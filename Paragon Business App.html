/* ---------- the technician report, fairly ----------
   A repeat counts against a technician only when the same machine comes back
   within thirty days of a job he resolved AND it printed no more than it
   normally does in that time. If it printed above what it was built for, the
   repeat is the client's use, not his work, and it is listed as an exception. */
function repeatsFor(uid){
  var out = { repeats: [], exceptions: [], unclear: [] };
  DB.complaints.forEach(function(c){
    if(c.tech !== uid || c.status !== 'resolved' || !c.resolved) return;
    var back = DB.complaints.filter(function(x){
      if(x.machine !== c.machine || x.id === c.id || !x.opened) return false;
      var gap = (new Date(x.opened) - new Date(c.resolved)) / 86400000;
      return gap > 0 && gap <= 30;
    }).sort(function(a, b){ return String(a.opened) < String(b.opened) ? -1 : 1; })[0];
    if(!back) return;
    var days = Math.max(1, Math.round((new Date(back.opened) - new Date(c.resolved)) / 86400000));
    var m = byId(DB.machines, c.machine), model = modelOf(m);
    var rated = model && +model.rated ? +model.rated / 30 * days : null;
    var normal = pagesPerDay(c.machine);
    normal = normal ? normal * days : null;
    var printed = (back.counter && c.counter) ? back.counter - c.counter : null;
    var row = { first: c, again: back, days: days, printed: printed,
                normal: normal ? Math.round(normal) : null, rated: rated ? Math.round(rated) : null };
    if(printed == null) out.unclear.push(row);
    else if(rated != null && printed > rated) out.exceptions.push(row);
    else if(normal != null && printed > normal) { row.more = true; out.exceptions.push(row); }
    else out.repeats.push(row);
  });
  return out;
}

function techReport(){
  var techs = DB.users.filter(function(u){ return u.role === 'tech'; });
  var line = function(r){
    return '<div class="meta" style="margin:3px 0">' + esc(r.first.no) + ' resolved ' + esc(dmy(r.first.resolved)) +
      ' \u2192 ' + esc(r.again.no) + ' opened ' + esc(dmy(r.again.opened)) + ' \u00b7 ' + r.days + ' days' +
      (r.printed != null ? ' \u00b7 ' + r.printed.toLocaleString() + ' pages printed' : ' \u00b7 no counter on one of them') +
      (r.rated != null ? ' (rated ' + r.rated.toLocaleString() + ')' : '') +
      (r.more ? ' \u2014 more than it usually prints' : '') + '</div>';
  };
  modal('Technician Work',
    techs.map(function(u){
      var mine = DB.complaints.filter(function(c){ return c.tech === u.id; });
      var done = mine.filter(function(c){ return c.status === 'resolved'; });
      var rp = repeatsFor(u.id);
      var rate = done.length ? Math.round(rp.repeats.length / done.length * 100) : 0;
      var fitted = 0;
      DB.parts.forEach(function(p){ if(p.by === u.id) fitted += q(p,'installed'); });
      return '<div class="card" style="padding:12px 13px;margin-bottom:8px">'+
        '<div class="ttl">' + esc(u.name) + '</div>'+
        '<div class="meta">' + mine.length + ' assigned \u00b7 ' + done.length + ' resolved' +
          (mine.length ? ' (' + Math.round(done.length / mine.length * 100) + '%)' : '') +
          ' \u00b7 ' + fitted + ' part(s) fitted</div>'+
        '<div class="meta"><b>' + rp.repeats.length + '</b> repeat(s) \u00b7 repeat rate ' + rate + '%</div>'+
        (rp.repeats.length ? '<div style="margin-top:6px"><b style="font-size:12.5px">Repeats</b>' + rp.repeats.map(line).join('') + '</div>' : '')+
        (rp.exceptions.length ? '<div style="margin-top:6px"><b style="font-size:12.5px">Not counted \u2014 heavy printing</b>' +
          rp.exceptions.map(line).join('') + '</div>' : '')+
        (rp.unclear.length ? '<div style="margin-top:6px"><b style="font-size:12.5px">Could not be judged \u2014 a counter is missing</b>' +
          rp.unclear.map(line).join('') + '</div>' : '')+
      '</div>'; }).join('') +
    '<div class="help"><b>How a repeat is decided.</b> A job counts as a repeat when the same machine gets a new '+
    'complaint within 30 days of one this technician resolved, and it printed no more than it normally does in '+
    'that time. If it printed more than usual, or more than the machine is rated for, the new fault is put down '+
    'to heavy use, not to the work, and it is listed separately so it can be checked.</div>',
    [{t:'Back',cls:'ghost',f:'reports()'},
     {t:'Send',cls:'green',f:"sendReport('Technician Work')"},
     {t:'Print',cls:'ghost',f:"printThis('Technician Work')"}]);
}

/* ---------- Quality Comparison: what a part really costs ----------
   The last column is the whole report: cheaper to buy is not always cheaper
   per thousand pages. */
function qualityReport(){
  var rows = {};
  DB.parts.forEach(function(p){
    if(q(p,'installed') < 1) return;
    var s = byId(DB.stock, p.stock); if(!s) return;
    var c = byId(DB.complaints, p.complaint); if(!c || !c.counter) return;
    /* the life of this fitting: pages until the next fitting of the same part on that machine */
    var next = DB.parts.filter(function(x){
      var cx = byId(DB.complaints, x.complaint);
      return x.stock === p.stock && x.id !== p.id && q(x,'installed') > 0 && cx &&
             cx.machine === c.machine && cx.counter && cx.counter > c.counter; })
      .map(function(x){ return byId(DB.complaints, x.complaint).counter; })
      .sort(function(a, b){ return a - b; })[0];
    if(!next) return;
    var key = (s.name || '') + '|' + (s.quality || '\u2014');
    var r = rows[key] || (rows[key] = { name: s.name, quality: s.quality || '\u2014', n: 0, pages: 0, cost: 0 });
    r.n++; r.pages += next - c.counter; r.cost += +(p.unitCost || s.cost || 0);
  });
  var list = Object.keys(rows).map(function(k){ var r = rows[k];
    r.avg = r.pages / r.n; r.avgCost = r.cost / r.n; r.per1000 = r.avg ? r.avgCost / r.avg * 1000 : 0; return r; })
    .sort(function(a, b){ return a.name === b.name ? a.per1000 - b.per1000 : (a.name < b.name ? -1 : 1); });
  modal('Quality Comparison',
    (list.length ? '<div style="overflow-x:auto"><table style="width:100%;font-size:12.5px;border-collapse:collapse">'+
      '<tr style="text-align:left;color:var(--ink-3)"><th style="padding:5px">Part</th><th>Quality</th><th>Fitted</th>'+
      '<th>Avg pages</th><th>Cost</th><th><b>Per 1,000 pages</b></th></tr>'+
      list.map(function(r){
        return '<tr style="border-top:1px solid var(--line)"><td style="padding:6px 5px">' + esc(r.name) + '</td><td>' +
          esc(r.quality) + '</td><td>' + r.n + '</td><td>' + Math.round(r.avg).toLocaleString() + '</td><td>Rs. ' +
          Math.round(r.avgCost).toLocaleString() + '</td><td><b>Rs. ' + Math.round(r.per1000).toLocaleString() + '</b></td></tr>';
      }).join('') + '</table></div>'
      : '<div class="empty">Not enough yet. A part needs to be fitted twice on the same machine, with the counter '+
        'read both times, before its life can be measured.</div>')+
    '<div class="help" style="margin-top:8px">Pages are counted from one fitting to the next fitting of the same part on '+
    'the same machine. Cost is what was paid for it when it was fitted.</div>',
    [{t:'Back',cls:'ghost',f:'reports()'},{t:'Print',cls:'ghost',f:"printThis('Quality Comparison')"}]);
}

function manualUpload(){
  var f = $('mfFile').files && $('mfFile').files[0];
  var models = Array.prototype.map.call(document.querySelectorAll('.mfModel:checked'), function(x){ return x.value; });
  if(!$('mfTitle').value.trim()) return toast('Give the manual its title','bad');
  if(!models.length) return toast('Tick the machines it covers','bad');
  if(!f) return toast('Choose the PDF','bad');
  var post = function(body){
    return fetch(serverBase() + '/upload', { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(Object.assign({ key: DB.share.key, token: DB.hr.token }, body)) }).then(function(r){ return r.json(); });
  };
  var prog = function(t){ $('mfProg').textContent = t; };
  post({ step:'begin', title:$('mfTitle').value.trim(), type:$('mfType').value, models:models,
         language:$('mfLang').value, version:$('mfVer').value, notes:$('mfNotes').value }).then(function(b){
    if(!b.ok) throw new Error(b.msg);
    var size = 1536 * 1024, count = Math.ceil(f.size / size), i = 0;
    var next = function(){
      if(i >= count){ prog('Reading the pages\u2026'); return post({ step:'finish', id:b.id, count:count }); }
      return new Promise(function(ok, bad){
        var rd = new FileReader();
        rd.onload = function(){ ok(String(rd.result).split(',')[1]); };
        rd.onerror = function(){ bad(new Error('the file could not be read')); };
        rd.readAsDataURL(f.slice(i * size, (i + 1) * size));
      }).then(function(data){ return post({ step:'chunk', id:b.id, i:i, data:data }); })
        .then(function(r){ if(!r.ok) throw new Error(r.msg); i++; prog('Sending ' + Math.round(i / count * 100) + '%'); return next(); });
    };
    return next();
  }).then(function(r){
    if(!r.ok) throw new Error(r.msg);
    modal('Manual added',
      '<div class="note g"><b>' + esc(r.manual.title) + '</b> \u2014 ' + r.manual.pages + ' pages, ' +
        r.manual.searchable + ' with readable text.</div>' +
      (r.warning ? '<div class="note w">' + esc(r.warning) + '</div>' : ''),
      [{t:'Library',cls:'',f:'manualLibrary()'}]);
  }).catch(function(e){ toast('Not uploaded: ' + e.message,'bad'); });
}

/* ============================================================
   RIGHTS \u2014 a checklist the admin ticks
   ------------------------------------------------------------
   By role: what every Technician, every Store Manager... may do.
   For one person: give or take a right from them alone.
   The admin always has everything; nobody can lock the firm out.
   ============================================================ */

var _rtWho = 'role:tech';

function rightsBox(who){
  if(ME.role !== 'admin') return toast('Only an admin sets rights','bad');
  if(!sharingOn()) return toast('Rights are kept on the server \u2014 connect this phone first','bad');
  if(!hrReady()) return hrLink();
  _rtWho = who || _rtWho;
  var roles = ['supervisor','store','tech','helper','operator'];
  var people = DB.users.filter(function(u){ return u.active && u.role !== 'admin'; });
  var isUser = _rtWho.indexOf('user:') === 0;
  var person = isUser ? byId(DB.users, _rtWho.slice(5)) : null;
  var role = isUser ? (person ? person.role : 'tech') : _rtWho.slice(5);
  var urec = isUser ? (rightsRec(_rtWho) || {}) : null;
  var has = function(k){
    if(isUser){
      if((urec.allow || []).indexOf(k) > -1) return true;
      if((urec.deny || []).indexOf(k) > -1) return false;
    }
    return roleHas(role, k);
  };
  modal('Rights',
    '<div class="field"><label>Whose rights</label><select id="rtWho" onchange="rightsBox(this.value)">'+
      '<optgroup label="Everyone in a role">' + roles.map(function(r){
        return '<option value="role:' + r + '"' + (_rtWho === 'role:' + r ? ' selected' : '') + '>Every ' + ROLES[r].label + '</option>'; }).join('') + '</optgroup>'+
      (people.length ? '<optgroup label="One person">' + people.map(function(u){
        return '<option value="user:' + u.id + '"' + (_rtWho === 'user:' + u.id ? ' selected' : '') + '>' + esc(u.name) +
          ' (' + ROLES[u.role].label + ')</option>'; }).join('') + '</optgroup>' : '')+
    '</select></div>'+
    (isUser ? '<div class="note i" style="font-size:12.5px">Ticks that differ from what every ' + ROLES[role].label +
      ' has are kept as <b>' + esc(person ? person.name : '') + '\u2019s own</b>.</div>'
      : '<div class="note i" style="font-size:12.5px">This changes every ' + ROLES[role].label + '. Admins always have every right.</div>')+
    RIGHT_GROUPS.map(function(g){
      return '<label style="margin:10px 0 4px">' + g[0] + '</label>' + g[1].map(function(r){
        var mark = isUser && has(r[0]) !== roleHas(role, r[0]) ? ' <span style="color:var(--amber);font-size:11.5px">\u2014 only for ' + esc(person.name) + '</span>' : '';
        return '<label style="display:flex;gap:9px;align-items:center;font-weight:400;padding:5px 0">'+
          '<input type="checkbox" class="rtBox" value="' + r[0] + '" style="width:auto"' + (has(r[0]) ? ' checked' : '') + '>' +
          esc(r[1]) + mark + '</label>';
      }).join('');
    }).join(''),
    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(isUser ? [{t:'Same as the role',cls:'ghost',f:'rightsClear()'}] : [{t:'Defaults',cls:'ghost',f:'rightsDefaults()'}])
      .concat([{t:'Save',cls:'',f:'rightsSave()'}]));
}

function rightsTicked(){
  var on = {};
  Array.prototype.forEach.call(document.querySelectorAll('.rtBox'), function(b){ on[b.value] = b.checked; });
  return on;
}

function rightsPut(rec, msg){
  return hrCall({ action:'rights.set', rec:rec }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');
    /* the phone takes the same record at once; the server has the final say */
    DB.rights = (DB.rights || []).filter(function(r){ return r.id !== rec.id; });
    DB.rights.push(Object.assign({}, rec, { _at: now() }));
    save(); toast(msg || 'Rights saved','good'); rightsBox(); draw();
    if(sharingOn()) syncSoon();
  });
}

function rightsSave(){
  var on = rightsTicked();
  if(_rtWho.indexOf('user:') === 0){
    var u = byId(DB.users, _rtWho.slice(5));
    var allow = [], deny = [];
    Object.keys(on).forEach(function(k){
      var base = roleHas(u.role, k);
      if(on[k] && !base) allow.push(k);
      if(!on[k] && base) deny.push(k);
    });
    return rightsPut({ id:_rtWho, allow:allow, deny:deny });
  }
  rightsPut({ id:_rtWho, perms: Object.keys(on).filter(function(k){ return on[k]; }) });
}

function rightsClear(){ rightsPut({ id:_rtWho, allow:[], deny:[] }, 'Now the same as the role'); }

function rightsDefaults(){
  var role = _rtWho.slice(5);
  var perms = Object.keys(PERMS).filter(function(k){ return PERMS[k].indexOf(role) > -1; });
  rightsPut({ id:_rtWho, perms:perms }, 'Back to the defaults');
}

/* Someone with the Users right who is not an admin cannot make or touch an
   admin \u2014 that would be a way round the checklist. */
function userEditAllowed(u, newRole){
  if(ME.role === 'admin') return true;
  if(u && u.role === 'admin') return false;
  if(newRole === 'admin') return false;
  return true;
}

/* ============================================================
   WHERE TO GO
   ------------------------------------------------------------
   The address on a job: the machine's own site if it is not at
   the client's main office, the client's address otherwise, and
   the floor. Directions open the phone's map \u2014 to the exact spot
   once a technician has saved it standing at the machine.
   ============================================================ */

function jobAddress(c){
  var m = byId(DB.machines, c.machine) || {}, cl = byId(DB.clients, c.client) || {};
  return { m: m, cl: cl, addr: m.site || cl.addr || cl.place || '',
           floor: [m.dept, m.place].filter(Boolean).join(' \u2014 ') };
}

function mapsLink(c){

function whereBlock(c, mine){

/* Saved standing at the machine, so the next visit goes to the door. */
function saveSpot(id){
  var c = byId(DB.complaints, id), m = c && byId(DB.machines, c.machine);
  if(!m) return;
  if(!navigator.geolocation) return toast('This phone cannot give its location','bad');
  toast('Finding where you are\u2026','good');
  navigator.geolocation.getCurrentPosition(function(p){
    if(p.coords.accuracy > 150) return toast('The location is not exact enough here (' + Math.round(p.coords.accuracy) + ' m). Try near a window.','bad');
    m.gps = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6);
    m.gpsBy = ME.name; m.gpsAt = now(); m._at = now();
    logIt('machine', 'Location saved for ' + machineLabel(m), ME.name);
    save(); openComplaint(id);
    toast('Saved. Directions now lead to this machine.','good');
    if(sharingOn()) syncSoon();
  }, function(){ toast('Location permission was not given','bad'); }, { enableHighAccuracy:true, timeout:15000 });
}

/* ============================================================
   DASHBOARDS
   ------------------------------------------------------------
   Each answers one question for one person.
     Admin:          what needs me today, across the whole business?
     Technician:     what do I do next, and what do I owe?
     Store Manager:  what do I give out, and what do I take back?

   The rules they all keep:
     action before information
     every number opens its own list; every row opens its record
     a section with nothing in it is not drawn at all
     each person sees only their own; money only with the Money right,
       and it is fetched from the server for that person alone
     each figure is worked out once, here, and used wherever it appears
   ============================================================ */

var DASH_TAB = 'today';
var _dashMoney = null, _dashTeam = null, _dashAt = 0, _dashSlips = null, _dashOnline = null;

/* ---------- age thresholds: settings, so they change without new code ---------- */
var AGE_DEFAULT = { complaint:[2,4], issue:[2,24], owed:[3,5], quote:[14,30], recv:[30,60], confirm:[3,7] };
function ages(k){ var a = (DB.company && DB.company.ages) || {}; return a[k] || AGE_DEFAULT[k]; }
function hoursSince(iso){ return iso ? (Date.now() - new Date(iso).getTime()) / 3600000 : 0; }
function ageWord(h){ return h < 24 ? Math.max(0, Math.round(h)) + 'h' : Math.floor(h / 24) + 'd'; }
/* amber past the first threshold, red past the second; issue ages are in hours, the rest in days */
function ageTone(h, key){
  var t = ages(key), v = key === 'issue' ? h : h / 24;
  return v >= t[1] ? 'neg' : v >= t[0] ? 'warn' : '';
}

function inr(n){ return Math.round(+n || 0).toLocaleString('en-IN'); }
function lakh(n){ n = +n || 0; return n >= 100000 ? (n / 100000).toFixed(1).replace(/\.0$/, '') + 'L' : inr(n); }

/* ============================================================
   THE FIGURES \u2014 one function each, used everywhere
   ============================================================ */

function jobOpen(c){ return ['pending','started','parts'].indexOf(c.status) > -1; }
function openJobs(){ return DB.complaints.filter(jobOpen); }
function oldestFirst(a, b){ return String(a.opened) < String(b.opened) ? -1 : 1; }
function unassignedJobs(){ return openJobs().filter(function(c){ return !c.tech; }).sort(oldestFirst); }
function resolvedToday(){
  return DB.complaints.filter(function(c){ return c.status === 'resolved' && String(c.resolved || '').slice(0,10) === today(); });
}
function lowStock(){
  return liveStock().filter(function(s){ return s.min && shelf(s.id) < s.min; })
    .sort(function(a, b){ return (shelf(a.id) - a.min) - (shelf(b.id) - b.min); });
}
function toIssueParts(){
  return DB.parts.filter(function(p){ return !p.refused && q(p,'qty') - q(p,'issued') > 0; })
    .sort(function(a, b){ return String(a.at) < String(b.at) ? -1 : 1; });
}
/* what a technician owes the store: old parts after a fitting, rejected parts
   not yet taken back, and parts he has said he is returning */
function owedRows(uid){
  var out = [];
  DB.parts.forEach(function(p){
    if(uid && p.by !== uid) return;
    var oldDue = wantsOldBack(p) ? q(p,'installed') - q(p,'oldBack') : 0;
    var rej = q(p,'rejected') - q(p,'rejBack');
    var ret = q(p,'retPend');
    if(oldDue > 0) out.push({ p:p, n:oldDue, what:'used part', since: p.installedAt || p.at });
    if(rej > 0) out.push({ p:p, n:rej, what:'rejected', since: p.rejectedAt || p.at });
    if(ret > 0) out.push({ p:p, n:ret, what:'returning', since: p.retAt || p.at });
  });
  return out.sort(function(a, b){ return String(a.since) < String(b.since) ? -1 : 1; });
}
function usedOwed(uid){ return owedRows(uid).filter(function(r){ return r.what === 'used part'; }); }
function heldBy(uid){
  var out = { complaint:0, direct:0, consumable:0, tool:0, total:0 };
  DB.parts.forEach(function(p){
    if(p.by !== uid) return;
    var h = holding(p); if(h <= 0) return;
    var k = kindOf(p);
    if(k === 'consumable') out.consumable += h;
    else if(k === 'tool') out.tool += h;
    else if(p.complaint) out.complaint += h; else out.direct += h;
    out.total += h;
  });
  return out;
}
function withTechsTotal(){
  return DB.parts.reduce(function(a, p){ return a + Math.max(0, holding(p)); }, 0);
}
function techs(){ return DB.users.filter(function(u){ return u.active && u.role === 'tech'; }); }
function followUpsDue(){
  return (DB.quotes || []).filter(function(x){
    if(!qOpen(x)) return false;
    var d = nextDue(x); return !!d && String(d).slice(0,10) <= today();
  }).sort(function(a, b){ return String(nextDue(a)) < String(nextDue(b)) ? -1 : 1; });
}
function contractsExpiring(){
  return (DB.contracts || []).filter(function(k){
    if(contractState(k) !== 'active') return false;
    var d = expiresIn(k); return d !== null && d >= 0 && d <= 60;
  }).sort(function(a, b){ return expiresIn(a) - expiresIn(b); });
}
/* an ASC whose monthly visit is overdue: nobody has been to its machines in 31 days */
function serviceDue(){
  var cut = new Date(Date.now() - 31 * 86400000).toISOString();
  return (DB.contracts || []).filter(function(k){
    if(contractState(k) !== 'active' || !/^asc/.test(k.kind || '')) return false;
    var ms = k.machine ? [k.machine] : DB.machines.filter(function(m){ return m.client === k.client; }).map(function(m){ return m.id; });
    var seen = false;
    DB.complaints.forEach(function(c){ if(ms.indexOf(c.machine) > -1 && String(c.resolved || c.started || '') >= cut) seen = true; });
    (DB.visits || []).forEach(function(v){ if(ms.indexOf(v.machine) > -1 && String(v.at) >= cut) seen = true; });
    return !seen && String(k.starts || '') <= cut.slice(0,10);
  });
}
function myTasksDue(){
  return (DB.tasks || []).filter(function(t){
    return t.to === ME.id && t.state !== 'done' && t.state !== 'turned' && t.due && String(t.due).slice(0,10) <= today();
  });
}

/* ---------- the findings nobody spots in a list ---------- */
function worthALook(){
  var out = [];
  var d30 = new Date(Date.now() - 30 * 86400000).toISOString(), d90 = new Date(Date.now() - 90 * 86400000).toISOString();
  DB.machines.forEach(function(m){
    var js = DB.complaints.filter(function(c){ return c.machine === m.id && String(c.opened) >= d30; });
    if(js.length >= 3) out.push({ w:3, title: nameOf(DB.clients, m.client) + ' \u00b7 ' + m.model,
      sub: js.length + ' faults in 30 days', open: function(){ dashList('Repeat faults \u2014 ' + m.model, js); } });
  });
  var fit = {};
  DB.parts.forEach(function(p){
    if(q(p,'installed') < 1) return;
    var c = byId(DB.complaints, p.complaint); if(!c || String(c.resolved || c.opened) < d90) return;
    var k = c.machine + '|' + p.stock; (fit[k] = fit[k] || []).push(c);
  });
  Object.keys(fit).forEach(function(k){
    if(fit[k].length < 2) return;
    var m = byId(DB.machines, k.split('|')[0]), s = byId(DB.stock, k.split('|')[1]);
    if(!m || !s || out.length > 6) return;
    out.push({ w:2, title: nameOf(DB.clients, m.client) + ' \u00b7 ' + m.model,
      sub: s.name + ' fitted twice in 90 days', open: function(){ dashList(s.name + ' fitted twice', fit[k]); } });
  });
  techs().forEach(function(u){
    var h = heldBy(u.id).total;
    if(h >= 3 && !openJobs().some(function(c){ return c.tech === u.id; }))
      out.push({ w:2, title: u.name + ' is idle, holding ' + h + ' parts', sub: 'No open jobs \u2014 ask for them back',
        open: function(){ techBox(u.id); } });
  });
  try {
    var qr = qualityRows();
    var byName = {};
    qr.forEach(function(r){ (byName[r.name] = byName[r.name] || []).push(r); });
    Object.keys(byName).forEach(function(n){
      var l = byName[n].sort(function(a, b){ return a.per1000 - b.per1000; });
      if(l.length < 2) return;
      var dear = l[l.length - 1], cheap = l[0];
      var pct = Math.round((dear.per1000 / cheap.per1000 - 1) * 100);
      if(pct >= 5) out.push({ w:1, title: dear.quality + ' ' + n.toLowerCase() + ' costs ' + pct + '% more per page',
        sub: 'Than ' + cheap.quality + ' \u2014 Rs ' + inr(dear.per1000) + ' vs Rs ' + inr(cheap.per1000) + ' per 1,000',
        open: function(){ qualityReport(); } });
    });
    early().forEach(function(e){ out.push(e); });
  } catch(e){}
  if(_dashMoney) (_dashMoney.slow || []).forEach(function(s){
    out.push({ w:1, title: s.name + ' pays slowly', sub: 'Average ' + s.days + ' days to pay',
      open: function(){ ledgerBox(s.client); } });
  });
  return out.sort(function(a, b){ return b.w - a.w; }).slice(0, 3);
}

/* the life of every fitting: pages until the next fitting of the same part on that machine */
function fittings(){
  var out = [];
  DB.parts.forEach(function(p){
    if(q(p,'installed') < 1) return;
    var s = byId(DB.stock, p.stock), c = byId(DB.complaints, p.complaint);
    if(!s || !c || !c.counter) return;
    var next = DB.parts.filter(function(x){
      var cx = byId(DB.complaints, x.complaint);
      return x.stock === p.stock && x.id !== p.id && q(x,'installed') > 0 && cx && cx.machine === c.machine && cx.counter > c.counter; })
      .map(function(x){ return byId(DB.complaints, x.complaint); })
      .sort(function(a, b){ return a.counter - b.counter; })[0];
    if(next) out.push({ p:p, s:s, c:c, next:next, pages: next.counter - c.counter, cost: +(p.unitCost || s.cost || 0) });
  });
  return out;
}
function qualityRows(){
  var rows = {};
  fittings().forEach(function(f){
    var k = f.s.name + '|' + (f.s.quality || '\u2014');
    var r = rows[k] || (rows[k] = { name:f.s.name, quality:f.s.quality || '\u2014', n:0, pages:0, cost:0 });
    r.n++; r.pages += f.pages; r.cost += f.cost;
  });
  return Object.keys(rows).map(function(k){ var r = rows[k];
    r.avg = r.pages / r.n; r.per1000 = r.avg ? (r.cost / r.n) / r.avg * 1000 : 0; return r; });
}
/* a consumable replaced at under 40% of its usual life */
function early(){
  var f = fittings(), avg = {};
  f.forEach(function(x){ var a = avg[x.s.id] || (avg[x.s.id] = { t:0, n:0 }); a.t += x.pages; a.n++; });
  return f.filter(function(x){ return kindOf(x.p) === 'consumable' && avg[x.s.id].n >= 3 && x.pages < 0.4 * avg[x.s.id].t / avg[x.s.id].n; })
    .slice(0, 2).map(function(x){
      return { w:2, title: x.s.name + ' replaced at ' + inr(x.pages) + ' pages',
        sub: nameOf(DB.clients, x.c.client) + ' \u00b7 usually ' + inr(avg[x.s.id].t / avg[x.s.id].n),
        open: function(){ dashList(x.s.name + ' \u2014 early', [x.c, x.next]); } };
    });
}

/* ---------- from the server: only for those allowed ---------- */
function dashFetch(){
  if(!sharingOn() || !hrReady()) return;
  if(Date.now() - _dashAt < 20000) return;
  _dashAt = Date.now();
  if(can('money')) hrCall({ action:'dash.money' }).then(function(d){ if(d && d.ok){ _dashMoney = d; if(PAGE === 'home') drawDash(); } }).catch(function(){});
  if(can('attendance.all')) hrCall({ action:'month', month: today().slice(0,7) }).then(function(d){
    if(!d || !d.ok) return;
    var t = { in:[], late:[], absent:[], leave:[] };
    d.people.forEach(function(p){
      var r = p.rows.filter(function(x){ return x.day === today(); })[0];
      if(!r) return;
      if(r.in){ t.in.push(p.name); if(r.late) t.late.push(p.name); }
      else if(r.status === 'absent' && new Date().getHours() >= 10) t.absent.push(p.name);
      else if(r.status === 'leave') t.leave.push(p.name);
    });
    t.noOut = [];
    d.people.forEach(function(p){ p.rows.forEach(function(r){ if(r.no_out) t.noOut.push(p.name + ' \u00b7 ' + dmy(r.day)); }); });
    _dashTeam = t; if(PAGE === 'home') drawDash();
  }).catch(function(){});
  if(ME.role === 'admin' || ME.role === 'supervisor') hrCall({ action:'presence.team' }).then(function(d){
    if(d && d.ok){ _dashOnline = d.team; if(PAGE === 'home') drawDash(); } }).catch(function(){});
  /* in the first ten days of a month: is last month's salary finalised? */
  if(can('salary') && new Date().getDate() <= 10){
    var lm = new Date(); lm.setDate(1); lm.setMonth(lm.getMonth() - 1);
    var key = lm.getFullYear() + '-' + String(lm.getMonth() + 1).padStart(2,'0');
    hrCall({ action:'slips.month', month:key }).then(function(d){
      if(!d || !d.ok) return;
      var drafts = d.slips.filter(function(s){ return s.status !== 'final'; }).length;
      _dashSlips = { month:key, none: !d.slips.length, drafts: drafts };
      if(PAGE === 'home') drawDash();
    }).catch(function(){});
  }
}
function billsUnpaid(){ return (DB.bills || []).filter(function(b){ return b.state !== 'paid'; }); }

function latestPrice(s){
  var best = null;
  (DB.buys || []).forEach(function(b){ (b.lines || []).forEach(function(l){
    if(l.stock === s.id && (!best || String(b.date || b.at) > best.d)) best = { d: String(b.date || b.at), p: +l.price || +l.cost || 0 }; }); });
  return best ? best.p : +(s.cost || 0);
}
function dStoreAdmin(){
  var mon = today().slice(0,7), owner = can('money');
  var out = storeStrip();
  if(owner){
    var value = liveStock().reduce(function(a, s){ return a + Math.max(0, shelf(s.id)) * latestPrice(s); }, 0);
    var used = 0, lost = 0, scrapV = 0;
    DB.parts.forEach(function(p){
      var when = String(p.installedAt || (byId(DB.complaints, p.complaint) || {}).resolved || '').slice(0,7);
      if(when === mon) used += q(p,'installed') * +(p.unitCost || 0);
      if(String(p.lostAt || '').slice(0,7) === mon) lost += q(p,'lost') * +(p.unitCost || (byId(DB.stock, p.stock) || {}).cost || 0);
    });
    liveStock().forEach(function(s){ scrapV += scrapHeld(s.id) * +(s.scrapValue || 0); });
    out += '<div class="db-money"><div onclick="go(\'store\')"><div class="v">Rs ' + inr(value) + '</div><div class="k">Stock value</div></div>'+
      '<div onclick="go(\'store\')"><div class="v">Rs ' + inr(used) + '</div><div class="k">Used this month</div></div></div>'+
      '<div class="db-money"><div onclick="scrapList()"><div class="v" style="color:var(--db-warn)">Rs ' + inr(scrapV) + '</div><div class="k">Scrap value</div></div>'+
      '<div onclick="go(\'store\')"><div class="v" style="color:' + (lost ? 'var(--db-neg)' : 'var(--db-ink)') + '">Rs ' + inr(lost) + '</div><div class="k">Lost this month</div></div></div>';
  }
  out += sec('Below minimum', lowStock().length, lowRows(), 'var(--db-neg)');
  out += sec('Owed back by technicians', owedRows().length, owedList(owedRows().slice(0, 8)), 'var(--db-neg)');
  out += sec('Who is holding what', null, holdingRows(), 'var(--db-purp)');
  return out;
}

  var owed = owedRows(ME.id), used = usedOwed(ME.id);
  var done = resolvedToday().filter(function(c){ return c.tech === ME.id; });
  var h = heldBy(ME.id);

  var out = band('tech', 'Technician');
  out += '<div id="dbAtt"></div>';
  out += strip([
    [mine.length, 'My jobs', '', "dashList('My jobs', openJobs().filter(function(c){ return c.tech === ME.id; }))"],
    [toFit.reduce(function(a, p){ return a + holding(p); }, 0), 'To fit', 'var(--db-warn)', "dashParts('To fit', DB.parts.filter(function(p){ return p.by === ME.id && p.complaint && holding(p) > 0; }))"],
    [owed.reduce(function(a, r){ return a + r.n; }, 0), 'To return', 'var(--db-neg)', "dashOwed('To return', owedRows(ME.id))"],
    [done.length, 'Done today', 'var(--db-pos)', "dashList('Done today', resolvedToday().filter(function(c){ return c.tech === ME.id; }))"]]);

    used.reduce(function(a, r){ return a + r.n; }, 0) + ' used part' + (used.length > 1 ? 's' : '') + '</div><div class="b">' + esc(partName(used[0].p)) +
    ' \u2014 <b>' + ageWord(hoursSince(used[0].since)) + '</b> \u2014 return it to the store</div></div>';
  out += sec('My complaints today', mine.length, mine.map(function(c){
    var hh = hoursSince(c.opened), tone = ageTone(hh, 'complaint'), m = byId(DB.machines, c.machine) || {};
    var ch = '';
    if(DB.parts.some(function(p){ return p.complaint === c.id && p.by === ME.id && holding(p) > 0; })) ch += chip('Part received', 'pos');
    if(DB.parts.some(function(p){ return p.complaint === c.id && q(p,'qty') - q(p,'issued') > 0 && !p.refused; })) ch += chip('Waiting on part', 'warn');
    if(c.cheque && !c.chequeDone) ch += chip('Collect cheque', 'cool');

    if(blockedBy(c)) ch = chip('After number ' + blockedBy(c).seq, 'grey') + ch;
    return row(tone === 'neg' ? 'var(--db-neg)' : tone === 'warn' ? 'var(--db-warn)' : 'var(--db-teal)', seqBadge(c) + esc(nameOf(DB.clients, c.client)),
      esc([m.model, m.dept, m.place].filter(Boolean).join(' \u00b7 ')) + '<br>' + esc(String(c.what || '').slice(0, 70)),
      [ageWord(hh), 'old'], tone, "openComplaint('" + c.id + "')", ch ? '<div class="db-chips">' + ch + '</div>' : '');
  }).join(''), 'var(--db-teal)');
  if(h.total) out += sec('Parts I am holding', h.total, strip([
    [h.complaint, 'Complaint', '', "dashParts('For complaints', DB.parts.filter(function(p){ return p.by===ME.id && p.complaint && holding(p)>0 && kindOf(p)!=='consumable' && kindOf(p)!=='tool'; }))"],
    [h.direct, 'Direct', '', "dashParts('Direct', DB.parts.filter(function(p){ return p.by===ME.id && !p.complaint && holding(p)>0 && kindOf(p)!=='consumable' && kindOf(p)!=='tool'; }))"],
    [h.consumable, 'Consumables', '', "dashParts('Consumables', DB.parts.filter(function(p){ return p.by===ME.id && holding(p)>0 && kindOf(p)==='consumable'; }))"],
    [h.tool, 'Tools', '', "dashParts('Tools', DB.parts.filter(function(p){ return p.by===ME.id && holding(p)>0 && kindOf(p)==='tool'; }))"]]), 'var(--db-teal)');
  out += sec('Shortcuts', null, '<div class="db-grid">'+
    '<div class="g" onclick="myPerformance()"><div class="ic" style="background:#EAF6EE;color:#1A7538">\u{1F4C8}</div><div><div class="a">My performance</div><div class="b">This month</div></div></div>'+
    '<div class="g" onclick="go(\'jobs\')"><div class="ic" style="background:var(--db-purpb);color:var(--db-purp)">+</div><div><div class="a">Request part</div><div class="b">From a job</div></div></div>'+
    '<div class="g" onclick="dashOwed(\'To return\', owedRows(ME.id))"><div class="ic" style="background:var(--db-warnb);color:var(--db-warn)">\u21A9</div><div><div class="a">Return part</div><div class="b">' + owed.length + ' owed</div></div></div>'+

  return '<div class="db-body">' + out + '</div>';

/* ============================================================
   MY DAY \u2014 each person's own
   ------------------------------------------------------------
   Goals with a target, daily habits, private tasks, a weekly
   review and progress photos. Kept on the phone, and on the
   server for this person alone. A goal they share is shown to
   the partners; nothing else is, and a photo never is.
   ============================================================ */

var MD_TAB = 'today';
var ME_KINDS = ['goals','checks','habits','hlog','ptasks','reviews'];
var _mdShared = [], _mdCheers = [], _mdSyncing = false, _mdTimer = null;

function mine(){
  DB.mine = DB.mine || {};
  var m = DB.mine[ME.id];
  if(!m){
    m = DB.mine[ME.id] = {};
    ME_KINDS.forEach(function(k){ m[k] = {}; });
    mdMigrate(m);
  }
  ME_KINDS.forEach(function(k){ m[k] = m[k] || {}; });
  return m;
}

/* the goals and habits kept before My Day came over, once */
function mdMigrate(m){
  (DB.goals || []).forEach(function(g){
    if(g.who !== ME.id) return;
    m.goals[g.id] = { id:g.id, title:g.title, why:g.why || '', start:g.from || today(), end:g.by || mdAdd(today(), 90),
                      mode:'none', state: g.state === 'won' ? 'won' : g.state === 'dropped' ? 'dropped' : 'live', _at: now() };
    mdQueue('goals', m.goals[g.id]);
  });
  (DB.habits || []).forEach(function(h){
    if(!m.goals[h.goal]) return;
    m.habits[h.id] = { id:h.id, name:h.name, perWeek:7, goal:h.goal, _at: now() };
    mdQueue('habits', m.habits[h.id]);
  });
  Object.keys(DB.habitLog || {}).forEach(function(k){
    if(m.habits[k.split('|')[0]]){ m.hlog[k] = { at: DB.habitLog[k], _at: now() }; mdQueue('hlog', m.hlog[k], k); }
  });
}

function mdAdd(day, n){ var d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function mdDays(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }
function mdLive(o){ return Object.keys(o).map(function(k){ return o[k]; }).filter(function(x){ return !x.gone; }); }

/* every change is kept here first, and sent when there is signal */
function mdQueue(kind, rec, key){
  DB.minePending = DB.minePending || {};
  var p = DB.minePending[ME.id] = DB.minePending[ME.id] || {};
  (p[kind] = p[kind] || {})[key || rec.id] = rec;
}
function mdPut(kind, rec, key){
  rec._at = now();
  mine()[kind][key || rec.id] = rec;
  mdQueue(kind, rec, key);
  save();
  clearTimeout(_mdTimer); _mdTimer = setTimeout(mdSync, 1500);
}
function mdSync(){
  if(!hrReady() || _mdSyncing) return;
  _mdSyncing = true;
  var pend = (DB.minePending || {})[ME.id] || {};
  var send = Object.keys(pend).length ? hrCall({ action:'me.put', records: pend }) : Promise.resolve({ ok:true });
  send.then(function(d){
    if(d && d.ok && DB.minePending) delete DB.minePending[ME.id];
    return hrCall({ action:'me.get' });
  }).then(function(d){
    _mdSyncing = false;
    if(!d || !d.ok) return;
    var m = mine();
    ME_KINDS.forEach(function(k){
      var theirs = d.mine[k] || {};
      Object.keys(theirs).forEach(function(id){
        var a = m[k][id], b = theirs[id];
        if(!a || String(a._at || '') < String(b._at || '')) m[k][id] = b;
      });
    });
    _mdShared = d.shared || []; _mdCheers = d.cheers || [];
    save();
    if(PAGE === 'tasks') drawMine();
  }).catch(function(){ _mdSyncing = false; });
}

/* ---------- the page: four parts ---------- */
function drawMine(){
  if(!ME) return;
  if(!canTasks()){ $('tkBody').style.display = ''; drawTasks(); return; }
  var tabs = [['today','Aaj'],['tasks','Tasks'],['goals','Goals'],['habits','Aadatein']];
  var bar = '<div class="md-tabs">' + tabs.map(function(t){
    return '<div class="md-tab' + (MD_TAB === t[0] ? ' on' : '') + '" onclick="MD_TAB=\'' + t[0] + '\';drawMine()">' + t[1] + '</div>'; }).join('') + '</div>';
  $('dayBox').innerHTML = bar + '<div id="mdBody"></div>';
  $('goalBox').innerHTML = '';
  $('tkBody').style.display = MD_TAB === 'tasks' ? '' : 'none';
  mdCss();
  var body = $('mdBody');
  if(MD_TAB === 'today') body.innerHTML = mdToday();
  if(MD_TAB === 'tasks'){ body.innerHTML = mdPrivateTasks(); drawTasks(); }
  if(MD_TAB === 'goals') body.innerHTML = mdGoals();
  if(MD_TAB === 'habits') body.innerHTML = mdHabits();
}

/* ---------- today ---------- */
function mdTasksDue(){
  var shared = (DB.tasks || []).filter(function(t){
    return t.kind !== 'meeting' && t.to === ME.id && (t.state === 'mine' || t.state === 'offered') && t.when && String(t.when).slice(0,10) <= today(); });
  var own = mdLive(mine().ptasks).filter(function(t){ return !t.done && t.when && t.when <= today(); });
  return { shared: shared, own: own, n: shared.length + own.length };
}
function mdHabitsToday(){
  var dow = new Date().getDay();
  return mdLive(mine().habits).filter(function(h){ return !h.days || h.days.indexOf(dow) > -1; });
}
function mdHabitsLeft(){ return mdHabitsToday().filter(function(h){ return !mdDone(h.id, today()); }); }

function mdToday(){
  var d = mdTasksDue(), hs = mdHabitsToday(), goals = mdLive(mine().goals).filter(function(g){ return g.state === 'live'; });
  var meet = (DB.tasks || []).filter(function(t){ return t.kind === 'meeting' && t.state !== 'done' && t.when && String(t.when).slice(0,10) === today() && (t.who || []).indexOf(ME.id) > -1; });
  var out = '<div class="md-hero"><div class="md-big">' + d.n + '</div><div>task' + (d.n === 1 ? '' : 's') + ' today</div>'+
    '<div class="md-big" style="margin-left:18px">' + mdHabitsLeft().length + '/' + hs.length + '</div><div>habits left</div></div>';
  var rows = d.shared.map(function(t){
    var late = String(t.when).slice(0,10) < today();
    return '<div class="md-row' + (late ? ' late' : '') + '" onclick="openTask(\'' + t.id + '\')"><div class="md-dot"></div><div class="grow">' + esc(t.what) +
      '<div class="meta">' + (late ? 'late \u00b7 ' + esc(dmy(t.when)) : 'today') + (t.by !== ME.id ? ' \u00b7 from ' + esc(nameOf(DB.users, t.by)) : '') + '</div></div></div>';
  }).concat(d.own.map(mdTaskRow)).join('');
  out += mdCard('Aaj ke tasks', rows || '<div class="help">Nothing due today. \u2728</div>', '<button class="btn sm ghost" onclick="mdTaskForm()">+ Private</button>');
  if(meet.length) out += mdCard('Meetings today', meet.map(function(t){
    return '<div class="md-row" onclick="openTask(\'' + t.id + '\')"><div class="md-dot" style="background:var(--db-cool,#2A6CA6)"></div><div class="grow">' + esc(t.what) +
      '<div class="meta">' + esc(String(t.when).slice(11,16)) + (t.where ? ' \u00b7 ' + esc(t.where) : '') + '</div></div></div>'; }).join(''));
  out += mdCard('Aadatein', hs.length ? '<div class="md-chips">' + hs.map(function(h){
    var on = mdDone(h.id, today());
    return '<div class="md-hchip' + (on ? ' on' : '') + '" onclick="mdTick(\'' + h.id + '\')">' + (on ? '\u2713 ' : '') + esc(h.name) +
      (mdStreak(h) > 1 ? ' <span class="md-fire">\u{1F525}' + mdStreak(h) + '</span>' : '') + '</div>'; }).join('') + '</div>'
    : '<div class="help">No habits yet. <a href="#" onclick="MD_TAB=\'habits\';drawMine();return false">Add one</a> \u2014 a walk, exercise, reading.</div>');
  out += mdCard('Namaz', prayerCards(), '<button class="btn sm ghost" onclick="prayerSetup()">Times</button>');
  if(goals.length) out += mdCard('Goals', goals.map(mdGoalLine).join(''));
  var sun = new Date().getDay();
  if((sun === 0 || sun === 1) && goals.length && !mdReviewedThisWeek())
    out += '<div class="note i" style="cursor:pointer" onclick="mdReviewForm()"><b>Weekly review</b> \u2014 how did the week go, and what is next? Two minutes.</div>';
  return out;
}
function mdCard(title, body, btn){
  return '<div class="card md-card"><div class="row" style="align-items:center;margin-bottom:8px"><label class="grow" style="margin:0">' + title + '</label>' + (btn || '') + '</div>' + body + '</div>';
}

/* ---------- private tasks ---------- */
function mdWhenGroup(t){
  if(!t.when) return 'Later';
  if(t.when < today()) return 'Late';
  if(t.when === today()) return 'Today';
  if(t.when === mdAdd(today(), 1)) return 'Tomorrow';
  if(mdDays(today(), t.when) <= 7) return 'This week';
  return 'Later';
}
function mdTaskRow(t){
  var late = t.when && t.when < today(), moves = t.moves || 0;
  return '<div class="md-row' + (late ? ' late' : '') + '"><div class="md-check" onclick="mdTaskDone(\'' + t.id + '\')"></div>'+
    '<div class="grow" onclick="mdTaskForm(\'' + t.id + '\')">' + (t.pri === 'high' ? '<b style="color:var(--red)">! </b>' : '') + esc(t.what) +
    '<div class="meta">' + (t.when ? (late ? 'late \u00b7 ' : '') + esc(dmy(t.when)) : 'no date') + (t.time ? ' \u00b7 ' + esc(t.time) : '') +
    (t.every ? ' \u00b7 every ' + t.every : '') + ' \u00b7 \u{1F512} private' +
    (moves >= 2 ? ' \u00b7 <span style="color:' + (moves >= 3 ? 'var(--red)' : 'var(--amber)') + '">moved ' + moves + '\u00d7</span>' : '') + '</div></div>'+
    '<button class="btn ghost sm" onclick="mdTaskMove(\'' + t.id + '\')">Tomorrow</button></div>';
}
function mdPrivateTasks(){
  var list = mdLive(mine().ptasks).filter(function(t){ return !t.done; });
  var order = ['Late','Today','Tomorrow','This week','Later'];
  var groups = order.map(function(g){
    var ts = list.filter(function(t){ return mdWhenGroup(t) === g; })
      .sort(function(a, b){ return ((a.pri === 'high' ? 0 : 1) - (b.pri === 'high' ? 0 : 1)) || (String(a.when) < String(b.when) ? -1 : 1); });
    return ts.length ? '<label style="margin:10px 0 6px;color:' + (g === 'Late' ? 'var(--red)' : 'var(--ink-3)') + '">' + g + ' \u00b7 ' + ts.length + '</label>' + ts.map(mdTaskRow).join('') : '';
  }).join('');
  return mdCard('My private tasks', groups || '<div class="help">Only you see these.</div>', '<button class="btn sm" onclick="mdTaskForm()">+ Private task</button>') +
    '<label style="margin:14px 0 6px">Shared tasks</label>';
}
function mdTaskForm(id){
  var t = id ? mine().ptasks[id] : null;
  modal(t ? 'Private task' : 'New private task',
    '<div class="note i" style="font-size:12.5px">\u{1F512} Only you see this task \u2014 not your partners, not anyone.</div>'+
    '<div class="field"><label>What</label><input id="ptWhat" value="' + esc(t ? t.what : '') + '"></div>'+
    '<div class="two"><div class="field"><label>Date</label><input id="ptWhen" type="date" value="' + esc(t ? t.when || '' : today()) + '"></div>'+
    '<div class="field"><label>Time (optional)</label><input id="ptTime" type="time" value="' + esc(t ? t.time || '' : '') + '"></div></div>'+
    '<div class="two"><div class="field"><label>Priority</label><select id="ptPri"><option value="">Normal</option>'+
      '<option value="high"' + (t && t.pri === 'high' ? ' selected' : '') + '>Important</option></select></div>'+
    '<div class="field"><label>Repeats</label><select id="ptEvery">' + [['','Once'],['day','Every day'],['week','Every week'],['month','Every month']].map(function(o){
      return '<option value="' + o[0] + '"' + (t && t.every === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>',
    [{t:'Close',cls:'ghost',f:'closeModal()'}].concat(t ? [{t:'Delete',cls:'danger',f:"mdTaskDrop('" + id + "')"}] : [])
      .concat([{t:'Save',cls:'',f:"mdTaskSave(" + (id ? "'" + id + "'" : 'null') + ")"}]));
}
function mdTaskSave(id){
  var what = $('ptWhat').value.trim(); if(!what) return toast('What is the task?','bad');
  var t = id ? mine().ptasks[id] : { id: uid(), moves:0 };
  t.what = what; t.when = $('ptWhen').value; t.time = $('ptTime').value; t.pri = $('ptPri').value; t.every = $('ptEvery').value;
  mdPut('ptasks', t); closeModal(); drawMine(); toast('Saved','good');
}
function mdTaskDone(id){
  var t = mine().ptasks[id]; if(!t) return;
  if(t.every){
    var n = { day:1, week:7 }[t.every];
    var d = new Date((t.when || today()) + 'T12:00:00');
    if(n) d.setDate(d.getDate() + n); else d.setMonth(d.getMonth() + 1);
    t.when = d.toISOString().slice(0,10); t.moves = 0;
    toast('Done \u2014 next on ' + dmy(t.when),'good');
  } else { t.done = true; t.doneAt = now(); toast('Done \u2713','good'); }
  mdPut('ptasks', t); drawMine();
}
function mdTaskMove(id){
  var t = mine().ptasks[id]; if(!t) return;
  t.when = mdAdd(today(), 1); t.moves = (t.moves || 0) + 1;
  mdPut('ptasks', t); drawMine();
  toast(t.moves >= 3 ? 'Moved ' + t.moves + ' times \u2014 do it, drop it, or break it smaller' : 'Moved to tomorrow', t.moves >= 3 ? 'bad' : 'good');
}
function mdTaskDrop(id){ var t = mine().ptasks[id]; t.gone = true; mdPut('ptasks', t); closeModal(); drawMine(); }

/* ---------- the weekly review ---------- */
function mdWeekKey(){ var d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0,10); }
function mdReviewedThisWeek(){
  var wk = new Date(); if(wk.getDay() === 1) wk.setDate(wk.getDate() - 1);
  var key = (function(){ var d = new Date(wk); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0,10); })();
  return !!mine().reviews[key];
}
function mdReviewForm(){
  modal('Weekly review',
    '<div class="field"><label>What went well, what did not</label><textarea id="rvWent" rows="3"></textarea></div>'+
    '<div class="field"><label>Next week, the one thing that matters most</label><textarea id="rvNext" rows="2"></textarea></div>',
    [{t:'Later',cls:'ghost',f:'closeModal()'},{t:'Save',cls:'',f:'mdReviewSave()'}]);
}
function mdReviewSave(){
  var wk = new Date(); if(wk.getDay() === 1) wk.setDate(wk.getDate() - 1);
  var d = new Date(wk); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  var key = d.toISOString().slice(0,10);
  mdPut('reviews', { id:key, week:key, went:$('rvWent').value.trim(), next:$('rvNext').value.trim() });
  closeModal(); drawMine(); toast('Week reviewed \u2713','good');
}

/* ---------- a small card for the admin dashboard ---------- */
function mdDashCard(){
  if(!canTasks()) return '';
  var d = mdTasksDue(), left = mdHabitsLeft().length, all = mdHabitsToday().length;
  var behind = mdLive(mine().goals).filter(function(g){ return g.state === 'live' && mdProgress(g).status === 'behind'; }).length;
  if(!d.n && !all && !mdLive(mine().goals).length) return '';
  return '<div class="db-act" onclick="MD_TAB=\'today\';go(\'tasks\')" style="background:#F7FAFC">'+
    '<div class="ic" style="background:var(--db-tealb);color:var(--db-teal)">\u2600</div>'+
    '<div class="tx">Mera din<span>' + d.n + ' task' + (d.n === 1 ? '' : 's') + ' \u00b7 ' + left + ' of ' + all + ' habits left' +
    (behind ? ' \u00b7 <b style="color:var(--db-warn)">' + behind + ' goal' + (behind > 1 ? 's' : '') + ' behind</b>' : '') + '</span></div>'+
    '<div class="nn" style="color:var(--db-teal)">\u203a</div></div>';
}

/* ============================================================
   GOALS \u2014 a target that can be measured, over ninety days
   ------------------------------------------------------------
   Three kinds:  count  \u2014 add as you go (machines sold: +1)
                 value  \u2014 a reading that moves (weight: 92 \u2192 84)
                 none   \u2014 done or not
   On track means the work done keeps up with the time gone.
   ============================================================ */

function mdChecks(gid){
  return mdLive(mine().checks).filter(function(c){ return c.goal === gid; })
    .sort(function(a, b){ return String(a.on) < String(b.on) ? -1 : 1; });
}
function mdProgress(g, checks){
  checks = checks || mdChecks(g.id);
  var total = Math.max(1, mdDays(g.start, g.end));
  var gone = Math.min(total, Math.max(0, mdDays(g.start, today())));
  var timePct = Math.round(gone / total * 100);
  var cur = null, pct = null;
  if(g.mode === 'count'){
    cur = checks.reduce(function(a, c){ return a + (+c.value || 0); }, 0);
    pct = g.target ? cur / g.target * 100 : 0;
  } else if(g.mode === 'value'){
    var last = checks.filter(function(c){ return c.value !== '' && c.value != null; }).slice(-1)[0];
    cur = last ? +last.value : +g.from;
    pct = (+g.target !== +g.from) ? (cur - g.from) / (g.target - g.from) * 100 : 0;
  }
  pct = pct == null ? null : Math.max(0, Math.round(pct));
  var status = g.state === 'won' ? 'done' : pct == null ? 'none' : pct >= 100 ? 'done' : pct >= timePct - 5 ? 'on' : 'behind';
  return { pct: pct, timePct: timePct, cur: cur, daysLeft: Math.max(0, total - gone), status: status };
}
var MD_STATUS = { on:['On track','var(--green)'], behind:['Behind','var(--amber)'], done:['Achieved','var(--green)'], none:['', 'var(--ink-3)'] };
function mdFmt(g, v){
  if(v == null) return '';
  var n = Math.round(+v) === +v ? inr(v) : (+v).toLocaleString('en-IN', { maximumFractionDigits: 1 });
  return g.unit === 'Rs' ? 'Rs ' + n : n + (g.unit ? ' ' + g.unit : '');
}

function mdBar(pct, timePct, colour){
  return '<div class="md-bar"><i style="width:' + Math.min(100, pct || 0) + '%;background:' + colour + '"></i>'+
    (timePct != null ? '<b style="left:' + Math.min(100, timePct) + '%"></b>' : '') + '</div>';
}
function mdGoalLine(g){
  var p = mdProgress(g), st = MD_STATUS[p.status];
  return '<div class="md-goal" onclick="mdGoalOpen(\'' + g.id + '\')"><div class="row"><div class="grow"><b>' + esc(g.title) + '</b>'+
    (g.shared ? ' <span class="meta">\u{1F465}</span>' : '') + '</div><span style="color:' + st[1] + ';font-weight:700;font-size:12px">' + st[0] + '</span></div>'+

/* the streak: days in a row for a daily habit; for "4 days a week", weeks in a row that made it */
function mdStreak(h){
  if(!h) return 0;
  var n = 0, d = today();
  if(!h.perWeek || h.perWeek >= 7){
    if(!mdDone(h.id, d)) d = mdAdd(d, -1);
    while(mdDone(h.id, d)){ n++; d = mdAdd(d, -1); }
    return n;
  }
  var wk = mdAdd(today(), -((new Date().getDay() + 6) % 7));
  for(var w = 1; w < 60; w++){
    var s = mdAdd(wk, -7 * w), c = 0;
    for(var i = 0; i < 7; i++) if(mdDone(h.id, mdAdd(s, i))) c++;
    if(c >= h.perWeek) n++; else break;
  }
  return n;
}
function mdWeekCount(h){
  var wk = mdAdd(today(), -((new Date().getDay() + 6) % 7)), c = 0;
  for(var i = 0; i < 7; i++) if(mdDone(h.id, mdAdd(wk, i))) c++;
  return c;
}
function mdCalendar(h){
  var d = new Date(), first = new Date(d.getFullYear(), d.getMonth(), 1), days = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  var pad = (first.getDay() + 6) % 7, cells = '';
  for(var i = 0; i < pad; i++) cells += '<i></i>';
  for(var k = 1; k <= days; k++){
    var day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(k).padStart(2,'0');
    cells += '<i class="' + (mdDone(h.id, day) ? 'on' : '') + (day === today() ? ' td' : '') + '">' + k + '</i>';
  }
  return '<div class="md-cal">' + ['M','T','W','T','F','S','S'].map(function(x){ return '<i class="hd">' + x + '</i>'; }).join('') + cells + '</div>';
}

  var quick = ['Walk','Exercise','Read 20 minutes','Wake up early','No sugar'].filter(function(n){ return !hs.some(function(h){ return h.name === n; }); });
  return mdCard('Aadatein', hs.length ? hs.map(function(h){
    var s = mdStreak(h), on = mdDone(h.id, today());
    return '<div class="md-habit"><div class="row" style="align-items:center"><div class="grow"><b>' + esc(h.name) + '</b>'+

      (s ? ' \u00b7 \u{1F525} ' + s + (h.perWeek >= 7 ? ' day' : ' week') + (s > 1 ? 's' : '') : '') + '</div></div>'+
      '<button class="btn sm ' + (on ? 'ghost' : 'green') + '" onclick="mdTick(\'' + h.id + '\')">' + (on ? '\u2713 Done' : 'Tick') + '</button></div>'+

  }).join('') : '<div class="help">Pick one to start \u2014 small and daily beats big and rare.</div>',

/* ============================================================
   THE ORDER OF A TECHNICIAN'S JOBS
   ------------------------------------------------------------
   The admin numbers a technician's open complaints 1, 2, 3. He
   sees them in that order, and cannot start number 2 while
   number 1 is still waiting \u2014 unless it is waiting for parts.
   ============================================================ */

function techQueue(uid){
  return DB.complaints.filter(function(c){ return c.tech === uid && ['pending','started','parts'].indexOf(c.status) > -1; })
    .sort(function(a, b){
      var sa = a.seq || 999, sb = b.seq || 999;
      return sa !== sb ? sa - sb : (String(a.opened) < String(b.opened) ? -1 : 1); });
}

/* the job that has to come first, if this one is not it */
function blockedBy(c){
  if(!c.seq) return null;
  return techQueue(c.tech).filter(function(x){
    return x.id !== c.id && x.seq && x.seq < c.seq && (x.status === 'pending' || x.status === 'started'); })[0] || null;
}

function seqBadge(c){
  return c.seq ? '<span class="seq-badge">' + c.seq + '</span>' : '';
}

var _orderTech = null, _orderList = [];
function orderBox(uid){
  if(!can('complaint.assign')) return toast('Setting the order is for the office','bad');
  _orderTech = uid;
  _orderList = techQueue(uid).map(function(c){ return c.id; });
  orderDraw();
}
function orderDraw(){
  var u = byId(DB.users, _orderTech);
  modal('Order for ' + u.name,
    '<div class="note i" style="font-size:12.5px">' + esc(u.name) + ' will see his jobs in this order, and cannot start the next one '+
    'while the one before it is still waiting.</div>'+
    (_orderList.length ? _orderList.map(function(id, i){
      var c = byId(DB.complaints, id), m = byId(DB.machines, c.machine) || {};
      return '<div class="ord-row"><span class="seq-badge big">' + (i + 1) + '</span><div class="grow"><b>' + esc(nameOf(DB.clients, c.client)) + '</b>'+
        '<div class="meta">' + esc(m.model || '') + ' \u00b7 ' + esc(String(c.what || '').slice(0, 50)) + ' \u00b7 ' + C_STATUS[c.status].label + '</div></div>'+
        '<button class="btn ghost sm" onclick="orderMove(' + i + ',-1)"' + (i ? '' : ' disabled') + '>\u2191</button>'+
        '<button class="btn ghost sm" onclick="orderMove(' + i + ',1)"' + (i < _orderList.length - 1 ? '' : ' disabled') + '>\u2193</button></div>';
    }).join('') : '<div class="empty">No open jobs.</div>'),
    [{t:'Close',cls:'ghost',f:'closeModal()'},{t:'No order',cls:'ghost',f:'orderClear()'},{t:'Save the order',cls:'',f:'orderSave()'}]);
}
function orderMove(i, d){
  var j = i + d; if(j < 0 || j >= _orderList.length) return;
  var t = _orderList[i]; _orderList[i] = _orderList[j]; _orderList[j] = t; orderDraw();
}
function orderSave(){
  var u = byId(DB.users, _orderTech);
  _orderList.forEach(function(id, i){ var c = byId(DB.complaints, id); c.seq = i + 1; c._at = now(); });
  var lines = _orderList.map(function(id, i){ var c = byId(DB.complaints, id); return (i + 1) + '. ' + nameOf(DB.clients, c.client); });
  tellAll([u], 'Your order of jobs', lines.join(' \u00b7 '), _orderList[0]);
  logIt('complaint', 'Order set for ' + u.name, lines.join(', '));
  save(); closeModal(); draw(); toast('Order saved \u2014 ' + u.name + ' has been told','good');
  if(sharingOn()) syncSoon();
}
function orderClear(){
  techQueue(_orderTech).forEach(function(c){ if(c.seq){ delete c.seq; c._at = now(); } });
  save(); closeModal(); draw(); toast('No order now','good');
  if(sharingOn()) syncSoon();
}

/* ============================================================
   VOICE NOTES
   ------------------------------------------------------------
   The client's voice note (sent to the office on WhatsApp,
   chosen from the phone) or the office's own, recorded here.
   The sound is kept on the server; the complaint keeps its id.
   ============================================================ */

var _voicePending = [];           /* notes waiting for the complaint to be saved */
var _rec = null, _recChunks = [], _recStart = 0, _recTimer = null;

function voiceKinds(){ return { client:'Client\u2019s voice note', office:'Office voice note' }; }

function voiceChooseFile(done){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*,.opus,.ogg,.m4a,.mp3,.aac,.amr,.wav';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 6 * 1024 * 1024) return toast('That voice note is too long','bad');
    var rd = new FileReader();
    rd.onload = function(){
      var data = String(rd.result);
      /* WhatsApp's .opus files often arrive with no type; give them the right one */
      if(/^data:(application\/octet-stream|);/.test(data) || data.indexOf('data:;') === 0)
        data = data.replace(/^data:[^;]*;/, 'data:' + (/\.m4a$/i.test(f.name) ? 'audio/mp4' : /\.mp3$/i.test(f.name) ? 'audio/mpeg' : 'audio/ogg') + ';');
      data = data.replace(/^data:audio\/x-m4a/, 'data:audio/mp4');
      done({ data:data, kind:'client', name:f.name });
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

function voiceRecord(done){
  if(!navigator.mediaDevices || !window.MediaRecorder)
    return toast('This phone cannot record here \u2014 record it in WhatsApp and choose it as a file','bad');
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    var type = MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
             : MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    _rec = type ? new MediaRecorder(stream, { mimeType:type }) : new MediaRecorder(stream);
    _recChunks = [];
    _rec.ondataavailable = function(e){ if(e.data && e.data.size) _recChunks.push(e.data); };
    _rec.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(_recTimer);
      var blob = new Blob(_recChunks, { type: (_rec.mimeType || 'audio/webm').split(';')[0] });
      var secs = Math.round((Date.now() - _recStart) / 1000);
      var rd = new FileReader();
      rd.onload = function(){ closeModal(); done({ data:String(rd.result).replace(/;codecs=[^;]*/, ''), kind:'office', secs:secs }); };
      rd.readAsDataURL(blob);
    };
    _recStart = Date.now(); _rec.start();
    modal('Recording\u2026', '<div style="text-align:center;padding:18px 0"><div class="rec-dot"></div>'+
      '<div id="recTime" style="font-size:30px;font-weight:700;margin-top:10px">0:00</div>'+
      '<div class="help">Speak clearly. Up to three minutes.</div></div>',
      [{t:'Cancel',cls:'ghost',f:'voiceCancel()'},{t:'Stop and keep',cls:'green',f:'voiceStop()'}]);
    _recTimer = setInterval(function(){
      var s = Math.round((Date.now() - _recStart) / 1000);
      if($('recTime')) $('recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');
      if(s >= 180) voiceStop();
    }, 500);
  }).catch(function(err){
    /* Saaf batao kya masla hai, warna sirf "not allowed" uljhata hai. */
    var name = err && err.name ? err.name : '';
    if(name === 'NotAllowedError' || name === 'SecurityError'){
      modal('Mic ki ijazat nahi',
        '<div class="note i">Voice note record karne ke liye mic ki ijazat chahiye.</div>'+
        '<ul style="font-size:13px;line-height:1.7">'+
        '<li><b>App (phone) par:</b> Phone Settings \u2192 Apps \u2192 Paragon \u2192 Permissions \u2192 <b>Microphone</b> ON karein. Phir app dobara kholein.</li>'+
        '<li><b>Browser par:</b> Address bar ke taala/\u24D8 par tap \u2192 Microphone <b>Allow</b>.</li>'+
        '<li>Ya <b>WhatsApp mein voice note</b> record kar ke, yahan <b>file se</b> bhej dein.</li>'+
        '</ul>',
        [{t:'Theek hai',cls:'',f:'closeModal()'}]);
    } else if(name === 'NotFoundError'){
      toast('Is phone par mic nahi mila','bad');
    } else {
      toast('Record nahi ho saka \u2014 WhatsApp se record kar ke file se bhejein','bad');
    }
  });
}
function voiceStop(){ if(_rec && _rec.state !== 'inactive') _rec.stop(); }
function voiceCancel(){ if(_rec && _rec.state !== 'inactive'){ _rec.onstop = function(){ clearInterval(_recTimer); }; _rec.stop(); } closeModal(); }

/* sends one note to the server, and adds it to the complaint */
function voiceAttach(c, v){
  return hrCall({ action:'voice.put', data:v.data }).then(function(d){
    if(!d || !d.ok) throw new Error((d && d.msg) || 'not saved');
    c.voices = c.voices || [];
    c.voices.push({ id:d.id, kind:v.kind, by:ME.name, at:now(), secs:v.secs || null, name:v.name || '' });
    c._at = now(); save(); if(sharingOn()) syncSoon();
    return true;
  });
}

/* on the job screen: every note, ready to play; the office can add more */
function voiceBlock(c){
  var vs = c.voices || [], office = can('complaint.all');
  if(!vs.length && !office) return '';
  var k = voiceKinds();
  return '<div class="field"><label>Voice notes</label>' + (vs.length ? vs.map(function(v){
    var url = hrReady() ? serverBase() + '/voice/' + v.id + '?t=' + encodeURIComponent(DB.hr.token) : '';
    return '<div class="vn-row"><div class="vn-ic ' + v.kind + '">' + (v.kind === 'client' ? '\u{1F464}' : '\u{1F3E2}') + '</div>'+
      '<div class="grow"><div style="font-size:13px;font-weight:600">' + k[v.kind] + (v.secs ? ' \u00b7 ' + Math.floor(v.secs / 60) + ':' + String(v.secs % 60).padStart(2,'0') : '') + '</div>'+
      '<div class="meta">' + esc(v.by) + ' \u00b7 ' + esc(ago(v.at)) + '</div>'+
      (url ? '<audio controls preload="none" src="' + url + '" style="width:100%;height:36px;margin-top:4px"></audio>'
           : '<div class="meta">Connect to play it</div>') + '</div></div>';
  }).join('') : '<div class="help">None yet.</div>')+
  (office ? '<div class="row" style="gap:7px;margin-top:6px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" onclick="voiceAdd(\'' + c.id + '\',\'file\')">\u{1F4CE} Client\u2019s voice note</button>'+
    '<button class="btn ghost sm" onclick="voiceAdd(\'' + c.id + '\',\'rec\')">\u{1F3A4} Record mine</button></div>' : '') + '</div>';
}
function voiceAdd(id, how){
  var c = byId(DB.complaints, id);
  if(!hrReady()) return toast('Voice notes are kept on the server \u2014 connect this phone first','bad');
  var then = function(v){
    toast('Saving the voice note\u2026','good');
    voiceAttach(c, v).then(function(){ openComplaint(id); toast('Voice note added \u2014 the technician can play it','good');
      if(c.tech) tellAll([byId(DB.users, c.tech)].filter(Boolean), 'Voice note on ' + c.no, voiceKinds()[v.kind], c.id);
    }).catch(function(e){ toast('Not saved: ' + e.message,'bad'); });
  };
  how === 'file' ? voiceChooseFile(then) : voiceRecord(then);
}

/* ---------- in the new-complaint form ---------- */
var _cfShots = [];
function cfMediaBlock(){
  _cfShots = []; _voicePending = [];
  return '<div class="field"><label>Photos of the error (optional)</label><div class="shots" id="cfShotList"></div>'+
    '<button class="btn ghost sm" onclick="cfAddShot()">\u{1F4F7} Add a photo</button></div>'+
    '<div class="field"><label>Voice notes (optional)</label><div id="cfVoiceList"></div>'+
    '<div class="row" style="gap:7px;flex-wrap:wrap">'+
      '<button class="btn ghost sm" onclick="cfAddVoice(\'file\')">\u{1F4CE} Client\u2019s voice note</button>'+
      '<button class="btn ghost sm" onclick="cfAddVoice(\'rec\')">\u{1F3A4} Record mine</button></div>'+
    '<div class="help">The technician finds these inside the complaint.</div></div>';
}
function cfAddShot(){
  if(_cfShots.length >= 6) return toast('Six photos is enough for one job','bad');
  pickPhoto(function(src){
    _cfShots.push(src);
    $('cfShotList').innerHTML = _cfShots.map(function(s){ return '<img class="shot" src="' + s + '">'; }).join('');
  }, { gallery:true });
}
function cfAddVoice(how){
  var then = function(v){
    _voicePending.push(v);
    $('cfVoiceList').innerHTML = _voicePending.map(function(x){
      return '<div class="meta" style="margin-bottom:4px">' + (x.kind === 'client' ? '\u{1F464} Client\u2019s voice note' : '\u{1F3A4} My voice note') +
        (x.secs ? ' \u00b7 ' + x.secs + 's' : '') + ' \u2014 ready</div>'; }).join('');
  };
  how === 'file' ? voiceChooseFile(then) : voiceRecord(then);
}
/* after the complaint is saved: its photos, then its voice notes to the server */
function cfMediaSave(c){
  if(_cfShots.length){ c.shots = (c.shots || []).concat(_cfShots).slice(0, 6); c._at = now(); save(); }
  var list = _voicePending.slice(); _cfShots = []; _voicePending = [];
  if(!list.length) return;
  if(!hrReady()) return toast('The voice notes need signal \u2014 add them from the complaint once connected','bad');
  list.reduce(function(p, v){ return p.then(function(){ return voiceAttach(c, v); }); }, Promise.resolve())
    .then(function(){ toast(list.length + ' voice note(s) added','good'); })
    .catch(function(e){ toast('A voice note was not saved: ' + e.message,'bad'); });
}

/* ============================================================
   TEAM CHAT
   ------------------------------------------------------------
   One-to-one and group conversations inside Paragon: text,
   emoji, reactions, replies, voice notes and photos, with sent
   and read ticks. Kept on the server; each message goes only to
   the people in its conversation.
   ============================================================ */

var _chat = { list:[], people:[], reacts:[], open:null, msgs:[], read:{}, deliv:{}, presence:{}, last:'', members:[], title:'', kind:'', reply:null };

/* "online", or when they were last seen \u2014 the way WhatsApp says it */
function lastSeen(p){
  if(!p) return '';
  if(p.online) return 'online';
  if(!p.at) return 'not connected yet';
  var d = String(p.at).slice(0,10), hm = String(p.at).slice(11,16);
  if(d === today()) return 'last seen today at ' + hm;
  if(d === mdAddSafe(today(), -1)) return 'last seen yesterday at ' + hm;
  return 'last seen ' + dmy(d) + ' at ' + hm;
}
var _chatPoll = null, _chatBadgePoll = null, _chatUnread = 0;

function chatOn(){ return sharingOn() && hrReady() && ME && ME.role !== 'operator'; }

function chatWrap(){
  var w = document.getElementById('chatWrap');
  if(!w){
    w = document.createElement('div'); w.id = 'chatWrap';
    document.body.appendChild(w);
    chatCss();
  }
  return w;
}

/* the badge on the chat button, kept fresh in the background */
var _chatSwitchedOff = false;
function chatBadge(){
  var show = ME && ME.role !== 'operator' && sharingOn() && !_chatSwitchedOff;
  var b = document.getElementById('barChat');
  if(b){
    b.style.display = show ? '' : 'none';
    b.innerHTML = '\u{1F4AC}' + (_chatUnread ? '<span class="chat-dot">' + (_chatUnread > 99 ? '99+' : _chatUnread) + '</span>' : '');
  }
  chatFab(show);
}

/* A round chat button, always in reach at the bottom-right of the screen.
   Tap it and the chat opens. It carries the same unread count, and hides
   itself while the chat is already open or when chat is off for this phone. */
function chatFab(show){
  var f = document.getElementById('chatFab');
  if(!f){
    f = document.createElement('div');
    f.id = 'chatFab';
    f.onclick = function(){ chatHome(); };
    document.body.appendChild(f);
    if(!document.getElementById('chatFabCss')){
      var s = document.createElement('style'); s.id = 'chatFabCss';
      s.textContent = '#chatFab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));'+
        'width:56px;height:56px;border-radius:50%;background:#12395E;color:#fff;font-size:26px;'+
        'display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);'+
        'z-index:55;cursor:pointer}#chatFab .fab-dot{position:absolute;top:-2px;right:-2px;background:#1A7538;'+
        'color:#fff;border-radius:11px;min-width:20px;height:20px;line-height:20px;font-size:11px;font-weight:700;'+
        'text-align:center;padding:0 5px;border:2px solid #EFEAE2}';
      document.head.appendChild(s);
    }
  }
  var open = document.getElementById('chatWrap') && document.getElementById('chatWrap').classList.contains('on');
  f.style.display = (show && !open) ? 'flex' : 'none';
  f.innerHTML = '\u{1F4AC}' + (_chatUnread ? '<span class="fab-dot">' + (_chatUnread > 99 ? '99+' : _chatUnread) + '</span>' : '');
}
function chatRefreshBadge(){
  if(!chatOn()) return chatBadge();
  hrCall({ action:'chat.list' }).then(function(d){
    if(d && d.off){ _chatSwitchedOff = true; _chat.open = null; var w = document.getElementById('chatWrap'); if(w) w.classList.remove('on'); chatBadge(); return; }
    if(!d || !d.ok) return;
    _chatSwitchedOff = false;
    _chat.list = d.convs; _chat.people = d.people; _chat.reacts = d.reacts;
    _chatUnread = d.convs.reduce(function(a, c){ return a + c.unread; }, 0);
    if(d.flags){ _chatSwitchedOff = !d.flags.chat_on; try { locFlags(d.flags); } catch(e){} }
    chatBadge();
    if(document.getElementById('chatWrap') && document.getElementById('chatWrap').classList.contains('on') && !_chat.open) chatDrawList();
    /* app khula hai to nayi chat notes foran laao aur ring karo \u2014 15 minute wale
       background worker ka intezar na ho */
    try { pullNotesNow(); } catch(e){}
  }).catch(function(){});
}
function chatStart(){
  chatBadge();
  clearInterval(_chatBadgePoll);
  _chatBadgePoll = setInterval(function(){ if(!document.hidden) chatRefreshBadge(); }, 12000);
  setTimeout(chatRefreshBadge, 3000);
}
document.addEventListener('visibilitychange', function(){
  if(!chatOn()) return;
  if(document.hidden) hrCall({ action:'presence.bye' }).catch(function(){});
  else chatRefreshBadge();
});
window.addEventListener('pagehide', function(){ try { if(chatOn()) hrCall({ action:'presence.bye' }); } catch(e){} });

/* ---------- the list ---------- */
function chatHome(){
  var fab = document.getElementById('chatFab'); if(fab) fab.style.display = 'none';
  if(_chatSwitchedOff) return toast('Chat is switched off','bad');
  if(!chatOn()) return toast(sharingOn() ? 'Confirm it is you once (Attendance \u2192 Start), then chat opens' : 'Chat needs this phone connected to the server','bad');
  _chat.open = null;
  var w = chatWrap(); w.classList.add('on');
  history.pushState({ chat:1 }, '');
  chatDrawList();
  chatRefreshBadge();
  clearInterval(_chatPoll);
  _chatPoll = setInterval(function(){ if(!document.hidden) (_chat.open ? chatFetch() : chatRefreshBadge()); }, 4000);
}
function chatClose(){
  clearInterval(_chatPoll); _chat.open = null;
  setTimeout(function(){ try { chatBadge(); } catch(e){} }, 50);
  var w = document.getElementById('chatWrap'); if(w) w.classList.remove('on');
  chatRefreshBadge();
}
window.addEventListener('popstate', function(){
  var w = document.getElementById('chatWrap');
  if(w && w.classList.contains('on')){ if(_chat.open){ _chat.open = null; chatDrawList(); history.pushState({ chat:1 }, ''); } else chatClose(); }
});

function initials(n){ return String(n || '?').split(' ').map(function(x){ return x[0]; }).join('').slice(0,2).toUpperCase(); }
function avatarColour(n){ var c = ['#12395E','#0E7268','#65479A','#B06E08','#2A6CA6','#AE1F26','#1A7538']; var h = 0; String(n).split('').forEach(function(ch){ h = (h * 31 + ch.charCodeAt(0)) % 997; }); return c[h % c.length]; }
function chatTime(iso){
  if(!iso) return '';
  var d = new Date(String(iso).slice(0,19)), t = today();
  var hm = String(iso).slice(11,16);
  if(String(iso).slice(0,10) === t) return hm;
  if(String(iso).slice(0,10) === mdAddSafe(t, -1)) return 'Yesterday';
  return dmy(String(iso).slice(0,10)).slice(0,5);
}
function mdAddSafe(day, n){ var d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }

function chatDrawList(){
  var w = chatWrap();
  var office = ME.role === 'admin' || ME.role === 'supervisor';
  w.innerHTML = '<div class="ch-head"><button class="ch-back" onclick="chatClose()">\u2039</button><div class="ch-title">Chat</div>'+
    (office ? '<button class="ch-new" onclick="teamOnline()">\u{1F7E2} Online</button>' : '')+
    '<button class="ch-new" onclick="chatNewBox()">+ New</button></div>'+
    '<div class="ch-list">' + (_chat.list.length ? _chat.list.map(function(c){
      var name = c.title;
      return '<div class="ch-conv" onclick="chatOpen(\'' + c.id + '\')">'+
        '<div class="ch-av" style="background:' + (c.id === 'team' ? '#12395E' : avatarColour(name)) + '">' + (c.kind === 'group' ? '\u{1F465}' : initials(name)) +
          (c.presence && c.presence.online ? '<i class="ch-on"></i>' : '') + '</div>'+
        '<div class="grow" style="min-width:0"><div class="row"><div class="grow ch-name">' + esc(name) + '</div>'+
        '<div class="ch-when' + (c.unread ? ' un' : '') + '">' + (c.last ? chatTime(c.last.at) : '') + '</div></div>'+
        '<div class="row"><div class="grow ch-last">' + (c.last ? (c.kind === 'group' && c.last.from ? esc(c.last.from.split(' ')[0]) + ': ' : '') + esc(c.last.text) : '<i>No messages yet</i>') + '</div>'+
        (c.unread ? '<span class="ch-count">' + c.unread + '</span>' : '') + '</div></div></div>';
    }).join('') : '<div class="empty">Loading\u2026</div>') + '</div>';
}

function chatNewBox(){
  var office = ME.role === 'admin' || ME.role === 'supervisor';
  modal('New chat',
    '<label style="margin-bottom:6px">Message someone</label>' + _chat.people.map(function(p){
      return '<div class="ch-conv" onclick="chatDm(\'' + p.id + '\')"><div class="ch-av" style="background:' + avatarColour(p.name) + '">' + (userPhoto(p.id) ? '<img src="'+userPhoto(p.id)+'">' : initials(p.name)) + '</div>'+
        '<div class="grow"><div class="ch-name">' + esc(p.name) + '</div><div class="ch-last">' + esc((ROLES[p.role] || {}).label || '') + '</div></div></div>'; }).join('')+
    (office ? '<div class="sep"></div><label style="margin-bottom:6px">Or start a group</label>'+
      '<div class="field"><input id="cgName" placeholder="Group name \u2014 e.g. Technicians"></div>' + _chat.people.map(function(p){
        return '<label style="display:flex;gap:9px;align-items:center;font-weight:400;padding:4px 0"><input type="checkbox" class="cgM" value="' + p.id + '" style="width:auto">' + esc(p.name) + '</label>'; }).join('') : ''),
    [{t:'Close',cls:'ghost',f:'closeModal()'}].concat(office ? [{t:'Start group',cls:'',f:'chatGroup()'}] : []));
}
function chatDm(uid){
  hrCall({ action:'chat.new', kind:'dm', with:uid }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not start','bad');
    closeModal(); chatOpen(d.id);

function chatGroup(){
  var members = Array.prototype.map.call(document.querySelectorAll('.cgM:checked'), function(x){ return x.value; });
  hrCall({ action:'chat.new', kind:'group', name:$('cgName').value, members:members }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not start','bad');

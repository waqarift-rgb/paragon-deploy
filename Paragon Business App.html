function saveContract(id){
  DB.contracts = DB.contracts || [];
  var k = id ? byId(DB.contracts, id) : null;
  var kind = $('kfKind').value;
  var machine = $('kfMachine').value;
  if(!machine) return toast('Choose a machine','bad');

  var busy = contractFor(machine);
  if(busy && (!k || busy.id !== k.id))
    return toast('That machine is already on ' + busy.no +
                 '. Cancel that one first.','bad');

  var client = $('kfClient').value;
  var brand = (byId(DB.clients, client) || {}).brand || 'paragon';

  if(!k){
    k = { id:uid(), no:contractNo(kind, brand), state:'draft',
          overrides:[], at:now() };
    DB.contracts.unshift(k);
  }
  k.client = client;
  k.machine = machine;
  k.brand = brand;
  k.kind = kind;
  k.starts = $('kfStart').value || today();
  k.ends = $('kfEnd').value || '';
  k.origToner = !!$('kfToner').value;

  if(kind === 'rental'){
    k.rate  = parseFloat($('kfRate').value)  || 0;
    k.free  = parseInt($('kfFree').value,10) || 0;
    k.rate2 = parseFloat($('kfRate2').value) || 0;
    k.amount = null;
  } else if(DEAL_KIND[kind].amount){
    k.amount = parseFloat($('kfAmount').value) || 0;
    k.how = $('kfHow').value;
  } else {
    k.amount = null;
  }
  k._at = now();

  logIt('contract',(id?'Edited ':'Drafted ')+k.no,
        nameOf(DB.clients, k.client) + ' \u00b7 ' + DEAL_KIND[kind].label);
  save(); closeModal(); draw(); openContract(k.id);
  if(sharingOn()) syncSoon();
}

/* ---------- what has to be true before it can start ---------- */

function activateBlocks(k){
  var stop = [];
  var m = byId(DB.machines, k.machine);
  var c = byId(DB.clients, k.client);

  if(!k.signed)
    stop.push('the signed copy has not been uploaded');
  if(!m || !(m.serial || '').trim())
    stop.push('the machine has no serial number');
  if(!k.openCount)
    stop.push('the opening counter reading has not been taken');
  if(!k.openShot)
    stop.push('there is no photograph of that opening reading');
  if(!c || !((c.people || []).some(function(p){ return (p.phone||'').trim(); })
             || (c.phone||'').trim()))
    stop.push('the client has nobody with a mobile number');
  if(!k.ends)
    stop.push('there is no end date');

  if(k.kind === 'rental'){
    if(!k.rate)  stop.push('the rate per print is not set');
    if(!k.free)  stop.push('the prints included are not set');
  } else if(DEAL_KIND[k.kind].amount && !k.amount){
    stop.push('the annual charge is not set');
  }
  return stop;
}

function activateContract(id){
  var k = byId(DB.contracts, id);
  var stop = activateBlocks(k);
  if(stop.length)
    return modal('Not ready to start',
      '<div class="note w">A contract stays a draft until all of this is '+
      'done:<ul style="margin:8px 0 0 18px">'+
      stop.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul></div>'+
      '<div class="help">Until then nothing has actually happened. A contract '+
      'typed in and never signed is a note, not an agreement \u2014 and if it '+
      'quietly started running, the client would be billed for a service he '+
      'never agreed to.</div>',
      [{t:'Back',cls:'ghost',f:"closeModal();openContract('"+id+"')"}]);

  k.state = 'active';
  k.liveFrom = now();
  k.liveBy = ME.name;
  k._at = now();
  logIt('contract','Activated ' + k.no, nameOf(DB.clients, k.client));
  save(); closeModal(); draw(); openContract(id);
  toast(k.no + ' is live','good');
  if(sharingOn()) syncSoon();
}

function renewContract(id){
  var k = byId(DB.contracts, id);
  var from = k.ends || today();

  modal('Renew ' + k.no,

      '<div class="field"><label>Starts</label>'+
        '<input id="rnFrom" type="date" value="'+esc(from)+'"></div>'+

        '<input id="rnTo" type="date" value="'+d.toISOString().slice(0,10)+
        '"></div>'+

     {t:'Draft the renewal',cls:'',f:"saveRenewal('"+id+"')"}]);

function saveRenewal(id){
  var k = byId(DB.contracts, id);
  var fresh = Object.assign({}, k, {
    id:uid(), no:contractNo(k.kind, k.brand), state:'draft',
    starts:$('rnFrom').value, ends:$('rnTo').value,
    signed:'', signedAt:'', liveFrom:'', liveBy:'',
    openCount:k.openCount, openShot:k.openShot,   /* the machine has not changed */
    renewalOf:k.no, overrides:[], at:now(), _at:now()
  });
  DB.contracts.unshift(fresh);
  k.state = 'expired'; k._at = now();
  logIt('contract','Renewal drafted: ' + fresh.no + ' from ' + k.no, '');
  save(); closeModal(); draw(); openContract(fresh.id);
  toast('Drafted. It starts when the signed copy is in.','good');
  if(sharingOn()) syncSoon();
}

function cancelContract(id){
  var k = byId(DB.contracts, id);
  askReason('Why is it being cancelled?', function(why){
    k.state = 'cancelled'; k.whyGone = why; k.goneAt = now(); k._at = now();
    logIt('contract','Cancelled ' + k.no, why);
    save(); closeModal(); draw();
    toast('Cancelled, and the reason kept','good');
    if(sharingOn()) syncSoon();
  });
}

/* ---------- the list ---------- */

var K_VIEW = 'live';
function kView(v){ K_VIEW = v; drawContracts(); }

function drawContracts(){
  var all = DB.contracts || [];
  var counts = { live:0, draft:0, soon:0, gone:0, all:all.length };
  all.forEach(function(k){
    var s = contractState(k);
    if(s === 'active') counts.live++;
    if(s === 'draft') counts.draft++;
    if(s === 'expired') counts.gone++;
    var l = expiresIn(k);
    if(s === 'active' && l !== null && l <= 60) counts.soon++;
  });

  var strip = $('kStrip');
  if(strip) strip.innerHTML = [
    ['live','Active'], ['soon','Ending soon'], ['draft','Draft'],
    ['gone','Expired'], ['all','All']
  ].map(function(f){
    return '<button class="'+(K_VIEW===f[0]?'on':'')+'" onclick="kView(\''+f[0]+
      '\')">'+f[1]+'<span class="c">'+counts[f[0]]+'</span></button>'; }).join('');

  var list = all.filter(function(k){
    var s = contractState(k), l = expiresIn(k);
    if(K_VIEW === 'live')  return s === 'active';
    if(K_VIEW === 'draft') return s === 'draft';
    if(K_VIEW === 'gone')  return s === 'expired';
    if(K_VIEW === 'soon')  return s === 'active' && l !== null && l <= 60;
    return true;
  }).sort(function(a,b){
    return (expiresIn(a) === null ? 1e9 : expiresIn(a)) -
           (expiresIn(b) === null ? 1e9 : expiresIn(b)); });

  $('kList').innerHTML = list.length ? list.map(function(k){
    var d = DEAL_KIND[k.kind], s = C_STATE[contractState(k)];
    var m = byId(DB.machines, k.machine);
    var b = BRANDS[k.brand||'paragon'];
    var left = expiresIn(k);
    return '<div class="card tap" onclick="openContract(\''+k.id+'\')">'+
      '<div style="height:3px;border-radius:2px;background:'+b.c1+
        ';margin:-13px -14px 10px"></div>'+
      '<div class="row"><div class="grow">'+
        '<div class="meta" style="color:'+b.c1+';font-weight:600;margin-bottom:2px">'+
          esc(b.name)+'</div>'+
        '<div class="ttl">'+esc(nameOf(DB.clients, k.client))+'</div>'+
        '<div class="meta">'+esc(d.label)+
          (m ? ' \u00b7 ' + esc(m.model) : '')+'</div>'+
        '<div class="meta"><b>'+esc(k.no)+'</b> \u00b7 '+
          (k.ends ? esc(dmy(k.ends)) : 'no end date')+
          (left !== null && contractState(k) === 'active'
            ? ' \u00b7 ' + (left < 0 ? Math.abs(left) + ' days over'
                                     : left + ' days left') : '')+
          '</div>'+
      '</div><span class="pill '+
        (left !== null && left <= 7 && contractState(k) === 'active'
          ? 'p-high' : s.pill)+'">'+s.label+'</span></div></div>';
  }).join('')
    : '<div class="empty"><span class="ic">\u{1F4DC}</span>Nothing here.</div>';

  var add = $('kAdd');
  if(add) add.classList.toggle('hide', !can('complaint.add'));
}

/* ---------- telling people before it runs out ---------- */

function checkContracts(){
  (DB.contracts || []).forEach(function(k){
    if(k.state !== 'active') return;
    var left = expiresIn(k);
    if(left === null) return;
    var d = DEAL_KIND[k.kind];

    /* An ASC is warned at sixty, thirty and seven days. A rental at thirty
       and on the day, and no more: nothing is at stake, and a notice that
       does not matter teaches people to ignore the ones that do. */
    var marks = d.blocks ? [60, 30, 7, 0] : [30, 0];
    if(marks.indexOf(left) === -1 && !(d.blocks && left < 0)) return;

    var key = 'k|' + k.id + '|' + today();
    DB.told = DB.told || {};
    if(DB.told[key]) return;
    DB.told[key] = 1;

    var who = nameOf(DB.clients, k.client);
    var m = byId(DB.machines, k.machine);
    var line = k.no + ' \u00b7 ' + who + (m ? ' \u00b7 ' + m.model : '');

    if(left < 0){
      tellAll(admins(), 'An expired contract is still open',
        line + ' \u00b7 ended ' + Math.abs(left) + ' days ago \u00b7 service is '+
        'blocked', '');
    } else if(left === 0){
      tellAll(admins(), d.blocks ? 'A contract ends today' : 'A rental ends today',
        line, '');
    } else {
      tellAll(admins(), 'A contract ends in ' + left + ' days', line, '');
    }
  });
  save();
}

   THE PRINTED AGREEMENT

function printContract(id){
  var k = byId(DB.contracts, id);
  if(!k) return;
  var d = DEAL_KIND[k.kind];
  var c = byId(DB.clients, k.client);
  var m = byId(DB.machines, k.machine);
  var b = BRANDS[k.brand || 'paragon'];
  var rental = k.kind === 'rental';
  var warranty = k.kind === 'warranty';
  var withParts = k.kind !== 'asc_without';

  var minimum = Math.round((k.free || 0) * (k.rate || 0));

  function s(n, title, inner){
    return '<div style="margin-top:6mm"><div style="font-size:10pt;'+
      'font-weight:600;color:'+b.c1+';margin-bottom:2mm">'+n+'. '+title+
      '</div>'+inner+'</div>';
  }
  function cl(n, text){
    return '<div style="margin-bottom:2mm"><b>'+n+'</b> &nbsp; '+text+'</div>';
  }

  /* ---- 1. charges ---- */
  var charges;
  if(rental){
    charges =
      '<table><tr><th>Description</th><th style="text-align:right">Rate per print'+
      '</th><th>Applies to</th></tr>'+
      '<tr><td><b>First '+num(k.free)+' prints \u2014 per printer, per month</b>'+
        '<div style="font-size:9pt;color:#55606D"><i>Fixed monthly charge, '+
        'payable whether or not the prints are used</i></div></td>'+
        '<td style="text-align:right"><b>Rs. '+k.rate+'</b></td>'+
        '<td>'+num(k.free)+' prints</td></tr>'+
      '<tr><td><b>Prints beyond '+num(k.free)+' \u2014 per printer, per month</b>'+
        '<div style="font-size:9pt;color:#55606D"><i>Charged on actual usage above '+
        'the monthly fixed volume</i></div></td>'+
        '<td style="text-align:right"><b>Rs. '+k.rate2+'</b></td>'+
        '<td>Each additional print</td></tr></table>'+

      '<div style="background:#EDF2FA;border:1px solid #C9DCF6;border-radius:2mm;'+
        'padding:3mm 4mm;margin-top:3mm;font-size:9.5pt">'+
        '<b>Fixed monthly minimum per printer:</b> '+num(k.free)+' prints '+
        '\u00d7 Rs. '+k.rate+' = <b>Rs. '+num(minimum)+' per printer, per '+
        'month.</b><br>This amount is payable every month for each installed '+
        'printer regardless of actual usage. Prints above '+num(k.free)+' in the '+
        'same month, on the same printer, are charged at Rs. '+k.rate2+' each.'+
      '</div>';
  } else if(warranty){
    charges = '<p>No charge arises under this Warranty. The equipment was '+
      'purchased from the Company and is covered as set out below.</p>';
  } else {

/* ============================================================
   QR CODES
   ------------------------------------------------------------
   Byte mode, error correction M, versions 1 to 10. Written out
   because the app loads nothing from outside.

   Level M recovers about 15% of the code. That is the right
   choice for a sticker on a machine: it survives a scuff and a
   fingerprint, without making the pattern so dense that a phone
   struggles from arm's length.
   ============================================================ */

/* how many data codewords, and how the blocks are split, at level M */
var QR_M = {
  1:  { total:26,   ec:10, g1:1, d1:16 },
  2:  { total:44,   ec:16, g1:1, d1:28 },
  3:  { total:70,   ec:26, g1:1, d1:44 },
  4:  { total:100,  ec:18, g1:2, d1:32 },
  5:  { total:134,  ec:24, g1:2, d1:43 },
  6:  { total:172,  ec:16, g1:4, d1:27 },
  7:  { total:196,  ec:18, g1:4, d1:31 },
  8:  { total:242,  ec:22, g1:2, d1:38, g2:2, d2:39 },
  9:  { total:292,  ec:22, g1:3, d1:36, g2:2, d2:37 },
  10: { total:346,  ec:26, g1:4, d1:43, g2:1, d2:44 }
};

function qrDataWords(v){
  var s = QR_M[v];
  return s.g1 * s.d1 + (s.g2 ? s.g2 * s.d2 : 0);
}

/* ---------- the field the error correction lives in ---------- */
var QR_EXP = new Array(512), QR_LOG = new Array(256);
(function(){
  var x = 1;
  for(var i = 0; i < 255; i++){
    QR_EXP[i] = x;
    QR_LOG[x] = i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;         /* the polynomial the standard fixes */
  }
  for(i = 255; i < 512; i++) QR_EXP[i] = QR_EXP[i - 255];
})();

function qrMul(a, b){
  if(a === 0 || b === 0) return 0;
  return QR_EXP[QR_LOG[a] + QR_LOG[b]];
}

function qrGenPoly(n){
  var poly = [1];
  for(var i = 0; i < n; i++){
    var next = new Array(poly.length + 1).fill(0);
    for(var j = 0; j < poly.length; j++){
      next[j] ^= poly[j];
      next[j + 1] ^= qrMul(poly[j], QR_EXP[i]);
    }
    poly = next;
  }
  return poly;
}

function qrECC(data, n){
  var gen = qrGenPoly(n);
  var rem = data.concat(new Array(n).fill(0));
  for(var i = 0; i < data.length; i++){
    var f = rem[i];
    if(f === 0) continue;
    for(var j = 0; j < gen.length; j++)
      rem[i + j] ^= qrMul(gen[j], f);
  }
  return rem.slice(data.length);
}

/* ---------- turning the text into codewords ---------- */
function qrBytes(text){
  var out = [];
  for(var i = 0; i < text.length; i++){
    var c = text.charCodeAt(i);
    if(c < 0x80) out.push(c);
    else if(c < 0x800){
      out.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));
    } else {
      out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
    }
  }
  return out;
}

function qrPickVersion(n){
  for(var v = 1; v <= 10; v++){
    var lenBits = v < 10 ? 8 : 16;
    var need = 4 + lenBits + n * 8;
    if(qrDataWords(v) * 8 >= need) return v;
  }
  return null;
}

function qrEncodeData(text){
  var bytes = qrBytes(text);
  var v = qrPickVersion(bytes.length);
  if(!v) return null;

  var bits = [];
  function put(val, n){
    for(var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1);
  }

  put(4, 4);                                   /* byte mode */
  put(bytes.length, v < 10 ? 8 : 16);
  bytes.forEach(function(b){ put(b, 8); });

  var cap = qrDataWords(v) * 8;
  for(var i = 0; i < 4 && bits.length < cap; i++) bits.push(0);   /* terminator */
  while(bits.length % 8) bits.push(0);

  var words = [];
  for(i = 0; i < bits.length; i += 8){
    var b = 0;
    for(var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    words.push(b);
  }
  /* the standard's two pad bytes, alternating */
  var pads = [0xEC, 0x11], p = 0;
  while(words.length < qrDataWords(v)) words.push(pads[p++ % 2]);

  return { version:v, words:words };
}

/* data and error correction are interleaved block by block */
function qrCodewords(text){
  var enc = qrEncodeData(text);
  if(!enc) return null;
  var v = enc.version, s = QR_M[v];

  var blocks = [], at = 0;
  for(var i = 0; i < s.g1; i++){ blocks.push(enc.words.slice(at, at + s.d1)); at += s.d1; }
  if(s.g2) for(i = 0; i < s.g2; i++){ blocks.push(enc.words.slice(at, at + s.d2)); at += s.d2; }

  var eccs = blocks.map(function(b){ return qrECC(b, s.ec); });

  var out = [];
  var longest = Math.max.apply(null, blocks.map(function(b){ return b.length; }));
  for(i = 0; i < longest; i++)
    blocks.forEach(function(b){ if(i < b.length) out.push(b[i]); });
  for(i = 0; i < s.ec; i++)
    eccs.forEach(function(e){ out.push(e[i]); });

  return { version:v, words:out };
}

/* ---------- laying it out ---------- */
var QR_ALIGN = {
  1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
  6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46], 10:[6,28,50]
};

function qrBuild(text){
  var cw = qrCodewords(text);
  if(!cw) return null;
  var v = cw.version;
  var n = v * 4 + 17;

  var m = [], used = [];
  for(var i = 0; i < n; i++){
    m.push(new Array(n).fill(0));
    used.push(new Array(n).fill(false));
  }
  function set(r, c, val){ m[r][c] = val; used[r][c] = true; }

  /* the three big squares, and the gap round them */
  function finder(r, c){
    for(var dr = -1; dr <= 7; dr++)
      for(var dc = -1; dc <= 7; dc++){
        var rr = r + dr, cc = c + dc;
        if(rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
        var on = (dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6) &&
                 (dr === 0 || dr === 6 || dc === 0 || dc === 6 ||
                  (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4));
        set(rr, cc, on ? 1 : 0);
      }
  }
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

  /* the dotted lines that let a scanner measure the grid */
  for(i = 8; i < n - 8; i++){
    set(6, i, i % 2 === 0 ? 1 : 0);
    set(i, 6, i % 2 === 0 ? 1 : 0);
  }

  /* the small squares that keep it straight when it is bent */
  var al = QR_ALIGN[v];
  al.forEach(function(r){
    al.forEach(function(c){
      if((r === 6 && c === 6) || (r === 6 && c === n - 7) ||
         (r === n - 7 && c === 6)) return;
      for(var dr = -2; dr <= 2; dr++)
        for(var dc = -2; dc <= 2; dc++)
          set(r + dr, c + dc,
              (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0))
              ? 1 : 0);
    });
  });

  set(n - 8, 8, 1);                       /* always dark */

  /* The format area is reserved now and written after masking.
     Column 6 of row 8, and row 6 of column 8, are timing modules and
     belong to the timing line \u2014 zeroing them here would break the
     grid a scanner measures itself against. */
  for(i = 0; i < 9; i++){
    if(i !== 6 && !used[8][i]) { m[8][i] = 0; used[8][i] = true; }
    if(i !== 6 && !used[i][8]) { m[i][8] = 0; used[i][8] = true; }
  }
  for(i = 0; i < 8; i++){
    used[8][n - 1 - i] = true;
    used[n - 1 - i][8] = true;
  }

  /* version information, from version 7 up */
  if(v >= 7){
    var vb = qrVersionBits(v);
    for(i = 0; i < 18; i++){
      var bit = (vb >> i) & 1;
      var r = Math.floor(i / 3), c = i % 3;
      set(n - 11 + c, r, bit);
      set(r, n - 11 + c, bit);
    }
  }

  /* the data, snaked up and down in two-wide columns */
  var bitsOut = [];
  cw.words.forEach(function(w){
    for(var i = 7; i >= 0; i--) bitsOut.push((w >> i) & 1);
  });

  var at = 0, up = true;
  for(var col = n - 1; col > 0; col -= 2){
    if(col === 6) col--;                  /* skip the timing column */
    for(var k = 0; k < n; k++){
      var row = up ? n - 1 - k : k;
      for(var s2 = 0; s2 < 2; s2++){
        var cc = col - s2;
        if(used[row][cc]) continue;
        m[row][cc] = at < bitsOut.length ? bitsOut[at] : 0;
        at++;
      }
    }
    up = !up;
  }

  /* try every mask and keep the one the standard's rules prefer */
  var best = null, bestScore = Infinity;
  for(var mask = 0; mask < 8; mask++){
    var t = qrApplyMask(m, used, n, mask);
    qrWriteFormat(t, n, mask);
    var sc = qrPenalty(t, n);
    if(sc < bestScore){ bestScore = sc; best = t; }
  }
  return { size:n, modules:best, version:v };
}

function qrMaskBit(mask, r, c){
  switch(mask){
    case 0: return (r + c) % 2 === 0;
    case 1: return r % 2 === 0;
    case 2: return c % 3 === 0;
    case 3: return (r + c) % 3 === 0;
    case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
    case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
    case 6: return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0;
    case 7: return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0;
  }
  return false;
}

function qrApplyMask(m, used, n, mask){
  var t = m.map(function(row){ return row.slice(); });
  for(var r = 0; r < n; r++)
    for(var c = 0; c < n; c++)
      if(!used[r][c] && qrMaskBit(mask, r, c)) t[r][c] ^= 1;
  return t;
}

/* the format bits carry the level and the mask, with their own error
   correction and a fixed mask of their own */
function qrFormatBits(mask){
  var data = (0x00 << 3) | mask;          /* 00 is level M */
  var rem = data;
  for(var i = 0; i < 10; i++){
    rem <<= 1;
    if(rem & 0x400) rem ^= 0x537;
  }
  return ((data << 10) | (rem & 0x3FF)) ^ 0x5412;
}

function qrWriteFormat(m, n, mask){
  var f = qrFormatBits(mask);
  for(var i = 0; i < 15; i++){
    var bit = (f >> i) & 1;
    if(i < 6)       m[8][i] = bit;
    else if(i === 6) m[8][7] = bit;
    else if(i === 7) m[8][8] = bit;
    else if(i === 8) m[7][8] = bit;
    else             m[14 - i][8] = bit;

    if(i < 8)  m[n - 1 - i][8] = bit;
    else       m[8][n - 15 + i] = bit;
  }
  m[n - 8][8] = 1;
}

function qrVersionBits(v){
  var rem = v;
  for(var i = 0; i < 12; i++){
    rem <<= 1;
    if(rem & 0x1000) rem ^= 0x1F25;
  }
  return (v << 12) | (rem & 0xFFF);
}

/* the four penalties the standard names, used only to pick a mask */
function qrPenalty(m, n){
  var p = 0, r, c, i, run, dark = 0;

  for(r = 0; r < n; r++){
    run = 1;
    for(c = 1; c < n; c++){
      if(m[r][c] === m[r][c-1]) run++;
      else { if(run >= 5) p += 3 + (run - 5); run = 1; }
    }
    if(run >= 5) p += 3 + (run - 5);
  }
  for(c = 0; c < n; c++){
    run = 1;
    for(r = 1; r < n; r++){
      if(m[r][c] === m[r-1][c]) run++;
      else { if(run >= 5) p += 3 + (run - 5); run = 1; }
    }
    if(run >= 5) p += 3 + (run - 5);
  }
  for(r = 0; r < n - 1; r++)
    for(c = 0; c < n - 1; c++)
      if(m[r][c] === m[r][c+1] && m[r][c] === m[r+1][c] &&
         m[r][c] === m[r+1][c+1]) p += 3;

  var pat = [1,0,1,1,1,0,1,0,0,0,0];
  function looks(get, len){
    var hits = 0;
    for(var s = 0; s + 11 <= len; s++){
      var ok = true;
      for(var k = 0; k < 11; k++) if(get(s + k) !== pat[k]) { ok = false; break; }
      if(ok) hits++;
      ok = true;
      for(k = 0; k < 11; k++) if(get(s + k) !== pat[10 - k]) { ok = false; break; }
      if(ok) hits++;
    }
    return hits;
  }
  for(r = 0; r < n; r++)
    p += 40 * looks(function(i){ return m[r][i]; }, n);
  for(c = 0; c < n; c++)
    p += 40 * looks(function(i){ return m[i][c]; }, n);

  for(r = 0; r < n; r++) for(c = 0; c < n; c++) if(m[r][c]) dark++;
  var pct = dark * 100 / (n * n);
  p += 10 * Math.floor(Math.abs(pct - 50) / 5);
  return p;
}

/* ---------- drawing it ---------- */
function qrSVG(text, mm, quiet){
  var q = qrBuild(text);
  if(!q) return '';
  quiet = quiet === undefined ? 4 : quiet;
  var n = q.size, total = n + quiet * 2;
  var d = '';
  for(var r = 0; r < n; r++){
    for(var c = 0; c < n; c++){
      if(!q.modules[r][c]) continue;
      d += 'M' + (c + quiet) + ' ' + (r + quiet) + 'h1v1h-1z';
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" '+
    'width="'+mm+'mm" height="'+mm+'mm" shape-rendering="crispEdges">'+
    '<rect width="'+total+'" height="'+total+'" fill="#fff"/>'+
    '<path d="'+d+'" fill="#000"/></svg>';
}

/* ============================================================
   STICKERS
   ------------------------------------------------------------
   Two sizes. Printed in batches, because nobody labels a client's
   office one PDF at a time.

   The code carries only the serial. Everything else on the label
   is resolved from it, so a client who moves floors needs a
   reprint, not a new code \u2014 and a label that carries data
   cannot be corrected at all.
   ============================================================ */

var STICKER_SIZES = {
  big:   { w:100, h:70, label:'100 \u00d7 70 mm', per:8,  cols:2, rows:4,
           for_:'copiers' },
  small: { w:70,  h:45, label:'70 \u00d7 45 mm',  per:12, cols:3, rows:4,
           for_:'desktop printers' }
};

function qrURL(serial){
  var base = (DB.company.qrBase || 'https://paragoncopiersolution.com')
               .replace(/\/+$/, '');
  return base + '/c/' + encodeURIComponent(serial);
}

/* one label, as HTML, at a fixed millimetre size */
function stickerHTML(m, size){
  var s = STICKER_SIZES[size];
  var c = byId(DB.clients, m.client);

  var phone = DB.company.phone || '021-34536010';
  var site = b.site || 'www.paragoncopiersolution.com';

  var pad = big ? '3mm 3.5mm' : '2mm 2.5mm';
  var qrmm = big ? 30 : 21;

  function row(k, v, blue){
    return '<tr><td style="color:#8794A3;font-size:'+(big?'6.5pt':'5pt')+
      ';padding:'+(big?'0.6mm':'0.35mm')+' 2mm 0.6mm 0;white-space:nowrap;'+
      'vertical-align:top">'+esc(k)+'</td>'+
      '<td style="font-size:'+(big?'7.5pt':'5.5pt')+';font-weight:600;'+
      (blue?'color:'+b.c1+';':'')+'padding:'+(big?'0.6mm':'0.35mm')+' 0;'+
      'line-height:1.25">'+esc(v)+'</td></tr>';
  }

  return '<div class="sticker" style="width:'+s.w+'mm;height:'+s.h+'mm;'+
    'border:0.2mm solid #D8DDE4;box-sizing:border-box;overflow:hidden;'+
    'display:flex;flex-direction:column;background:#fff">'+

    /* the band: it has to look like it belongs to somebody */
    '<div style="background:'+b.c1+';color:#fff;padding:'+
      (big?'2mm 3.5mm':'1.4mm 2.5mm')+';display:flex;'+
      'justify-content:space-between;align-items:center">'+
      '<div><div style="font-size:'+(big?'11pt':'8pt')+';font-weight:700;'+
        'letter-spacing:.12em;line-height:1">'+esc(b.one.toUpperCase())+'</div>'+
        '<div style="font-size:'+(big?'5pt':'4pt')+';letter-spacing:.18em;'+
        'opacity:.82">'+esc(b.two.toUpperCase())+'</div></div>'+
      '<div style="text-align:right">'+
        '<div style="font-size:'+(big?'5pt':'4pt')+';opacity:.82;'+
          'letter-spacing:.1em">SERVICE HELPLINE</div>'+
        '<div style="font-size:'+(big?'10pt':'7.5pt')+';font-weight:700;'+
          'line-height:1.1">'+esc(phone)+'</div></div>'+
    '</div>'+

    '<div style="flex:1;display:flex;padding:'+pad+';gap:'+(big?'3mm':'2mm')+'">'+
      '<div style="text-align:center;flex-shrink:0">'+
        qrSVG(qrURL(m.serial || ''), qrmm, 2)+
        '<div style="font-size:'+(big?'5pt':'4pt')+';font-weight:700;'+
          'letter-spacing:.09em;color:#55606D;margin-top:'+(big?'1.2mm':'0.7mm')+
          ';line-height:1.3">'+(big?'SCAN WITH<br>PHONE CAMERA':'SCAN TO REPORT')+
          '</div></div>'+

      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:'+(big?'9.5pt':'7pt')+';font-weight:700;'+
          'color:'+b.c1+';line-height:1.15">Machine not working?</div>'+
        '<div style="font-size:'+(big?'5.5pt':'4.2pt')+';color:#55606D;'+
          'line-height:1.35;margin:'+(big?'0.8mm 0 1.8mm':'0.4mm 0 1mm')+'">'+
          (big
            ? 'Scan the code to report a fault. No app needed \u2014 it opens '+
              'straight in your browser.'
            : 'Scan to report a fault.')+'</div>'+
        '<table style="width:100%;border-collapse:collapse">'+
          row('Client', c ? c.name : '')+
          row('Machine', m.model || '')+
          row('Serial No.', m.serial || '', true)+

        ' &nbsp;\u00b7&nbsp; '+esc(m.serial||'')+'</div>'+

/* ---------- choosing which to print ---------- */

var stickPick = {};

function stickerRun(){
  if(!can('complaint.add')) return toast('Only the office prints labels','bad');
  if(!DB.machines.length) return toast('No machines on record','bad');
  stickPick = {};
  stickerList('all');
}

function stickerList(filter){
  var list = DB.machines.slice();
  if(filter === 'none') list = list.filter(function(m){ return !m.stickerAt; });

  /* Grouped by client, and printed in the order shown, because that is
     how they will be carried to site. */
  list.sort(function(a, b){
    var an = nameOf(DB.clients, a.client), bn = nameOf(DB.clients, b.client);
    return an === bn ? String(a.model) < String(b.model) ? -1 : 1
                     : an < bn ? -1 : 1;
  });

  var noneLeft = DB.machines.filter(function(m){ return !m.stickerAt; }).length;

  modal('Print stickers',
    '<div class="strip">'+
      '<button class="'+(filter==='all'?'on':'')+'" onclick="stickerList(\'all\')">'+
        'All<span class="c">'+DB.machines.length+'</span></button>'+
      '<button class="'+(filter==='none'?'on':'')+'" onclick="stickerList(\'none\')">'+
        'Not printed yet<span class="c">'+noneLeft+'</span></button>'+
    '</div>'+

    '<div class="two" style="margin:10px 0">'+
      '<div class="field" style="margin:0"><label>Size</label>'+
        '<select id="stSize">'+
          Object.keys(STICKER_SIZES).map(function(k){
            var s = STICKER_SIZES[k];
            return '<option value="'+k+'">'+esc(s.label)+' \u00b7 '+s.per+
                   ' a sheet \u00b7 '+esc(s.for_)+'</option>'; }).join('')+
        '</select></div>'+
      '<div class="field" style="margin:0"><label>&nbsp;</label>'+
        '<button class="btn ghost" style="width:100%" onclick="stickAll()">'+
        'Tick all shown</button></div>'+
    '</div>'+

    (list.length ? list.map(function(m){
      var c = byId(DB.clients, m.client);
      var b = BRANDS[(c && c.brand) || 'paragon'];
      return '<label style="display:flex;gap:10px;align-items:flex-start;'+
        'padding:9px 2px;font-weight:400;border-bottom:1px solid #EDF0F3;'+
        'cursor:pointer">'+
        '<input type="checkbox" class="stBox" value="'+m.id+'"'+
          (stickPick[m.id]?' checked':'')+
          ' onchange="stickPick[this.value]=this.checked" style="width:auto;'+
          'margin-top:3px">'+
        '<span style="flex:1;min-width:0">'+
          '<span style="font-size:11.5px;color:'+b.c1+';font-weight:600">'+
            esc(b.name)+'</span>'+
          '<span style="display:block;font-size:13.5px;font-weight:600">'+
            esc(c?c.name:'')+'</span>'+
          '<span style="display:block;font-size:12.5px;color:var(--ink-3)">'+
            esc(m.model)+' \u00b7 '+esc(m.serial||'no serial')+
            (m.stickerAt ? ' \u00b7 printed '+esc(dmy(m.stickerAt))
                         : ' \u00b7 never printed')+'</span>'+
        '</span></label>'; }).join('')
      : '<div class="empty">Nothing here.</div>'),

    [{t:'Close',cls:'ghost',f:'closeModal()'},
     {t:'Print stickers',cls:'',f:'printStickers()'}]);
}

function stickAll(){
  Array.prototype.forEach.call(document.querySelectorAll('.stBox'), function(b){
    b.checked = true; stickPick[b.value] = true; });
}

/* ---------- the sheet ---------- */

function printStickers(){
  var size = $('stSize').value;
  var s = STICKER_SIZES[size];
  var ids = Object.keys(stickPick).filter(function(k){ return stickPick[k]; });
  if(!ids.length) return toast('Tick at least one machine','bad');

  /* in the order the list showed them */
  var chosen = [];
  Array.prototype.forEach.call(document.querySelectorAll('.stBox'), function(b){
    if(stickPick[b.value]){
      var m = byId(DB.machines, b.value);
      if(m) chosen.push(m);
    }
  });
  if(!chosen.length)
    chosen = ids.map(function(i){ return byId(DB.machines, i); }).filter(Boolean);

  var missing = chosen.filter(function(m){ return !(m.serial||'').trim(); });
  if(missing.length)
    return toast(missing.length + ' of them have no serial number. The code is '+
                 'the serial, so they cannot be labelled yet.','bad');

  /* Every position on a page is filled before a new page starts. Nine
     labels is a full sheet and one on the second, not two half sheets. */
  var pages = [];
  for(var i = 0; i < chosen.length; i += s.per)
    pages.push(chosen.slice(i, i + s.per));

  var w = window.open('', '_blank');
  if(!w) return toast('The browser blocked the print window','bad');

  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8">'+
    '<title>Stickers \u00b7 '+chosen.length+'</title><style>'+
    '@page{ size:A4 portrait; margin:8mm; }'+
    '*{box-sizing:border-box;margin:0;padding:0}'+
    'body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;'+
      '-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.sheet{display:grid;grid-template-columns:repeat('+s.cols+','+s.w+'mm);'+
      'gap:0;page-break-after:always;width:'+(s.cols*s.w)+'mm}'+
    '.sheet:last-child{page-break-after:auto}'+
    '.cell{position:relative}'+
    /* faint lines to cut along, and nothing heavier */
    '.cell:after{content:"";position:absolute;inset:0;'+
      'border-right:0.2mm dashed #C8CFD8;border-bottom:0.2mm dashed #C8CFD8;'+
      'pointer-events:none}'+
    '</style></head><body>'+

    pages.map(function(page){
      return '<div class="sheet">' + page.map(function(m){
        return '<div class="cell">' + stickerHTML(m, size) + '</div>';
      }).join('') + '</div>';
    }).join('') +

    '</body></html>');
  w.document.close();
  setTimeout(function(){ w.print(); }, 500);

  /* so the list can show what still has no label */
  chosen.forEach(function(m){ m.stickerAt = today(); m._at = now(); });
  logIt('sticker','Printed ' + chosen.length + ' sticker(s)',
        s.label + ' \u00b7 ' + pages.length + ' sheet(s)');
  save(); closeModal(); draw();
  toast(chosen.length + ' label(s) on ' + pages.length + ' sheet(s)','good');
  if(sharingOn()) syncSoon();
}

/* ============================================================
   MACHINES
   ------------------------------------------------------------
   What each machine is doing: how much it prints, and how often
   it breaks. The two together say things neither says alone.

   A machine printing forty thousand a month with no complaints is
   earning. One printing four thousand with four complaints is
   costing, and that is invisible until they sit in one list.
   ============================================================ */

/* the server keeps the readings; the app keeps a copy to show */
function pullMeters(quiet){
  if(!sharingOn()) return Promise.resolve();
  var since = new Date();
  since.setMonth(since.getMonth() - 1);

  return bridge({ action:'meters', since: since.toISOString().slice(0,10) })
    .then(function(d){
      if(!d || !d.ok) throw new Error((d && d.msg) || 'refused');
      DB.meters = {};
      (d.machines || []).forEach(function(r){
        DB.meters[String(r.key || '').toLowerCase()] = r;
      });
      DB.metersAt = now();
      save();
      if(PAGE === 'fleet') drawFleet();
      if(!quiet) toast((d.machines||[]).length + ' machine(s) read','good');
    })
    .catch(function(e){
      if(!quiet) toast('Could not get the counters: ' + e.message,'bad');
    });
}

function meterFor(m){
  if(!m || !m.serial) return null;
  return (DB.meters || {})[String(m.serial).trim().toLowerCase()] || null;
}

/* pages a day, worked out from the two readings the server kept */
function perDay(r){
  if(!r || !r.base || !r.last) return null;
  var a = new Date(r.base.day), b = new Date(r.last.day);
  var days = Math.round((b - a) / 86400000);
  if(!days || r.used == null) return null;
  return Math.round(r.used / days);
}

function jobsOn(machineId){
  return DB.complaints.filter(function(c){ return c.machine === machineId; });
}
function openJobsOn(machineId){
  return jobsOn(machineId).filter(function(c){
    return c.status !== 'resolved' && c.status !== 'closed'; });
}

/* how often it has come back, over the last three months */
function faultRate(machineId){
  var cut = new Date(Date.now() - 90*86400e3).toISOString();
  return jobsOn(machineId).filter(function(c){
    return String(c.opened||'') >= cut; }).length;
}

var FLEET_SORT = 'busy';
function fleetSort(v){ FLEET_SORT = v; drawFleet(); }

function drawFleet(){
  if(!can('complaint.all')){
    $('flBody').innerHTML = '<div class="empty"><span class="ic">\u{1F512}</span>'+
      'This is for the office.</div>';
    return;
  }

  var rows = DB.machines.map(function(m){
    var r = meterFor(m);
    var c = byId(DB.clients, m.client);
    var k = contractFor(m.id);
    return {
      m:m, c:c, k:k, meter:r,
      open: openJobsOn(m.id).length,
      faults: faultRate(m.id),
      used: r ? r.used : null,
      day: perDay(r),
      last: r && r.last ? r.last : null
    };
  });

  var totalPages = rows.reduce(function(a,r){ return a + (r.used || 0); }, 0);
  var withOpen = rows.filter(function(r){ return r.open; }).length;
  var noRead = rows.filter(function(r){ return !r.last; }).length;

  rows.sort(function(a,b){
    if(FLEET_SORT === 'busy')   return (b.used||-1) - (a.used||-1);
    if(FLEET_SORT === 'faults') return b.faults - a.faults ||
                                       (b.open - a.open);
    if(FLEET_SORT === 'open')   return b.open - a.open;
    if(FLEET_SORT === 'quiet')  return (a.used == null ? 1e9 : a.used) -
                                       (b.used == null ? 1e9 : b.used);
    var an = (a.c && a.c.name) || '', bn = (b.c && b.c.name) || '';
    return an < bn ? -1 : 1;
  });

  $('flBody').innerHTML =
    '<div class="tiles">'+
      tile('b', num(totalPages), 'Pages this month')+
      tile('r', withOpen, 'With an open job')+
      tile('a', noRead, 'Never read')+
      tile('g', DB.machines.length, 'Machines')+
    '</div>'+

    (!sharingOn()
      ? '<div class="note w">Sharing is off, so there are no counters here. '+
        'Turn it on under More \u2192 Paragon server.</div>'
      : DB.metersAt
        ? '<div class="help" style="margin-bottom:10px">Counters as of '+
          esc(dtime(DB.metersAt))+' \u00b7 <a href="#" onclick="pullMeters();'+
          'return false">refresh</a></div>'
        : '<div class="note i">No counters yet. <a href="#" '+
          'onclick="pullMeters();return false">Get them from the server</a>, '+
          'or read them from the console first.</div>')+

    '<div class="strip">'+
      [['busy','Busiest'],['faults','Most faults'],['open','Open jobs'],
       ['quiet','Quietest'],['client','By client']].map(function(f){
        return '<button class="'+(FLEET_SORT===f[0]?'on':'')+
          '" onclick="fleetSort(\''+f[0]+'\')">'+f[1]+'</button>'; }).join('')+
    '</div>'+

    (rows.length ? rows.map(fleetCard).join('')
      : '<div class="empty">No machines yet.</div>');
}

function fleetCard(r){
  var m = r.m, b = BRANDS[(r.c && r.c.brand) || 'paragon'];
  var stale = r.last ? Math.floor((Date.now() - new Date(r.last.at)) / 86400000)
                     : null;

  /* the two things worth seeing together */
  var busy = r.used != null && r.used > 0;

  return '<div class="card tap" onclick="openMachine(\''+m.id+'\')">'+
    '<div style="height:3px;border-radius:2px;background:'+b.c1+
      ';margin:-13px -14px 10px"></div>'+
    '<div class="row"><div class="grow">'+
      '<div class="meta" style="color:'+b.c1+';font-weight:600;margin-bottom:2px">'+
        esc((r.c && r.c.name) || '')+'</div>'+
      '<div class="ttl">'+esc(m.model)+'</div>'+
      '<div class="meta">'+esc(m.serial||'no serial')+
        ([m.place, m.dept].filter(Boolean).length
          ? ' \u00b7 ' + esc([m.place, m.dept].filter(Boolean).join(' \u2014 '))
          : '')+'</div>'+

      '<div class="meta" style="margin-top:6px">'+
        (busy
          ? '<b>'+num(r.used)+'</b> pages this month' +
            (r.day ? ' \u00b7 about ' + num(r.day) + ' a day' : '')
          : r.last
            ? 'no printing recorded this month'
            : '<span style="color:var(--amber)">never read</span>')+
        (r.last && stale > 25
          ? ' \u00b7 <span style="color:var(--amber)">last read '+stale+
            ' days ago</span>' : '')+
      '</div>'+

      '<div class="meta">'+
        (r.k
          ? esc(DEAL_KIND[r.k.kind].label) +
            (contractState(r.k) === 'expired'
              ? ' \u00b7 <span style="color:var(--red)">expired</span>' : '')
          : '<span style="color:var(--amber)">no contract</span>')+
        ' \u00b7 '+r.faults+' fault(s) in 90 days'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">'+
      (r.open ? '<span class="pill p-high">'+r.open+' open</span>' : '')+
      (sick ? '<span class="pill p-pending">breaking often</span>' : '')+
    '</div></div></div>';
}

/* ============================================================
   WHEN THERE IS NO SIGNAL
   ------------------------------------------------------------
   Nothing stops. Every save goes to the device first and the
   server second, so a basement costs you nothing but the delay.

   What matters is that the person can see which it is.
   ============================================================ */

var ONLINE = true;
var LAST_FAIL = '';

/* What the server has not been told about yet. Worked out rather than
   counted as it happens, so it stays right even if a sync dies halfway. */
function unsent(){
  if(!sharingOn()) return 0;
  var since = DB.share.at || '';
  var n = 0;
  ['complaints','clients','machines','quotes','bills','contracts']
    .forEach(function(k){
      (DB[k] || []).forEach(function(r){
        if(r && String(r._at || '') > String(since)) n++;
      });
    });
  return n;
}

function netState(){
  if(!sharingOn()) return 'alone';
  if(!ONLINE) return 'off';
  return unsent() ? 'behind' : 'ok';
}

function drawNet(){
  var el = $('netBar');
  if(!el) return;
  var s = netState(), n = unsent();

  if(s === 'alone' || (s === 'ok' && !n)){ el.className = 'hide'; return; }
  el.className = 'net ' + s;

  el.innerHTML =
    s === 'off'
      ? '<b>No signal.</b> Carry on \u2014 everything is saved on this phone '+
        'and goes by itself when you are back.' +
        (n ? ' <span>' + n + ' waiting</span>' : '')
      : s === 'behind'
        ? '<b>' + n + ' change(s) not sent yet.</b>' +
          ' <span onclick="syncNow()">send now</span>'
        : '';
}

/* the browser tells us, and we check for ourselves before trusting it */
function watchNet(){
  window.addEventListener('online', function(){
    ONLINE = true; drawNet();
    toast('Back online. Sending what is waiting\u2026','good');
    syncNow(true);
  });
  window.addEventListener('offline', function(){
    ONLINE = false; drawNet();
  });
  ONLINE = navigator.onLine !== false;
  drawNet();

  /* A phone on a wifi with no route out still reports itself online, so
     the only honest test is whether the last sync actually worked. */
  setInterval(function(){
    if(sharingOn() && ONLINE && unsent()) syncNow(true);
  }, 60000);
}

function netWorked(){
  ONLINE = true; LAST_FAIL = '';
  drawNet();
}

function netFailed(msg){
  /* A refused request is not a lost signal. The difference matters: one
     of them is worth telling somebody about. */
  if(/NetworkError|Failed to fetch|Load failed|network/i.test(String(msg))){
    ONLINE = false;
  }
  LAST_FAIL = String(msg || '');
  drawNet();
}

/* ---------- what is waiting, in full ---------- */
function unsentList(){
  if(!sharingOn())
    return modal('Sharing is off',
      '<div class="note i">This phone is working on its own. Everything is '+

   ['contracts','Contract'], ['clients','Client'], ['machines','Machine']]
    .forEach(function(p){
      (DB[p[0]] || []).forEach(function(r){

          rows.push({ kind:p[1], what:(r.no || r.name || r.model || ''),

  rows.sort(function(a,b){ return String(b.at) < String(a.at) ? -1 : 1; });

      ? '<div class="note d">The last attempt said: '+esc(LAST_FAIL)+'</div>'
      : '')+

    (rows.length
      ? rows.slice(0, 30).map(function(r){
          return '<div class="card" style="padding:9px 12px;margin-bottom:6px">'+
            '<div style="font-size:13.5px;font-weight:600">'+esc(r.kind)+
            ' \u00b7 '+esc(r.what)+'</div>'+
            '<div class="meta">changed '+esc(ago(r.at))+'</div></div>'; }).join('')
        + (rows.length > 30
           ? '<div class="help">and '+(rows.length-30)+' more.</div>' : '')
      : '<div class="empty"><span class="ic">\u2713</span>Everything has '+
        'been sent.</div>')+

    (DB.share.at
      ? '<div class="help" style="margin-top:10px">Last sent '+
        esc(dtime(DB.share.at))+'.</div>' : ''),

    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(rows.length ? [{t:'Try now',cls:'',f:'closeModal();syncNow()'}] : []));
}

/* ============================================================
   NUMBERS
   ------------------------------------------------------------
   Each phone counted on its own, so Waqar's phone and Fawad's
   phone could both open PCS-0041 on the same morning. Now the
   server hands out numbers in small batches, and each phone
   keeps a few in hand so it can still number a job with no
   signal.

   A few numbers can go unused \u2014 a phone lost with three in
   hand leaves a gap. A gap is harmless; two jobs with one number
   is not.
   ============================================================ */

var POOL_KEEP = 5;

function numPool(key){
  DB.numPool = DB.numPool || {};
  DB.numPool[key] = DB.numPool[key] || [];
  return DB.numPool[key];
}

/* every series a phone might need, and how the server should shape it */
function numberSeries(){
  if(!can('complaint.add')) return [];         /* a technician numbers nothing */
  var out = [{ key:'job',  prefix:'PCS',   pad:4, start:1 },
             { key:'bill', prefix:'PCS-B', pad:4, start:1 }];
  Object.keys(BRANDS).forEach(function(b){
    out.push({ key:'q-'+b, prefix:BRANDS[b].prefix, pad:4, start:1 });
    var base = BRANDS[b].prefix.replace('-Q','');
    Object.keys(DEAL_KIND).forEach(function(k){
      var pre = base + '-' + DEAL_KIND[k].abbr;
      out.push({ key:'k-'+pre, prefix:pre, pad:4, start:1024 });
    });
  });
  /* ASC with and without parts share a prefix, so they share a series */
  var seen = {};
  return out.filter(function(s){
    if(seen[s.key]) return false;
    seen[s.key] = 1; return true;
  });
}

function topUpNumbers(){
  if(!sharingOn()) return;
  numberSeries().forEach(function(s){
    var pool = numPool(s.key);
    var want = POOL_KEEP - pool.length;
    if(want <= 0) return;
    bridge({ action:'number', prefix:s.prefix, sep:'-', pad:s.pad,
             start:s.start, count:want })
      .then(function(d){
        if(d && d.ok && d.numbers){
          var p = numPool(s.key);
          d.numbers.forEach(function(x){ if(p.indexOf(x) === -1) p.push(x); });
          save();
        }
      }).catch(function(){});
  });
}

/* A number from the batch in hand. With sharing off the phone is the only
   one counting, so its own counter is safe. With sharing on and the batch
   used up offline, the phone's own tag goes in, so it still cannot clash. */
function takeNumber(key, prefix, localNext, pad){
  var pool = numPool(key);
  if(pool.length){
    var n = pool.shift();
    save();
    if(pool.length < 2) setTimeout(topUpNumbers, 500);
    return n;
  }
  var local = prefix + '-' + String(localNext()).padStart(pad, '0');
  if(!sharingOn()) return local;
  var tag = String(DB.share.pc || 'x').replace(/^pc-/, '').slice(0,3).toUpperCase();
  return prefix + '-' + tag + String(localNext()).padStart(pad, '0');
}

/* ============================================================
   THE PHONE'S OWN NOTIFICATIONS
   ------------------------------------------------------------
   In a browser the bell can only wait to be opened. Inside the
   APK there is an Android side that can make the phone ring, and
   this is what hands it the notes.

   Two routes, and the Android side makes sure a note never rings
   twice between them:
     the app open or recently used  \u2014 at once, as the note arrives
     the app closed                 \u2014 Android checks the server
                                      itself, every fifteen minutes

   Outside the APK none of this exists, and nothing here pretends
   it does: the bell carries on as before.
   ============================================================ */

function onPhone(){
  return !!(window.Android && typeof Android.notify === 'function');
}

/* The first time, everything already there is treated as seen. Installing
   the app should not greet a person with forty notifications from last
   month. */
function phoneNotify(){
  if(!onPhone() || !ME) return;
  var first = !DB.phoned;
  DB.phoned = DB.phoned || {};
  var quiet = !!mutedUntil();
  var dayAgo = new Date(Date.now() - 48*3600e3).toISOString();

  (DB.notes || []).forEach(function(n){
    if(n.to !== ME.id || n.read || DB.phoned[n.id]) return;
    DB.phoned[n.id] = 1;
    if(first || quiet) return;                 /* seen, or asked for quiet */
    if(String(n.at || '') < dayAgo) return;    /* too old to ring about */
    try {
      Android.notify(String(n.id), String(n.what || 'Paragon'),
                     String(n.detail || ''), String(n.link || ''));
    } catch(e){}
  });

  /* this only needs to remember recent ones */
  var ids = Object.keys(DB.phoned);
  if(ids.length > 800) ids.slice(0, ids.length - 500)
    .forEach(function(k){ delete DB.phoned[k]; });
  save();
}

/* What the Android side needs to check the server on its own while the app
   is closed: where the server is, the secret, and whose notes to ask for. */
function phoneConfig(){
  if(!onPhone() || typeof Android.setConfig !== 'function') return;
  try {
    Android.setConfig(
      sharingOn() ? String(DB.share.url || '') : '',
      String(DB.share.key || ''),
      ME ? String(ME.id) : '',
      String(mutedUntil() || ''));
  } catch(e){}
}

/* Tapping a notification opens the job it is about, not the home screen. */
function openFromPhone(link){
  if(!ME || !link) return;
  if(byId(DB.complaints, link)) return openComplaint(link);
  if(byId(DB.contracts || [], link)) return openContract(link);
  if(byId(DB.quotes || [], link)) return openQuote(link);
}

/* ============================================================
   IMPORT FROM EXCEL
   ------------------------------------------------------------
   Three lists: clients, machines, the store. In that order,
   because a machine belongs to a client and a part can name the
   models it fits.

   Nothing is saved until the person has seen what will happen:
   how many are new, how many update one already there, and every
   row left out with the reason. A guess that quietly loads fifty
   wrong rows is far worse than a list that says "row 14: no
   serial number".
   ============================================================ */

var IMPORT_KINDS = {
  clients: {
    label: 'Clients',
    cols: ['Name', 'Company', 'Arrangement', 'Place', 'Phone',
           'Contact person', 'Contact phone', 'NTN', 'STRN'],
    example: ['CMC Pvt Ltd', 'Paragon', 'Cash', 'SITE Area, Karachi',
              '021-32561234', 'Mr Asif', '0300 1234567', '', ''],
    must: ['Name']
  },
  machines: {
    label: 'Machines',
    cols: ['Client', 'Model', 'Serial', 'Department', 'Floor or room',
           'IP address', 'Rate per copy', 'Free copies'],
    example: ['CMC Pvt Ltd', 'Ricoh MP 3055', 'W881P300145', 'Accounts',
              '1st floor', '192.168.1.50', '', ''],
    must: ['Client', 'Model', 'Serial']
  },
  stock: {
    label: 'Store',
    cols: ['Code', 'Name', 'Quality', 'Kind', 'Opening stock', 'Minimum',
           'Cost', 'Fits'],
    example: ['P0001', 'Drum', 'CET', 'Spare part', '10', '3', '8500',
              'Ricoh MP 3055, Ricoh MP 5055'],
    must: ['Name']
  }
};

/* ---------- reading a CSV ----------
   Quotes, commas inside quotes, doubled quotes and both kinds of line
   ending, because that is what Excel actually writes. */
function parseCSV(text){
  text = String(text || '').replace(/^\uFEFF/, '');     /* Excel's UTF-8 mark */
  var sep = ',';
  var first = text.split(/\r?\n/)[0] || '';
  if(first.split(';').length > first.split(',').length) sep = ';';
  if(first.split('\t').length > first.split(sep).length) sep = '\t';

  var rows = [], row = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += ch;
      continue;
    }
    if(ch === '"'){ q = true; continue; }
    if(ch === sep){ row.push(cell); cell = ''; continue; }
    if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
      continue;
    }
    cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  /* Blank lines are kept, so that "row 14" in a message is row 14 in Excel. */
  return rows;
}

/* ---------- reading an Excel file ----------
   An .xlsx is a zip of XML files. The first sheet and its shared strings
   are read out directly, so nobody has to "save as CSV" first. */
function readXLSX(buf){
  var u = new Uint8Array(buf);
  var dv = new DataView(buf);

  /* find the zip's table of contents at the end */
  var eocd = -1;
  for(var i = u.length - 22; i >= Math.max(0, u.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) return Promise.reject(new Error('That is not an Excel file'));

  var count = dv.getUint16(eocd + 10, true);
  var at = dv.getUint32(eocd + 16, true);
  var entries = {};
  for(var n = 0; n < count; n++){
    if(dv.getUint32(at, true) !== 0x02014b50) break;
    var method = dv.getUint16(at + 10, true);
    var csize = dv.getUint32(at + 20, true);
    var nlen = dv.getUint16(at + 28, true);
    var xlen = dv.getUint16(at + 30, true);
    var clen = dv.getUint16(at + 32, true);
    var local = dv.getUint32(at + 42, true);
    var name = new TextDecoder().decode(u.subarray(at + 46, at + 46 + nlen));
    entries[name] = { method:method, csize:csize, local:local };
    at += 46 + nlen + xlen + clen;
  }

  function file(name){
    var e = entries[name];
    if(!e) return Promise.resolve(null);
    var l = e.local;
    var start = l + 30 + dv.getUint16(l + 26, true) + dv.getUint16(l + 28, true);
    var data = u.subarray(start, start + e.csize);
    if(e.method === 0) return Promise.resolve(new TextDecoder().decode(data));
    if(e.method !== 8) return Promise.reject(new Error('That Excel file is packed in a way this cannot read'));
    var ds = new DecompressionStream('deflate-raw');
    var out = new Blob([data]).stream().pipeThrough(ds);
    return new Response(out).text();
  }

  /* the first sheet in the workbook's own order */
  return file('xl/workbook.xml').then(function(wb){
    return file('xl/_rels/workbook.xml.rels').then(function(rels){
      var target = 'xl/worksheets/sheet1.xml';
      if(wb && rels){
        var doc = new DOMParser().parseFromString(wb, 'application/xml');
        var s = doc.getElementsByTagName('sheet')[0];
        var rid = s && (s.getAttribute('r:id') ||
                        s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
        var rd = new DOMParser().parseFromString(rels, 'application/xml');
        Array.prototype.forEach.call(rd.getElementsByTagName('Relationship'), function(r){
          if(r.getAttribute('Id') === rid){
            var t = r.getAttribute('Target').replace(/^\/?xl\//, '');
            target = 'xl/' + t.replace(/^\//, '');
          }
        });
      }
      return Promise.all([file(target), file('xl/sharedStrings.xml')]);
    });
  }).then(function(parts){
    var sheet = parts[0], shared = parts[1];
    if(!sheet) throw new Error('No sheet found in that Excel file');

    var strings = [];
    if(shared){
      var sd = new DOMParser().parseFromString(shared, 'application/xml');
      Array.prototype.forEach.call(sd.getElementsByTagName('si'), function(si){
        var ts = si.getElementsByTagName('t'), s = '';
        for(var k = 0; k < ts.length; k++) s += ts[k].textContent;
        strings.push(s);
      });
    }

    var doc = new DOMParser().parseFromString(sheet, 'application/xml');
    var rows = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('row'), function(r){
      /* Excel leaves empty rows out of the file entirely, so each row is put
         back at its own number \u2014 otherwise every row after a gap would
         be reported one too early. */
      var rn = parseInt(r.getAttribute('r'), 10);
      if(rn > 0) while(rows.length < rn - 1) rows.push([]);
      var row = [];
      Array.prototype.forEach.call(r.getElementsByTagName('c'), function(c){
        var ref = c.getAttribute('r') || '';
        var col = 0, m = ref.match(/^[A-Z]+/);
        if(m) for(var k = 0; k < m[0].length; k++) col = col*26 + (m[0].charCodeAt(k) - 64);
        col = col ? col - 1 : row.length;
        var t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        var val = '';
        if(t === 's' && v) val = strings[parseInt(v.textContent, 10)] || '';
        else if(t === 'inlineStr'){
          var is = c.getElementsByTagName('t'); for(var j = 0; j < is.length; j++) val += is[j].textContent;
        }
        else if(v) val = v.textContent;
        while(row.length < col) row.push('');
        row[col] = val;
      });
      rows.push(row);
    });
    return rows;
  });
}

/* ---------- matching what people actually type ---------- */
function norm(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g,' '); }

function pickBrand(s){
  var v = norm(s);
  if(!v) return 'paragon';
  if(v.indexOf('house') > -1 || v === 'ch') return 'house';
  if(v.indexOf('star') > -1 || v === 'cs') return 'star';
  if(v.indexOf('paragon') > -1 || v === 'pcs') return 'paragon';
  return null;
}

function pickDeal(s){
  var v = norm(s);
  if(!v) return 'cash';
  if(v.indexOf('rent') > -1) return 'rental';
  if(v.indexOf('without') > -1) return 'ascWithout';
  if(v.indexOf('asc') > -1 || v.indexOf('with') > -1) return 'ascWith';
  if(v.indexOf('cash') > -1) return 'cash';
  return null;
}

function pickKind(s){
  var v = norm(s);
  if(!v) return 'part';
  if(v.indexOf('consum') > -1 || v.indexOf('toner') > -1) return 'consumable';
  if(v.indexOf('tool') > -1) return 'tool';
  if(v.indexOf('part') > -1 || v.indexOf('spare') > -1) return 'part';
  return null;
}

function numOr(s, d){
  var n = parseFloat(String(s == null ? '' : s).replace(/,/g, ''));
  return isNaN(n) ? d : n;
}

/* Header names are matched loosely: "Serial No.", "serial number" and
   "SERIAL" all mean Serial, and the order of the columns does not matter.
   Exact names are tried first, then the known other names for each column,
   and only then a loose word match \u2014 so "Contact Phone" is never taken
   for Phone just because it has the word in it. */
var HEAD_ALIASES = {
  'Name':           ['client name','customer','customer name','party','party name','part name','part','item','item name','description'],
  'Company':        ['brand','company name','our company','firm'],
  'Arrangement':    ['type','deal','contract','contract type','agreement','service type'],
  'Place':          ['address','location','area','city'],
  'Phone':          ['phone','phone no','phone number','telephone','tel','landline','office phone'],
  'Contact person': ['contact','contact name','person','focal person','attention'],
  'Contact phone':  ['contact mobile','contact phone','contact no','contact number','mobile','cell','whatsapp'],
  'NTN':            ['ntn no','ntn number'],
  'STRN':           ['strn no','strn number','gst','gst no','sales tax'],
  'Client':         ['client name','customer','customer name','party','company'],
  'Model':          ['machine model','model no','model name','machine'],
  'Serial':         ['serial no','serial number','sr no','s no','machine serial'],
  'Department':     ['dept','department name','section'],
  'Floor or room':  ['floor','room','location','place','site'],
  'IP address':     ['ip','ip addr','network address'],
  'Rate per copy':  ['rate','per copy','copy rate','rate per print'],
  'Free copies':    ['free','free prints','copies included','included copies'],
  'Code':           ['part code','part no','part number','item code','sku'],
  'Quality':        ['grade','make','brand'],
  'Kind':           ['type','category','part type'],
  'Opening stock':  ['opening','qty','quantity','stock','in hand','balance','on hand'],
  'Minimum':        ['min','minimum stock','reorder','reorder level'],
  'Cost':           ['price','rate','unit cost','purchase price','cost price'],
  'Fits':           ['compatible','compatible with','models','fits models','for model']
};

function mapHeaders(kind, head){
  var want = IMPORT_KINDS[kind].cols, map = {}, used = {};
  var hs = head.map(function(h){
    return norm(h).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); });

  function take(c, test){
    if(map[c] !== undefined) return;
    for(var i = 0; i < hs.length; i++){
      if(used[i] || !hs[i]) continue;
      if(test(hs[i])){ map[c] = i; used[i] = 1; return; }
    }
  }
  /* 1. the column's own name */
  want.forEach(function(c){ var w = norm(c); take(c, function(v){ return v === w; }); });
  /* 2. the names people use for it */
  want.forEach(function(c){
    var al = HEAD_ALIASES[c] || [];
    take(c, function(v){ return al.indexOf(v) > -1; });
  });
  /* 3. loosely: the name as a whole word inside a longer heading */
  want.forEach(function(c){
    var w = norm(c);
    take(c, function(v){ return (' ' + v + ' ').indexOf(' ' + w + ' ') > -1; });
  });
  return map;
}

/* ---------- working out what would happen ---------- */
function blankRow(r){ return !r || !r.some(function(c){ return String(c == null ? '' : c).trim(); }); }

function planImport(kind, rows){
  /* The heading is the row that actually names the columns \u2014 not a title
     like "PARAGON CLIENT LIST" sitting above it. The first dozen rows are
     tried, and the one that finds the required columns wins. */
  var must = IMPORT_KINDS[kind].must, h0 = -1, best = -1, bestHits = -1;
  for(var i = 0, looked = 0; i < rows.length && looked < 12; i++){
    if(blankRow(rows[i])) continue;
    looked++;
    var mm = mapHeaders(kind, rows[i]);
    var hits = Object.keys(mm).length;
    if(must.every(function(c){ return mm[c] !== undefined; })){ h0 = i; break; }
    if(hits > bestHits){ bestHits = hits; best = i; }
  }
  if(h0 < 0) h0 = best;
  if(h0 < 0) return { error:'That file is empty.' };
  if(!rows.slice(h0 + 1).some(function(r){ return !blankRow(r); }))
    return { error:'The file has a header row but nothing under it.' };
  var head = rows[h0], map = mapHeaders(kind, head);
  var missing = IMPORT_KINDS[kind].must.filter(function(c){ return map[c] === undefined; });
  if(missing.length)
    return { error:'These columns are missing: ' + missing.join(', ') +
      '. Download the template to see the headings it expects.' };

  function get(r, c){ return map[c] === undefined ? '' : String(r[map[c]] == null ? '' : r[map[c]]).trim(); }

  var plan = { kind:kind, add:[], update:[], skip:[] };
  var seen = {};

  rows.forEach(function(r, idx){
    if(idx <= h0 || blankRow(r)) return;
    var line = idx + 1;                          /* as Excel numbers it */
    if(kind === 'clients'){
      var name = get(r,'Name');
      if(!name) return plan.skip.push({ line:line, why:'no name' });
      var key = norm(name);
      if(seen[key]) return plan.skip.push({ line:line, why:'"'+name+'" is in the file twice' });
      seen[key] = 1;
      var brand = pickBrand(get(r,'Company'));
      if(!brand) return plan.skip.push({ line:line, why:'company "'+get(r,'Company')+'" is not one of the three' });
      var deal = pickDeal(get(r,'Arrangement'));
      if(!deal) return plan.skip.push({ line:line, why:'arrangement "'+get(r,'Arrangement')+'" is not rental, ASC or cash' });
      var rec = { name:name, brand:brand, deal:deal, place:get(r,'Place'),
                  phone:get(r,'Phone'), ntn:get(r,'NTN'), strn:get(r,'STRN'),
                  person:get(r,'Contact person'), personPhone:get(r,'Contact phone') };
      var have = DB.clients.filter(function(c){ return norm(c.name) === key; })[0];
      (have ? plan.update : plan.add).push({ line:line, rec:rec, have:have });
    }

    if(kind === 'machines'){
      var serial = get(r,'Serial'), model = get(r,'Model'), cname = get(r,'Client');
      if(!serial) return plan.skip.push({ line:line, why:'no serial number \u2014 stickers, counters and contracts all hang off it' });
      if(!model) return plan.skip.push({ line:line, why:'no model' });
      var skey = norm(serial);
      if(seen[skey]) return plan.skip.push({ line:line, why:'serial '+serial+' is in the file twice' });
      seen[skey] = 1;
      var client = DB.clients.filter(function(c){ return norm(c.name) === norm(cname); })[0];
      if(!client) return plan.skip.push({ line:line, why:'no client called "'+cname+'" \u2014 import the clients first' });
      var mrec = { client:client.id, model:model, serial:serial,
                   dept:get(r,'Department'), place:get(r,'Floor or room'),
                   ip:get(r,'IP address'),
                   rate:get(r,'Rate per copy') === '' ? undefined : numOr(get(r,'Rate per copy'), undefined),
                   free:get(r,'Free copies') === '' ? undefined : numOr(get(r,'Free copies'), undefined) };
      var mh = DB.machines.filter(function(m){ return norm(m.serial) === skey; })[0];
      if(mh && mh.client !== client.id)
        return plan.skip.push({ line:line, why:'serial '+serial+' is already on '+
          nameOf(DB.clients, mh.client)+' \u2014 move it by hand if it really changed hands' });
      (mh ? plan.update : plan.add).push({ line:line, rec:mrec, have:mh });
    }

    if(kind === 'stock'){
      var pname = get(r,'Name'), code = get(r,'Code');
      if(!pname) return plan.skip.push({ line:line, why:'no part name' });
      var pkey = norm(code || pname + '|' + get(r,'Quality'));
      if(seen[pkey]) return plan.skip.push({ line:line, why:(code||pname)+' is in the file twice' });
      seen[pkey] = 1;
      var pk = pickKind(get(r,'Kind'));
      if(!pk) return plan.skip.push({ line:line, why:'kind "'+get(r,'Kind')+'" is not spare part, consumable or tool' });
      var fits = get(r,'Fits').split(/[,;\/]/).map(function(s){ return s.trim(); }).filter(Boolean);
      var srec = { code:code, name:pname, quality:get(r,'Quality'), kind:pk,
                   opening:numOr(get(r,'Opening stock'), 0),
                   min:numOr(get(r,'Minimum'), 0), cost:numOr(get(r,'Cost'), 0),
                   fits:fits };
      var sh = DB.stock.filter(function(s){
        return s.active !== false && (code ? norm(s.code) === norm(code)
          : norm(s.name) === norm(pname) && norm(s.quality) === norm(get(r,'Quality'))); })[0];
      (sh ? plan.update : plan.add).push({ line:line, rec:srec, have:sh });
    }
  });
  return plan;
}

/* ---------- doing it ---------- */
function applyImport(plan){
  var stamp = now(), n = 0;

  plan.add.concat(plan.update).forEach(function(p){
    var r = p.rec, h = p.have;

    if(plan.kind === 'clients'){
      var c = h || { id:uid(), active:true, people:[] };
      c.name = r.name; c.brand = r.brand; c.deal = r.deal;
      /* a blank cell leaves what was there alone */
      ['place','phone','ntn','strn'].forEach(function(f){ if(r[f]) c[f] = r[f]; });
      if(r.person || r.personPhone){
        c.people = c.people || [];
        var dup = c.people.some(function(x){
          return norm(x.name) === norm(r.person) ||
                 (r.personPhone && String(x.phone).replace(/\D/g,'') === r.personPhone.replace(/\D/g,'')); });
        if(!dup) c.people.push({ name:r.person || 'Contact', role:'', phone:r.personPhone });
      }
      c._at = stamp;
      if(!h) DB.clients.push(c);
    }

    if(plan.kind === 'machines'){
      var m = h || { id:uid() };
      m.client = r.client; m.model = r.model; m.serial = r.serial;
      ['dept','place','ip'].forEach(function(f){ if(r[f]) m[f] = r[f]; });
      if(r.rate !== undefined) m.rate = r.rate;
      if(r.free !== undefined) m.free = r.free;
      m._at = stamp;
      if(!h) DB.machines.push(m);
    }

    if(plan.kind === 'stock'){
      var s = h || { id:uid(), active:true, purchased:0 };
      s.code = r.code; s.name = r.name; s.quality = r.quality; s.kind = r.kind;
      s.min = r.min; if(r.cost) s.cost = r.cost;
      if(r.fits.length) s.fits = r.fits;
      /* Opening stock is written only on a new part. On one already in
         use, the shelf is worked out from what has happened since, and
         changing its starting point would quietly rewrite every figure. */
      if(!h) s.opening = r.opening;
      s._at = stamp;
      if(!h) DB.stock.push(s);
    }
    n++;
  });

  logIt('import', 'Imported ' + IMPORT_KINDS[plan.kind].label.toLowerCase(),
        plan.add.length + ' new, ' + plan.update.length + ' updated, ' +
        plan.skip.length + ' left out');
  save(); draw();
  if(sharingOn()) syncSoon();
  return n;
}

/* ---------- the screens ---------- */
var _plan = null;

function importBox(kind){

  var mayStore = can('stock.edit');
  if(!can('complaint.add')) return toast('Only the office imports lists','bad');

  modal('Import from Excel',
    '<div class="strip">'+
      ['clients','machines','stock'].filter(function(k){
        return k !== 'stock' || mayStore; }).map(function(k){
        return '<button class="'+(k===kind?'on':'')+'" onclick="importBox(\''+k+'\')">'+
          IMPORT_KINDS[k].label+'</button>'; }).join('')+
    '</div>'+

    '<div class="note i">Clients first, then machines, then the store \u2014 '+
    'a machine has to find its client by name, and a part can list the '+
    'models it fits.</div>'+

    '<div class="field"><label>1. Get the template</label>'+
      '<button class="btn ghost sm" onclick="importTemplate(\''+kind+'\')">'+
      'Download the '+IMPORT_KINDS[kind].label.toLowerCase()+' template</button>'+
      '<div class="help">Columns: <b>'+IMPORT_KINDS[kind].cols.join(', ')+'</b>. '+
      'Only <b>'+IMPORT_KINDS[kind].must.join(', ')+'</b> '+
      (IMPORT_KINDS[kind].must.length > 1 ? 'are' : 'is')+' required. '+
      'Your own sheet works too if the headings are close.</div></div>'+

    '<div class="field"><label>2. Choose the file</label>'+
      '<button class="btn" onclick="importPick(\''+kind+'\')">Choose an Excel or CSV file</button>'+
      '<div class="help">An .xlsx straight from Excel, or a .csv. Only the '+

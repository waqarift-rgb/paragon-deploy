<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paragon">
<meta name="application-name" content="Paragon">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Paragon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --ink:#16202B;--ink-2:#55606D;--ink-3:#8794A3;--line:#D8DDE4;--soft:#F5F7F9;
 --blue:#1F5FCC;--blue-lt:#E7EFFC;--green:#17794B;--green-lt:#E8F3EC;
 --amber:#94620F;--amber-lt:#FCF6E9;--red:#C0322C;--red-lt:#FBEEED;
 --purple:#5B3E9E;--purple-lt:#EFEAFA;--bg:#EEF1F5;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
 overscroll-behavior-y:none}
.hide{display:none!important}

/* the strip that says where the work has got to */
.net{padding:9px 14px;font-size:12.5px;line-height:1.45;
 display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.net.off{background:var(--amber-lt);color:var(--amber);
 border-bottom:1px solid #EBDCB6}
.net.behind{background:var(--blue-lt);color:var(--blue);
 border-bottom:1px solid #C9DCF6}
.net span{text-decoration:underline;cursor:pointer;opacity:.85}

/* ---------- shell ---------- */
#app{display:none;min-height:100%;padding-bottom:calc(64px + var(--safe-b))}
.bar{position:sticky;top:0;z-index:40;background:#1C2430;color:#fff;
 padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:11px}
.bar .mk{width:32px;height:32px;border-radius:7px;background:#fff;
 display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:3px}
.bar .mk img{width:100%;height:100%;object-fit:contain}
.bar .t{font-size:15px;font-weight:600;line-height:1.2;flex:1;min-width:0}
.bar .t span{display:block;font-size:11px;font-weight:400;color:#8FA6C4;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:transparent;border:0;color:#8FA6C4;font-size:19px;
 padding:5px 7px;cursor:pointer}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
 border-top:1px solid var(--line);display:flex;
 padding-bottom:var(--safe-b)}
.tabs button{flex:1;background:transparent;border:0;padding:9px 2px 7px;
 font-family:inherit;font-size:10.5px;color:var(--ink-3);cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button.on{color:var(--blue)}
.tabs .ic{font-size:19px;line-height:1}
.tabs .dot{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;
 height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;
 font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- pages ---------- */
.page{display:none;padding:14px}
.page.on{display:block}
h2{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:3px}
.sub{font-size:12.5px;color:var(--ink-3);margin-bottom:14px}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:8px;
 padding:13px 14px;margin-bottom:11px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--soft)}
.row{display:flex;gap:10px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.ttl{font-size:14.5px;font-weight:600;line-height:1.35}
.meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.meta b{color:var(--ink-2);font-weight:600}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:8px;
 padding:12px 13px;cursor:pointer}
.tile:active{background:var(--soft)}
.tile .n{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1}
.tile .l{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.tile.b .n{color:var(--blue)} .tile.g .n{color:var(--green)}
.tile.a .n{color:var(--amber)} .tile.r .n{color:var(--red)}

/* ---------- pills ---------- */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;
 border-radius:10px;white-space:nowrap}
.p-pending{background:var(--amber-lt);color:var(--amber)}
.p-started{background:var(--blue-lt);color:var(--blue)}
.p-resolved{background:var(--green-lt);color:var(--green)}
.p-parts{background:var(--purple-lt);color:var(--purple)}
.p-closed{background:var(--soft);color:var(--ink-3)}
.p-high{background:var(--red-lt);color:var(--red)}
.p-low{background:var(--soft);color:var(--ink-3)}

/* ---------- filter strip ---------- */
.strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex-shrink:0;background:#fff;border:1px solid var(--line);
 border-radius:16px;padding:6px 13px;font-family:inherit;font-size:12.5px;
 color:var(--ink-2);cursor:pointer;white-space:nowrap}
.strip button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.strip .c{font-weight:600;margin-left:4px;opacity:.75}

/* ---------- forms ---------- */
label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;font-size:16px;
 font-family:inherit;border:1px solid var(--line);border-radius:6px;background:#fff;
 color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);
 box-shadow:0 0 0 3px var(--blue-lt)}
textarea{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.help{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
 font-family:inherit;font-size:14.5px;font-weight:600;padding:12px 18px;
 border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:6px;
 cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.danger{background:#fff;color:var(--red);border-color:#E6C4C2}
.btn.sm{font-size:13px;padding:8px 13px;width:auto}
.btns{display:flex;gap:9px;margin-top:6px}
.btns .btn{width:auto;flex:1}

/* ---------- photos ---------- */
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot{width:72px;height:72px;border-radius:6px;object-fit:cover;
 border:1px solid var(--line);cursor:pointer}
.addshot{width:72px;height:72px;border-radius:6px;border:1px dashed var(--ink-3);
 background:var(--soft);display:flex;align-items:center;justify-content:center;
 font-size:22px;color:var(--ink-3);cursor:pointer}

/* ---------- modal ---------- */
#mwrap{position:fixed;inset:0;z-index:100;background:rgba(16,24,34,.55);
 display:none;align-items:flex-end;justify-content:center}
#mwrap.on{display:flex}
#mbox{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;
 max-height:92vh;display:flex;flex-direction:column;
 padding-bottom:var(--safe-b)}
#mhead{padding:15px 16px 11px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:10px}
#mhead .h{font-size:16px;font-weight:600;flex:1}
#mbody{padding:15px 16px;overflow:auto;flex:1}
.pr-head{margin-bottom:14px}.pr-name{font-size:17px;font-weight:700;color:#12395E}.pr-month{font-size:13px;color:#667}
.pr-table{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.pr-row.neg .pr-v{color:#AE1F26}
.pr-l{font-size:14px;font-weight:600;color:#1C2E4A}.pr-s{font-size:11.5px;color:#778}
.pr-v{font-size:14px;font-weight:600}
.pr-row.total{background:#F5F8FB;border-bottom:0;padding:14px}
.pr-row.total .pr-l{font-size:15px}.pr-row.total .pr-v{font-size:18px;font-weight:800}
.pr-row.total.good .pr-v{color:#1A7538}.pr-row.total.bad .pr-v{color:#AE1F26}
.pr-note{margin-top:12px;font-size:13px;text-align:center;color:#667}
.pf-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bday-wrap{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#12395E,#1C4F7F 60%,#2B8ABA);display:flex;align-items:center;justify-content:center;transition:opacity .4s;overflow:hidden}
.bday-conf-box{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bday-conf{position:absolute;top:-20px;border-radius:2px;animation:bdayFall linear infinite;opacity:.9}
@keyframes bdayFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.7}}
.bday-card{position:relative;text-align:center;color:#fff;padding:30px 26px;max-width:340px;animation:bdayPop .6s cubic-bezier(.2,.8,.3,1.4)}
@keyframes bdayPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.bday-cake{font-size:66px;animation:bdayBounce 1.5s ease-in-out infinite}
@keyframes bdayBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bday-h{font-size:27px;font-weight:800;line-height:1.2;margin:10px 0 6px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.bday-emoji{font-size:26px;letter-spacing:4px;margin:8px 0}
.bday-sub{font-size:14px;color:rgba(255,255,255,.9);margin:6px 0 14px;line-height:1.5}
.bday-dua{background:rgba(255,255,255,.14);border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.6;color:#fff}
.lc-on{font-size:10.5px;font-weight:600;vertical-align:middle}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.qrow-act{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.qrow-act .btn{flex:1}
.bfold{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.bfold-card{display:flex;align-items:center;gap:13px;padding:14px 15px;border:2px solid;border-radius:12px;cursor:pointer;background:#fff;transition:transform .1s}
.bfold-card:active{transform:scale(.98)}
.bfold-ic{width:44px;height:44px;border-radius:10px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.bfold-n{font-size:15px;font-weight:700;color:#12395E;flex:1}
.bfold-c{font-size:12.5px;color:#667}
.bfold-head{display:flex;align-items:center;gap:12px;color:#fff;padding:11px 14px;border-radius:10px;margin-bottom:10px}
.bfold-head button{background:rgba(255,255,255,.2);border:0;color:#fff;padding:5px 11px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer}
.bfold-head span{font-size:15px;font-weight:700}
.qfold{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qfold button{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.qfold button.on{background:#12395E;color:#fff;border-color:#12395E}
.mr-head{margin-bottom:12px}.mr-m{font-size:16px;font-weight:700;color:#12395E}.mr-c{font-size:12.5px;color:#667}
.mr-figs{display:flex;gap:8px;margin-bottom:14px}.mr-fig{flex:1;background:#F5F8FB;border-radius:9px;padding:11px 6px;text-align:center}
.mr-fig .n{font-size:17px;font-weight:800;color:#12395E}.mr-fig .l{font-size:10.5px;color:#667;margin-top:2px}
.mr-flag{background:#FBEDEE;color:#AE1F26;font-weight:700;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:8px}
.mr-rep{font-size:13px;padding:6px 12px;border-bottom:1px solid var(--line)}
.mr-sec{font-size:12px;font-weight:700;color:#12395E;margin:14px 0 7px}
.mr-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.mr-tbl th{background:#12395E;color:#fff;text-align:left;padding:5px 7px;font-size:10.5px}
.mr-tbl td{border-bottom:1px solid var(--line);padding:5px 7px;vertical-align:top}
.mr-tbl .num{text-align:right}.mr-job{font-size:10px;color:#889}
.tp-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer}
.tp-row:active{background:#F5F8FB}
.tp-av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.tp-av img{width:100%;height:100%;object-fit:cover}
.tp-n{font-size:14.5px;font-weight:600;color:#12395E}.tp-s{font-size:12px;color:#667}
.tp-rate{font-size:17px;font-weight:800;flex:none}
.tp-go{color:#2B8ABA;font-size:18px;flex:none}
.gs-sec{font-size:11.5px;font-weight:700;color:#12395E;margin:12px 0 6px;letter-spacing:.02em}
.gs-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
.gs-row:active{background:#F5F8FB}
.gs-ic{font-size:19px;flex:none}
.gs-t{font-size:14px;font-weight:600;color:#1C2E4A}.gs-s{font-size:12px;color:#667}
.gs-go{color:#2B8ABA;font-size:18px;flex:none}
.us-photo-row{display:flex;align-items:center;gap:14px}
.us-av{width:64px;height:64px;border-radius:50%;background:#E3EAF2;color:#12395E;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.us-av img{width:100%;height:100%;object-fit:cover}
.pf-av{width:52px;height:52px;border-radius:50%;color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.pf-name{font-size:17px;font-weight:700;color:#12395E}.pf-role{font-size:12.5px;color:#667}
.pf-figs{display:flex;gap:9px;margin-bottom:16px}
.pf-fig{flex:1;background:#F5F8FB;border-radius:10px;padding:12px 6px;text-align:center}
.pf-fig .n{font-size:22px;font-weight:800;color:#12395E}.pf-fig .l{font-size:11px;color:#667;margin-top:2px}
.pf-bar{margin-bottom:11px}
.pf-bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.pf-bl b{color:#12395E}
.pf-track{height:9px;background:#EDF1F5;border-radius:5px;overflow:hidden}
.pf-fill{height:100%;border-radius:5px;transition:width .5s}
.pf-note{margin-top:14px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.5}
.pf-note.g{background:#EAF6EE;color:#1A7538}.pf-note.i{background:#EAF2FA;color:#1C4F7F}.pf-note.w{background:#FDF6E9;color:#9A6206}
.att-card{background:linear-gradient(135deg,#0E7268,#0A5B53);color:#fff;border-radius:14px;padding:15px 17px;margin-bottom:14px;box-shadow:0 3px 10px rgba(14,114,104,.25)}
.att-top{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.att-dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.att-state{font-size:16px;font-weight:700}.att-date{font-size:12px;color:rgba(255,255,255,.75)}
.att-since{font-size:12.5px;color:rgba(255,255,255,.9);background:rgba(255,255,255,.15);padding:3px 10px;border-radius:12px}
.att-line{font-size:13px;color:rgba(255,255,255,.92);line-height:1.5}
.att-line b{color:#fff}
.att-q{font-size:11.5px;color:#FFE1A8;margin-top:6px}
.att-btn{margin-top:11px}
.att-btn .btn{width:100%;background:#fff;color:#0A5B53;font-weight:700}
.att-btn .btn.green{background:#fff;color:#0A5B53}
.ci-where{display:flex;gap:10px}
.ci-opt{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:22px;cursor:pointer}
.ci-opt span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ci-opt.on{border-color:#1A7538;background:#EAF6EE}
.ci-photo{border:2px dashed var(--line);border-radius:10px;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer;overflow:hidden}
.ci-photo.has{border-style:solid;padding:0}
.ci-photo img{width:100%;max-height:200px;object-fit:cover;display:block}
.ci-loc{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.eye-wrap{position:relative}
.eye-wrap input{width:100%;padding-right:40px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;opacity:.7;user-select:none}
.eye-btn:active{opacity:1}
.as-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.as-t{font-size:14.5px;font-weight:600}.as-s{font-size:12px;color:var(--ink-3);margin-top:2px}.as-w{font-size:11.5px;color:var(--amber);margin-top:3px}
.as-sw{position:relative;width:46px;height:26px;flex:none;margin-top:2px}.as-sw input{display:none}
.as-sw i{position:absolute;inset:0;background:#CBD3DB;border-radius:13px;transition:.2s}
.as-sw i:before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.as-sw input:checked+i{background:#1A7538}.as-sw input:checked+i:before{left:23px}
.lc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lc-dot{width:12px;height:12px;border-radius:50%;flex:none}
.seq-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-right:6px;border-radius:10px;background:#12395E;color:#fff;font-size:11.5px;font-weight:800;vertical-align:1px}
.seq-badge.big{min-width:30px;height:30px;border-radius:15px;font-size:15px;flex:none}
.ord-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.vn-row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.vn-row:first-of-type{border-top:0}
.vn-ic{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#E8F1F8}
.vn-ic.client{background:#FDF3E2}
.rec-dot{width:22px;height:22px;border-radius:50%;background:#C0392B;margin:0 auto;animation:recp 1s infinite}
@keyframes recp{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.cl-btn{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:12px;background:#E8F1F8;color:#2A6CA6;font-size:12px;font-weight:700;text-decoration:none}
.cl-btn.wa{background:#E7F7EC;color:#1A7538}
.cf-pick{display:inline-block;margin:0 6px 6px 0;padding:6px 10px;border-radius:14px;border:1.5px solid var(--line);font-size:12.5px;cursor:pointer;background:#fff}
#mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
/* Buttons wrap onto a second row rather than squeezing into one: three to a
   row at most, never so narrow that a label breaks over several lines. The
   last one — the main action — takes a row of its own when there are many. */
#mfoot .btn{flex:1 1 calc(33.33% - 8px);min-width:96px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-left:8px;padding-right:8px}
#mfoot .btn:nth-last-child(1):nth-child(n+4){flex-basis:100%}

/* ---------- misc ---------- */
.empty{text-align:center;padding:42px 20px;color:var(--ink-3);font-size:13.5px}
.empty .ic{font-size:34px;opacity:.35;display:block;margin-bottom:9px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(74px + var(--safe-b));
 z-index:120;background:#1C2430;color:#fff;padding:12px 15px;border-radius:8px;
 font-size:13.5px;line-height:1.5;opacity:0;transform:translateY(8px);
 transition:.18s;pointer-events:none}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast.bad{background:var(--red)} #toast.good{background:var(--green)}
.note{padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.6;
 border-left:3px solid;margin-bottom:12px}
.note.i{background:var(--soft);border-color:var(--blue)}
.note.w{background:var(--amber-lt);border-color:var(--amber);color:var(--amber)}
.note.d{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.note.g{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.sep{height:1px;background:var(--line);margin:14px 0}
code{font-family:Consolas,Menlo,monospace;font-size:12.5px;background:var(--soft);
 padding:1px 5px;border-radius:3px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;padding-bottom:13px;font-size:12.5px}
.tl .ev:before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;
 border-radius:50%;background:var(--line)}
.tl .ev.on:before{background:var(--blue)}
.tl .ev b{display:block;font-size:13px;color:var(--ink)}
.tl .ev span{color:var(--ink-3)}

/* ---------- sign in ---------- */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;
 padding:24px;background:linear-gradient(160deg,#1C2430,#0F1620)}
#gate .box{background:#fff;border-radius:12px;padding:26px 22px;width:100%;
 max-width:380px}
#gate h1{font-size:21px;font-weight:600;letter-spacing:-.4px}
#gate .s{font-size:13px;color:var(--ink-3);margin:4px 0 20px}

@media(min-width:720px){
 .page{max-width:720px;margin:0 auto;padding:20px}
 .tiles{grid-template-columns:repeat(4,1fr)}
 .bar{padding-left:20px;padding-right:20px}
 #mbox{border-radius:12px;margin-bottom:auto;margin-top:auto;max-height:86vh}
 #mwrap{align-items:center}
}
</style>
</head><body>

<!-- sign in -->
<div id="gate">
  <div class="box">
    <h1>Paragon</h1>
    <div class="s">Sign in</div>
    <div class="field"><label>User name</label>
      <input id="gUser" autocapitalize="off" autocomplete="username"></div>
    <div class="field"><label>Password</label>
      <div class="eye-wrap">
        <input id="gPass" type="password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doSignin()">
        <span class="eye-btn" onclick="eyeToggle('gPass', this)">👁️</span></div></div>
    <div id="gErr" style="color:var(--red);font-size:13px;margin-bottom:12px"></div>
    <button class="btn" onclick="doSignin()">Sign in</button>
    <!-- A phone not yet connected is shown the way to connect, not the
         starting login: that belongs in the installation guide, for the one
         person setting up the very first phone. -->
    <div id="gJoin">
      <div class="help" style="margin:16px 0 8px">New phone? An admin connects it
        first.</div>
      <button class="btn ghost" onclick="joinServer()">Connect to the server</button>
    </div>
  </div>

<script>

/* ============================================================
   PASSWORDS
   ------------------------------------------------------------
   Kept as a SHA-256, salted with the person's own id so two
   people with the same password do not look alike.

   Nobody can read a password back out of this, including us.
   A forgotten one is reset by an admin, not recovered.
   ============================================================ */

function sha256(msg){
  function rr(n, x){ return (x >>> n) | (x << (32 - n)); }
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  /* the text as UTF-8 bytes, so Urdu in a password works */
  var bytes = [];
  var s = unescape(encodeURIComponent(String(msg)));
  for(var i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i));
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  var hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
             (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);

  var w = new Array(64);
  for(var off = 0; off < bytes.length; off += 64){
    for(var t = 0; t < 16; t++)
      w[t] = (bytes[off+t*4]<<24)|(bytes[off+t*4+1]<<16)|
             (bytes[off+t*4+2]<<8)|(bytes[off+t*4+3]);
    for(t = 16; t < 64; t++){
      var s0 = rr(7,w[t-15]) ^ rr(18,w[t-15]) ^ (w[t-15]>>>3);
      var s1 = rr(17,w[t-2]) ^ rr(19,w[t-2]) ^ (w[t-2]>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t = 0; t < 64; t++){
      var S1 = rr(6,e) ^ rr(11,e) ^ rr(25,e);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      var S0 = rr(2,a) ^ rr(13,a) ^ rr(22,a);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ('00000000' + (x>>>0).toString(16)).slice(-8); })
          .join('');
}

function hashPass(user, plain){
  return sha256('paragon:' + user.id + ':' + plain);
}

function checkPass(user, plain){
  if(user.passHash) return user.passHash === hashPass(user, plain);
  return user.pass === plain;          /* an account from before this change */
}

function setPass(user, plain){
  user.passHash = hashPass(user, plain);
  delete user.pass;
}

/* Anything still holding a password as typed is converted, once, the
   moment the app opens. */
function hashOldPasswords(){
  var changed = false;
  (DB.users || []).forEach(function(u){
    if(u.pass != null && !u.passHash){
      setPass(u, u.pass);
      u._at = now();
      changed = true;
    }
  });
  return changed;
}

/* ============================================================
   PARAGON COMPLAINT MANAGER
   ------------------------------------------------------------
   One file. Data is kept on this device and, when the bridge is
   set up, shared with every other phone in the business.

   Built for a phone held next to a machine, not a desk.
   ============================================================ */

var KEY = 'paragon_complaints_v1';
var PERSIST = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }
catch(e){ PERSIST = false; }
var MEM = {};

function sGet(k){ try { return PERSIST ? localStorage.getItem(k) : (MEM[k]||null); }
                  catch(e){ return MEM[k]||null; } }
function sSet(k,v){ if(PERSIST){ try { localStorage.setItem(k,v); return; }
                    catch(e){ PERSIST = false; } } MEM[k] = v; }

var APP_VERSION = '1.11';
var DEFAULT_SERVER = 'http://139.180.219.41:8080/';
var DB = {};

/* Password ke aage aankh \u2014 tap par dikhe/chhupe (WhatsApp jaisa). */
function eyeToggle(id, el){
  var inp = document.getElementById(id); if(!inp) return;
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  el.textContent = show ? '\u{1F648}' : '\u{1F441}\uFE0F';
}
function eyeWrap(inputHtml, id){
  return '<div class="eye-wrap">' + inputHtml +
    '<span class="eye-btn" onclick="eyeToggle(\'' + id + '\', this)">\u{1F441}\uFE0F</span></div>';
}

function save(){ sSet(KEY, JSON.stringify(DB)); }

function load(){
  try { DB = JSON.parse(sGet(KEY)) || {}; } catch(e){ DB = {}; }
  DB.company    = DB.company    || { name:'Paragon Copier Solution', phone:'', logo:'' };
  DB.users      = DB.users      || [];
  DB.clients    = DB.clients    || [];
  DB.machines   = DB.machines   || [];
  DB.complaints = DB.complaints || [];
  DB.parts      = DB.parts      || [];     /* the parts asked for on a complaint */
  DB.stock      = DB.stock      || [];     /* what is in the store */
  DB.log        = DB.log        || [];
  DB.share      = DB.share      || { on:false, url:'', key:'', client:'', pc:'', auto:true, at:'' };
  /* A fresh phone already points at the server, so nobody has to type the
     address \u2014 only an admin's user name and password are needed to connect.
     A phone that is already connected is never touched. */
  if(!DB.share.on && !DB.share.url) DB.share.url = DEFAULT_SERVER;
  DB.seq        = DB.seq        || { complaint: 1 };
  if(!DB.share.pc) DB.share.pc = 'pc-' + Math.random().toString(36).slice(2,7);

  if(!DB.users.length){
    /* Marked as the starting account. Until somebody signs in and gives it
       a real password, it never leaves this phone \u2014 otherwise every
       phone would carry an admin that anyone could open with admin123. */
    var first = { id:uid(), name:'Admin', email:'admin', role:'admin',
                  active:true, mustChange:true, seed:true, _at:now() };
    setPass(first, 'admin123');
    DB.users.push(first);
    save();
  }
  if(hashOldPasswords()) save();
}

/* ---------- small helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return new Date().toISOString(); }
function today(){ return new Date().toISOString().slice(0,10); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* dates the way people here read them */
function dmy(iso){
  if(!iso) return '';
  var d = String(iso).slice(0,10).split('-');
  return d.length === 3 ? d[2]+'-'+d[1]+'-'+d[0] : iso;
}
function dtime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return '';
  var h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  var ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return dmy(iso) + ' ' + h + ':' + m + ' ' + ap;
}
function ago(iso){
  if(!iso) return '';
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + ' min ago';
  if(s < 86400) return Math.floor(s/3600) + ' hr ago';
  var d = Math.floor(s/86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
}

function byId(list, id){
  for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
  return null;
}
function nameOf(list, id, field){
  var r = byId(list, id);
  return r ? (r[field||'name'] || '') : '';
}

/* ---------- who is using it ---------- */
var ME = null;

var ROLES = {
  admin:      { label:'Admin',         rank:5 },
  supervisor: { label:'Supervisor',    rank:4 },
  store:      { label:'Store Manager', rank:3 },
  tech:       { label:'Technician',    rank:2 },
  helper:     { label:'Helper',        rank:1 },
  operator:   { label:'Operator',      rank:0 }
};

/* Who may do what, written as a list of the roles that may \u2014 never as
   "everyone except". The old form said "not a technician", and the day a
   Helper was added it would quietly have handed the Helper every complaint,
   the store and the reports. A new role now starts with nothing. */
var PERMS = {
  'users':            ['admin'],
  'settings':         ['admin'],
  'stock.edit':       ['admin','store'],
  'stock.see':        ['admin','supervisor','store'],
  'complaint.add':    ['admin','supervisor','store'],
  'complaint.assign': ['admin','supervisor','store'],
  'complaint.all':    ['admin','supervisor','store'],
  'part.approve':     ['admin','supervisor','store'],
  'part.issue':       ['admin','supervisor','store'],
  'reports':          ['admin','supervisor','store'],
  'jobs':             ['admin','supervisor','store','tech'],
  'fleet':            ['admin','supervisor','store'],
  'quotes':           ['admin'],
  'tasks':            ['admin','supervisor'],
  'attendance.all':   ['admin','supervisor'],
  'salary':           ['admin'],
  'money':            ['admin'],
  'collect':          ['admin','supervisor','tech'],
  'delivery':         ['admin','store'],
  'manuals':          ['admin']
};

/* What each right is, in words, for the checklist in Settings. */
var RIGHT_GROUPS = [
  ['Complaints', [['jobs','See the Jobs tab'], ['complaint.all','See every complaint, not only their own'],
                  ['complaint.add','Open new complaints'], ['complaint.assign','Assign and change technicians']]],
  ['Store and parts', [['stock.see','See the store'], ['stock.edit','Change stock, purchases and scrap'],
                       ['part.approve','Approve part requests'], ['part.issue','Issue parts'], ['delivery','Delivery notes']]],
  ['Machines and reports', [['fleet','See the Machines tab'], ['reports','Reports'], ['manuals','Manage the manual library']]],
  ['Office', [['quotes','Quotations, bills and contracts'], ['tasks','Tasks and meetings'],
              ['money','Money \u2014 invoices, payments, receivables'], ['collect','Record a payment collected']]],
  ['People', [['attendance.all','Everyone\u2019s attendance, corrections, holidays'], ['salary','Salary \u2014 rates, advances, slips, bank letter'],
              ['users','Add and edit users'], ['settings','Company settings']]]
];

function rightsRec(id){ return (DB.rights || []).filter(function(r){ return r.id === id; })[0]; }

function roleHas(role, what){
  if(role === 'admin') return true;
  var r = rightsRec('role:' + role);
  return r ? (r.perms || []).indexOf(what) > -1 : ((PERMS[what] || []).indexOf(role) > -1);
}

/* An admin always has every right \u2014 nobody can lock the firm out. For anyone
   else: the role's rights as the admin set them, then that person's own
   exceptions. The server checks the same list, so taking a right away stops
   it working at once, whatever a phone shows. */
function can(what){
  if(!ME) return false;
  if(ME.role === 'admin') return true;
  var u = rightsRec('user:' + ME.id);
  if(u){
    if((u.allow || []).indexOf(what) > -1) return true;
    if((u.deny || []).indexOf(what) > -1) return false;
  }
  return roleHas(ME.role, what);
}

/* what this person is allowed to see */
function myComplaints(){
  if(can('complaint.all')) return DB.complaints;
  return DB.complaints.filter(function(c){ return c.tech === ME.id; });
}

/* ---------- a plain record of what happened ---------- */
function logIt(kind, what, detail){
  DB.log.unshift({ id:uid(), kind:kind, what:what, detail:detail||'',
                   by: ME ? ME.name : '', at: now() });
  if(DB.log.length > 600) DB.log.length = 600;
}

/* ---------- toast ---------- */
function toast(msg, kind){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'on' + (kind ? ' ' + kind : '');
  clearTimeout(t._x);
  t.onclick = function(){ t.className = ''; };
  t._x = setTimeout(function(){ t.className = ''; },
                    kind === 'bad' ? 9000 : 3400);
}

/* ---------- modal ---------- */
function modal(title, body, buttons){
  $('mtitle').textContent = title;
  $('mbody').innerHTML = body;
  $('mfoot').innerHTML = (buttons||[{t:'Close',cls:'ghost',f:'closeModal()'}])
    .map(function(b){
      return '<button class="btn '+(b.cls||'')+'" onclick="'+b.f+'">'+esc(b.t)+'</button>';
    }).join('');
  $('mwrap').classList.add('on');
}
function closeModal(){ $('mwrap').classList.remove('on'); }

/* ---------- signing in ---------- */
function doSignin(){
  var u = $('gUser').value.trim().toLowerCase();
  var p = $('gPass').value;
  var err = $('gErr');

  var rec = DB.users.filter(function(x){
    return String(x.email||'').toLowerCase() === u; })[0];

  if(!rec || !rec.active || !checkPass(rec, p)){
    err.textContent = 'That user name or password is not right.';
    return;
  }
  err.textContent = '';
  ME = rec;
  /* stay signed in, the way an app on a phone does. The phone's own lock
     is what keeps it private; Sign out ends it. */
  DB.session = rec.id;
  /* the same password signs this person in to attendance on the server,
     while it is to hand; only the session is kept */
  try { if(typeof hrLogin === 'function') hrLogin(rec.email, p, true); } catch(e){}
  $('gPass').value = '';
  $('gate').classList.add('hide');
  $('app').style.display = 'block';
  logIt('auth','Signed in', ROLES[rec.role].label);
  save();
  startApp();
  if(rec.mustChange) setTimeout(forceNewPass, 500);
}

function signOut(){
  ME = null;
  DB.hr = null; DB.attToday = null;
  try { gateJoinButton(); } catch(e){}
  DB.session = '';
  save();
  /* a phone nobody is signed in on should not ring with somebody's jobs */
  try { if(window.Android && Android.setConfig) Android.setConfig('', '', '', ''); }
  catch(e){}
  try { if(DB.pushOn) disablePush(true); } catch(e){}
  $('app').style.display = 'none';
  $('gate').classList.remove('hide');
  $('gUser').value = ''; $('gPass').value = '';
}

function forceNewPass(){
  modal('Choose your own password',
    '<div class="note w">This account is still on the password it was set up '+
    'with. Choose your own now.</div>'+
    '<div class="field"><label>New password</label>'+
      eyeWrap('<input type="password" id="np1" autocomplete="new-password">', 'np1')+'</div>'+
    '<div class="field"><label>Type it again</label>'+
      eyeWrap('<input type="password" id="np2" autocomplete="new-password">', 'np2')+'</div>',
    [{t:'Set it',cls:'',f:'setNewPass()'}]);
}

function setNewPass(){
  var a = $('np1').value, b = $('np2').value;
  if(a.length < 5) return toast('At least five characters','bad');
  if(a !== b) return toast('The two do not match','bad');
  setPass(ME, a); ME.mustChange = false; delete ME.seed; ME._at = now();
  save(); closeModal();
  toast('Password changed','good');
}

/* ============================================================
   COMPLAINTS
   ------------------------------------------------------------
   A complaint moves: Pending -> Started -> Resolved, and can sit
   at "Waiting for parts" in between. Nothing skips a step, and
   every move is recorded with a name and a time, because that is
   what a customer argument comes down to.
   ============================================================ */

var C_STATUS = {
  pending:  { label:'Pending',           pill:'p-pending'  },
  started:  { label:'Started',           pill:'p-started'  },
  parts:    { label:'Waiting for parts', pill:'p-parts'    },
  resolved: { label:'Resolved',          pill:'p-resolved' },
  closed:   { label:'Closed',            pill:'p-closed'   }
};


function mmyy(){
  var d = new Date();
  return String(d.getMonth()+1).padStart(2,'0') + String(d.getFullYear()).slice(2);
}

function complaintNo(){
  return takeNumber('job', 'PCS', function(){ return DB.seq.complaint++; }, 4) +
         '-' + mmyy();
}

/* ---------- writing one down ---------- */
function newComplaint(){
  if(!can('complaint.add'))
    return toast('Only the office can open a complaint','bad');
  openComplaintForm(null);
}

function openComplaintForm(id){
  var c = id ? byId(DB.complaints, id) : null;
  var clients = DB.clients.filter(function(x){ return x.active !== false; });

  if(!clients.length)
    return toast('Add a client first, under More','bad');

  modal(c ? 'Edit ' + c.no : 'New complaint',
    '<div class="field"><label>Client</label>'+
      '<select id="cfClient" onchange="cfMachines()">'+
        clients.map(function(x){
          return '<option value="'+x.id+'"'+(c&&c.client===x.id?' selected':'')+'>'+
                 esc(x.name)+'</option>'; }).join('')+
      '</select></div>'+

    '<div class="field"><label>Machine</label>'+
      '<select id="cfMachine"></select>'+
      '<div class="help">Only the machines at that client are listed.</div></div>'+

    '<div class="field"><label>What is wrong</label>'+
      '<textarea id="cfWhat" placeholder="Paper jam in the fuser, SC542 showing">'+
        esc(c?c.what:'')+'</textarea></div>'+

    '<div class="two">'+
      '<div class="field"><label>Priority</label><select id="cfPri">'+
        ['Normal','High'].map(function(p){
          return '<option'+(c&&c.pri===p?' selected':'')+'>'+p+'</option>'; }).join('')+
        '</select></div>'+
      '<div class="field"><label>Technician</label><select id="cfTech">'+
        '<option value="">not yet</option>'+
        DB.users.filter(function(u){ return u.role==='tech' && u.active; })
          .map(function(u){
            return '<option value="'+u.id+'"'+(c&&c.tech===u.id?' selected':'')+'>'+
                   esc(u.name)+'</option>'; }).join('')+
        '</select></div>'+
    '</div>'+

    '<div class="two">'+
      '<div class="field"><label>Person to ask for</label>'+
        '<input id="cfWho" value="'+esc(c?c.who:'')+'" placeholder="Mr. Asif" list="cfWhoList" oninput="cfWhoPick()" autocomplete="off">'+
        '<datalist id="cfWhoList"></datalist></div>'+
      '<div class="field"><label>Their WhatsApp</label>'+
        '<input id="cfPhone" type="tel" value="'+esc(c?c.phone:'')+'" '+
        'placeholder="0300 1234567"></div>'+
    '</div>'+

    '<div id="cfWhoPicks" style="margin:-4px 0 10px"></div>'+

    '<div class="field"><label>Note for the technician</label>'+
      '<input id="cfTechNote" value="'+esc(c?c.techNote||'':'')+'" '+
      'placeholder="Collect payment first \u00b7 call only after 5pm \u00b7 \u2026">'+
      '<div class="help">Shown at the top of his job screen.</div></div>'+

    (id ? '' : cfMediaBlock())+

    '<div class="field"><label>Cheque to collect?</label>'+
      '<select id="cfCheque">'+
        '<option value="">no</option>'+
        '<option value="1"'+(c&&c.cheque?' selected':'')+'>yes</option>'+
      '</select>'+
      '<div class="help">The technician is told plainly on the job screen.</div></div>',

    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t: c?'Save':'Open it', cls:'', f:'saveComplaint(' + (c?"'"+c.id+"'":'null') + ')'}]);

  cfMachines(c ? c.machine : null);
}

/* Everyone this client has been reached through before: the people listed
   for the client, and whoever was asked for on its earlier complaints. */
function clientPeople(cid){
  var cl = byId(DB.clients, cid) || {}, seen = {}, out = [];
  (cl.people || []).concat(DB.complaints.filter(function(x){ return x.client === cid && x.who; })
      .sort(function(a, b){ return String(a.opened) < String(b.opened) ? 1 : -1; })
      .map(function(x){ return { name:x.who, phone:x.phone }; })).forEach(function(p){
    var k = String(p.name || '').trim().toLowerCase();
    if(!k) return;
    if(!seen[k]){ seen[k] = { name:p.name.trim(), phone:p.phone || '' }; out.push(seen[k]); }
    else if(!seen[k].phone && p.phone) seen[k].phone = p.phone;
  });
  return out;
}
function cfWhoOptions(){
  var list = $('cfWhoList'), picks = $('cfWhoPicks');
  if(!list || !$('cfClient')) return;
  var ppl = clientPeople($('cfClient').value);
  list.innerHTML = ppl.map(function(p){ return '<option value="' + esc(p.name) + '">' + esc(p.phone) + '</option>'; }).join('');
  picks.innerHTML = ppl.length ? '<div class="help" style="margin-bottom:4px">Asked for before at this client \u2014 tap to fill:</div>' +
    ppl.slice(0, 5).map(function(p, i){
      return '<span class="cf-pick" onclick="cfWhoSet(' + i + ')">' + esc(p.name) + (p.phone ? ' \u00b7 ' + esc(p.phone) : '') + '</span>'; }).join('') : '';
  window._cfPeople = ppl;
}
function cfWhoSet(i){ var p = window._cfPeople[i]; $('cfWho').value = p.name; $('cfPhone').value = p.phone || ''; }
/* typing a name already known fills the number too; a new name leaves it for you */
function cfWhoPick(){
  var name = $('cfWho').value.trim().toLowerCase();
  var p = (window._cfPeople || []).filter(function(x){ return x.name.toLowerCase() === name; })[0];
  if(p && p.phone && !$('cfPhone').value.trim()) $('cfPhone').value = p.phone;
}
/* a new person on a complaint is kept with the client, for next time */
function rememberPerson(cid, name, phone){
  if(!name) return;
  var cl = byId(DB.clients, cid); if(!cl) return;
  cl.people = cl.people || [];
  var have = cl.people.filter(function(p){ return String(p.name).trim().toLowerCase() === name.toLowerCase(); })[0];
  if(have){ if(phone && have.phone !== phone){ have.phone = phone; cl._at = now(); } return; }
  cl.people.push({ name:name, role:'', phone:phone || '' }); cl._at = now();
}

function cfMachines(pick){
  var cid = $('cfClient').value;
  var list = DB.machines.filter(function(m){ return m.client === cid && !m.cancelled; });
  var sel = $('cfMachine');
  if(!list.length){
    sel.innerHTML = '<option value="">no machines on record for this client</option>';
    return;
  }
  sel.innerHTML = list.map(function(m){
    return '<option value="'+m.id+'"'+(pick===m.id?' selected':'')+'>'+
           esc(machineLabel(m))+'</option>'; }).join('');
  try { cfWhoOptions(); } catch(e){}
}

function machineLabel(m){
  return [m.model, m.serial, m.dept, m.place].filter(Boolean).join(' \u00b7 ');
}

function saveComplaint(id){
  var what = $('cfWhat').value.trim();
  if(!what) return toast('Write what is wrong','bad');
  var machine = $('cfMachine').value;
  if(!machine) return toast('Choose a machine','bad');
  if(!validPhone($('cfPhone').value))
    return toast('A phone number has 10 or 11 digits \u2014 check it, a wrong one is a wasted journey','bad');

  /* One broken machine is one complaint, however many people report it. */
  if(!id){
    var open = DB.complaints.filter(function(x){
      return x.machine === machine && ['pending','started','parts'].indexOf(x.status) > -1; })[0];
    if(open){
      window._addTo = { open: open.id, what: what, who: $('cfWho').value.trim() };
      return modal('This machine already has an open complaint',
        '<div class="card" style="padding:10px 12px"><div class="ttl">' + esc(open.no) + ' \u00b7 ' +
          C_STATUS[open.status].label + '</div><div class="meta">' + esc(String(open.what).slice(0,90)) +
          '</div><div class="meta">' + (open.tech ? esc(nameOf(DB.users, open.tech)) : 'not assigned yet') +
          ' \u00b7 opened ' + esc(dtime(open.opened)) + '</div></div>'+
        '<div class="help" style="margin-top:8px">Add what you were told to that one, instead of opening a '+
        'second job for the same machine.</div>',
        [{t:'Back',cls:'ghost',f:'closeModal()'},{t:'Add to it',cls:'',f:'addToOpen()'}]);
    }
  }

  /* An expired service contract stops a new job here, and only here. The
     point is not to refuse the client — an admin can go ahead — but
     to make somebody decide, rather than a renewal being forgotten and a
     year of service given away. */
  var blocked = id ? null : serviceBlocked(machine);
  if(blocked && !window._overrode){
    return modal('That contract has expired',
      blockNote(blocked)+
      '<div class="help">Renew it, or open the job anyway and say who decided '+
      'to.</div>',
      [{t:'Back',cls:'ghost',f:'closeModal()'}]
        .concat(ME.role === 'admin'
          ? [{t:'Open it anyway',cls:'danger',
              f:"overrideBlock('"+blocked.id+"')"}]
          : []));
  }
  window._overrode = false;

  var c = id ? byId(DB.complaints, id) : null;
  var oldTech = c ? c.tech : '';
  var fresh = !c;
  if(fresh){
    c = { id:uid(), no:complaintNo(), status:'pending', opened:now(),
          openedBy: ME.id, shots:[],
          aiAllowed: !!(aiStatus().enabled && aiStatus().default_allowed) };
    DB.complaints.unshift(c);
  }
  c.client  = $('cfClient').value;
  c.machine = machine;
  c.what    = what;
  c.pri     = $('cfPri').value;
  c.tech    = $('cfTech').value;
  c.who     = $('cfWho').value.trim();
  c.phone   = $('cfPhone').value.trim();
  rememberPerson(c.client || $('cfClient').value, c.who, c.phone);
  c.cheque  = !!$('cfCheque').value;
  c.techNote = $('cfTechNote').value.trim();
  c._at     = now();

  if(fresh) notifyLogged(c);
  if(c.tech && c.tech !== oldTech) notifyAssigned(c);
  logIt('complaint', fresh ? 'Opened ' + c.no : 'Edited ' + c.no,
        nameOf(DB.clients, c.client));
  save(); closeModal(); draw();
  toast(fresh ? c.no + ' opened' : 'Saved', 'good');
  if(sharingOn()) syncSoon();
  if(fresh) cfMediaSave(c);
}

function addToOpen(){
  var a = window._addTo; window._addTo = null;
  var c = a && byId(DB.complaints, a.open);
  if(!c) return closeModal();
  c.more = c.more || [];
  c.more.push({ what: a.what, who: (a.who ? a.who + ', via ' : '') + ME.name, at: now() });
  c._at = now();
  if(c.tech) tellAll([byId(DB.users, c.tech)].filter(Boolean), 'More on ' + c.no, a.what, c.id);
  logIt('complaint', 'Added to ' + c.no, a.what);
  save(); closeModal(); draw();
  toast('Added to ' + c.no,'good');
  if(sharingOn()) syncSoon();
}

/* ---------- the job screen ---------- */
/* Only an admin can go past it, and it is written down with a reason. */
function overrideBlock(contractId){
  var k = byId(DB.contracts, contractId);
  closeModal();
  askReason('Why is this being opened on an expired contract?', function(why){
    k.overrides = k.overrides || [];
    k.overrides.push({ why:why, by:ME.name, at:now() });
    k._at = now();
    tellAll(admins(), 'An expired contract was overridden',
      k.no + ' \u00b7 ' + nameOf(DB.clients, k.client) + ' \u00b7 ' + why, '');
    logIt('contract','Overrode ' + k.no, why);
    save();
    window._overrode = true;
    closeModal();
    openComplaintForm(null);
    toast('Opened. The override is on the contract.','good');
  });
}

    /* A lapsed contract does not stop a complaint that has already been

       the office can decide whether to charge. */

      if(k && contractState(k) === 'expired' && DEAL_KIND[k.kind].blocks)

            ', '+esc(ago(x.at))+'</span>'; }).join('<br>')+'</div>' : '')+

      (aiStatus().enabled ? 'AI Assistant on this complaint: <b>' + (c.aiAllowed ? 'allowed' : 'not allowed') + '</b>'

        (c.aiAllowed ? 'Stop it' : 'Allow') + '</button>' : '') + '</div>' : '')+

    (c.techNote ? '<div class="note d" style="font-size:14.5px"><b>' + (mine ? 'Note from the office:' : 'Note for the technician:') + '</b> '+
      esc(c.techNote)+'</div>' : '')+

function ev(title, detail, on){
  return '<div class="ev'+(on?' on':'')+'"><b>'+esc(title)+'</b><span>'+
         esc(detail)+'</span></div>';
}

/* a number as two buttons: call, and WhatsApp */
function callLinks(phone, stop){
  if(!phone) return '';
  var s = stop ? ' onclick="event.stopPropagation()"' : '';
  return ' <a class="cl-btn" href="tel:' + esc(String(phone).replace(/[^0-9+]/g,'')) + '"' + s + '>\u{1F4DE}</a>'+
         '<a class="cl-btn wa" href="https://wa.me/' + waNum(phone) + '" target="_blank"' + s + '>WhatsApp</a>';
}

function waNum(p){
  var d = String(p||'').replace(/[^0-9]/g,'');
  if(d.indexOf('92') === 0) return d;
  if(d.indexOf('0') === 0) return '92' + d.slice(1);
  return d;
}

/* ---------- the moves ---------- */
function startJob(id){
  var c = byId(DB.complaints, id);
  if(!c || c.tech !== ME.id) return toast('This is not your job','bad');
  var first = blockedBy(c);
  if(first) return toast('The office set your order: first number ' + first.seq + ' \u2014 ' + nameOf(DB.clients, first.client), 'bad');
  c.status = 'started'; c.started = now(); c._at = now();
  grabPlace(c);            /* quietly, and only once */
  logIt('complaint','Started ' + c.no, '');
  save(); closeModal(); draw();
  toast('Started. The office can see it now.','good');
  if(sharingOn()) syncSoon();
}

/* Nothing can be closed until every part is settled, the counter is read
   and photographed, and a cheque is either collected or explained. The
   specification calls this the record lock, and it is the only thing that
   makes the part reports trustworthy afterwards. */
function lockBlocks(c){
  var stop = [];
  var open = DB.parts.filter(function(p){
    return p.complaint === c.id && unsettled(p) > 0; });
  if(open.length)
    stop.push(open.length + ' part(s) are still unsettled \u2014 install, return '+
              'or write them off first');
  if(!c.counter)
    stop.push('the counter reading has not been taken');
  if(!c.counterShot)
    stop.push('there is no photo of the counter');
  if(c.cheque && !c.chequeDone && !c.chequeWhy)
    stop.push('the cheque is neither collected nor explained');
  return stop;
}

function resolveJob(id){
  var c = byId(DB.complaints, id);
  if(!c || c.tech !== ME.id) return toast('This is not your job','bad');

  var stop = lockBlocks(c);
  if(stop.length)
    return modal('Not ready to close',
      '<div class="note w">These have to be done first:<ul style="margin:8px 0 0 18px">'+
      stop.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul></div>',
      [{t:'Back',cls:'ghost',f:"closeModal();openComplaint('"+id+"')"}]);

  modal('How did it end?',
    '<div class="field"><label>Outcome</label><select id="rjHow" onchange="rjShow()">'+
      '<option value="done">Resolved</option>'+
      '<option value="parts">Resolved for now \u2014 a part needs changing</option>'+
      '<option value="no">Not resolved</option>'+
    '</select><div class="help" id="rjHelp"></div></div>'+

    '<div class="field" id="rjWorkF"><label>Work done (required)</label>'+
      '<textarea id="rjWork" placeholder="Cleaned the fuser, replaced the pick-up roller, test print fine"></textarea>'+
      '<div class="help">What you actually did. The next technician reads this first.</div></div>'+
    '<div class="field hide" id="rjWhyF"><label>Why is it not resolved (required)</label>'+
      '<textarea id="rjWhy"></textarea></div>'+
    '<div class="field"><label>Note for the office</label>'+
      '<textarea id="rjNote" placeholder="Anything the office should know"></textarea></div>'+
    '<div class="note w" style="font-size:12.5px">After this, only an admin can reopen this complaint.</div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Save',cls:'green',f:"doResolve('"+id+"')"}]);
}

function rjShow(){
  var how = $('rjHow').value;
  $('rjHelp').textContent = {
    done:  'The fault is fixed and the machine is working.',
    parts: 'It is working now, but a part is worn and has to be changed on another visit.',
    no:    'It is not working. Say why \u2014 a part is needed, the client stopped you, anything.'
  }[how];
  $('rjWorkF').classList.toggle('hide', how === 'no');
  $('rjWhyF').classList.toggle('hide', how !== 'no');
}

function doResolve(id){
  var c = byId(DB.complaints, id);
  var how = $('rjHow').value;
  var note = $('rjNote').value.trim();
  var work = $('rjWork') ? $('rjWork').value.trim() : '';
  var why = $('rjWhy') ? $('rjWhy').value.trim() : '';

  if(how !== 'no' && !work)
    return toast('Write what was done \u2014 it is the one thing the next technician needs','bad');
  if(how === 'no' && !why)
    return toast('Say why it is not resolved','bad');

  c.workDone = how !== 'no' ? work : '';
  c.reason = how === 'no' ? why : '';
  c.note = note;
  c.locked = now();
  c.lockedBy = ME.id;
  c._at = now();

  if(how === 'done'){
    c.status = 'resolved'; c.resolved = now();
    notifyResolved(c);
    logIt('complaint','Resolved ' + c.no, note);
    toast(c.no + ' resolved','good');
  } else if(how === 'parts'){
    c.status = 'parts';

  if(last && n < last)
    return toast('The last reading on this machine was ' + last.toLocaleString() +
                 '. A counter cannot go down.','bad');

  c.counter = n; c.counterAt = now(); c._at = now();
  logIt('complaint','Counter ' + n + ' on ' + c.no, '');

function lastCounter(machineId, notThis){
  var best = 0;
  DB.complaints.forEach(function(x){
    if(x.machine !== machineId || x.id === notThis) return;
    if(x.counter && x.counter > best) best = x.counter;
  });
  (DB.visits || []).forEach(function(v){
    if(v.machine === machineId && v.counter > best) best = v.counter;
  });
  return best;
}

/* ============================================================
   PARTS
   ------------------------------------------------------------
   A part row carries quantities, not a single state. Status
   describes the stage a row has reached; it is never counted.

     qty        how many were asked for and assigned
     issued     how many left the shelf
     rejected   how many the technician refused at the counter
     rejBack    how many of those the store put back on the shelf
     installed  how many went into a machine
     retPend    how many he has said he is returning
     returned   how many the store has actually taken back
     lost       how many are gone
     oldBack    how many old parts came back as proof of a fitting

   The two figures, each written once:

     holding = issued - installed - returned - retPend - rejected - lost
     shelf   = opening + purchased - issued + rejBack + returned
   ============================================================ */

var P_STAGE = {
  asked:    { label:'Requested', pill:'p-pending'  },
  approved: { label:'Approved',  pill:'p-started'  },
  issued:   { label:'Issued',    pill:'p-parts'    },
  working:  { label:'In hand',   pill:'p-started'  },
  done:     { label:'Settled',   pill:'p-resolved' },
  refused:  { label:'Rejected',  pill:'p-closed'   }
};

function q(p, field){ return parseFloat(p[field]) || 0; }

/* ---------- the two figures. One implementation each. ---------- */

function holding(p){
  return q(p,'issued') - q(p,'installed') - q(p,'returned')
       - q(p,'retPend') - q(p,'rejected') - q(p,'lost');
}

function shelf(stockId){
  var s = byId(DB.stock, stockId);
  if(!s) return 0;
  var n = q(s,'opening') + purchases(stockId);
  DB.parts.forEach(function(p){
    if(p.stock !== stockId) return;
    n -= q(p,'issued');
    n += q(p,'rejBack');
    n += q(p,'returned');
  });
  return n;
}

/* what is still to be settled on a row */
function unsettled(p){
  return holding(p) + (q(p,'issued') - q(p,'rejected') - q(p,'installed')
                       - q(p,'returned') - q(p,'retPend') - q(p,'lost') < 0 ? 0 : 0)
       + (q(p,'rejected') - q(p,'rejBack'))
       + q(p,'retPend');
}

/* the stage a row has reached, worked out from its quantities */
function stageOf(p){
  if(q(p,'issued') === 0)
    return p.approved ? 'approved' : 'asked';
  if(q(p,'rejected') >= q(p,'issued') && q(p,'rejBack') >= q(p,'rejected'))
    return 'refused';
  if(unsettled(p) <= 0) return 'done';
  if(holding(p) > 0) return 'working';
  return 'issued';
}

/* ---------- asking for one ---------- */
/* Does this part fit that machine?

   A part with nothing ticked fits anything. That is deliberate: before the
   compatibility list is filled in, hiding parts would stop the work, and a
   technician standing at a machine cannot wait for somebody to tick a box. */
function partFits(s, model){
  var list = s.fits || [];
  if(!list.length) return true;
  var m = String(model || '').trim().toLowerCase();
  if(!m) return true;
  return list.some(function(f){
    return String(f).trim().toLowerCase() === m; });
}

var _showAllParts = false;

function askPart(complaintId){
  var stock = DB.stock.filter(function(s){ return s.active !== false; });
  if(!stock.length) return toast('The store list is empty','bad');

  var c = byId(DB.complaints, complaintId);
  var machine = c ? byId(DB.machines, c.machine) : null;
  var model = machine ? machine.model : '';

  var fit  = stock.filter(function(s){ return partFits(s, model); });
  var rest = stock.filter(function(s){ return !partFits(s, model); });
  var shown = _showAllParts ? stock : fit;

  modal('Ask for a part',
    (model
      ? '<div class="note i">Showing the parts that fit <b>'+esc(model)+'</b>'+
        (rest.length && !_showAllParts
          ? ' \u2014 '+rest.length+' other part(s) are hidden.' : '.')+'</div>'
      : '')+

    '<div class="field"><label>Part</label><select id="apPart">'+
      (shown.length
        ? shown.map(function(s){
            return '<option value="'+s.id+'">'+esc(stockLabel(s))+
                   ' \u2014 '+shelf(s.id)+' on the shelf'+
                   ((s.fits||[]).length ? '' : ' \u00b7 fits anything')+
                   '</option>'; }).join('')
        : '<option value="">nothing on the list fits this machine</option>')+
      '<option value="other">something else \u2014 not on the list</option>'+
    '</select></div>'+

    (rest.length
      ? '<div class="field"><label style="display:flex;gap:9px;align-items:center;'+
        'font-weight:400;font-size:13px;cursor:pointer">'+
        '<input type="checkbox" id="apAll"'+(_showAllParts?' checked':'')+
        ' onchange="_showAllParts=this.checked;closeModal();askPart(\''+
        complaintId+'\')" style="width:auto">'+
        'Show every part, even the ones not listed for this machine</label>'+
        '<div class="help">Compatibility lists are never complete. If you know a '+
        'part fits, use it \u2014 then tick it on the part so the next person '+
        'does not have to know.</div></div>'
      : '')+
    '<div class="field hide" id="apOtherBox"><label>What is it</label>'+
      '<input id="apOther" placeholder="Fuser unit for MP 5055"></div>'+
    '<div class="field"><label>How many</label>'+
      '<input id="apQty" type="number" inputmode="numeric" value="1" min="1"></div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Ask',cls:'',f:"saveAsk('"+complaintId+"')"}]);

  $('apPart').onchange = function(){
    $('apOtherBox').classList.toggle('hide', this.value !== 'other'); };
}

function saveAsk(complaintId){

  });

/* ---------- showing a row ---------- */
function partRow(p){
  var st = P_STAGE[stageOf(p)];
  var bits = [];
  if(q(p,'issued'))    bits.push(q(p,'issued') + ' issued');
  if(holding(p))       bits.push(holding(p) + ' in hand');
  if(q(p,'installed')) bits.push(q(p,'installed') + ' fitted');
  if(q(p,'retPend'))   bits.push(q(p,'retPend') + ' coming back');
  if(q(p,'returned'))  bits.push(q(p,'returned') + ' returned');
  if(q(p,'rejected'))  bits.push(q(p,'rejected') + ' rejected');
  if(q(p,'lost'))      bits.push(q(p,'lost') + ' lost');

  return '<div class="card" style="padding:10px 12px;margin-bottom:7px">'+
    '<div class="row"><div class="grow">'+
      '<div style="font-size:13.5px;font-weight:600">'+esc(p.name)+'</div>'+
      '<div class="meta">'+q(p,'qty')+' asked'+
        (bits.length ? ' \u00b7 ' + bits.join(' \u00b7 ') : '')+'</div>'+
      '<div class="meta">by '+esc(p.byName || nameOf(DB.users,p.by))+
        ' \u00b7 '+ago(p.at)+'</div>'+
      (p.rejectedWhy ? '<div class="meta"><b>Rejected:</b> '+esc(p.rejectedWhy)+'</div>' : '')+
      (p.lostWhy ? '<div class="meta"><b>Lost:</b> '+esc(p.lostWhy)+'</div>' : '')+
    '</div><span class="pill '+st.pill+'">'+st.label+'</span></div>'+
    partButtons(p)+
  '</div>';
}

/* Each button says how many it can move, so nobody presses one that
   cannot do anything. */
function partButtons(p){
  var b = [], stage = stageOf(p);
  var mine = p.by === ME.id;

  if(!p.approved && can('part.approve')){
    b.push(['Approve','green',"partApprove('"+p.id+"')"]);
    b.push(['Reject the request','danger',"partDrop('"+p.id+"')"]);
  }
  var toIssue = q(p,'qty') - q(p,'issued');
  if(p.approved && toIssue > 0 && can('part.issue'))
    b.push(['Issue ' + toIssue,'', "partAsk('"+p.id+"','issued',"+toIssue+")"]);

  if(mine){
    var inHand = holding(p);
    var waiting = q(p,'issued') - q(p,'rejected') - q(p,'installed')
                - q(p,'returned') - q(p,'retPend') - q(p,'lost');
    if(waiting > 0){
      b.push(['Reject ' + waiting,'danger',"partAsk('"+p.id+"','rejected',"+waiting+")"]);
    }
    if(inHand > 0){
      b.push(['Install','green',"partAsk('"+p.id+"','installed',"+inHand+")"]);
      b.push(['Return','ghost',"partAsk('"+p.id+"','retPend',"+inHand+")"]);
      b.push(['Lost','danger',"partAsk('"+p.id+"','lost',"+inHand+")"]);
    }
    if(q(p,'installed') > 0)
      b.push(['Undo a fitting','ghost',"partAsk('"+p.id+"','uninstall',"+q(p,'installed')+")"]);
  }

  var rejWaiting = q(p,'rejected') - q(p,'rejBack');
  if(rejWaiting > 0 && can('part.issue'))
    b.push(['Take back ' + rejWaiting,'',"partAsk('"+p.id+"','rejBack',"+rejWaiting+")"]);

  if(q(p,'retPend') > 0 && can('part.issue'))
    b.push(['Received back ' + q(p,'retPend'),'',
            "partAsk('"+p.id+"','returned',"+q(p,'retPend')+")"]);

  var oldDue = wantsOldBack(p) ? q(p,'installed') - q(p,'oldBack') : 0;
  if(oldDue > 0 && can('part.issue'))
    b.push(['Old part in ' + oldDue,'',"partAsk('"+p.id+"','oldBack',"+oldDue+")"]);

  if(!b.length) return '';
  return '<div class="btns" style="margin-top:9px;flex-wrap:wrap">' +
    b.map(function(x){
      return '<button class="btn sm '+x[1]+'" onclick="'+x[2]+'">'+x[0]+'</button>';
    }).join('') + '</div>';
}

function partApprove(id){
  var p = byId(DB.parts, id);
  if(!p) return;
  p.approved = true; p.approvedBy = ME.id; p.approvedAt = now(); p._at = now();
  logIt('part','Approved ' + p.name, '');

function partDrop(id){
  var p = byId(DB.parts, id);
  if(!p) return;
  askReason('Why is the request refused?', function(why){
    p.rejected = q(p,'qty'); p.rejBack = q(p,'rejected');

    logIt('part','Request refused \u2014 ' + p.name, why);
    save(); closeModal(); draw();

/* ---------- the one place a quantity moves ---------- */
var MOVES = {
  issued:    { word:'Issue',          needs:'the shelf' },
  rejected:  { word:'Reject',         needs:'', why:'Why is it being rejected?' },
  rejBack:   { word:'Take back',      needs:'' },
  installed: { word:'Install',        needs:'' },
  uninstall: { word:'Undo a fitting', needs:'' },
  retPend:   { word:'Return',         needs:'' },
  returned:  { word:'Received back',  needs:'' },
  lost:      { word:'Write off',      needs:'', why:'What happened to it?' },
  oldBack:   { word:'Old part in',    needs:'' }
};

function partAsk(id, what, most){
  var p = byId(DB.parts, id);
  if(!p) return;
  var m = MOVES[what];

  if(what === 'issued' && p.stock){
    var have = shelf(p.stock);
    if(have < most) most = have;
    if(most < 1) return toast('Nothing on the shelf','bad');
  }

  modal(m.word + ' \u2014 ' + p.name,
    '<div class="field"><label>How many</label>'+
      '<input id="pmN" type="number" inputmode="numeric" value="'+most+
      '" min="1" max="'+most+'">'+
      '<div class="help">Up to '+most+'. Put a smaller number to move only '+
      'some of them.</div></div>'+
    (m.why ? '<div class="field"><label>Reason</label>'+
      '<textarea id="pmWhy" placeholder="Needed for the record"></textarea></div>' : '')+
    (what === 'rejected' ? '<div class="note i">Carry on with the complaint. The store will send a '+
      'replacement.</div>' : ''),
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:m.word,cls:'',f:"partDo('"+id+"','"+what+"',"+most+")"}]);
}

function partDo(id, what, most){
  var p = byId(DB.parts, id);
  var m = MOVES[what];
  var n = parseInt($('pmN').value,10) || 0;
  if(n < 1) return toast('How many?','bad');
  if(n > most) return toast('Only ' + most + ' can be moved','bad');

  var why = m.why ? ($('pmWhy').value || '').trim() : '';
  if(m.why && !why) return toast('A reason is needed','bad');

  if(what === 'uninstall'){
    p.installed = q(p,'installed') - n;
  } else if(what === 'returned'){
    /* the store taking it in moves it out of "coming back" and into
       "returned" \u2014 it must not sit in both, or one part is counted twice */
    p.retPend  = q(p,'retPend') - n;
    p.returned = q(p,'returned') + n;
  } else {
    p[what] = q(p, what) + n;
  }

  /* a part's cost is frozen the moment it goes into a machine, so an old
     record never shows today's price */
  if(what === 'installed') p.installedAt = now();
  if(what === 'retPend') p.retAt = now();
  if(what === 'installed' && !p.unitCost && p.stock){
    var s = byId(DB.stock, p.stock);
    if(s) p.unitCost = q(s,'cost');
  }
  if(what === 'rejected'){
    p.rejectedWhy = why; p.rejectedAt = now();
    notifyPartRejected(p, byId(DB.complaints, p.complaint), n, why);
  }
  if(what === 'lost'){
    p.lostWhy = why; p.lostAt = now();
    notifyPartLost(p, byId(DB.complaints, p.complaint), n, why);
  }
  if(what === 'issued'){
    p.issuedBy = ME.id; p.issuedByName = ME.name;
    notifyPartReady(p, byId(DB.complaints, p.complaint));
  }

  p['at_' + what] = now();
  p._at = now();

  logIt('part', m.word + ' ' + n + ' \u00d7 ' + p.name, why);

  /* a complaint stops waiting when nothing is outstanding on it */
  var c = byId(DB.complaints, p.complaint);
  if(c && c.status === 'parts'){
    var open = DB.parts.filter(function(x){
      return x.complaint === c.id && unsettled(x) > 0; });
    if(!open.length){ c.status = 'started'; c._at = now(); }
  }

  if(p.stock) checkLowStock(p.stock);
  save(); closeModal(); draw();
  toast(m.word + ' \u2014 ' + n, 'good');
  if(sharingOn()) syncSoon();
}

function askReason(title, done){
  modal(title,
    '<div class="field"><label>Reason</label>'+
      '<textarea id="arWhy" placeholder="Needed for the record"></textarea></div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Save',cls:'',f:'arGo()'}]);
  window._arDone = done;
}
function arGo(){
  var why = ($('arWhy').value || '').trim();
  if(!why) return toast('A reason is needed','bad');
  var f = window._arDone; window._arDone = null;
  if(f) f(why);
}

var PAGE = 'home';
var FILTER = 'open';

function go(p){
  /* a page the role cannot use sends them home instead */
  var allowed = { jobs:'jobs', store:'stock.see', fleet:'fleet', quotes:'quotes' };
  if(ME && allowed[p] && !can(allowed[p])) p = 'home';
  if(ME && p === 'tasks' && !canTasks() && ME.role !== 'helper') p = 'home';
  PAGE = p;
  Array.prototype.forEach.call(document.querySelectorAll('.page'), function(el){
    el.classList.toggle('on', el.id === 'pg-' + p); });
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.classList.toggle('on', b.dataset.p === p); });
  draw();
  window.scrollTo(0,0);
}

function draw(){
  /* A sync that set off while somebody was signed in can finish after they
     have signed out. With nobody signed in there is nothing to draw. */
  if(!ME) return;
  drawTabs();
  try { drawNet(); } catch(e){}
  if(PAGE === 'home')  drawHome();
  if(PAGE === 'jobs')  drawJobs();
  if(PAGE === 'store') drawStore();
  if(PAGE === 'fleet') drawFleet();
  if(PAGE === 'quotes') drawQuotes();
  if(PAGE === 'tasks') drawMine();
  if(PAGE === 'more')  drawMore();
}

/* ---------- the bar and tabs ---------- */
function drawTabs(){
  if(!ME) return;
  var showTab = { home:true, more:true,
    jobs: can('jobs'), store: can('stock.see'), fleet: can('fleet'),
    quotes: can('quotes'), tasks: canTasks() || ME.role === 'helper' };
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.style.display = showTab[b.dataset.p] === false ? 'none' : '';
  });
  var open = myComplaints().filter(function(c){
    return c.status !== 'resolved' && c.status !== 'closed'; }).length;
  /* the badge counts what actually needs a person, by quantity */
  var waiting = 0;
  if(can('part.approve'))
    waiting = DB.parts.filter(function(p){ return !p.approved && !q(p,'issued'); }).length;
  if(can('part.issue'))
    waiting += DB.parts.filter(function(p){
      return q(p,'retPend') > 0 || q(p,'rejected') - q(p,'rejBack') > 0; }).length;

  var b = $('tabJobs'); if(b) b.innerHTML = tabInner('\u{1F527}','Jobs',open);
  var s = $('tabStore'); if(s) s.innerHTML = tabInner('\u{1F4E6}','Store',waiting);
  var tk = $('tabTasks');
  if(tk){
    var waitingOnMe = canTasks()
      ? (DB.tasks||[]).filter(function(t){

/* ---------- home ---------- */
function drawHome(){
  var mine = myComplaints();
  var open    = mine.filter(function(c){ return c.status === 'pending'; });
  var running = mine.filter(function(c){ return c.status === 'started'; });
  var waiting = mine.filter(function(c){ return c.status === 'parts'; });
  var doneToday = mine.filter(function(c){
    return c.status === 'resolved' && String(c.resolved||'').slice(0,10) === today(); });

  $('homeWho').textContent = ME.name;
  $('homeRole').textContent = ROLES[ME.role].label;
  var hasDash = ['admin','supervisor','store','tech'].indexOf(ME.role) > -1;
  $('homeClassic').style.display = hasDash ? 'none' : '';
  $('homeDash').style.display = hasDash ? '' : 'none';
  if(hasDash){
    try { drawDash(); dashFetch(); } catch(e){ $('homeDash').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
    try { drawAttCard(); } catch(e){}
    return;
  }
  try { drawAttCard(); } catch(e){}

  /* A Helper has no jobs: his home is his attendance and his own work. */
  if(ME.role === 'helper'){
    var work = (DB.tasks || []).filter(function(t){
      return t.to === ME.id && t.state !== 'done' && t.state !== 'turned'; });
    $('homeTiles').innerHTML = '';
    $('homeList').innerHTML = '<label style="margin:6px 0 9px">Your work</label>' +
      (work.length ? work.map(taskCard).join('')
        : '<div class="empty"><span class="ic">\u2713</span>Nothing waiting for you.</div>');
    $('homeParts').innerHTML = '';
    return;
  }

  $('homeTiles').innerHTML =
    tile('a', open.length, can('complaint.all') ? 'Pending' : 'Waiting for me', "jump('pending')")+
    tile('b', running.length, 'Started', "jump('started')")+
    tile('r', waiting.length, 'Need parts', "jump('parts')")+
    tile('g', doneToday.length, 'Done today', "jump('resolved')");

  var next = open.concat(running).sort(function(a,b){
    if(a.pri !== b.pri) return a.pri === 'High' ? -1 : 1;
    return String(a.opened) < String(b.opened) ? -1 : 1;
  }).slice(0, 6);

  $('homeList').innerHTML = next.length
    ? '<label style="margin:6px 0 9px">Next up</label>' + next.map(jobCard).join('')
    : '<div class="empty"><span class="ic">\u2713</span>Nothing waiting.</div>';

  if(can('part.approve')){
    var asked = DB.parts.filter(function(p){ return !p.approved && !q(p,'issued'); });
    $('homeParts').innerHTML = asked.length
      ? '<div class="sep"></div><label style="margin-bottom:9px">'+
        'Parts asked for ('+asked.length+')</label>' +
        asked.slice(0,5).map(partRow).join('')

/* ---------- jobs ---------- */
function drawJobs(){
  var all = myComplaints();
  var counts = { open:0, pending:0, started:0, parts:0, resolved:0 };
  all.forEach(function(c){
    if(counts[c.status] !== undefined) counts[c.status]++;
    if(c.status !== 'resolved' && c.status !== 'closed') counts.open++;
  });

  $('jobStrip').innerHTML = [
    ['open','Open'], ['pending','Pending'], ['started','Started'],
    ['parts','Need parts'], ['resolved','Resolved']
  ].map(function(f){
    return '<button class="'+(FILTER===f[0]?'on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+
      f[1]+'<span class="c">'+counts[f[0]]+'</span></button>';

  var list = all.filter(function(c){

/* one way in for every photo the app takes */
function pickPhoto(done, opts){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  /* a counter or a cheque is photographed there and then; a photo the client
     sent on WhatsApp is chosen from the gallery */
  if(!(opts && opts.gallery)) inp.capture = 'environment';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(f) shrink(f, done);
  };

    var c = byId(DB.complaints, id);

/* A phone photo is three megabytes. Shrink it before it is stored, or a
   handful of jobs fill the device and nothing can be saved at all. */
function shrink(file, done){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 1000;
      var w = img.width, h = img.height;
      if(w > max || h > max){
        if(w > h){ h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      done(cv.toDataURL('image/jpeg', 0.72));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function bigShot(i, id){
  var c = byId(DB.complaints, id);
  var src = (c.shots||[])[i];
  if(!src) return;
  modal('Photo',

    [{t:'Remove',cls:'danger',f:"dropShot("+i+",'"+id+"')"},
     {t:'Close',cls:'ghost',f:"closeModal();openComplaint('"+id+"')"}]);

function purchases(stockId){
  var n = 0;
  (DB.buys || []).forEach(function(b){
    (b.lines || []).forEach(function(l){
      if(l.stock !== stockId) return;
      n += q(l,'qty') - q(l,'back');
    });
  });
  return n;
}

function saveBuy(){
  var lines = [];
  Array.prototype.forEach.call($('byLines').children, function(d){
    var n = parseInt(d.querySelector('.blQty').value,10) || 0;
    if(n < 1) return;
    lines.push({ id:uid(), stock:d.querySelector('.blPart').value, qty:n, back:0,
                 cost: parseFloat(d.querySelector('.blCost').value) || 0 });
  });
  if(!lines.length) return toast('Nothing on the purchase','bad');

  var b = { id:uid(), who:$('byWho').value.trim(), no:$('byNo').value.trim(),
            date:$('byDate').value || today(), lines:lines,
            by:ME.id, byName:ME.name, at:now(), _at:now() };
  DB.buys.unshift(b);

  /* the cost on the shelf follows the newest purchase, but a part already
     fitted keeps the cost frozen into its own record */
  lines.forEach(function(l){
    var s = byId(DB.stock, l.stock);
    if(s && l.cost){ s.cost = l.cost; s._at = now(); }
  });

  logIt('buy','Purchase from ' + (b.who||'a supplier'),
        lines.length + ' line(s)');
  save(); closeModal(); draw();
  toast('Purchase saved','good');
  if(sharingOn()) syncSoon();
}

function doBuyReturn(buyId, lineId){

}

/* ============================================================
   SCRAP
   ------------------------------------------------------------
   An old part that comes back is proof the new one was fitted. It
   has no use, but it is not thrown away: it is sold in bulk once a
   year, so it is tracked until it is.
   ============================================================ */

function scrapHeld(stockId){
  var n = 0;
  DB.parts.forEach(function(p){
    if(p.stock === stockId) n += q(p,'oldBack');
  });
  (DB.scrapSales || []).forEach(function(s){
    (s.lines||[]).forEach(function(l){
      if(l.stock === stockId) n -= q(l,'qty');
    });
  });
  return n;
}

function scrapList(){
  var rows = DB.stock.map(function(s){
    return { s:s, n:scrapHeld(s.id) }; }).filter(function(r){ return r.n > 0; });

  modal('Scrap held',
    (rows.length
      ? rows.map(function(r){
          return '<div class="card" style="padding:11px 13px;margin-bottom:8px">'+
            '<div class="row"><div class="grow"><div class="ttl">'+
            esc(stockLabel(r.s))+'</div></div>'+
            '<span class="pill p-closed">'+r.n+'</span></div></div>'; }).join('')+
        '<div class="help">Old parts that came back. Sold in bulk, not thrown away.</div>'
      : '<div class="empty">Nothing held.</div>'),
    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(rows.length && can('stock.edit')
        ? [{t:'Sell it',cls:'',f:'sellScrap()'}] : []));
}

function sellScrap(){
  var rows = DB.stock.map(function(s){
    return { s:s, n:scrapHeld(s.id) }; }).filter(function(r){ return r.n > 0; });

  modal('Sell scrap',
    '<div class="field"><label>Sold to</label><input id="scWho"></div>'+
    '<div class="field"><label>Total received</label>'+
      '<input id="scAmt" type="number" inputmode="decimal"></div>'+
    '<div class="sep"></div><label>How many of each</label>'+
    rows.map(function(r){

        ' <span style="font-weight:400;color:var(--ink-3)">up to '+r.n+'</span></label>'+
        '<input class="scN" data-stock="'+r.s.id+'" type="number" '+
        'inputmode="numeric" value="'+r.n+'" min="0" max="'+r.n+'"></div>'; }).join(''),
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},

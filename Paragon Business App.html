/* ============================================================
   MACHINES
   ------------------------------------------------------------
   What each machine is doing: how much it prints, and how often
   it breaks. The two together say things neither says alone.

   A machine printing forty thousand a month with no complaints is
   earning. One printing four thousand with four complaints is
   costing, and that is invisible until they sit in one list.
   ============================================================ */

/* the server keeps the readings; the app keeps a copy to show */
function pullMeters(quiet){
  if(!sharingOn()) return Promise.resolve();
  var since = new Date();
  since.setMonth(since.getMonth() - 1);

  return bridge({ action:'meters', since: since.toISOString().slice(0,10) })
    .then(function(d){
      if(!d || !d.ok) throw new Error((d && d.msg) || 'refused');
      DB.meters = {};
      (d.machines || []).forEach(function(r){
        DB.meters[String(r.key || '').toLowerCase()] = r;
      });
      DB.metersAt = now();
      save();
      if(PAGE === 'fleet') drawFleet();
      if(!quiet) toast((d.machines||[]).length + ' machine(s) read','good');
    })
    .catch(function(e){
      if(!quiet) toast('Could not get the counters: ' + e.message,'bad');
    });
}

function meterFor(m){
  if(!m || !m.serial) return null;
  return (DB.meters || {})[String(m.serial).trim().toLowerCase()] || null;
}

/* pages a day, worked out from the two readings the server kept */
function perDay(r){
  if(!r || !r.base || !r.last) return null;
  var a = new Date(r.base.day), b = new Date(r.last.day);
  var days = Math.round((b - a) / 86400000);
  if(!days || r.used == null) return null;
  return Math.round(r.used / days);
}

function jobsOn(machineId){
  return DB.complaints.filter(function(c){ return c.machine === machineId; });
}
function openJobsOn(machineId){
  return jobsOn(machineId).filter(function(c){
    return c.status !== 'resolved' && c.status !== 'closed'; });
}

/* how often it has come back, over the last three months */
function faultRate(machineId){
  var cut = new Date(Date.now() - 90*86400e3).toISOString();
  return jobsOn(machineId).filter(function(c){
    return String(c.opened||'') >= cut; }).length;
}

var FLEET_SORT = 'busy';
function fleetSort(v){ FLEET_SORT = v; drawFleet(); }

function drawFleet(){
  if(!can('complaint.all')){
    $('flBody').innerHTML = '<div class="empty"><span class="ic">\u{1F512}</span>'+
      'This is for the office.</div>';
    return;
  }

  var rows = DB.machines.map(function(m){
    var r = meterFor(m);
    var c = byId(DB.clients, m.client);
    var k = contractFor(m.id);
    return {
      m:m, c:c, k:k, meter:r,
      open: openJobsOn(m.id).length,
      faults: faultRate(m.id),
      used: r ? r.used : null,
      day: perDay(r),
      last: r && r.last ? r.last : null
    };
  });

  var totalPages = rows.reduce(function(a,r){ return a + (r.used || 0); }, 0);
  var withOpen = rows.filter(function(r){ return r.open; }).length;
  var noRead = rows.filter(function(r){ return !r.last; }).length;

  rows.sort(function(a,b){
    if(FLEET_SORT === 'busy')   return (b.used||-1) - (a.used||-1);
    if(FLEET_SORT === 'faults') return b.faults - a.faults ||
                                       (b.open - a.open);
    if(FLEET_SORT === 'open')   return b.open - a.open;
    if(FLEET_SORT === 'quiet')  return (a.used == null ? 1e9 : a.used) -
                                       (b.used == null ? 1e9 : b.used);
    var an = (a.c && a.c.name) || '', bn = (b.c && b.c.name) || '';
    return an < bn ? -1 : 1;
  });

  $('flBody').innerHTML =
    '<div class="tiles">'+
      tile('b', num(totalPages), 'Pages this month')+
      tile('r', withOpen, 'With an open job')+
      tile('a', noRead, 'Never read')+
      tile('g', DB.machines.length, 'Machines')+
    '</div>'+

    (!sharingOn()
      ? '<div class="note w">Sharing is off, so there are no counters here. '+
        'Turn it on under More \u2192 Paragon server.</div>'
      : DB.metersAt
        ? '<div class="help" style="margin-bottom:10px">Counters as of '+
          esc(dtime(DB.metersAt))+' \u00b7 <a href="#" onclick="pullMeters();'+
          'return false">refresh</a></div>'
        : '<div class="note i">No counters yet. <a href="#" '+
          'onclick="pullMeters();return false">Get them from the server</a>, '+
          'or read them from the console first.</div>')+

    '<div class="strip">'+
      [['busy','Busiest'],['faults','Most faults'],['open','Open jobs'],
       ['quiet','Quietest'],['client','By client']].map(function(f){
        return '<button class="'+(FLEET_SORT===f[0]?'on':'')+
          '" onclick="fleetSort(\''+f[0]+'\')">'+f[1]+'</button>'; }).join('')+
    '</div>'+

    (rows.length ? rows.map(fleetCard).join('')
      : '<div class="empty">No machines yet.</div>');
}

function fleetCard(r){
  var m = r.m, b = BRANDS[(r.c && r.c.brand) || 'paragon'];
  var stale = r.last ? Math.floor((Date.now() - new Date(r.last.at)) / 86400000)
                     : null;

  /* the two things worth seeing together */
  var busy = r.used != null && r.used > 0;
  var sick = r.faults >= 3;

  return '<div class="card tap" onclick="openMachine(\''+m.id+'\')">'+
    '<div style="height:3px;border-radius:2px;background:'+b.c1+
      ';margin:-13px -14px 10px"></div>'+
    '<div class="row"><div class="grow">'+
      '<div class="meta" style="color:'+b.c1+';font-weight:600;margin-bottom:2px">'+
        esc((r.c && r.c.name) || '')+'</div>'+
      '<div class="ttl">'+esc(m.model)+'</div>'+
      '<div class="meta">'+esc(m.serial||'no serial')+
        ([m.place, m.dept].filter(Boolean).length
          ? ' \u00b7 ' + esc([m.place, m.dept].filter(Boolean).join(' \u2014 '))
          : '')+'</div>'+

      '<div class="meta" style="margin-top:6px">'+
        (busy
          ? '<b>'+num(r.used)+'</b> pages this month' +
            (r.day ? ' \u00b7 about ' + num(r.day) + ' a day' : '')
          : r.last
            ? 'no printing recorded this month'
            : '<span style="color:var(--amber)">never read</span>')+
        (r.last && stale > 25
          ? ' \u00b7 <span style="color:var(--amber)">last read '+stale+
            ' days ago</span>' : '')+
      '</div>'+

      '<div class="meta">'+
        (r.k
          ? esc(DEAL_KIND[r.k.kind].label) +
            (contractState(r.k) === 'expired'
              ? ' \u00b7 <span style="color:var(--red)">expired</span>' : '')
          : '<span style="color:var(--amber)">no contract</span>')+
        ' \u00b7 '+r.faults+' fault(s) in 90 days'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">'+
      (r.open ? '<span class="pill p-high">'+r.open+' open</span>' : '')+
      (sick ? '<span class="pill p-pending">breaking often</span>' : '')+
    '</div></div></div>';
}

/* ---------- one machine ---------- */
function openMachine(id){
  var m = byId(DB.machines, id);
  if(!m) return;
  var c = byId(DB.clients, m.client);
  var b = BRANDS[(c && c.brand) || 'paragon'];
  var r = meterFor(m);
  var k = contractFor(m.id);
  var jobs = jobsOn(id).sort(function(a,b2){
    return String(b2.opened||'') < String(a.opened||'') ? -1 : 1; });

  modal(m.model,
    '<div style="background:'+b.c1+';color:#fff;margin:-15px -16px 14px;'+
      'padding:11px 16px"><div style="font-size:15px;font-weight:600">'+
      esc(c?c.name:'')+'</div><div style="font-size:11.5px;opacity:.8">'+
      esc(b.name)+'</div></div>'+

    '<div class="meta" style="margin-bottom:12px">'+esc(m.serial||'no serial')+
      ([m.place,m.dept].filter(Boolean).length
        ? ' \u00b7 '+esc([m.place,m.dept].filter(Boolean).join(' \u2014 ')) : '')+
      '</div>'+
    (m.autoAt ? '<div class="auto-strip">'+
      '\u{1F4E1} <b>Live from machine</b>'+
      (m.autoCounter!=null ? ' \u00b7 Counter '+num(m.autoCounter) : '')+
      (m.autoToner!=null ? ' \u00b7 Toner '+esc(String(m.autoToner))+'%' : '')+
      '<div class="auto-when">'+ago(m.autoAt)+'</div></div>' : '')+

    (r && r.last
      ? '<div class="tiles" style="grid-template-columns:repeat(2,1fr)">'+
          tile('b', num(r.last.total), 'Counter now')+
          tile('g', r.used != null ? num(r.used) : '\u2014', 'Pages this month')+
        '</div>'+
        '<div class="help" style="margin:-4px 0 12px">Read '+
          esc(dtime(r.last.at))+
          (perDay(r) ? ' \u00b7 about '+num(perDay(r))+' pages a day' : '')+
          (r.last.colour != null
            ? ' \u00b7 '+num(r.last.bw)+' black, '+num(r.last.colour)+' colour'
            : '')+'</div>'
      : '<div class="note w">No counter reading. Put its address in the '+
        'console and read it, or the technician writes it down on a '+
        'visit.</div>')+

    (k
      ? '<div class="card tap" onclick="closeModal();openContract(\''+k.id+
        '\')" style="padding:11px 13px"><div class="row"><div class="grow">'+
        '<div class="ttl">'+esc(DEAL_KIND[k.kind].label)+'</div>'+
        '<div class="meta">'+esc(k.no)+' \u00b7 to '+esc(dmy(k.ends))+'</div>'+
        '</div><span class="pill '+C_STATE[contractState(k)].pill+'">'+
        C_STATE[contractState(k)].label+'</span></div></div>'
      : '<div class="note w">No contract on this machine.</div>')+

    '<div class="sep"></div>'+
    '<label>Its history</label>'+
    (jobs.length
      ? jobs.slice(0, 8).map(function(j){
          var s = C_STATUS[j.status];
          return '<div class="card tap" onclick="closeModal();openComplaint(\''+
            j.id+'\')" style="padding:10px 12px;margin-bottom:7px">'+
            '<div class="row"><div class="grow">'+
            '<div style="font-size:13.5px;font-weight:600">'+
              esc(String(j.what||'').slice(0,60))+'</div>'+
            '<div class="meta">'+esc(j.no)+' \u00b7 '+esc(dmy(j.opened))+
              (j.counter ? ' \u00b7 counter '+num(j.counter) : '')+'</div>'+
            '</div><span class="pill '+s.pill+'">'+s.label+'</span></div></div>';
        }).join('') + (jobs.length > 8
          ? '<div class="help">'+(jobs.length-8)+' more before these.</div>' : '')
      : '<div class="help">Nothing has been reported on it.</div>'),

    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(can('complaint.add') && (m.serial||'').trim()
        ? [{t:'Sticker',cls:'ghost',f:"closeModal();stickerPreview('"+id+"','big')"}]
        : [])
      .concat(can('complaint.add')
        ? [{t:'New job',cls:'',f:"closeModal();openComplaintForm(null,'"+
            m.client+"','"+id+"')"}] : []));
}

/* ============================================================
   WHEN THERE IS NO SIGNAL
   ------------------------------------------------------------
   Nothing stops. Every save goes to the device first and the
   server second, so a basement costs you nothing but the delay.

   What matters is that the person can see which it is.
   ============================================================ */

var ONLINE = true;
var LAST_FAIL = '';

/* What the server has not been told about yet. Worked out rather than
   counted as it happens, so it stays right even if a sync dies halfway. */
function unsent(){
  if(!sharingOn()) return 0;
  var since = DB.share.at || '';
  var n = 0;
  ['complaints','clients','machines','quotes','bills','contracts']
    .forEach(function(k){
      (DB[k] || []).forEach(function(r){
        if(r && String(r._at || '') > String(since)) n++;
      });
    });
  return n;
}

function netState(){
  if(!sharingOn()) return 'alone';
  if(!ONLINE) return 'off';
  return unsent() ? 'behind' : 'ok';
}

function drawNet(){
  var el = $('netBar');
  if(!el) return;
  var s = netState(), n = unsent();

  if(s === 'alone' || (s === 'ok' && !n)){ el.className = 'hide'; return; }
  el.className = 'net ' + s;

  el.innerHTML =
    s === 'off'
      ? '<b>No signal.</b> Carry on \u2014 everything is saved on this phone '+
        'and goes by itself when you are back.' +
        (n ? ' <span>' + n + ' waiting</span>' : '')
      : s === 'behind'
        ? '<b>' + n + ' change(s) not sent yet.</b>' +
          ' <span onclick="syncNow()">send now</span>'
        : '';
}

/* the browser tells us, and we check for ourselves before trusting it */
function watchNet(){
  window.addEventListener('online', function(){
    ONLINE = true; drawNet();
    toast('Back online. Sending what is waiting\u2026','good');
    syncNow(true);
  });
  window.addEventListener('offline', function(){
    ONLINE = false; drawNet();
  });
  ONLINE = navigator.onLine !== false;
  drawNet();

  /* A phone on a wifi with no route out still reports itself online, so
     the only honest test is whether the last sync actually worked. */
  setInterval(function(){
    if(sharingOn() && ONLINE && unsent()) syncNow(true);
  }, 60000);
}

function netWorked(){
  ONLINE = true; LAST_FAIL = '';
  drawNet();
}

function netFailed(msg){
  /* A refused request is not a lost signal. The difference matters: one
     of them is worth telling somebody about. */
  if(/NetworkError|Failed to fetch|Load failed|network/i.test(String(msg))){
    ONLINE = false;
  }
  LAST_FAIL = String(msg || '');
  drawNet();
}

/* ---------- what is waiting, in full ---------- */
function unsentList(){
  if(!sharingOn())
    return modal('Sharing is off',
      '<div class="note i">This phone is working on its own. Everything is '+
      'saved here and nothing is sent anywhere.</div>'+
      '<div class="help">Turn sharing on under More \u2192 Paragon server when '+
      'you want the office to see it.</div>',
      [{t:'Close',cls:'ghost',f:'closeModal()'}]);

  var since = DB.share.at || '';
  var rows = [];
  [['complaints','Job'], ['quotes','Quotation'], ['bills','Bill'],
   ['contracts','Contract'], ['clients','Client'], ['machines','Machine']]
    .forEach(function(p){
      (DB[p[0]] || []).forEach(function(r){
        if(r && String(r._at || '') > String(since))
          rows.push({ kind:p[1], what:(r.no || r.name || r.model || ''),
                      at:r._at });
      });
    });
  rows.sort(function(a,b){ return String(b.at) < String(a.at) ? -1 : 1; });

  modal('Waiting to be sent',
    (ONLINE
      ? '<div class="note i">You are online. These should go in a few '+
        'seconds.</div>'
      : '<div class="note w"><b>No signal.</b> These are safe on this phone '+
        'and will go by themselves when you are back. Nothing is lost.</div>')+

    (LAST_FAIL && ONLINE
      ? '<div class="note d">The last attempt said: '+esc(LAST_FAIL)+'</div>'
      : '')+

    (rows.length
      ? rows.slice(0, 30).map(function(r){
          return '<div class="card" style="padding:9px 12px;margin-bottom:6px">'+
            '<div style="font-size:13.5px;font-weight:600">'+esc(r.kind)+
            ' \u00b7 '+esc(r.what)+'</div>'+
            '<div class="meta">changed '+esc(ago(r.at))+'</div></div>'; }).join('')
        + (rows.length > 30
           ? '<div class="help">and '+(rows.length-30)+' more.</div>' : '')
      : '<div class="empty"><span class="ic">\u2713</span>Everything has '+
        'been sent.</div>')+

    (DB.share.at
      ? '<div class="help" style="margin-top:10px">Last sent '+
        esc(dtime(DB.share.at))+'.</div>' : ''),

    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(rows.length ? [{t:'Try now',cls:'',f:'closeModal();syncNow()'}] : []));
}

/* ============================================================
   NUMBERS
   ------------------------------------------------------------
   Each phone counted on its own, so Waqar's phone and Fawad's
   phone could both open PCS-0041 on the same morning. Now the
   server hands out numbers in small batches, and each phone
   keeps a few in hand so it can still number a job with no
   signal.

   A few numbers can go unused \u2014 a phone lost with three in
   hand leaves a gap. A gap is harmless; two jobs with one number
   is not.
   ============================================================ */

var POOL_KEEP = 5;

function numPool(key){
  DB.numPool = DB.numPool || {};
  DB.numPool[key] = DB.numPool[key] || [];
  return DB.numPool[key];
}

/* every series a phone might need, and how the server should shape it */
function numberSeries(){
  if(!can('complaint.add')) return [];         /* a technician numbers nothing */
  var out = [{ key:'job',  prefix:'PCS',   pad:4, start:1 },
             { key:'bill', prefix:'PCS-B', pad:4, start:1 }];
  Object.keys(BRANDS).forEach(function(b){
    out.push({ key:'q-'+b, prefix:BRANDS[b].prefix, pad:4, start:1 });
    var base = BRANDS[b].prefix.replace('-Q','');
    Object.keys(DEAL_KIND).forEach(function(k){
      var pre = base + '-' + DEAL_KIND[k].abbr;
      out.push({ key:'k-'+pre, prefix:pre, pad:4, start:1024 });
    });
  });
  /* ASC with and without parts share a prefix, so they share a series */
  var seen = {};
  return out.filter(function(s){
    if(seen[s.key]) return false;
    seen[s.key] = 1; return true;
  });
}

function topUpNumbers(){
  if(!sharingOn()) return;
  numberSeries().forEach(function(s){
    var pool = numPool(s.key);
    var want = POOL_KEEP - pool.length;
    if(want <= 0) return;
    bridge({ action:'number', prefix:s.prefix, sep:'-', pad:s.pad,
             start:s.start, count:want })
      .then(function(d){
        if(d && d.ok && d.numbers){
          var p = numPool(s.key);
          d.numbers.forEach(function(x){ if(p.indexOf(x) === -1) p.push(x); });
          save();
        }
      }).catch(function(){});
  });
}

/* A number from the batch in hand. With sharing off the phone is the only
   one counting, so its own counter is safe. With sharing on and the batch
   used up offline, the phone's own tag goes in, so it still cannot clash. */
function takeNumber(key, prefix, localNext, pad){
  var pool = numPool(key);
  if(pool.length){
    var n = pool.shift();
    save();
    if(pool.length < 2) setTimeout(topUpNumbers, 500);
    return n;
  }
  var local = prefix + '-' + String(localNext()).padStart(pad, '0');
  if(!sharingOn()) return local;
  var tag = String(DB.share.pc || 'x').replace(/^pc-/, '').slice(0,3).toUpperCase();
  return prefix + '-' + tag + String(localNext()).padStart(pad, '0');
}

/* ============================================================
   THE PHONE'S OWN NOTIFICATIONS
   ------------------------------------------------------------
   In a browser the bell can only wait to be opened. Inside the
   APK there is an Android side that can make the phone ring, and
   this is what hands it the notes.

   Two routes, and the Android side makes sure a note never rings
   twice between them:
     the app open or recently used  \u2014 at once, as the note arrives
     the app closed                 \u2014 Android checks the server
                                      itself, every fifteen minutes

   Outside the APK none of this exists, and nothing here pretends
   it does: the bell carries on as before.
   ============================================================ */

function onPhone(){
  return !!(window.Android && typeof Android.notify === 'function');
}

/* The first time, everything already there is treated as seen. Installing
   the app should not greet a person with forty notifications from last
   month. */
function phoneNotify(){
  if(!onPhone() || !ME) return;
  var first = !DB.phoned;
  DB.phoned = DB.phoned || {};
  var quiet = !!mutedUntil();
  var dayAgo = new Date(Date.now() - 48*3600e3).toISOString();

  (DB.notes || []).forEach(function(n){
    if(n.to !== ME.id || n.read || DB.phoned[n.id]) return;
    DB.phoned[n.id] = 1;
    if(first || quiet) return;                 /* seen, or asked for quiet */
    if(String(n.at || '') < dayAgo) return;    /* too old to ring about */
    try {
      Android.notify(String(n.id), String(n.what || 'Paragon'),
                     String(n.detail || ''), String(n.link || ''));
    } catch(e){}
  });

  /* this only needs to remember recent ones */
  var ids = Object.keys(DB.phoned);
  if(ids.length > 800) ids.slice(0, ids.length - 500)
    .forEach(function(k){ delete DB.phoned[k]; });
  save();
}

/* What the Android side needs to check the server on its own while the app
   is closed: where the server is, the secret, and whose notes to ask for. */
function phoneConfig(){
  if(!onPhone() || typeof Android.setConfig !== 'function') return;
  try {
    Android.setConfig(
      sharingOn() ? String(DB.share.url || '') : '',
      String(DB.share.key || ''),
      ME ? String(ME.id) : '',
      String(mutedUntil() || ''));
  } catch(e){}
}

/* App khula hote hue: server se meri nayi notes le kar phone par foran ring karo.
   Chat message 15 minute ke background worker ka intezar na kare. */
var _lastNotePull = 0;
function pullNotesNow(){
  if(!sharingOn() || !ME) return;
  if(Date.now() - _lastNotePull < 8000) return;   /* thodi der mein baar baar nahi */
  _lastNotePull = Date.now();
  bridge({ action:'pull' }).then(function(d){
    if(!d || !d.ok) return;
    var remote = d.notes || {};
    DB.notes = DB.notes || [];
    var have = {}; DB.notes.forEach(function(x){ if(x && x.id) have[x.id] = 1; });
    var added = false;
    Object.keys(remote).forEach(function(id){
      if(!have[id] && remote[id] && typeof remote[id] === 'object'){ DB.notes.push(remote[id]); added = true; }
    });
    if(added){
      save();
      /* App khula hote hue bhi ek halki beep + buzz \u2014 jaise WhatsApp mein
         aati hai, taake message foran pata chale. */
      var chatCame = Object.keys(remote).some(function(id){
        return remote[id] && String(remote[id].link||'').indexOf('chat:') === 0 && !have[id]; });
      if(chatCame){
        try { if(typeof tapTick === 'function'){ tapTick('key'); setTimeout(function(){ tapTick('tap'); }, 90); } } catch(e){}
        try { if(navigator.vibrate) navigator.vibrate([0,60,40,60]); } catch(e){}
      }
      try { phoneNotify(); } catch(e){}
      draw && draw();
    }
  }).catch(function(){});
}

/* Tapping a notification opens the job it is about, not the home screen. */
function openFromPhone(link){
  if(!ME || !link) return;
  if(String(link).indexOf('chat:') === 0) return chatOpen(String(link).slice(5));
  if(byId(DB.complaints, link)) return openComplaint(link);
  if(byId(DB.contracts || [], link)) return openContract(link);
  if(byId(DB.quotes || [], link)) return openQuote(link);
}

/* ============================================================
   IMPORT FROM EXCEL
   ------------------------------------------------------------
   Three lists: clients, machines, the store. In that order,
   because a machine belongs to a client and a part can name the
   models it fits.

   Nothing is saved until the person has seen what will happen:
   how many are new, how many update one already there, and every
   row left out with the reason. A guess that quietly loads fifty
   wrong rows is far worse than a list that says "row 14: no
   serial number".
   ============================================================ */

var IMPORT_KINDS = {
  clients: {
    label: 'Clients',
    cols: ['Name', 'Company', 'Arrangement', 'Place', 'Phone',
           'Contact person', 'Contact phone', 'NTN', 'STRN'],
    example: ['CMC Pvt Ltd', 'Paragon', 'Cash', 'SITE Area, Karachi',
              '021-32561234', 'Mr Asif', '0300 1234567', '', ''],
    must: ['Name']
  },
  machines: {
    label: 'Machines',
    cols: ['Client', 'Model', 'Serial', 'Department', 'Floor or room',
           'IP address', 'Rate per copy', 'Free copies'],
    example: ['CMC Pvt Ltd', 'Ricoh MP 3055', 'W881P300145', 'Accounts',
              '1st floor', '192.168.1.50', '', ''],
    must: ['Client', 'Model', 'Serial']
  },
  stock: {
    label: 'Store',
    cols: ['Code', 'Name', 'Quality', 'Kind', 'Opening stock', 'Minimum',
           'Cost', 'Fits'],
    example: ['P0001', 'Drum', 'CET', 'Spare part', '10', '3', '8500',
              'Ricoh MP 3055, Ricoh MP 5055'],
    must: ['Name']
  }
};

/* ---------- reading a CSV ----------
   Quotes, commas inside quotes, doubled quotes and both kinds of line
   ending, because that is what Excel actually writes. */
function parseCSV(text){
  text = String(text || '').replace(/^\uFEFF/, '');     /* Excel's UTF-8 mark */
  var sep = ',';
  var first = text.split(/\r?\n/)[0] || '';
  if(first.split(';').length > first.split(',').length) sep = ';';
  if(first.split('\t').length > first.split(sep).length) sep = '\t';

  var rows = [], row = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += ch;
      continue;
    }
    if(ch === '"'){ q = true; continue; }
    if(ch === sep){ row.push(cell); cell = ''; continue; }
    if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
      continue;
    }
    cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  /* Blank lines are kept, so that "row 14" in a message is row 14 in Excel. */
  return rows;
}

/* ---------- reading an Excel file ----------
   An .xlsx is a zip of XML files. The first sheet and its shared strings
   are read out directly, so nobody has to "save as CSV" first. */
function readXLSX(buf){
  var u = new Uint8Array(buf);
  var dv = new DataView(buf);

  /* find the zip's table of contents at the end */
  var eocd = -1;
  for(var i = u.length - 22; i >= Math.max(0, u.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) return Promise.reject(new Error('That is not an Excel file'));

  var count = dv.getUint16(eocd + 10, true);
  var at = dv.getUint32(eocd + 16, true);
  var entries = {};
  for(var n = 0; n < count; n++){
    if(dv.getUint32(at, true) !== 0x02014b50) break;
    var method = dv.getUint16(at + 10, true);
    var csize = dv.getUint32(at + 20, true);
    var nlen = dv.getUint16(at + 28, true);
    var xlen = dv.getUint16(at + 30, true);
    var clen = dv.getUint16(at + 32, true);
    var local = dv.getUint32(at + 42, true);
    var name = new TextDecoder().decode(u.subarray(at + 46, at + 46 + nlen));
    entries[name] = { method:method, csize:csize, local:local };
    at += 46 + nlen + xlen + clen;
  }

  function file(name){
    var e = entries[name];
    if(!e) return Promise.resolve(null);
    var l = e.local;
    var start = l + 30 + dv.getUint16(l + 26, true) + dv.getUint16(l + 28, true);
    var data = u.subarray(start, start + e.csize);
    if(e.method === 0) return Promise.resolve(new TextDecoder().decode(data));
    if(e.method !== 8) return Promise.reject(new Error('That Excel file is packed in a way this cannot read'));
    var ds = new DecompressionStream('deflate-raw');
    var out = new Blob([data]).stream().pipeThrough(ds);
    return new Response(out).text();
  }

  /* the first sheet in the workbook's own order */
  return file('xl/workbook.xml').then(function(wb){
    return file('xl/_rels/workbook.xml.rels').then(function(rels){
      var target = 'xl/worksheets/sheet1.xml';
      if(wb && rels){
        var doc = new DOMParser().parseFromString(wb, 'application/xml');
        var s = doc.getElementsByTagName('sheet')[0];
        var rid = s && (s.getAttribute('r:id') ||
                        s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
        var rd = new DOMParser().parseFromString(rels, 'application/xml');
        Array.prototype.forEach.call(rd.getElementsByTagName('Relationship'), function(r){
          if(r.getAttribute('Id') === rid){
            var t = r.getAttribute('Target').replace(/^\/?xl\//, '');
            target = 'xl/' + t.replace(/^\//, '');
          }
        });
      }
      return Promise.all([file(target), file('xl/sharedStrings.xml')]);
    });
  }).then(function(parts){
    var sheet = parts[0], shared = parts[1];
    if(!sheet) throw new Error('No sheet found in that Excel file');

    var strings = [];
    if(shared){
      var sd = new DOMParser().parseFromString(shared, 'application/xml');
      Array.prototype.forEach.call(sd.getElementsByTagName('si'), function(si){
        var ts = si.getElementsByTagName('t'), s = '';
        for(var k = 0; k < ts.length; k++) s += ts[k].textContent;
        strings.push(s);
      });
    }

    var doc = new DOMParser().parseFromString(sheet, 'application/xml');
    var rows = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('row'), function(r){
      /* Excel leaves empty rows out of the file entirely, so each row is put
         back at its own number \u2014 otherwise every row after a gap would
         be reported one too early. */
      var rn = parseInt(r.getAttribute('r'), 10);
      if(rn > 0) while(rows.length < rn - 1) rows.push([]);
      var row = [];
      Array.prototype.forEach.call(r.getElementsByTagName('c'), function(c){
        var ref = c.getAttribute('r') || '';
        var col = 0, m = ref.match(/^[A-Z]+/);
        if(m) for(var k = 0; k < m[0].length; k++) col = col*26 + (m[0].charCodeAt(k) - 64);
        col = col ? col - 1 : row.length;
        var t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        var val = '';
        if(t === 's' && v) val = strings[parseInt(v.textContent, 10)] || '';
        else if(t === 'inlineStr'){
          var is = c.getElementsByTagName('t'); for(var j = 0; j < is.length; j++) val += is[j].textContent;
        }
        else if(v) val = v.textContent;
        while(row.length < col) row.push('');
        row[col] = val;
      });
      rows.push(row);
    });
    return rows;
  });
}

/* ---------- matching what people actually type ---------- */
function norm(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g,' '); }

function pickBrand(s){
  var v = norm(s);
  if(!v) return 'paragon';
  if(v.indexOf('house') > -1 || v === 'ch') return 'house';
  if(v.indexOf('star') > -1 || v === 'cs') return 'star';
  if(v.indexOf('paragon') > -1 || v === 'pcs') return 'paragon';
  return null;
}

function pickDeal(s){
  var v = norm(s);
  if(!v) return 'cash';
  if(v.indexOf('rent') > -1) return 'rental';
  if(v.indexOf('without') > -1) return 'ascWithout';
  if(v.indexOf('asc') > -1 || v.indexOf('with') > -1) return 'ascWith';
  if(v.indexOf('cash') > -1) return 'cash';
  return null;
}

function pickKind(s){
  var v = norm(s);
  if(!v) return 'part';
  if(v.indexOf('consum') > -1 || v.indexOf('toner') > -1) return 'consumable';
  if(v.indexOf('tool') > -1) return 'tool';
  if(v.indexOf('part') > -1 || v.indexOf('spare') > -1) return 'part';
  return null;
}

function numOr(s, d){
  var n = parseFloat(String(s == null ? '' : s).replace(/,/g, ''));
  return isNaN(n) ? d : n;
}

/* Header names are matched loosely: "Serial No.", "serial number" and
   "SERIAL" all mean Serial, and the order of the columns does not matter.
   Exact names are tried first, then the known other names for each column,
   and only then a loose word match \u2014 so "Contact Phone" is never taken
   for Phone just because it has the word in it. */
var HEAD_ALIASES = {
  'Name':           ['client name','customer','customer name','party','party name','part name','part','item','item name','description'],
  'Company':        ['brand','company name','our company','firm'],
  'Arrangement':    ['type','deal','contract','contract type','agreement','service type'],
  'Place':          ['address','location','area','city'],
  'Phone':          ['phone','phone no','phone number','telephone','tel','landline','office phone'],
  'Contact person': ['contact','contact name','person','focal person','attention'],
  'Contact phone':  ['contact mobile','contact phone','contact no','contact number','mobile','cell','whatsapp'],
  'NTN':            ['ntn no','ntn number'],
  'STRN':           ['strn no','strn number','gst','gst no','sales tax'],
  'Client':         ['client name','customer','customer name','party','company'],
  'Model':          ['machine model','model no','model name','machine'],
  'Serial':         ['serial no','serial number','sr no','s no','machine serial'],
  'Department':     ['dept','department name','section'],
  'Floor or room':  ['floor','room','location','place','site'],
  'IP address':     ['ip','ip addr','network address'],
  'Rate per copy':  ['rate','per copy','copy rate','rate per print'],
  'Free copies':    ['free','free prints','copies included','included copies'],
  'Code':           ['part code','part no','part number','item code','sku'],
  'Quality':        ['grade','make','brand'],
  'Kind':           ['type','category','part type'],
  'Opening stock':  ['opening','qty','quantity','stock','in hand','balance','on hand'],
  'Minimum':        ['min','minimum stock','reorder','reorder level'],
  'Cost':           ['price','rate','unit cost','purchase price','cost price'],
  'Fits':           ['compatible','compatible with','models','fits models','for model']
};

function mapHeaders(kind, head){
  var want = IMPORT_KINDS[kind].cols, map = {}, used = {};
  var hs = head.map(function(h){
    return norm(h).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); });

  function take(c, test){
    if(map[c] !== undefined) return;
    for(var i = 0; i < hs.length; i++){
      if(used[i] || !hs[i]) continue;
      if(test(hs[i])){ map[c] = i; used[i] = 1; return; }
    }
  }
  /* 1. the column's own name */
  want.forEach(function(c){ var w = norm(c); take(c, function(v){ return v === w; }); });
  /* 2. the names people use for it */
  want.forEach(function(c){
    var al = HEAD_ALIASES[c] || [];
    take(c, function(v){ return al.indexOf(v) > -1; });
  });
  /* 3. loosely: the name as a whole word inside a longer heading */
  want.forEach(function(c){
    var w = norm(c);
    take(c, function(v){ return (' ' + v + ' ').indexOf(' ' + w + ' ') > -1; });
  });
  return map;
}

/* ---------- working out what would happen ---------- */
function blankRow(r){ return !r || !r.some(function(c){ return String(c == null ? '' : c).trim(); }); }

function planImport(kind, rows){
  /* The heading is the row that actually names the columns \u2014 not a title
     like "PARAGON CLIENT LIST" sitting above it. The first dozen rows are
     tried, and the one that finds the required columns wins. */
  var must = IMPORT_KINDS[kind].must, h0 = -1, best = -1, bestHits = -1;
  for(var i = 0, looked = 0; i < rows.length && looked < 12; i++){
    if(blankRow(rows[i])) continue;
    looked++;
    var mm = mapHeaders(kind, rows[i]);
    var hits = Object.keys(mm).length;
    if(must.every(function(c){ return mm[c] !== undefined; })){ h0 = i; break; }
    if(hits > bestHits){ bestHits = hits; best = i; }
  }
  if(h0 < 0) h0 = best;
  if(h0 < 0) return { error:'That file is empty.' };
  if(!rows.slice(h0 + 1).some(function(r){ return !blankRow(r); }))
    return { error:'The file has a header row but nothing under it.' };
  var head = rows[h0], map = mapHeaders(kind, head);
  var missing = IMPORT_KINDS[kind].must.filter(function(c){ return map[c] === undefined; });
  if(missing.length)
    return { error:'These columns are missing: ' + missing.join(', ') +
      '. Download the template to see the headings it expects.' };

  function get(r, c){ return map[c] === undefined ? '' : String(r[map[c]] == null ? '' : r[map[c]]).trim(); }

  var plan = { kind:kind, add:[], update:[], skip:[] };
  var seen = {};

  rows.forEach(function(r, idx){
    if(idx <= h0 || blankRow(r)) return;
    var line = idx + 1;                          /* as Excel numbers it */
    if(kind === 'clients'){
      var name = get(r,'Name');
      if(!name) return plan.skip.push({ line:line, why:'no name' });
      var key = norm(name);
      if(seen[key]) return plan.skip.push({ line:line, why:'"'+name+'" is in the file twice' });
      seen[key] = 1;
      var brand = pickBrand(get(r,'Company'));
      if(!brand) return plan.skip.push({ line:line, why:'company "'+get(r,'Company')+'" is not one of the three' });
      var deal = pickDeal(get(r,'Arrangement'));
      if(!deal) return plan.skip.push({ line:line, why:'arrangement "'+get(r,'Arrangement')+'" is not rental, ASC or cash' });
      var rec = { name:name, brand:brand, deal:deal, place:get(r,'Place'),
                  phone:get(r,'Phone'), ntn:get(r,'NTN'), strn:get(r,'STRN'),
                  person:get(r,'Contact person'), personPhone:get(r,'Contact phone') };
      var have = DB.clients.filter(function(c){ return norm(c.name) === key; })[0];
      (have ? plan.update : plan.add).push({ line:line, rec:rec, have:have });
    }

    if(kind === 'machines'){
      var serial = get(r,'Serial'), model = get(r,'Model'), cname = get(r,'Client');
      if(!serial) return plan.skip.push({ line:line, why:'no serial number \u2014 stickers, counters and contracts all hang off it' });
      if(!model) return plan.skip.push({ line:line, why:'no model' });
      var skey = norm(serial);
      if(seen[skey]) return plan.skip.push({ line:line, why:'serial '+serial+' is in the file twice' });
      seen[skey] = 1;
      var client = DB.clients.filter(function(c){ return norm(c.name) === norm(cname); })[0];
      if(!client) return plan.skip.push({ line:line, why:'no client called "'+cname+'" \u2014 import the clients first' });
      var mrec = { client:client.id, model:model, serial:serial,
                   dept:get(r,'Department'), place:get(r,'Floor or room'),
                   ip:get(r,'IP address'),
                   rate:get(r,'Rate per copy') === '' ? undefined : numOr(get(r,'Rate per copy'), undefined),
                   free:get(r,'Free copies') === '' ? undefined : numOr(get(r,'Free copies'), undefined) };
      var mh = DB.machines.filter(function(m){ return norm(m.serial) === skey; })[0];
      if(mh && mh.client !== client.id)
        return plan.skip.push({ line:line, why:'serial '+serial+' is already on '+
          nameOf(DB.clients, mh.client)+' \u2014 move it by hand if it really changed hands' });
      (mh ? plan.update : plan.add).push({ line:line, rec:mrec, have:mh });
    }

    if(kind === 'stock'){
      var pname = get(r,'Name'), code = get(r,'Code');
      if(!pname) return plan.skip.push({ line:line, why:'no part name' });
      var pkey = norm(code || pname + '|' + get(r,'Quality'));
      if(seen[pkey]) return plan.skip.push({ line:line, why:(code||pname)+' is in the file twice' });
      seen[pkey] = 1;
      var pk = pickKind(get(r,'Kind'));
      if(!pk) return plan.skip.push({ line:line, why:'kind "'+get(r,'Kind')+'" is not spare part, consumable or tool' });
      var fits = get(r,'Fits').split(/[,;\/]/).map(function(s){ return s.trim(); }).filter(Boolean);
      var srec = { code:code, name:pname, quality:get(r,'Quality'), kind:pk,
                   opening:numOr(get(r,'Opening stock'), 0),
                   min:numOr(get(r,'Minimum'), 0), cost:numOr(get(r,'Cost'), 0),
                   fits:fits };
      var sh = DB.stock.filter(function(s){
        return s.active !== false && (code ? norm(s.code) === norm(code)
          : norm(s.name) === norm(pname) && norm(s.quality) === norm(get(r,'Quality'))); })[0];
      (sh ? plan.update : plan.add).push({ line:line, rec:srec, have:sh });
    }
  });
  return plan;
}

/* ---------- doing it ---------- */
function applyImport(plan){
  var stamp = now(), n = 0;

  plan.add.concat(plan.update).forEach(function(p){
    var r = p.rec, h = p.have;

    if(plan.kind === 'clients'){
      var c = h || { id:uid(), active:true, people:[] };
      c.name = r.name; c.brand = r.brand; c.deal = r.deal;
      /* a blank cell leaves what was there alone */
      ['place','phone','ntn','strn'].forEach(function(f){ if(r[f]) c[f] = r[f]; });
      if(r.person || r.personPhone){
        c.people = c.people || [];
        var dup = c.people.some(function(x){
          return norm(x.name) === norm(r.person) ||
                 (r.personPhone && String(x.phone).replace(/\D/g,'') === r.personPhone.replace(/\D/g,'')); });
        if(!dup) c.people.push({ name:r.person || 'Contact', role:'', phone:r.personPhone });
      }
      c._at = stamp;
      if(!h) DB.clients.push(c);
    }

    if(plan.kind === 'machines'){
      var m = h || { id:uid() };
      m.client = r.client; m.model = r.model; m.serial = r.serial;
      ['dept','place','ip'].forEach(function(f){ if(r[f]) m[f] = r[f]; });
      if(r.rate !== undefined) m.rate = r.rate;
      if(r.free !== undefined) m.free = r.free;
      m._at = stamp;
      if(!h) DB.machines.push(m);
    }

    if(plan.kind === 'stock'){
      var s = h || { id:uid(), active:true, purchased:0 };
      s.code = r.code; s.name = r.name; s.quality = r.quality; s.kind = r.kind;
      s.min = r.min; if(r.cost) s.cost = r.cost;
      if(r.fits.length) s.fits = r.fits;
      /* Opening stock is written only on a new part. On one already in
         use, the shelf is worked out from what has happened since, and
         changing its starting point would quietly rewrite every figure. */
      if(!h) s.opening = r.opening;
      s._at = stamp;
      if(!h) DB.stock.push(s);
    }
    n++;
  });

  logIt('import', 'Imported ' + IMPORT_KINDS[plan.kind].label.toLowerCase(),
        plan.add.length + ' new, ' + plan.update.length + ' updated, ' +
        plan.skip.length + ' left out');
  save(); draw();
  if(sharingOn()) syncSoon();
  return n;
}

function importTemplate(kind){          /* CSV template */
  var k = IMPORT_KINDS[kind];
  function q(s){ s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
  var csv = '\uFEFF' + k.cols.map(q).join(',') + '\r\n' + k.example.map(q).join(',') + '\r\n';
  saveText('paragon-' + kind + '-template.csv', csv, 'text/csv');
}
function importTemplateXlsx(kind){      /* Excel (.xlsx) template */
  var k = IMPORT_KINDS[kind];
  var blob = makeXlsx([k.cols, k.example.map(String)]);
  saveBlob('paragon-' + kind + '-template.xlsx', blob);
}

/* A minimal, valid .xlsx from rows of strings \u2014 no library needed.
   It writes the few parts Excel needs, zipped with stored (no compression). */
function makeXlsx(rows){
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function(row, r){
    sheet += '<row r="' + (r+1) + '">';
    row.forEach(function(cell, c){
      var ref = String.fromCharCode(65 + c) + (r+1);
      sheet += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + esc(cell) + '</t></is></c>';
    });
    sheet += '</row>';
  });
  sheet += '</sheetData></worksheet>';
  var files = {
    '[Content_Types].xml':
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
    '_rels/.rels':
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels':
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
    'xl/worksheets/sheet1.xml': sheet
  };
  return zipStore(files);
}

/* A ZIP with stored (uncompressed) entries \u2014 enough for small text files. */
function zipStore(files){
  var enc = new TextEncoder();
  function crc32(bytes){
    var c, crc = 0xFFFFFFFF;
    for(var i=0;i<bytes.length;i++){ c = (crc ^ bytes[i]) & 0xFF;
      for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crc = (crc >>> 8) ^ c; }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  var chunks = [], central = [], offset = 0;
  function u16(n){ return [n & 255, (n>>8)&255]; }
  function u32(n){ return [n & 255, (n>>8)&255, (n>>16)&255, (n>>24)&255]; }
  Object.keys(files).forEach(function(name){
    var nameB = enc.encode(name), data = enc.encode(files[name]);
    var crc = crc32(data);
    var local = [].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0));
    chunks.push(new Uint8Array(local), nameB, data);
    var cen = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset));
    central.push(new Uint8Array(cen), nameB);
    offset += local.length + nameB.length + data.length;
  });
  var cenStart = offset, cenSize = 0;
  central.forEach(function(c){ cenSize += c.length; });
  var eocd = [].concat(u32(0x06054b50), u16(0), u16(0),
    u16(Object.keys(files).length), u16(Object.keys(files).length),
    u32(cenSize), u32(cenStart), u16(0));
  var parts = chunks.concat(central); parts.push(new Uint8Array(eocd));
  return new Blob(parts, { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function saveBlob(name, blob){
  if(window.Android && typeof Android.saveBinary === 'function'){
    var rd = new FileReader();
    rd.onload = function(){
      var b64 = String(rd.result).split(',')[1] || '';
      Android.saveBinary(name, b64, blob.type || 'application/octet-stream');
    };
    rd.readAsDataURL(blob); return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Downloaded ' + name, 'good');
}

/* one way to hand a person a file, in a browser or inside the APK */
function saveText(name, text, type){
  if(window.Android && typeof Android.saveFileTyped === 'function'){
    Android.saveFileTyped(name, text, type || 'text/plain');   /* sahi type se save */
    return;
  }
  if(window.Android && typeof Android.saveFile === 'function'){
    Android.saveFile(name, text);
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Downloaded ' + name, 'good');
}

function importPick(kind){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    $('imPreview').innerHTML = '<div class="help">Reading ' + esc(f.name) + '\u2026</div>';
    var r = new FileReader();
    var isX = /\.xlsx$/i.test(f.name);
    r.onload = function(){
      (isX ? readXLSX(r.result) : Promise.resolve(parseCSV(r.result)))
        .then(function(rows){ showPlan(kind, planImport(kind, rows), f.name); })
        .catch(function(e){
          $('imPreview').innerHTML = '<div class="note d">Could not read that file: '+
            esc(e.message)+'. If it is an old .xls, open it in Excel and save it '+
            'as .xlsx or .csv.</div>';
        });
    };
    if(isX) r.readAsArrayBuffer(f); else r.readAsText(f);
  };
  inp.click();
}

function showPlan(kind, plan, fname){
  _plan = plan;
  if(plan.error){
    $('imPreview').innerHTML = '<div class="note d">'+esc(plan.error)+'</div>';
    return;
  }
  var total = plan.add.length + plan.update.length;
  function label(p){
    var r = p.rec;
    if(kind === 'clients') return r.name + ' \u00b7 ' + BRANDS[r.brand].name;
    if(kind === 'machines') return r.model + ' \u00b7 ' + r.serial + ' \u00b7 ' + nameOf(DB.clients, r.client);
    return [r.code, r.name, r.quality].filter(Boolean).join('-') +
           (p.have ? '' : ' \u00b7 ' + r.opening + ' on the shelf');
  }

  $('imPreview').innerHTML =
    '<div class="sep"></div>'+
    '<label>'+esc(fname)+'</label>'+
    '<div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-top:8px">'+
      tile('g', plan.add.length, 'New')+
      tile('b', plan.update.length, 'Update one already there')+
      tile('r', plan.skip.length, 'Left out')+
    '</div>'+

    (plan.skip.length
      ? '<div class="note w"><b>Left out, and why:</b><br>'+
        plan.skip.slice(0,25).map(function(s){
          return 'Row ' + s.line + ' \u2014 ' + esc(s.why); }).join('<br>')+
        (plan.skip.length > 25 ? '<br>and ' + (plan.skip.length-25) + ' more' : '')+
        '<div style="margin-top:6px">Fix those rows in the file and import it again; '+
        'the ones already in will just be updated.</div></div>' : '')+

    (kind === 'stock' && plan.update.length
      ? '<div class="note i">For parts already in the store the opening stock is '+
        '<b>not</b> changed \u2014 the shelf is worked out from what has happened '+
        'since. Change it by hand if you really mean to.</div>' : '')+

    (total
      ? '<div class="help" style="margin-bottom:8px">First few:<br>'+
        plan.add.concat(plan.update).slice(0,6).map(function(p){
          return (p.have ? '\u21bb ' : '+ ') + esc(label(p)); }).join('<br>')+'</div>'+
        '<button class="btn green" onclick="doImport()">Import '+total+' '+
        IMPORT_KINDS[kind].label.toLowerCase()+'</button>'
      : '<div class="note d">Nothing in that file can be imported.</div>');
}

function doImport(){
  if(!_plan || _plan.error) return;
  var n = applyImport(_plan);
  var k = _plan.kind;
  _plan = null;
  $('imPreview').innerHTML = '<div class="note g"><b>' + n + ' ' +
    IMPORT_KINDS[k].label.toLowerCase() + ' imported.</b>' +
    (k === 'clients' ? ' Next: the machines.' : k === 'machines' ? ' Next: the store.' : '') +
    '</div>';
  toast(n + ' imported', 'good');
}

function perfReport(uid){
  if(uid !== ME.id && ME.role !== 'admin' && ME.role !== 'supervisor')
    return toast('You can see your own report','bad');
  var u = byId(DB.users, uid); if(!u) return;
  var month = today().slice(0, 7);
  var name = (month.slice(5) === today().slice(5,7)) ? 'this month' : month;

  /* is mahine ki complaints jo is tech ki thin */
  var mine = DB.complaints.filter(function(c){
    return c.tech === uid && String(c.opened || '').slice(0,7) === month; });
  var done = mine.filter(function(c){ return c.status === 'resolved'; });
  var openNow = openJobs().filter(function(c){ return c.tech === uid; });

  /* kitni jaldi \u2014 open se resolve tak, ghanton mein (kaam ke ghante nahi, saada) */
  var times = done.filter(function(c){ return c.opened && c.resolved; })
    .map(function(c){ return (new Date(c.resolved) - new Date(c.opened)) / 3600000; })
    .filter(function(h){ return h >= 0 && h < 24*30; });
  var avg = times.length ? Math.round(times.reduce(function(a,b){ return a+b; },0) / times.length) : null;
  var sameDay = done.filter(function(c){
    return c.opened && c.resolved && String(c.opened).slice(0,10) === String(c.resolved).slice(0,10); }).length;

  /* parts is mahine lagaye */
  var fitted = DB.parts.filter(function(p){
    return p.by === uid && q(p,'installed') > 0 &&
      String(p.at || '').slice(0,7) === month; })
    .reduce(function(a,p){ return a + q(p,'installed'); }, 0);

  perfDraw(u, {
    month: name, jobs: mine.length, done: done.length, openNow: openNow.length,
    avg: avg, sameDay: sameDay, fitted: fitted, doneList: done
  });
}

function perfBar(label, value, max, colour){

  return '<div class="pf-bar"><div class="pf-bl"><span>' + label + '</span><b>' + value + '</b></div>'+
    '<div class="pf-track"><div class="pf-fill" style="width:' + pct + '%;background:' + colour + '"></div></div></div>';

/* ============================================================
   TAP AND TYPING FEEDBACK
   ============================================================ */

var _sndOn = (function(){ try { return sGet('paragon-sound') !== 'off'; } catch(e){ return true; } })();
var _audioCtx = null;

function soundOn(){ return _sndOn; }
function soundToggle(){
  _sndOn = !_sndOn;
  try { sSet('paragon-sound', _sndOn ? 'on' : 'off'); } catch(e){}
  if(_sndOn) tapTick();
  if(typeof drawMore === 'function' && PAGE === 'more') drawMore();
  toast(_sndOn ? 'Sound on' : 'Sound off', 'good');
}

/* a short, soft tick \u2014 like a keyboard key */
function tapTick(kind){
  if(!_sndOn) return;
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume();
    var o = _audioCtx.createOscillator(), g = _audioCtx.createGain(), now = _audioCtx.currentTime;
    o.type = 'sine';
    o.frequency.value = kind === 'key' ? 620 : 420;      /* type thoda ooncha, tap neecha */
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(kind === 'key' ? 0.05 : 0.09, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    o.connect(g); g.connect(_audioCtx.destination);
    o.start(now); o.stop(now + 0.07);
  } catch(e){}
}
function tapBuzz(ms){
  if(!_sndOn) return;
  try { if(navigator.vibrate) navigator.vibrate(ms || 8); } catch(e){}
}

/* one place that hears every tap and keypress */
function soundWire(){
  /* a tap on anything you can press */
  document.addEventListener('click', function(e){
    var t = e.target;
    if(t.closest && t.closest('button, .btn, .tap, .card.tap, .db-act, .g, .row.tap, .ci-opt, a, [onclick]')){
      tapTick('tap'); tapBuzz(8);
    }
  }, true);
  /* a tick as you type */
  document.addEventListener('input', function(e){
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && t.type !== 'range' && t.type !== 'checkbox'){
      tapTick('key'); tapBuzz(5);
    }
  }, true);
}

function clientProfitRun(){
  var clientId = $('cpfClient').value;
  var month = $('cpfMonth').value || today().slice(0,7);
  /* received us mahine mein \\u2014 server se (payments confirmed) */
  mCall({ action:'received', client:clientId, month:month }, function(r){
    var received = (r && r.ok) ? (r.received || 0) : 0;
    clientProfitDraw(clientId, month, received);
  });
}

function clientProfitDraw(clientId, month, received){
  var c = byId(DB.clients, clientId); if(!c) return;
  var visitRate = costRate('visitCharge');
  var defDep = costRate('depMonths');

  /* us client ke machines */
  var machines = DB.machines.filter(function(m){ return m.client === clientId && !m.cancelled; });
  var machineIds = machines.map(function(m){ return m.id; });

  /* VISITS \\u2014 us mahine mein us client par resolved complaints (har ek = ek visit) */
  var visits = DB.complaints.filter(function(x){
    return x.client === clientId && x.status === 'resolved' &&
           String(x.resolved || '').slice(0,7) === month; }).length;
  var visitCost = visits * visitRate;

  /* PARTS + TONER \\u2014 us mahine mein us client ke machines par lage (installed) */
  var partsCost = 0, tonerCost = 0;
  DB.parts.forEach(function(p){
    var inst = q(p, 'installed');
    if(inst <= 0) return;
    if(String(p.at || '').slice(0,7) !== month) return;
    /* is part ka complaint us client ka hai? */
    var job = p.complaint ? byId(DB.complaints, p.complaint) : null;
    if(!job || job.client !== clientId) return;
    var st = p.stock ? byId(DB.stock, p.stock) : null;
    var each = st ? (parseFloat(st.cost) || 0) : 0;
    var kind = st ? (st.kind || 'part') : 'part';
    if(kind === 'toner') tonerCost += inst * each;
    else partsCost += inst * each;
  });

  /* DEPRECIATION \\u2014 har rental machine ka ek mahine ka hissa (cost / months) */
  var dep = 0;
  machines.forEach(function(m){
    if(m.mtype !== 'rental') return;
    var cost = parseFloat(m.cost) || 0;
    var months = parseFloat(m.depMonths) || defDep || 12;
    if(cost > 0 && months > 0) dep += cost / months;
  });
  dep = Math.round(dep);

  var profit = Math.round(received - visitCost - partsCost - tonerCost - dep);

  function row(label, value, sub, neg){
    return '<div class="pr-row'+(neg?' neg':'')+'">'+
      '<div><div class="pr-l">'+label+'</div>'+(sub?'<div class="pr-s">'+sub+'</div>':'')+'</div>'+
      '<div class="pr-v">'+(neg&&value?'\\u2212 ':'')+rs(value)+'</div></div>';
  }

  var body =
    '<div class="pr-head"><div class="pr-name">'+esc(c.name)+'</div>'+
      '<div class="pr-month">'+monthName(month)+'</div></div>'+
    '<div class="pr-table">'+
      row('Received', received, 'Payments confirmed this month', false)+
      row('Tech visits', visitCost, visits+' visit(s) \\u00d7 '+rs(visitRate), true)+
      row('Parts', partsCost, 'Parts fitted this month, at cost', true)+
      row('Toner', tonerCost, 'Toner used this month, at cost', true)+
      row('Depreciation', dep, machines.filter(function(m){return m.mtype==='rental';}).length+' rental machine(s)', true)+
      '<div class="pr-row total '+(profit>=0?'good':'bad')+'">'+
        '<div class="pr-l">Profit</div>'+
        '<div class="pr-v">'+rs(profit)+'</div></div>'+
    '</div>'+
    '<div class="pr-note">'+(profit>=0
      ? '\\u2705 Is client par is mahine faida hua.'
      : '\\u26A0\\uFE0F Is client par is mahine nuqsan \\u2014 rent ya service dekh lein.')+'</div>';

  modal('Profit \\u2014 '+esc(c.name), body,
    [{t:'Back',cls:'ghost',f:'clientProfitPick()'},{t:'Close',cls:'',f:'closeModal()'}]);
}

  var p = String(m).split('-'); return (mo[parseInt(p[1],10)-1]||'') + ' ' + p[0];
}

function roundsBox(month){
  var isOffice = (ME.role === 'admin' || ME.role === 'supervisor');
  month = month || today().slice(0, 7);

  /* rental machines. Technician ko sirf us ke apne (jo us ko assign) dikhein;
     office ko saare. */
  var machines = DB.machines.filter(function(m){
    if(m.cancelled || m.mtype !== 'rental') return false;
    if(!isOffice) return m.roundTech === ME.id;   /* tech: sirf mere */
    return true;
  });

  var done = [], due = [];
  machines.forEach(function(m){
    var visited = roundVisited(m.id, month);
    (visited ? done : due).push({ m: m, visit: visited });
  });

  var total = machines.length;
  var pct = total ? Math.round(done.length / total * 100) : 0;
  var barColour = pct >= 90 ? '#1A7538' : pct >= 60 ? '#C8860B' : '#AE1F26';

  var body =
    '<div class="rd-top">'+
      '<div class="rd-month"><button class="btn ghost sm" onclick="roundsBox(\''+monthShift(month,-1)+'\')">\u2039</button>'+
        '<b>'+monthName(month)+'</b>'+
        '<button class="btn ghost sm" onclick="roundsBox(\''+monthShift(month,1)+'\')">\u203A</button></div>'+
      '<div class="rd-cov"><div class="rd-cov-bar"><div style="width:'+pct+'%;background:'+barColour+'"></div></div>'+
        '<div class="rd-cov-n">'+done.length+' of '+total+' covered \u00b7 '+pct+'%</div></div>'+
    '</div>';

  if(!total){
    body += '<div class="empty">No rental machines yet. Mark a machine as '+
      '\u201cRental\u201d (with a monthly rent) to plan its visits.</div>';
  } else {
    if(due.length){
      body += '<div class="rd-sec rd-due">\u26A0\uFE0F Still due this month ('+due.length+')</div>';
      body += due.map(function(x){ return roundRow(x.m, null); }).join('');
    }
    if(done.length){
      body += '<div class="rd-sec rd-done">\u2705 Covered ('+done.length+')</div>';
      body += done.map(function(x){ return roundRow(x.m, x.visit); }).join('');
    }
  }

  modal('Service rounds', body, [{t:'Close',cls:'ghost',f:'closeModal()'}]);
}

/* is machine par is mahine koi visit (ya resolved complaint) hua? */
function roundVisited(machineId, month){
  var hit = null;
  (DB.visits || []).forEach(function(v){
    if(v.machine === machineId && String(v.at || '').slice(0,7) === month){
      if(!hit || String(v.at) > String(hit.at)) hit = v;
    }
  });
  DB.complaints.forEach(function(c){
    if(c.machine === machineId && c.status === 'resolved' &&
       String(c.resolved || '').slice(0,7) === month){
      var at = c.resolved;
      if(!hit || String(at) > String(hit.at)) hit = { at: at, counter: c.counter, job: true };
    }
  });
  return hit;
}

function monthShift(m, by){
  var p = String(m).split('-'), y = +p[0], mo = +p[1] + by;
  while(mo < 1){ mo += 12; y--; } while(mo > 12){ mo -= 12; y++; }
  return y + '-' + ('0'+mo).slice(-2);
}

/* ek machine ka is mahine ka bill \u2014 khula hisaab */
function rentalLine(m, month){
  var client = nameOf(DB.clients, m.client);
  var label = machineLabel(m);
  var rent = parseFloat(m.rent) || 0;
  var copyRate = parseFloat(m.copyRate) || 0;
  var minCharge = parseFloat(m.minCharge) || 0;
  var already = rentalAlready(m.id, month);

  if(copyRate > 0){
    /* per-copy: is mahine ki reading \u2212 pichhle mahine ki */
    var now = counterInMonth(m.id, month);
    var prev = counterBefore(m.id, month);
    var copies = (now != null && prev != null) ? Math.max(0, now - prev) : null;
    var amount = copies != null ? Math.max(copies * copyRate, minCharge) : minCharge;
    var how = copies != null
      ? copies.toLocaleString()+' copies \u00d7 '+rs(copyRate)+(minCharge && copies*copyRate<minCharge?' (min '+rs(minCharge)+')':'')
      : 'No reading this month \u2014 minimum '+rs(minCharge);
    return { id:m.id, label:label, client:client, amount:Math.round(amount), how:how,
             already:already, warn: copies == null };
  }
  /* fixed monthly rent */
  return { id:m.id, label:label, client:client, amount:Math.round(rent),
           how:'Monthly rent', already:already, warn:false };
}

/* is machine par is mahine ka aakhri counter */
function counterInMonth(machineId, month){
  var best = null;
  (DB.visits || []).forEach(function(v){
    if(v.machine === machineId && String(v.at||'').slice(0,7) === month && v.counter != null)
      if(best == null || v.counter > best) best = v.counter;
  });
  DB.complaints.forEach(function(c){
    if(c.machine === machineId && c.counter && String(c.resolved||'').slice(0,7) === month)
      if(best == null || c.counter > best) best = c.counter;
  });
  return best;
}

/* is machine ka is mahine se pehle ka aakhri counter */
function counterBefore(machineId, month){
  var best = null;
  var cut = month + '-01';
  (DB.visits || []).forEach(function(v){
    if(v.machine === machineId && String(v.at||'').slice(0,10) < cut && v.counter != null)
      if(best == null || v.counter > best) best = v.counter;
  });
  DB.complaints.forEach(function(c){
    if(c.machine === machineId && c.counter && String(c.resolved||'').slice(0,10) < cut)
      if(best == null || c.counter > best) best = c.counter;
  });
  return best;
}

function rentalAlready(machineId, month){
  return (DB.rentals || []).some(function(r){
    return r.machine === machineId && r.month === month; });
}

function rentalMake(month){
  var machines = DB.machines.filter(function(m){
    return !m.cancelled && m.mtype === 'rental' && (parseFloat(m.rent)>0 || parseFloat(m.copyRate)>0); });
  DB.rentals = DB.rentals || [];
  var made = 0;
  machines.forEach(function(m){
    if(rentalAlready(m.id, month)) return;
    var l = rentalLine(m, month);
    if(!l.amount) return;
    DB.rentals.push({ id:uid(), machine:m.id, client:m.client, month:month,
      amount:l.amount, how:l.how, at:now(), by:ME.id });
    made++;
  });
  logIt('money', 'Made '+made+' rental invoice(s)', monthName(month));
  save(); if(sharingOn()) syncSoon();
  toast(made+' rental invoice(s) made','good');
  rentalRun();
}

function globalSearch(){
  modal('Search',
    '<div class="field"><input id="gsQ" type="search" autocomplete="off" '+

      'oninput="gsRun()" style="font-size:15px"></div>'+
    '<div id="gsOut"><div class="help">Type to search across clients, machines and jobs.</div></div>',
    [{t:'Close',cls:'ghost',f:'closeModal()'}]);
  setTimeout(function(){ var f = $('gsQ'); if(f) f.focus(); }, 150);
}

function gsRun(){
  var q = ($('gsQ').value || '').trim().toLowerCase();
  var out = $('gsOut'); if(!out) return;
  if(q.length < 2){ out.innerHTML = '<div class="help">Type at least two letters.</div>'; return; }

  var hits = { clients:[], machines:[], jobs:[], users:[], quotes:[], invoices:[] };
  var seeClients = can('clients') || ME.role === 'admin' || ME.role === 'supervisor';
  var seeMoney = can('quotes') || ME.role === 'admin';

  /* clients */
  if(seeClients){
    (DB.clients || []).forEach(function(c){
      if(gsHas(q, [c.name, c.who, c.phone, c.email, c.address])){
        hits.clients.push(c);
      } else if((c.people||[]).some(function(p){ return gsHas(q, [p.name, p.phone, p.email]); })){
        hits.clients.push(c);
      }
    });
  }
  /* machines */
  if(seeClients){
    (DB.machines || []).forEach(function(m){
      if(m.cancelled) return;
      if(gsHas(q, [m.model, m.serial, m.dept, m.place, nameOf(DB.clients, m.client)]))
        hits.machines.push(m);
    });
  }
  /* complaints (jobs) \u2014 tech ko sirf apni */
  (DB.complaints || []).forEach(function(c){
    if(ME.role === 'tech' && c.tech !== ME.id) return;
    var m = byId(DB.machines, c.machine);
    if(gsHas(q, [c.no, c.what, nameOf(DB.clients, c.client), m && m.model, m && m.serial]))
      hits.jobs.push(c);
  });
  /* users \u2014 sirf admin */
  if(ME.role === 'admin'){
    (DB.users || []).forEach(function(u){
      if(gsHas(q, [u.name, u.email, u.phone, (ROLES[u.role]||{}).label]))
        hits.users.push(u);
    });
  }
  /* quotations */
  if(seeMoney){
    (DB.quotes || []).forEach(function(x){
      if(gsHas(q, [x.no, nameOf(DB.clients, x.client), (BRANDS[x.brand]||{}).name, x.type]))
        hits.quotes.push(x);
    });
    (DB.bills || []).concat((typeof _mon!=='undefined' && _mon.invs) || []).forEach(function(i){
      if(i && gsHas(q, [i.no, i.clientName, nameOf(DB.clients, i.client)]))
        hits.invoices.push(i);
    });
  }

  var total = hits.clients.length + hits.machines.length + hits.jobs.length + hits.users.length + hits.quotes.length + hits.invoices.length;
  if(!total){ out.innerHTML = '<div class="empty">Nothing found for \u201c' + esc(q) + '\u201d.</div>'; return; }

  var html = '';
  if(hits.jobs.length) html += gsSection('Complaints', hits.jobs.slice(0,15).map(function(c){
    var m = byId(DB.machines, c.machine);
    return gsItem('\u{1F527}', c.no + ' \u00b7 ' + esc(String(c.what||'').slice(0,40)),
      nameOf(DB.clients, c.client) + (m ? ' \u00b7 ' + esc(m.model) : ''),
      "closeModal();openComplaint('" + c.id + "')");
  }));
  if(hits.quotes.length) html += gsSection('Quotations', hits.quotes.slice(0,15).map(function(x){
    return gsItem('\u{1F4C4}', esc(x.no) + ' \u00b7 ' + esc(nameOf(DB.clients, x.client)),
      ((BRANDS[x.brand]||{}).name||'') + ' \u00b7 ' + (x.type==='rental'?'Rental':'Sales'),
      "closeModal();openQuote('" + x.id + "')");
  }));
  if(hits.invoices.length) html += gsSection('Invoices', hits.invoices.slice(0,15).map(function(i){
    return gsItem('\u{1F9FE}', esc(i.no) + ' \u00b7 ' + esc(i.clientName || nameOf(DB.clients, i.client)),
      rs(i.total || 0), "closeModal();moneyBox()");
  }));
  if(hits.clients.length) html += gsSection('Clients', hits.clients.slice(0,15).map(function(c){
    return gsItem('\u{1F3E2}', esc(c.name), (c.who ? esc(c.who) + ' \u00b7 ' : '') + (c.phone ? esc(c.phone) : ''),
      "closeModal();contacts('" + c.id + "')");
  }));
  if(hits.machines.length) html += gsSection('Machines', hits.machines.slice(0,15).map(function(m){
    return gsItem('\u{1F5A8}\uFE0F', esc(machineLabel(m)), nameOf(DB.clients, m.client),
      "closeModal();openMachine('" + m.id + "')");
  }));
  if(hits.users.length) html += gsSection('People', hits.users.slice(0,15).map(function(u){
    return gsItem('\u{1F464}', esc(u.name), (ROLES[u.role]||{}).label || '',
      "closeModal();editUser('" + u.id + "')");
  }));

  out.innerHTML = html;
}

function gsHas(q, fields){
  for(var i=0;i<fields.length;i++){
    if(fields[i] && String(fields[i]).toLowerCase().indexOf(q) > -1) return true;
  }
  return false;
}
function gsSection(title, rows){
  return '<div class="gs-sec">' + title + ' (' + rows.length + ')</div>' + rows.join('');

function gsItem(icon, title, sub, onclick){
  return '<div class="gs-row" onclick="' + onclick + '">'+
    '<div class="gs-ic">' + icon + '</div>'+
    '<div class="grow"><div class="gs-t">' + title + '</div>'+
    (sub ? '<div class="gs-s">' + sub + '</div>' : '') + '</div>'+
    '<div class="gs-go">\u203A</div></div>';
}

function machineReport(machineId){
  var m = byId(DB.machines, machineId); if(!m) return;
  var client = nameOf(DB.clients, m.client);

  /* is machine ki complaints */
  var jobIds = {};
  DB.complaints.forEach(function(c){ if(c.machine === machineId) jobIds[c.id] = c; });

  /* is machine par lage saare parts (installed) */
  var fitted = [];
  DB.parts.forEach(function(p){
    if(q(p,'installed') <= 0) return;
    if(!jobIds[p.complaint]) return;                 /* isi machine ki job */
    var st = p.stock ? byId(DB.stock, p.stock) : null;
    var each = st ? (parseFloat(st.cost) || 0) : 0;
    fitted.push({
      part: st ? stockLabel(st) : (p.name || 'part'),
      partId: p.stock,
      qty: q(p,'installed'),
      each: each,
      cost: q(p,'installed') * each,
      by: nameOf(DB.users, p.by),
      at: p.at || (jobIds[p.complaint] && jobIds[p.complaint].resolved) || '',
      job: jobIds[p.complaint] ? jobIds[p.complaint].no : ''
    });
  });
  fitted.sort(function(a,b){ return String(a.at) < String(b.at) ? 1 : -1; });

  /* har part ka kitni baar (repeat = nishani) */
  var byPart = {};
  fitted.forEach(function(f){
    byPart[f.part] = byPart[f.part] || { part:f.part, times:0, qty:0, cost:0 };
    byPart[f.part].times++; byPart[f.part].qty += f.qty; byPart[f.part].cost += f.cost;
  });
  var repeats = Object.keys(byPart).map(function(k){ return byPart[k]; })
    .filter(function(x){ return x.times >= 2; })
    .sort(function(a,b){ return b.times - a.times; });

  var totalCost = fitted.reduce(function(s,f){ return s + f.cost; }, 0);
  var lastCounter = (typeof lastCounter === 'function') ? 0 : 0;

  /* screen */
  var body =
    '<div class="mr-head"><div class="mr-m">'+esc(machineLabel(m))+'</div>'+
      '<div class="mr-c">'+esc(client)+(m.serial?' \u00b7 '+esc(m.serial):'')+'</div></div>'+

/* A4 print \u2014 same professional design as other reports */
function machineReportPrint(machineId){
  var m = byId(DB.machines, machineId); if(!m) return;
  var client = nameOf(DB.clients, m.client);
  var jobIds = {};
  DB.complaints.forEach(function(c){ if(c.machine === machineId) jobIds[c.id] = c; });
  var fitted = [];
  DB.parts.forEach(function(p){
    if(q(p,'installed') <= 0 || !jobIds[p.complaint]) return;
    var st = p.stock ? byId(DB.stock, p.stock) : null;
    var each = st ? (parseFloat(st.cost)||0) : 0;
    fitted.push({ part: st?stockLabel(st):(p.name||'part'), qty:q(p,'installed'),
      cost:q(p,'installed')*each, by:nameOf(DB.users,p.by),
      at:p.at||'', job:jobIds[p.complaint]?jobIds[p.complaint].no:'' });
  });
  fitted.sort(function(a,b){ return String(a.at) < String(b.at) ? 1 : -1; });
  var total = fitted.reduce(function(s,f){ return s+f.cost; }, 0);
  var byPart = {};
  fitted.forEach(function(f){ byPart[f.part]=(byPart[f.part]||0)+1; });
  var repeats = Object.keys(byPart).filter(function(k){ return byPart[k]>=2; });

  var rows = fitted.map(function(f){
    return '<tr><td>'+(f.at?dmy(String(f.at).slice(0,10)):'')+'</td><td>'+esc(f.part)+'</td>'+
      '<td>'+(f.job||'')+'</td><td class="num">'+f.qty+'</td>'+
      '<td class="num">'+Math.round(f.cost).toLocaleString('en-PK')+'</td><td>'+esc(f.by||'')+'</td></tr>';
  }).join('');

  var meta = '<span><b>Machine:</b> '+esc(machineLabel(m))+'</span>'+
    '<span><b>Client:</b> '+esc(client)+'</span>'+
    (m.serial?'<span><b>Serial:</b> '+esc(m.serial)+'</span>':'');

  printBox('Machine Report',
    '<table><tr><th>Date</th><th>Part</th><th>Job</th><th class="num">Qty</th><th class="num">Cost (Rs)</th><th>Technician</th></tr>'+
    rows+
    '<tr><td colspan="4" style="text-align:right"><b>Total spent</b></td>'+
    '<td class="num"><b>'+Math.round(total).toLocaleString('en-PK')+'</b></td><td></td></tr></table>'+
    (repeats.length
      ? '<div class="note"><b class="flag-red">'+repeats.length+' part(s) fitted more than once</b> \u2014 '+
        esc(repeats.join(', '))+'. Worth checking: a real fault, or parts not reaching the machine.</div>'
      : '<div class="note"><b class="flag-green">No part fitted twice</b> \u2014 nothing unusual here.</div>'),
    meta);
}

function printQuotePro(id, forShare){
  var x = byId(DB.quotes, id); if(!x) return;

  var grand = 0, grandTax = 0;
  var tables = QP_CATS.filter(function(cd){ return groups[cd.key]; }).map(function(cd){
    var rows = '', catTotal = 0;
    groups[cd.key].forEach(function(l, i){

      var price = parseFloat(l.price) || 0;

      var before = (l.enteredAs === 'after' && rate) ? amt / (1 + rate/100) : amt;

        '<td class="num"><b>'+qpRs(before+tt)+'</b></td></tr>';

      '<span class="qp-cat-t">Category Total: '+qpRs(catTotal)+'</span></div>'+

      (x.tax ? '<th class="num">Excl. Tax</th><th class="num">Tax</th>' : '')+

/* ---------- a conversation ---------- */
function chatOpen(id){
  if(!document.getElementById('chatWrap') || !document.getElementById('chatWrap').classList.contains('on')) chatHome();
  _chat.open = id; _chat.msgs = []; _chat.last = ''; _chat.reply = null;
  var w = chatWrap();
  var c = _chat.list.filter(function(x){ return x.id === id; })[0] || {};
  w.innerHTML = '<div class="ch-head"><button class="ch-back" onclick="_chat.open=null;chatDrawList();chatRefreshBadge()">\u2039</button>'+
    '<div class="ch-av sm" style="background:' + (c.kind === 'group' ? '#12395E' : avatarColour(c.title)) + '">' + (c.kind === 'group' ? '\u{1F465}' : ((c.other && userPhoto(c.other.id)) ? '<img src="'+userPhoto(c.other.id)+'">' : initials(c.title))) + '</div>'+
    '<div class="grow" style="min-width:0"><div class="ch-title" id="chTitle">' + esc(c.title || '') + '</div><div class="ch-sub" id="chSub"></div></div>'+
    (c.kind !== 'group' ? '<button class="ch-call voice" onclick="callStart(\''+id+'\',false)" title="Voice call" aria-label="Voice call">'+
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>'+
      '</button>'+
      '<button class="ch-call video" onclick="callStart(\''+id+'\',true)" title="Video call" aria-label="Video call">'+
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 6h11c1.1 0 2 .9 2 2v2.5l3.3-2.3c.5-.4 1.2 0 1.2.6v6.4c0 .6-.7 1-1.2.6L17 13.5V16c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2z"/></svg>'+
      '</button>' : '')+
    '</div>'+
    '<div class="ch-msgs" id="chMsgs"><div class="empty">Loading\u2026</div></div>' + chatComposer();
  chatFetch(true);
}

/* WhatsApp jaisa call: 1-to-1 chat se us bande ko call. Us ka phone number
   ho to phone ka dialer khul jata hai. (Poora in-app voice call baad mein.) */
function chatCall(convId){ return callStart(convId, false); }
function chatCallOld(convId){
  var c = _chat.list.filter(function(x){ return x.id === convId; })[0] || {};
  /* doosre bande ka user record dhoondo (conversation ke members se) */
  var other = null;
  (_chat.members || []).forEach(function(m){ if(m.id !== ME.id) other = m; });
  if(!other && c.other) other = c.other;
  var u = other ? byId(DB.users, other.id) : null;
  var phone = (u && u.phone) ? u.phone : (other && other.phone);
  if(!phone){
    return toast('Is ka phone number nahi hai \u2014 admin Users mein daal sakta hai','bad');
  }
  /* dialer kholo */
  var clean = String(phone).replace(/[^0-9+]/g, '');
  window.location.href = 'tel:' + clean;
}

function chatFetch(first){
  var id = _chat.open; if(!id) return;
  hrCall({ action:'chat.open', conv:id, after: first ? '' : _chat.last }).then(function(d){
    if(!d || !d.ok || _chat.open !== id) return;
    _chat.read = d.read; _chat.deliv = d.deliv || {}; _chat.presence = d.presence || {};
    _chat.members = d.members; _chat.title = d.title; _chat.kind = d.kind;
    var changed = first;
    d.msgs.forEach(function(m){
      var i = -1; _chat.msgs.forEach(function(x, k){ if(x.id === m.id) i = k; });
      if(i > -1) _chat.msgs[i] = m; else _chat.msgs.push(m);
      var stamp = m.edited && m.edited > m.at ? m.edited : m.at;
      if(stamp > _chat.last) _chat.last = stamp;
      changed = true;
    });
    if($('chSub')){
      if(d.kind === 'group'){
        var on = d.members.filter(function(x){ return x.id !== ME.id && _chat.presence[x.id] && _chat.presence[x.id].online; }).length;
        $('chSub').textContent = (on ? on + ' online \u00b7 ' : '') + d.members.map(function(x){ return x.name.split(' ')[0]; }).join(', ');
      } else {
        var other = d.members.filter(function(x){ return x.id !== ME.id; })[0];
        $('chSub').textContent = other ? lastSeen(_chat.presence[other.id]) : '';
        $('chSub').classList.toggle('on', !!(other && _chat.presence[other.id] && _chat.presence[other.id].online));
      }
    }
    if(changed || first) chatDrawMsgs(first || d.msgs.some(function(m){ return !m.edited; }));
    else chatTicks();
    var mineLast = _chat.msgs.filter(function(m){ return m.from !== ME.id; }).slice(-1)[0];
    if(mineLast && (d.read[ME.id] || '') < mineLast.at) hrCall({ action:'chat.read', conv:id, upto: mineLast.at }).then(function(){ chatNotesRead(id); });
  }).catch(function(){});
}

/* the chat notes are only for the phone to ring; opening the conversation settles them */
function chatNotesRead(id){
  var any = false;
  (DB.notes || []).forEach(function(n){ if(n.to === ME.id && n.link === 'chat:' + id && !n.read){ n.read = true; n._at = now(); any = true; } });
  if(any){ save(); if(sharingOn()) syncSoon(); }
}

function nameIn(uid){ var m = _chat.members.filter(function(x){ return x.id === uid; })[0]; return m ? m.name : 'Someone'; }

function chatDrawMsgs(toBottom){
  var box = $('chMsgs'); if(!box) return;
  var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  var lastDay = '', html = '';
  _chat.msgs.forEach(function(m, i){
    var day = String(m.at).slice(0,10);
    if(day !== lastDay){ html += '<div class="ch-day"><span>' + (day === today() ? 'Today' : day === mdAddSafe(today(), -1) ? 'Yesterday' : dmy(day)) + '</span></div>'; lastDay = day; }
    html += chatBubble(m, _chat.msgs[i - 1]);
  });
  box.innerHTML = html || '<div class="empty">Say salam \u{1F44B}</div>';
  if(toBottom || nearBottom) box.scrollTop = box.scrollHeight;
}

function chatTicks(){
  _chat.msgs.forEach(function(m){
    var el = document.getElementById('tk' + m.id);
    if(el) el.outerHTML = chatTick(m);
  });
}
/* the ticks, as WhatsApp has them:
     clock  \u2014 still on this phone, on its way
     \u2713      \u2014 reached the server
     \u2713\u2713 grey \u2014 reached their phone
     \u2713\u2713 blue \u2014 they have read it (everyone, in a group) */
function chatTick(m){
  if(m.from !== ME.id || m.gone) return '';
  if(m.sending) return '<span id="tk' + m.id + '" class="ch-tick">\u{1F552}</span>';
  var others = _chat.members.filter(function(x){ return x.id !== ME.id; });
  var readAll = others.length && others.every(function(x){ return (_chat.read[x.id] || '') >= m.at; });
  var gotAll = others.length && others.every(function(x){ return (_chat.deliv[x.id] || '') >= m.at || (_chat.read[x.id] || '') >= m.at; });
  return '<span id="tk' + m.id + '" class="ch-tick' + (readAll ? ' read' : '') + '">' + (readAll || gotAll ? '\u2713\u2713' : '\u2713') + '</span>';
}

function chatBubble(m, prev){
  var mine = m.from === ME.id, group = _chat.kind === 'group';
  var showName = group && !mine && (!prev || prev.from !== m.from || String(prev.at).slice(0,10) !== String(m.at).slice(0,10));
  var body = '';
  if(m.gone) body = '<i class="ch-gone">\u{1F6AB} This message was deleted' + (m.deletedBy ? ' by ' + esc(m.deletedBy) : '') + '</i>';
  else {
    if(m.reply){
      var r = _chat.msgs.filter(function(x){ return x.id === m.reply; })[0];
      if(r) body += '<div class="ch-quote" onclick="event.stopPropagation();chatJump(\'' + r.id + '\')"><b>' + esc(r.from === ME.id ? 'You' : nameIn(r.from)) + '</b><br>' +
        esc(r.gone ? 'Deleted message' : r.voice ? '\u{1F3A4} Voice note' : r.photo ? '\u{1F4F7} Photo' : String(r.text).slice(0, 90)) + '</div>';
    }
    if(m.photo) body += '<div class="ch-photo" id="ph' + m.id + '" onclick="event.stopPropagation();chatPhoto(\'' + m.id + '\',\'' + m.photo + '\')">\u{1F4F7} Tap to view photo</div>';
    if(m.voice) body += chatVoice(m);
    if(m.file) body += chatFileCard(m);
    if(m.text) body += '<div class="ch-text">' + chatLinkify(m.text) + '</div>';
  }
  var reacts = m.reacts && Object.keys(m.reacts).length ? '<div class="ch-reacts">' + Object.keys(m.reacts).map(function(e){
    return '<span class="' + (m.reacts[e].indexOf(ME.id) > -1 ? 'me' : '') + '">' + e + (m.reacts[e].length > 1 ? ' ' + m.reacts[e].length : '') + '</span>'; }).join('') + '</div>' : '';
  return '<div class="ch-line ' + (mine ? 'mine' : 'theirs') + '" id="m' + m.id + '">'+
    '<div class="ch-bub" onclick="chatMenu(\'' + m.id + '\')">' + (showName ? '<div class="ch-from" style="color:' + avatarColour(nameIn(m.from)) + '">' + esc(nameIn(m.from)) + '</div>' : '') +
    body + '<div class="ch-meta">' + (m.editedAt && !m.gone ? '<span class="ch-ed" title="edited by ' + esc(m.editedBy || '') + '">edited</span> ' : '') +
    String(m.at).slice(11,16) + ' ' + chatTick(m) + '</div></div>' + reacts + '</div>';
}
/* a document: its kind by colour, its name, its size; a tap opens it */
function fileKind(name){
  var e = String(name).split('.').pop().toLowerCase();
  if(e === 'pdf') return ['PDF','#E53935'];
  if(e === 'doc' || e === 'docx') return ['DOC','#2B579A'];
  if(e === 'xls' || e === 'xlsx' || e === 'csv') return ['XLS','#217346'];
  if(e === 'ppt' || e === 'pptx') return ['PPT','#D24726'];
  if(e === 'zip' || e === 'rar') return ['ZIP','#6D4C41'];
  return [e.slice(0,4).toUpperCase() || 'FILE','#607D8B'];
}
function fileSize(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function chatFileCard(m){
  var k = fileKind(m.file.name);
  return '<div class="ch-file" onclick="event.stopPropagation();' + (m.file.id ? 'chatOpenFile(\'' + m.file.id + '\')' : '') + '">'+
    '<div class="ch-fic" style="background:' + k[1] + '">' + k[0] + '</div>'+
    '<div class="grow" style="min-width:0"><div class="ch-fname">' + esc(m.file.name) + '</div>'+
    '<div class="ch-fsize">' + fileSize(m.file.size || 0) + ' \u00b7 ' + k[0] + (m.sending ? ' \u00b7 sending\u2026' : '') + '</div></div>'+
    (m.file.id ? '<div class="ch-fdl">\u2B07</div>' : '') + '</div>';
}
/* opens the file on the phone: in the app, the phone's own viewer; in a browser, a new tab or a download */
function chatOpenFile(fid){
  toast('Opening\u2026','good');
  hrCall({ action:'chat.file', conv:_chat.open, id:fid }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not open','bad');
    if(window.Android && typeof Android.openFile === 'function') return Android.openFile(d.name, d.mime || 'application/octet-stream', d.data);
    var bin = atob(d.data), arr = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: d.mime || 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = d.name; a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }).catch(function(){ toast('No signal \u2014 the file is on the server','bad'); });
}

function chatLinkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" onclick="event.stopPropagation()">$1</a>').replace(/\n/g, '<br>');
}
function chatJump(id){ var el = document.getElementById('m' + id); if(el){ el.scrollIntoView({ behavior:'smooth', block:'center' }); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 1200); } }
function chatVoice(m){
  var url = serverBase() + '/voice/' + m.voice + '?t=' + encodeURIComponent(DB.hr.token);
  var s = m.secs ? Math.floor(m.secs / 60) + ':' + String(m.secs % 60).padStart(2,'0') : '';
  return '<div class="ch-voice" onclick="event.stopPropagation()"><button class="ch-play" onclick="chatPlay(this,\'' + url + '\')">\u25B6</button>'+
    '<div class="ch-wave"><i></i></div><span class="ch-dur">' + s + '</span></div>';
}
var _chatAudio = null, _chatAudioBtn = null;
function chatPlay(btn, url){
  if(_chatAudio && _chatAudioBtn === btn){ if(_chatAudio.paused){ _chatAudio.play(); btn.textContent = '\u275A\u275A'; } else { _chatAudio.pause(); btn.textContent = '\u25B6'; } return; }
  if(_chatAudio){ _chatAudio.pause(); if(_chatAudioBtn) _chatAudioBtn.textContent = '\u25B6'; }
  _chatAudio = new Audio(url); _chatAudioBtn = btn;
  var bar = btn.parentNode.querySelector('.ch-wave i');
  _chatAudio.ontimeupdate = function(){ if(_chatAudio.duration) bar.style.width = (_chatAudio.currentTime / _chatAudio.duration * 100) + '%'; };
  _chatAudio.onended = function(){ btn.textContent = '\u25B6'; bar.style.width = '0'; };
  _chatAudio.onerror = function(){ btn.textContent = '\u25B6'; toast('This voice note cannot play on this phone','bad'); };
  _chatAudio.play().then(function(){ btn.textContent = '\u275A\u275A'; }).catch(function(){});
}
function chatPhoto(mid, name){
  var el = document.getElementById('ph' + mid);
  hrCall({ action:'chat.photo', conv:_chat.open, id:name }).then(function(d){
    if(!d || !d.ok) return toast('Photo not found','bad');
    if(el && el.tagName !== 'IMG'){ el.outerHTML = '<img class="ch-img" src="' + d.data + '" onclick="event.stopPropagation();chatBig(this.src)">'; }
  });
}
function chatBig(src){ modal('Photo', '<img src="' + src + '" style="width:100%;border-radius:10px">', [{t:'Close',cls:'ghost',f:'closeModal()'}]); }
/* ---------- who is connected now, for the office ---------- */
function teamOnline(){
  chatCss();                      /* opened from the dashboard too, before the chat ever is */
  hrCall({ action:'presence.team' }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');
    var on = d.team.filter(function(x){ return x.online; });
    modal('Team \u2014 who is connected',
      '<div class="note ' + (on.length ? 'g' : 'i') + '" style="font-size:13px"><b>' + on.length + ' of ' + d.team.length + '</b> online now</div>' +
      d.team.map(function(x){
        return '<div class="ch-conv" style="padding:9px 2px"><div class="ch-av sm" style="background:' + avatarColour(x.name) + '">' + initials(x.name) +
          (x.online ? '<i class="ch-on"></i>' : '') + '</div><div class="grow"><div class="ch-name">' + esc(x.name) + '</div>'+
          '<div class="ch-last" style="color:' + (x.online ? '#1A7538' : '#889') + '">' + esc((ROLES[x.role] || {}).label || '') + ' \u00b7 ' + lastSeen(x) + '</div></div>'+
          '<button class="btn ghost sm" onclick="closeModal();chatDm(\'' + x.id + '\')">\u{1F4AC}</button></div>';
      }).join('') + '<div class="help" style="margin-top:8px">Online means the app is open on their phone and connected now.</div>',
      [{t:'Refresh',cls:'ghost',f:'teamOnline()'},{t:'Close',cls:'ghost',f:'closeModal()'}]);
  });
}


/* ---------- writing a message ---------- */
var EMOJI = {
  'Smileys': '\u{1F600} \u{1F601} \u{1F602} \u{1F923} \u{1F60A} \u{1F607} \u{1F642} \u{1F609} \u{1F60D} \u{1F618} \u{1F60E} \u{1F914} \u{1F928} \u{1F610} \u{1F644} \u{1F62E} \u{1F634} \u{1F60C} \u{1F61F} \u{1F622} \u{1F62D} \u{1F621} \u{1F631} \u{1F633} \u{1F917} \u{1F973} \u{1F97A} \u{1F92A} \u{1F910} \u{1F637}',
  'Hands': '\u{1F44D} \u{1F44E} \u{1F44C} \u{270C}\uFE0F \u{1F91E} \u{1F44F} \u{1F64C} \u{1F450} \u{1F64F} \u{1F91D} \u{270B} \u{1F44B} \u{1F4AA} \u{1F446} \u{1F447} \u{1F449} \u{1F448} \u{261D}\uFE0F \u{270D}\uFE0F \u{1F91A}',
  'Work': '\u{2705} \u{274C} \u{2757} \u{2753} \u{1F525} \u{1F4AF} \u{2B50} \u{1F389} \u{1F4E6} \u{1F527} \u{1F6E0}\uFE0F \u{1F5A8}\uFE0F \u{1F4C4} \u{1F4DE} \u{1F4F1} \u{1F4BB} \u{1F697} \u{23F0} \u{1F4B0} \u{1F4B5} \u{1F4C8} \u{1F4CD} \u{1F4E2} \u{1F4AC}',
  'Hearts': '\u{2764}\uFE0F \u{1F9E1} \u{1F49B} \u{1F49A} \u{1F499} \u{1F49C} \u{1F90D} \u{1F494} \u{1F495} \u{2728} \u{1F31F} \u{1F339} \u{1F932} \u{1F54C} \u{1F319}'
};
function chatComposer(){
  return '<div class="ch-replybar" id="chReply"></div>'+
    '<div class="ch-emoji" id="chEmoji"></div>'+
    '<div class="ch-comp" id="chComp">'+
      '<button class="ch-ib" onclick="chatEmoji()" title="Emoji">\u{1F60A}</button>'+
      '<textarea id="chText" rows="1" placeholder="Message" oninput="chatGrow(this)" onfocus="document.getElementById(\'chEmoji\').classList.remove(\'on\')"></textarea>'+
      '<button class="ch-ib" onclick="chatAttach()" title="Photo">\u{1F4CE}</button>'+
      '<button class="ch-send" id="chSend" onclick="chatSendOrRec()">\u{1F3A4}</button>'+
    '</div>';
}
function chatGrow(t){
  t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px';
  $('chSend').textContent = t.value.trim() ? '\u27A4' : '\u{1F3A4}';
}
function chatEmoji(){
  var box = $('chEmoji');
  if(box.classList.contains('on')){ box.classList.remove('on'); return; }
  box.innerHTML = Object.keys(EMOJI).map(function(k){
    return '<div class="ch-ek">' + k + '</div><div class="ch-eg">' + EMOJI[k].split(' ').map(function(e){
      return '<span onclick="chatPut(\'' + e + '\')">' + e + '</span>'; }).join('') + '</div>'; }).join('');
  box.classList.add('on');
}
function chatPut(e){
  var t = $('chText'), s = t.selectionStart || t.value.length;
  t.value = t.value.slice(0, s) + e + t.value.slice(t.selectionEnd || s);
  chatGrow(t);
}
function chatSendOrRec(){
  var t = $('chText');
  if(t.value.trim()) return chatSend({ text: t.value.trim() });
  voiceRecord(function(v){
    toast('Sending the voice note\u2026','good');
    hrCall({ action:'voice.put', data:v.data }).then(function(d){
      if(!d || !d.ok) throw new Error((d && d.msg) || 'not saved');
      chatSend({ voice:d.id, secs:v.secs });
    }).catch(function(e){ toast('Not sent: ' + e.message,'bad'); });
  });
}
function chatAttach(){
  modal('Send', '<div class="ch-attach">'+
    '<div onclick="closeModal();chatAttachCamera()"><span style="background:#1A7538">\u{1F4F7}</span>Camera</div>'+
    '<div onclick="closeModal();chatAttachPhoto()"><span style="background:#BF59CF">\u{1F5BC}\uFE0F</span>Gallery</div>'+
    '<div onclick="closeModal();chatAttachFile()"><span style="background:#5F66CD">\u{1F4C4}</span>Document</div>'+
    '<div onclick="closeModal();chatSendOrRecForce()"><span style="background:#FF8A00">\u{1F3A4}</span>Voice note</div></div>'+
    '<div class="help" style="text-align:center;margin-top:8px">Camera se seedha photo, ya gallery/document (5 MB tak).</div>',
    [{t:'Close',cls:'ghost',f:'closeModal()'}]);
}
function chatAttachCamera(){
  /* seedha camera \u2014 abhi ki photo khaanch kar bhejo (WhatsApp jaisa) */
  pickPhoto(function(src){ chatSend({ photo:src, text:$('chText').value.trim() }); }, { gallery:false });
}
function chatAttachPhoto(){
  pickPhoto(function(src){ chatSend({ photo:src, text:$('chText').value.trim() }); }, { gallery:true });
}
function chatSendOrRecForce(){ $('chText').value = ''; chatGrow($('chText')); chatSendOrRec(); }
function chatAttachFile(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.zip,.rar,.jpg,.jpeg,.png,application/pdf,application/*,text/*';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 5 * 1024 * 1024) return toast('Files up to 5 MB can be sent','bad');
    var rd = new FileReader();
    rd.onload = function(){
      var data = String(rd.result);
      if(data.indexOf('data:;') === 0) data = data.replace('data:;', 'data:application/octet-stream;');
      chatSend({ file:{ name:f.name, data:data }, text:$('chText').value.trim(), fileMeta:{ name:f.name, size:f.size } });
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function chatSend(body){
  var id = _chat.open; if(!id) return;
  body.action = 'chat.send'; body.conv = id;
  if(_chat.reply) body.reply = _chat.reply;
  /* shown at once, marked as sending; replaced by the real one when the server has it */
  var meta = body.fileMeta; delete body.fileMeta;
  var temp = { id:'tmp' + Date.now(), from:ME.id, text:body.text || '', voice:body.voice || '', secs:body.secs, photo: body.photo ? 'x' : '',
               file: meta ? { id:'', name:meta.name, size:meta.size } : null,
               reply: body.reply || '', at: new Date(Date.now() + 5 * 3600000).toISOString().slice(0,19), reacts:{}, sending:true };
  _chat.msgs.push(temp); chatDrawMsgs(true);
  $('chText').value = ''; chatGrow($('chText')); chatReplyClear();
  hrCall(body).then(function(d){
    _chat.msgs = _chat.msgs.filter(function(m){ return m.id !== temp.id; });
    if(!d || !d.ok){ chatDrawMsgs(); return toast((d && d.msg) || 'Not sent','bad'); }
    _chat.msgs.push(d.msg); if(d.msg.at > _chat.last) _chat.last = d.msg.at;
    chatDrawMsgs(true);
  }).catch(function(){
    _chat.msgs = _chat.msgs.filter(function(m){ return m.id !== temp.id; }); chatDrawMsgs();
    toast('No signal \u2014 not sent','bad');
  });
}

/* ---------- a message's menu: react, reply, copy, delete ---------- */
function chatMenu(mid){
  var m = _chat.msgs.filter(function(x){ return x.id === mid; })[0];
  if(!m || m.gone || m.sending) return;
  var reacts = (_chat.reacts.length ? _chat.reacts : ['\u{1F44D}','\u2764\uFE0F','\u{1F602}','\u{1F62E}','\u{1F622}','\u{1F64F}']);
  var mine = m.from === ME.id;
  var others = _chat.members.filter(function(x){ return x.id !== ME.id; });
  var seen = mine ? others.filter(function(x){ return (_chat.read[x.id] || '') >= m.at; }).map(function(x){ return x.name.split(' ')[0]; }) : [];
  var got = mine ? others.filter(function(x){ return (_chat.read[x.id] || '') < m.at && (_chat.deliv[x.id] || '') >= m.at; }).map(function(x){ return x.name.split(' ')[0]; }) : [];
  modal(mine ? 'Your message' : nameIn(m.from),
    '<div class="ch-rpick">' + reacts.map(function(e){
      var on = m.reacts && m.reacts[e] && m.reacts[e].indexOf(ME.id) > -1;
      return '<span class="' + (on ? 'on' : '') + '" onclick="chatReact(\'' + mid + '\',\'' + e + '\')">' + e + '</span>'; }).join('') + '</div>'+
    (m.text ? '<div class="note i" style="font-size:13px;margin-top:10px">' + chatLinkify(String(m.text).slice(0, 300)) + '</div>' : '')+
    (mine ? '<div class="help">' + (seen.length ? '<span style="color:#34B7F1">\u2713\u2713</span> Read' + (_chat.kind === 'group' ? ' by ' + esc(seen.join(', ')) : '') + '<br>' : '') +
      (got.length ? '\u2713\u2713 Delivered' + (_chat.kind === 'group' ? ' to ' + esc(got.join(', ')) : '') + ', not read yet<br>' : '') +
      (!seen.length && !got.length ? '\u2713 Sent \u2014 not on their phone yet' : '') + '</div>' : '')+
    (m.reacts && Object.keys(m.reacts).length ? '<div class="help">' + Object.keys(m.reacts).map(function(e){
      return e + ' ' + m.reacts[e].map(function(u){ return u === ME.id ? 'You' : nameIn(u).split(' ')[0]; }).join(', '); }).join(' \u00b7 ') + '</div>' : ''),
    [{t:'Reply',cls:'',f:"chatReplyTo('" + mid + "')"}]
      .concat(m.text ? [{t:'Copy',cls:'ghost',f:"chatCopy('" + mid + "')"}] : [])
      /* editing and deleting belong to the admin alone, for any message */
      .concat(ME.role === 'admin' && m.text ? [{t:'Edit',cls:'ghost',f:"chatEdit('" + mid + "')"}] : [])
      .concat(ME.role === 'admin' ? [{t:'Delete',cls:'danger',f:"chatDelete('" + mid + "')"}] : [])
      .concat([{t:'Close',cls:'ghost',f:'closeModal()'}]));
}
function chatReact(mid, e){
  closeModal();
  hrCall({ action:'chat.react', conv:_chat.open, msg:mid, emoji:e }).then(function(d){
    if(!d || !d.ok) return;
    _chat.msgs = _chat.msgs.map(function(m){ return m.id === mid ? d.msg : m; }); chatDrawMsgs();
  });
}
function chatReplyTo(mid){
  closeModal();
  var m = _chat.msgs.filter(function(x){ return x.id === mid; })[0];
  _chat.reply = mid;
  $('chReply').innerHTML = '<div class="grow"><b>Replying to ' + esc(m.from === ME.id ? 'yourself' : nameIn(m.from)) + '</b><br>' +
    esc(m.voice ? '\u{1F3A4} Voice note' : m.photo ? '\u{1F4F7} Photo' : m.file ? '\u{1F4C4} ' + m.file.name : String(m.text).slice(0, 80)) + '</div><button class="ch-ib" onclick="chatReplyClear()">\u2715</button>';
  $('chReply').classList.add('on'); $('chText').focus();
}
function chatReplyClear(){ _chat.reply = null; var r = $('chReply'); if(r){ r.classList.remove('on'); r.innerHTML = ''; } }
function chatCopy(mid){
  var m = _chat.msgs.filter(function(x){ return x.id === mid; })[0];
  try { navigator.clipboard.writeText(m.text); toast('Copied','good'); } catch(e){ toast('Could not copy','bad'); }
  closeModal();
}
function chatEdit(mid){
  if(ME.role !== 'admin') return toast('Only an admin can edit messages','bad');
  var m = _chat.msgs.filter(function(x){ return x.id === mid; })[0];
  modal('Edit message' + (m.from !== ME.id ? ' \u2014 ' + nameIn(m.from) : ''),
    '<div class="field"><textarea id="ceText" rows="4">' + esc(m.text) + '</textarea></div>'+
    '<div class="help">Everyone in the conversation will see it marked \u201cedited\u201d. What it said before is kept.</div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},{t:'Save',cls:'',f:"chatEditSave('" + mid + "')"}]);
}
function chatEditSave(mid){
  var text = $('ceText').value.trim();
  if(!text) return toast('Delete the message instead of leaving it empty','bad');
  hrCall({ action:'chat.edit', conv:_chat.open, msg:mid, text:text }).then(function(d){
    closeModal();
    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');
    _chat.msgs = _chat.msgs.map(function(m){ return m.id === mid ? d.msg : m; }); chatDrawMsgs();
    toast('Edited','good');
  });
}
function chatDelete(mid){
  if(ME.role !== 'admin') return toast('Only an admin can delete messages','bad');
  if(!confirm('Delete this message for everyone?')) return;
  hrCall({ action:'chat.delete', conv:_chat.open, msg:mid }).then(function(d){
    closeModal();
    if(!d || !d.ok) return toast((d && d.msg) || 'Not deleted','bad');
    _chat.msgs = _chat.msgs.map(function(m){ return m.id === mid ? d.msg : m; }); chatDrawMsgs();
  });
}

/* ============================================================
   ADMIN SETTINGS
   ------------------------------------------------------------
   One place, the admin's, where things are switched on and off.
   The server enforces every one of these; the screen only sets
   them. Nothing here is on until the admin turns it on.
   ============================================================ */

var _aset = null;

function adminSettingsBox(){
  if(ME.role !== 'admin') return toast('These settings are for the admin','bad');
  if(!sharingOn()) return toast('Connect this phone to the server first','bad');
  if(!hrReady()) return hrLink();
  hrCall({ action:'admin.settings' }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');
    _aset = d.settings;
    adminSettingsDraw();
  });
}

function asToggle(id, title, sub, on, warn){
  return '<div class="as-row"><div class="grow"><div class="as-t">' + title + '</div><div class="as-s">' + sub + '</div>'+
    (warn ? '<div class="as-w">' + warn + '</div>' : '') + '</div>'+
    '<label class="as-sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' onchange="' + id + 'Change()"><i></i></label></div>';
}

function adminSettingsDraw(){
  var s = _aset;
  modal('Admin Settings',
    '<div class="note i" style="font-size:12.5px">Only you see this screen. Nothing in the app happens against these switches.</div>'+
    '<label style="margin:8px 0 2px">Team chat</label>'+
    asToggle('asChatOn', 'Chat', 'The whole team chat. Off means nobody can send or read.', s.chat_on)+
    (s.chat_on ? asToggle('asE2E', 'End-to-end private', 'Only the people in a conversation can read it \u2014 not even you.',
        s.chat_e2e, s.chat_e2e ? '' : '') +
      asToggle('asRead', 'I can read every conversation', 'You may open and read any conversation, one-to-one or group. You cannot write into one that is not yours, and nobody is told.',
        s.chat_read, s.chat_e2e ? 'Turn off end-to-end to use this.' : '') : '')+
    '<label style="margin:14px 0 2px">Location</label>'+
    asToggle('asLoc', 'See where the team is', 'When on, you can ask for a person\u2019s current location and see it on a map. Their phone shares it only when you ask.', s.loc_on)+
    '<div class="help">Turning these on affects everyone\u2019s phones. Turning them off stops it at once.</div>',
    [{t:'Close',cls:'ghost',f:'closeModal()'}]);
}

function asSet(key, val, then){
  var o = {}; o[key] = val;
  hrCall({ action:'admin.settings', set:true, settings:o }).then(function(d){
    if(!d || !d.ok){ toast((d && d.msg) || 'Not saved','bad'); return; }
    _aset = d.settings; if(then) then();
    try { aiRefresh(); } catch(e){}
  });
}
function asChatOnChange(){ asSet('chat_on', $('asChatOn').checked, adminSettingsDraw); }
function asE2EChange(){
  var on = $('asE2E').checked;
  if(on && !confirm('End-to-end private means even you cannot read the team\u2019s chats. Turn it on?')) { $('asE2E').checked = false; return; }
  asSet('chat_e2e', on, adminSettingsDraw);
}
function asReadChange(){
  var on = $('asRead').checked;
  if(on && !confirm('You will be able to read every conversation. Turn this on?')) { $('asRead').checked = false; return; }
  asSet('chat_read', on, adminSettingsDraw);
}
function asLocChange(){
  var on = $('asLoc').checked;
  if(on && !confirm('This lets you see where the team is. Turn location on?')) { $('asLoc').checked = false; return; }
  asSet('loc_on', on, adminSettingsDraw);
}

/* ============================================================
   LOCATION
   ------------------------------------------------------------
   A phone shares its position only when the admin has switched
   the feature on and has just asked for this phone. Nothing is
   shown, said, or stored on the phone; the reading goes to the
   server, and only the admin sees it.
   ============================================================ */

var _locOn = false, _locWanted = false, _locBusy = false;

/* the flags ride on the chat heartbeat, so the phone learns silently */
function locFlags(f){
  if(!f) return;
  _locOn = !!f.loc_on;
  if(f.loc_wanted && _locOn) locSendNow();
}
function locSendNow(){
  if(_locBusy || !_locOn || !navigator.geolocation) { locTell(); return; }
  _locBusy = true;
  navigator.geolocation.getCurrentPosition(function(p){
    _locBusy = false;
    hrCall({ action:'loc.mine', lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }).catch(function(){});
  }, function(){ _locBusy = false; locTell(); }, { enableHighAccuracy:true, timeout:12000, maximumAge:15000 });
}
/* even a refusal answers, so the admin learns "location off on that phone" rather than nothing */
function locTell(){ hrCall({ action:'loc.mine' }).catch(function(){}); }

/* ---------- the admin's map ---------- */
function teamMap(){
  if(ME.role !== 'admin') return;
  hrCall({ action:'loc.team' }).then(function(d){
    if(!d || !d.ok){
      if(d && d.off) return locSettingsPrompt();
      return toast((d && d.msg) || 'Could not load','bad');
    }
    teamMapDraw(d.team);
  });
}
function locSettingsPrompt(){
  modal('Location is off',
    '<div class="note i">Switch location on to see where the team is. Their phones share it only when you ask, and only you see it.</div>',
    [{t:'Close',cls:'ghost',f:'closeModal()'},{t:'Admin Settings',cls:'',f:'adminSettingsBox()'}]);
}
function teamMapDraw(team){
  var placed = team.filter(function(x){ return x.lat != null; });
  modal('Where the team is',
    '<div class="note i" style="font-size:12.5px">Tap a name to ask their phone for a fresh location, then open it on the map. Only you see this.</div>'+
    (team.length ? team.map(function(x){
      var when = x.at ? ago(x.at) : 'never';
      /* online (internet se juda) status */
      var online = x.online;
      var statusTxt = online ? 'Online' : (x.lastSeen ? 'Last seen ' + ago(x.lastSeen) : 'Offline');
      /* on-duty aur kis job par */
      var duty = x.onDuty ? 'On duty' : '';
      var job = x.job ? 'On ' + x.job : '';
      var sub = [duty, job].filter(Boolean).join(' \u00b7 ');
      return '<div class="lc-row"><div class="lc-dot" style="background:' + (online ? '#1A7538' : '#C0392B') + '" title="' + statusTxt + '"></div>'+
        '<div class="grow"><div class="ttl">' + esc(x.name) + ' <span class="lc-on" style="color:' + (online?'#1A7538':'#889') + '">\u25CF ' + statusTxt + '</span></div>'+
        '<div class="meta">' + esc((ROLES[x.role] || {}).label || '') + (sub ? ' \u00b7 ' + esc(sub) : '') + '</div>'+
        '<div class="meta" style="font-size:11px">\u{1F4CD} ' + (x.lat != null ? (x.fresh ? 'now' : when) + (x.acc ? ' \u00b7 within ' + Math.round(x.acc) + ' m' : '') : 'not located') + '</div></div>'+
        '<button class="btn ghost sm" onclick="locAsk(\'' + x.id + '\',\'' + esc(x.name).replace(/'/g,'') + '\')">Locate</button>'+
        (x.lat != null ? '<button class="btn sm" style="margin-left:5px" onclick="locOpen(' + x.lat + ',' + x.lng + ',\'' + esc(x.name).replace(/'/g,'') + '\')">Map</button>' : '')+
      '</div>';
    }).join('') : '<div class="empty">Nobody to show.</div>'),
    [{t:'Refresh',cls:'ghost',f:'teamMap()'},{t:'Close',cls:'ghost',f:'closeModal()'}]);
}
function locAsk(uid, name){
  hrCall({ action:'loc.ask', who:uid }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not ask','bad');
    toast('Asked ' + name + '\u2019s phone \u2014 refresh in a moment','good');
    setTimeout(teamMap, 4000);
  });
}
function locOpen(lat, lng, name){
  var url = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
  try { if(window.Android && Android.openUrl){ Android.openUrl(url); return; } } catch(e){}
  window.open(url, '_blank');
}

function drawMore(){

  /* Client list aur machine list sirf office/admin ko \u2014 technician aur
     store manager ko poori list nahi (wo apni job par machine dekh lete hain). */
  if(can('clients') || ME.role === 'admin' || ME.role === 'supervisor'){
    rows.push(['\u{1F3E2}','Clients', DB.clients.length + ' on record', "listClients()"]);
    rows.push(['\u{1F5A8}','Machines', DB.machines.length + ' on record', "listMachines()"]);
  }
  if(can('users'))

function contactSave(clientId, idx){
  var c = byId(DB.clients, clientId); if(!c) return;
  var name = $('cpName').value.trim();
  if(!name) return toast('Naam likhein','bad');
  var p = { name:name, role:$('cpRole').value.trim(), phone:$('cpPhone').value.trim(),
            email:$('cpEmail').value.trim(), primary:!!$('cpPrimary').checked };
  c.people = c.people || [];
  if(p.primary) c.people.forEach(function(x){ x.primary = false; });   /* ek hi main */
  if(idx >= 0) c.people[idx] = p; else c.people.push(p);
  if(p.primary || c.people.length === 1){ c.who = p.name; c.phone = c.phone || p.phone; }
  save(); if(sharingOn()) syncSoon();
  contacts(clientId);
}

function contactPrimary(clientId, idx){
  var c = byId(DB.clients, clientId); if(!c || !c.people[idx]) return;
  c.people.forEach(function(x){ x.primary = false; });
  c.people[idx].primary = true; c.who = c.people[idx].name;
  save(); if(sharingOn()) syncSoon(); contacts(clientId);
}

function contactDelete(clientId, idx){
  var c = byId(DB.clients, clientId); if(!c || !c.people[idx]) return;
  if(!confirm('Remove '+c.people[idx].name+'?')) return;
  var wasPrimary = c.people[idx].primary;
  c.people.splice(idx, 1);
  if(wasPrimary && c.people.length){ c.people[0].primary = true; c.who = c.people[0].name; }
  save(); if(sharingOn()) syncSoon(); contacts(clientId);
}

function saveMachine(id){
  var model = $('mcModel').value.trim();
  if(!model) return toast('Model is needed','bad');
  var serial = $('mcSerial').value.trim();
  var was = id ? byId(DB.machines, id) : null;
  if(was && (was.serial||'').trim() && serial !== was.serial)
    return toast('A serial cannot be changed. Cancel this machine and add it again.','bad');
  /* cancelled machines are checked too: a serial exists once, ever */
  var clash = DB.machines.filter(function(x){
    return serial && String(x.serial||'').trim().toLowerCase() === serial.toLowerCase() && x.id !== id; })[0];
  if(clash) return toast('That serial number is already on record' + (clash.cancelled ? ' (on a cancelled machine)' : ''),'bad');

  var m = id ? byId(DB.machines, id) : null;
  if(!m){ m = { id:uid() }; DB.machines.push(m); }
  m.client = $('mcClient').value; m.model = model; m.serial = serial;
  m.dept = $('mcDept').value.trim(); m.place = $('mcPlace').value.trim();
  if(ME.role === 'admin'){
    if($('mcType')) m.mtype = $('mcType').value;
    if($('mcCost')) m.cost = parseFloat($('mcCost').value) || 0;
    if($('mcBought')) m.bought = $('mcBought').value;
    if($('mcRent')) m.rent = parseFloat($('mcRent').value) || 0;
    if($('mcDep')) m.depMonths = parseFloat($('mcDep').value) || 0;
    if($('mcCopy')) m.copyRate = parseFloat($('mcCopy').value) || 0;
    if($('mcMin')) m.minCharge = parseFloat($('mcMin').value) || 0;
  }
  m.site = $('mcSite').value.trim();
  m._at = now();
  logIt('machine',(id?'Edited ':'Added ')+model, serial);
  save(); listMachines(); draw();
  if(sharingOn()) syncSoon();
}

/* The admin removes a person for good. An admin cannot be deleted by a
   non-admin, the last admin cannot be removed, and you cannot delete
   yourself. What the person did (attendance, salary, jobs) stays on record
   under their name; only their account and sign-in go. */
function deleteUser(id){
  var u = byId(DB.users, id);
  if(!u) return;
  if(u.id === ME.id) return toast('You cannot delete your own account','bad');
  if(!userEditAllowed(u, u.role)) return toast('Only an admin can delete an admin','bad');
  if(u.role === 'admin' && DB.users.filter(function(x){ return x.role==='admin' && x.active && x.id!==id; }).length === 0)
    return toast('This is the last admin \u2014 make someone else an admin first','bad');
  if(!confirm('Delete ' + u.name + ' for good? Their record stays under their name, but the account and sign-in are removed.')) return;
  DB.users = DB.users.filter(function(x){ return x.id !== id; });
  DB.deletedUsers = DB.deletedUsers || {};
  DB.deletedUsers[id] = now();               /* so the server drops it on every phone */
  logIt('user','Deleted '+u.name, ROLES[u.role] ? ROLES[u.role].label : '');
  save(); listUsers(); draw();
  if(sharingOn()) syncSoon();
  toast(u.name + ' deleted','good');
}

function saveUser(id){
  var name = $('usName').value.trim();
  var email = $('usEmail').value.trim().toLowerCase();
  if(!name || !email) return toast('Name and user name are both needed','bad');
  var clash = DB.users.filter(function(x){
    return x.email.toLowerCase() === email && x.id !== id; })[0];
  if(clash) return toast('That user name is taken','bad');

  var u = id ? byId(DB.users, id) : null;
  if(!userEditAllowed(u, $('usRole').value))
    return toast('Only an admin can make, or change, an admin','bad');
  var pass = $('usPass').value;
  if(!u){
    /* an operator is on the books for salary; he need not sign in at all */
    if(!pass && $('usRole').value !== 'operator') return toast('Give them a starting password','bad');
    u = { id:uid() }; DB.users.push(u);
  }
  if($('usPhone') && !validPhone($('usPhone').value)) return toast('A phone number has 10 or 11 digits','bad');
  u.name = name; u.email = email; u.role = $('usRole').value;
  if($('usPhone')) u.phone = $('usPhone').value.trim();
  if($('usDob')) u.dob = $('usDob').value;
  u.photo = _usPhoto || '';
  u.active = !!$('usActive').value;
  if(pass){ setPass(u, pass); u.mustChange = true; }
  u._at = now();

  if(!DB.users.filter(function(x){ return x.role==='admin' && x.active; }).length){
    u.role = 'admin'; u.active = true;
    toast('Someone has to be an admin, so this account stays one','bad');
  }
  logIt('user',(id?'Edited ':'Added ')+name, ROLES[u.role].label);
  save(); listUsers();
  if(sharingOn()) syncSoon();
}

/* ============================================================
   WHAT IS SHARED BETWEEN PHONES
   ------------------------------------------------------------
   Everything that more than one person works on. What is left
   off this list stays on the phone it was made on, on purpose:
   prayer records, walk and gym, and habit ticks are nobody else's.

   The first version of this list had three entries and never grew
   as the app did, so parts, users and quotations stayed on the
   phone that made them. That is what this list is for: one place,
   so nothing added later can be left out quietly.
   ============================================================ */
var SYNC_KINDS = [
  ['complaints','invoices'], ['clients','clients'], ['machines','items'],
  ['users','users'],         ['parts','parts'],     ['stock','stock'],
  ['buys','buys'],           ['scrapSales','scrap'],['quotes','quotes'],
  ['calls','calls'],         ['bills','bills'],     ['contracts','contracts'],
  ['models','models'],       ['tasks','tasks'],     ['notes','notes'],
  ['goals','goals'],         ['habits','habits'],     ['visits','visits'],
  ['rights','rights']
];

/* A password never leaves the phone as typed. Only its hash travels. */
function forServer(kind, rec){
  if(kind !== 'users' || rec.pass == null) return rec;
  var copy = Object.assign({}, rec);
  delete copy.pass;
  return copy;
}

var _syncing = false;
function syncNow(quiet){
  if(!sharingOn()) return;
  if(_syncing) return;
  _syncing = true;
  hashOldPasswords();

  var mine = {};
  SYNC_KINDS.forEach(function(p){
    var o = {};
    (DB[p[0]] || []).forEach(function(r){
      if(!r || !r.id) return;
      if(p[0] === 'users' && r.seed && r.mustChange) return;  /* still admin123 */
      o[r.id] = forServer(p[0], r);
    });
    mine[p[1]] = o;
  });

  bridge({ action:'push', records: mine, deletedUsers: DB.deletedUsers || {} })
    .then(function(d){
      if(!d || !d.ok) throw new Error((d && d.msg) || 'refused');
      return bridge({ action:'pull' });
    })
    .then(function(d){
      if(!d || !d.ok) throw new Error((d && d.msg) || 'refused');
      var n = 0;
      SYNC_KINDS.forEach(function(p){
        var local = DB[p[0]] || [], remote = d[p[1]] || {};
        var at = {};
        local.forEach(function(r,i){ if(r && r.id) at[r.id] = i; });
        Object.keys(remote).forEach(function(id){
          var them = remote[id];
          if(!them || typeof them !== 'object') return;
          var i = at[id];
          if(i === undefined){ local.push(them); n++; return; }
          if(String(them._at||'') > String(local[i]._at||'')){
            /* keep a password typed on this phone if the server copy
               only has the hash of an older one */
            local[i] = them; n++;
          }
        });
        DB[p[0]] = local;
      });

      /* the person signed in may have been changed on another phone */
      if(ME){
        var fresh = byId(DB.users, ME.id);
        if(fresh) ME = fresh;
        if(fresh && !fresh.active){ signOut(); toast('This account was switched off.','bad'); }
      }

      DB.share.at = now();
      netWorked();
      topUpNumbers();
      save();
      pullMeters(true);
      phoneNotify();
      phoneConfig();
      try { attFlush(); mdSync(); chatRefreshBadge(); } catch(e){}
      draw();
      if(!quiet) toast(n ? n + ' change(s) came down' : 'Up to date','good');
    })
    .catch(function(e){
      netFailed(e && e.message);
      if(!quiet) toast('Could not sync: ' + e.message,'bad');
    })
    .then(function(){ _syncing = false; });
}

/* ---------- a new phone joining the team ----------
   The people are on the server, not on a new phone, so the phone has to
   reach the server before anybody can sign in. This is the one thing that
   can be done from the sign-in screen. */
/* A connected phone has no use for the Connect button on its sign-in
   screen; only an unconnected one shows it. */
function gateJoinButton(){

  modal('Connect to your server',

      '<input id="jnPass" type="password" autocomplete="off"></div>',
    [{t:'Back',cls:'ghost',f:"closeModal();$('gate').classList.remove('hide')"},
     {t:'Connect',cls:'',f:'doJoin()'}]);
}

function joinUrl(url){
  return String(url).replace(/\/+$/,'') + '/join';
}

function doJoin(){
  var url = $('jnUrl').value.trim();
  var user = $('jnUser').value.trim(), pass = $('jnPass').value;
  if(!url) return toast('Put the server address in','bad');
  if(!user || !pass) return toast('An admin\u2019s user name and password are needed','bad');
  if(!/^https?:\/\//i.test(url)) url = 'http://' + url;
  if(!/\/$/.test(url)) url += '/';

  fetch(joinUrl(url), { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ user:user, pass:pass }) })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j || !j.ok) throw new Error((j && j.msg) || 'refused');
    /* The secret arrives from the server and is kept on this phone only. The
       settings are locked from here on; an admin unlocks them. */
    DB.share.url = url; DB.share.key = j.key; DB.share.on = true;
    DB.share.locked = true;

    /* A new phone's own starting admin is dropped: the team's real accounts
       are about to arrive, and a second admin123 must not join them. */
    DB.users = DB.users.filter(function(u){ return !(u.seed && u.mustChange); });
    return bridge({ action:'pull' });
  })
  .then(function(d){
    if(!d || !d.ok) throw new Error((d && d.msg) || 'refused');
    SYNC_KINDS.forEach(function(p){
      var remote = d[p[1]] || {};
      var local = DB[p[0]] || [];
      var have = {};
      local.forEach(function(r){ if(r && r.id) have[r.id] = 1; });
      Object.keys(remote).forEach(function(id){
        if(!have[id] && remote[id] && typeof remote[id] === 'object')
          local.push(remote[id]);
      });
      DB[p[0]] = local;
    });
    DB.share.at = now();
    save();
    var people = DB.users.filter(function(u){ return u.active; }).length;
    closeModal();
    $('gate').classList.remove('hide');
    gateJoinButton();
    toast('Connected and locked. ' + people + ' account(s) came down \u2014 sign in '+
          'with your own.', 'good');
  })
  .catch(function(e){
    toast('Could not connect: ' + e.message, 'bad');
  });
}

function forgetOnServer(kind, id){
  if(!sharingOn()) return;
  var map = {};
  SYNC_KINDS.forEach(function(p){ map[p[0]] = p[1]; });
  if(!map[kind]) return;
  var ids = {}; ids[map[kind]] = [id];
  bridge({ action:'forget', ids: ids }).catch(function(){});
}

function resumeSession(){
  if(!ME || $('app').style.display === 'block') return;
  $('gate').classList.add('hide');
  $('app').style.display = 'block';
  startApp();
}

/* Served from the Paragon server, the app installs and opens offline. Opened
   from a file it cannot, and nothing here pretends otherwise \u2014 the check
   is simply skipped, and the app works exactly as before. */
function canInstall(){
  return 'serviceWorker' in navigator &&
         /^https?:$/.test(location.protocol);
}

if(canInstall()){
  navigator.serviceWorker.register('/sw.js', { scope:'/' })
    .catch(function(){ /* not fatal: the app still works without it */ });
}

/* Android offers to install. Keep the offer so it can be made at the right
   moment, rather than on top of the sign-in screen. */
var _installOffer = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _installOffer = e;
  try { drawMore(); } catch(err){}
});

function installApp(){
  if(!_installOffer)
    return modal('Install on this phone',
      installHelp(),
      [{t:'Close',cls:'ghost',f:'closeModal()'}]);
  _installOffer.prompt();
  _installOffer.userChoice.then(function(r){
    if(r.outcome === 'accepted') toast('Installed. Find it in your apps.','good');
    _installOffer = null;
    try { drawMore(); } catch(err){}
  });
}

function installHelp(){
  var file = location.protocol === 'file:';
  var plain = location.protocol === 'http:' &&
              !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  return (file
      ? '<div class="note w"><b>This app was opened from a file.</b> A phone '+
        'will only install an app that comes from a server. Open it from the '+
        'Paragon server instead \u2014 the address ends in <code>/app</code>.</div>'
      : plain
        ? '<div class="note w"><b>This connection is not secure (http).</b> '+
          'Phones only offer to install over <b>https</b>. The app works '+
          'perfectly well like this; it just cannot be installed until the '+
          'server has an https address.</div>'
        : '')+
    '<div class="field"><label>Android, Chrome</label>'+
      '<div style="font-size:14px">The three-dot menu, then '+
      '<b>Install app</b>.</div></div>'+
    '<div class="field"><label>iPhone, Safari</label>'+
      '<div style="font-size:14px">The share button, then <b>Add to Home '+
      'Screen</b>.</div></div>'+
    '<div class="help">Either way it gets its own icon and opens full screen, '+
    'with no address bar.</div>';
}

</script>
</body></html>

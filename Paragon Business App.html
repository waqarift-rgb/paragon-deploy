/* ============================================================
   NOTIFICATIONS, IN THE APP
   ------------------------------------------------------------
   A web page cannot wake a phone, so these do not chase anyone.
   They collect what happened while a person was away, and the
   tab carries a count.
   ============================================================ */

function tell(who, what, detail, link){
  if(!who) return;
  DB.notes = DB.notes || [];
  DB.notes.unshift({ id:uid(), to:who, what:what, detail:detail||'',
                     link:link||'', at:now(), read:false, _at:now() });
  if(DB.notes.length > 400) DB.notes.length = 400;
}

function myNotes(){
  return (DB.notes || []).filter(function(n){ return n.to === ME.id; });
}
function unread(){
  return myNotes().filter(function(n){ return !n.read; }).length;
}

function noteCentre(){
  var list = myNotes().slice(0, 40);
  list.forEach(function(n){ n.read = true; });
  save();
  drawTabs();

  modal('What you missed',
    (list.length ? list.map(function(n){
      return '<div class="card'+(n.link?' tap':'')+'"'+
        (n.link ? ' onclick="closeModal();openComplaint(\''+n.link+'\')"' : '')+
        ' style="padding:11px 13px;margin-bottom:8px">'+
        '<div class="ttl">'+esc(n.what)+'</div>'+
        (n.detail ? '<div class="meta">'+esc(n.detail)+'</div>' : '')+
        '<div class="meta">'+ago(n.at)+'</div></div>'; }).join('')
      : '<div class="empty"><span class="ic">\u2713</span>Nothing waiting.</div>'),
    [{t:'Close',cls:'ghost',f:'closeModal()'}]);
}


/* ============================================================
   WHAT HAPPENED TO A QUOTATION
   ------------------------------------------------------------
   Nothing is ever deleted. A wrong quotation is cancelled with a
   reason and stays, because deleted work has no history and no
   explanation.

   Won Elsewhere is neither a win nor a loss for the brand that
   quoted: the client bought from us, just through another name.
   Counting it either way makes the figures lie.
   ============================================================ */

var Q_STATE = {
  pending:  { label:'Pending',       pill:'p-pending'  },
  accepted: { label:'Accepted',      pill:'p-resolved' },
  rejected: { label:'Rejected',      pill:'p-closed'   },
  elsewhere:{ label:'Won elsewhere', pill:'p-parts'    },
  cancelled:{ label:'Cancelled',     pill:'p-closed'   }
};

var WHY_REJECTED = ['Price too high','Went to another supplier','No longer needed',
                    'Budget not approved','No response','Other'];

/* Quotations never expire on their own. ValidUntil prints for the client;
   only a person closes a quotation, because clients say yes after the date
   more often than not. */
function qState(x){ return x.state || 'pending'; }
function qOpen(x){ return qState(x) === 'pending'; }

function markQuote(id, to){
  var x = byId(DB.quotes, id);
  if(!x) return;
  var fields = '';

  if(to === 'rejected')
    fields =
      '<div class="field"><label>Why</label><select id="qsWhy">'+
        WHY_REJECTED.map(function(w){ return '<option>'+esc(w)+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="field"><label>Note</label><textarea id="qsNote" '+
        'placeholder="What they actually said"></textarea></div>';

  if(to === 'elsewhere')
    fields =
      '<div class="note i">The client bought from us, through another of our '+
      'names. It is neither a win nor a loss for this brand.</div>'+
      '<div class="field"><label>Which brand won it</label><select id="qsWho">'+
        Object.keys(BRANDS).filter(function(k){ return k !== x.brand; })
          .map(function(k){ return '<option value="'+k+'">'+esc(BRANDS[k].name)+
            '</option>'; }).join('')+
      '</select></div>';

  if(to === 'cancelled')
    fields =
      '<div class="note w">A cancelled quotation stays in the record. Nothing '+
      'is deleted here.</div>'+
      '<div class="field"><label>Why</label><textarea id="qsNote" '+
        'placeholder="Needed \u2014 this is the only explanation there will be">'+
        '</textarea></div>';

  modal({accepted:'Mark accepted', rejected:'Mark rejected',
         elsewhere:'Won elsewhere', cancelled:'Cancel this quotation'}[to],
    (to === 'accepted'
      ? '<div class="note g">Good. The follow-up chain stops here.</div>' : '') +
    fields,
    [{t:'Back',cls:'ghost',f:"closeModal();openQuote('"+id+"')"},
     {t:'Save',cls: to==='cancelled'?'danger':'', f:"doMarkQuote('"+id+"','"+to+"')"}]);
}

function doMarkQuote(id, to){
  var x = byId(DB.quotes, id);
  if(to === 'rejected'){
    x.why = $('qsWhy').value;
    x.whyNote = ($('qsNote').value||'').trim();
  }
  if(to === 'elsewhere') x.wonBy = $('qsWho').value;
  if(to === 'cancelled'){
    var n = ($('qsNote').value||'').trim();
    if(!n) return toast('A reason is required','bad');
    x.whyNote = n;
  }
  x.state = to;
  x.stateAt = now();
  x.stateBy = ME.name;
  x._at = now();
  logIt('quote', Q_STATE[to].label + ' \u2014 ' + x.no,
        x.why || x.whyNote || (x.wonBy ? BRANDS[x.wonBy].name : ''));
  save(); closeModal(); draw();
  toast(Q_STATE[to].label,'good');
  if(sharingOn()) syncSoon();
}

/* ============================================================
   FOLLOW-UP
   ------------------------------------------------------------
   The most valuable part of the quotation side, because most
   quotations are lost to silence rather than to price.

   A call is only logged against an open quotation. Once it is
   closed the conversation is finished; a client ringing back
   three months later is a new quotation, not another call on a
   dead one.
   ============================================================ */

var MOODS = { good:'Positive', flat:'Neutral', slow:'Slow' };

function callsFor(quoteId){
  return (DB.calls || []).filter(function(c){ return c.quote === quoteId; })
    .sort(function(a,b){ return String(b.on) < String(a.on) ? -1 : 1; });
}

function nextDue(x){
  var list = callsFor(x.id);
  return list.length ? list[0].next : '';
}

function overdue(x){
  if(!qOpen(x)) return false;
  var d = nextDue(x);
  return !!d && new Date(d) < new Date(today());
}

function waitingDays(x){
  return Math.floor((new Date(today()) - new Date(x.date)) / 86400000);
}

/* amber past two weeks, red past a month */
function waitDot(x){
  var d = waitingDays(x);
  if(d > 30) return '<span style="color:var(--red)">\u25CF</span> ';
  if(d > 14) return '<span style="color:var(--amber)">\u25CF</span> ';
  return '';
}

function logCall(id){
  var x = byId(DB.quotes, id);
  if(!qOpen(x))
    return toast('This quotation is closed. A client calling back is a new one.','bad');

  var seven = new Date(Date.now() + 7*86400e3).toISOString().slice(0,10);
  var n = callsFor(id).length + 1;

  modal('Log a call \u2014 follow-up ' + n,
    '<div class="field"><label>When</label>'+
      '<input id="fuOn" type="date" value="'+today()+'"></div>'+
    '<div class="field"><label>What they said</label>'+
      '<textarea id="fuSaid" placeholder="Quotation under review, manager out of '+
      'country. Call after the 10th."></textarea></div>'+
    '<div class="field"><label>How it felt</label><select id="fuMood">'+
      Object.keys(MOODS).map(function(k){
        return '<option value="'+k+'">'+MOODS[k]+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="field"><label>Call again on</label>'+
      '<input id="fuNext" type="date" value="'+seven+'">'+
      '<div class="help">Required. Seven days is only a starting point.</div></div>',
    [{t:'Back',cls:'ghost',f:"closeModal();openQuote('"+id+"')"},
     {t:'Save',cls:'',f:"saveCall('"+id+"')"}]);
}

function saveCall(id){
  var said = ($('fuSaid').value||'').trim();
  var next = $('fuNext').value;
  if(!said) return toast('Write what they said','bad');
  if(!next) return toast('The next date is required','bad');

  DB.calls = DB.calls || [];
  DB.calls.unshift({ id:uid(), quote:id, on:$('fuOn').value || today(),
    said:said, mood:$('fuMood').value, next:next,
    n: callsFor(id).length + 1, by:ME.name, at:now(), _at:now() });

  var x = byId(DB.quotes, id);
  x._at = now();
  logIt('quote','Call logged \u2014 ' + x.no, said.slice(0,50));
  save(); closeModal(); openQuote(id); draw();
  if(sharingOn()) syncSoon();
}

/* three slow readings in a row say more than any status field */
function goingCold(x){
  var last = callsFor(x.id).slice(0,3);
  return last.length === 3 && last.every(function(c){ return c.mood === 'slow'; });
}

function callHistory(x){
  var list = callsFor(x.id);
  if(!list.length) return '';
  return '<div class="sep"></div><label>Calls</label>'+
    (goingCold(x) ? '<div class="note w">Three slow readings in a row. This one '+
      'is going cold.</div>' : '')+
    '<div class="tl">'+list.map(function(c){
      return '<div class="ev on"><b>'+esc(c.said)+'</b><span>'+
        esc(dmy(c.on))+' \u00b7 '+esc(MOODS[c.mood]||'')+
        ' \u00b7 follow-up '+c.n+' \u00b7 next '+esc(dmy(c.next))+'</span></div>';
    }).join('')+'</div>';
}

/* ---------- who needs a call today ---------- */
function needsCall(){
  return (DB.quotes || []).filter(function(x){
    if(!qOpen(x)) return false;
    var d = nextDue(x);
    return !d || new Date(d) <= new Date(today());
  }).sort(function(a,b){ return waitingDays(b) - waitingDays(a); });
}

function callList(){
  var list = needsCall();
  /* grouped by brand, because he is about to pick up the phone and has to
     know which company he is calling as */
  var byBrand = {};
  list.forEach(function(x){ (byBrand[x.brand] = byBrand[x.brand] || []).push(x); });

  modal('Needs a call',
    (list.length
      ? Object.keys(byBrand).map(function(k){
          var b = BRANDS[k];
          return '<label style="color:'+b.c1+';margin:10px 0 8px">'+esc(b.name)+
            '</label>'+ byBrand[k].slice(0,6).map(function(x){
              return '<div class="card tap" onclick="closeModal();openQuote(\''+
                x.id+'\')" style="padding:11px 13px;margin-bottom:7px">'+
                '<div class="row"><div class="grow">'+
                '<div class="ttl">'+esc(nameOf(DB.clients, x.client))+'</div>'+
                '<div class="meta">'+esc(x.no)+' \u00b7 '+
                  (x.type==='rental'?'Rental':'Rs. '+
                    Math.round(quoteTotal(x)).toLocaleString('en-PK'))+'</div>'+
                '<div class="meta">'+waitDot(x)+waitingDays(x)+' day(s) waiting'+
                  (overdue(x)?' \u00b7 follow-up overdue':'')+'</div>'+
                '</div></div></div>'; }).join(''); }).join('')
      : '<div class="empty"><span class="ic">\u2713</span>Nobody is waiting.</div>'),
    [{t:'Close',cls:'ghost',f:'closeModal()'}]);
}

/* ============================================================
   THE MONEY, DONE THE WAY QUOTATIONS ARE ACTUALLY BUILT
   ------------------------------------------------------------
   Real ones are built backwards from a round figure: Rs 1,170,000
   including tax, not Rs 991,525 plus 18%. The app takes either.
   ============================================================ */

function taxFor(type){ return type === 'rental' ? 15 : 18; }

function lineBefore(l, rate){
  var amt = (parseFloat(l.price) || 0) * (parseFloat(l.qty) || 1);
  if(l.enteredAs === 'after') return amt / (1 + rate/100);
  return amt;
}
function lineAfter(l, rate){
  var amt = (parseFloat(l.price) || 0) * (parseFloat(l.qty) || 1);
  if(l.enteredAs === 'after') return amt;
  return amt * (1 + rate/100);
}

/* ============================================================
   QUOTATIONS
   ------------------------------------------------------------
   Three brands, each with its own look. Two types, and tax on or
   off, which together decide the layout that prints.

   A Sales quotation carries a total. A Rental one does not: it
   mixes monthly minimums with one-off charges, and adding those
   together produces a figure nobody quotes.
   ============================================================ */

var BRANDS = {
  paragon: { name:'Paragon Copier Solution', one:'Paragon', two:'Copier Solution',
             c1:'#1C2E4A', c2:'#7A8699', prefix:'PCS-Q',
             site:'www.paragoncopiersolution.com' },
  house:   { name:'Copier House', one:'Copier', two:'House',
             c1:'#C2202E', c2:'#C2202E', prefix:'CH-Q',
             site:'' },
  star:    { name:'Copier Star', one:'Copier', two:'Star',
             c1:'#B8860B', c2:'#B8860B', prefix:'CS-Q',
             site:'' }
};

function quoteNo(brand){
  return takeNumber('q-' + brand, BRANDS[brand].prefix, function(){
    DB.seq.quote = DB.seq.quote || {};
    DB.seq.quote[brand] = (DB.seq.quote[brand] || 0) + 1;
    return DB.seq.quote[brand];
  }, 4);
}

var QT_VIEW = 'quotes';
function qtView(v){ QT_VIEW = v; drawQuotes(); }

function drawQuotes(){
  if(!can('quotes')){
    $('qtList').innerHTML = '<div class="empty"><span class="ic">\u{1F512}</span>'+
      'Quotations, bills and contracts are for the office.</div>';
    if($('qtStrip')) $('qtStrip').innerHTML = '';
    if($('kList')) $('kList').innerHTML = '';
    if($('qtAdd')) $('qtAdd').classList.add('hide');
    return;
  }
  var strip = $('qtStrip');
  if(strip) strip.innerHTML = [
    ['quotes','Quotations',(DB.quotes||[]).length],
    ['bills','Bills',(DB.bills||[]).length],
    ['unpaid','Unpaid',(DB.bills||[]).filter(function(b){
      return b.state !== 'paid'; }).length],
    ['contracts','Contracts',(DB.contracts||[]).filter(function(k){
      return contractState(k) === 'active'; }).length]
  ].map(function(f){
    return '<button class="'+(QT_VIEW===f[0]?'on':'')+'" onclick="qtView(\''+f[0]+
      '\')">'+f[1]+'<span class="c">'+f[2]+'</span></button>'; }).join('');

  $('kStrip').classList.toggle('hide', QT_VIEW !== 'contracts');
  $('kList').innerHTML = '';
  if(QT_VIEW === 'contracts'){
    $('qtList').innerHTML = '';
    $('qtAdd').classList.remove('hide');
    $('qtAdd').textContent = '+ Contract';
    $('qtAdd').onclick = function(){ newContract(); };
    return drawContracts();
  }
  $('qtAdd').textContent = '+ New';
  $('qtAdd').onclick = function(){ newQuote(); };
  if(QT_VIEW !== 'quotes') return drawBills();

  var list = (DB.quotes || []).slice();
  var qs = ($('qtSearch') && $('qtSearch').value || '').toLowerCase().trim();
  if(qs) list = list.filter(function(x){
    return (x.no + ' ' + nameOf(DB.clients, x.client) + ' ' +
            BRANDS[x.brand].name).toLowerCase().indexOf(qs) > -1; });

  $('qtList').innerHTML = list.length ? list.map(function(x){
    var b = BRANDS[x.brand];
    var tot = quoteTotal(x);
    return '<div class="card tap" onclick="openQuote(\'' + x.id + '\')">'+
      '<div class="row"><div class="grow">'+
        '<div class="ttl">'+esc(nameOf(DB.clients, x.client))+'</div>'+
        '<div class="meta"><b style="color:'+b.c1+'">'+esc(b.name)+'</b> \u00b7 '+
          esc(x.type === 'rental' ? 'Rental' : 'Sales')+
          (x.tax ? ' \u00b7 with tax' : '')+'</div>'+
        '<div class="meta"'+(overdue(x)?' style="color:var(--red)"':'')+'>'+
          esc(x.no)+' \u00b7 '+esc(dmy(x.date))+
          (x.type !== 'rental' && tot
            ? ' \u00b7 Rs. '+Math.round(tot).toLocaleString('en-PK') : '')+
          (overdue(x)?' \u00b7 follow-up overdue':'')+'</div>'+
        '<div class="meta">'+waitDot(x)+waitingDays(x)+' day(s) waiting</div>'+
      '</div>'+
      '<span class="pill '+Q_STATE[qState(x)].pill+'">'+
        Q_STATE[qState(x)].label+'</span>'+
      '</div></div>'; }).join('')
    : '<div class="empty"><span class="ic">\u{1F4C4}</span>None yet.</div>';

  $('qtAdd').classList.toggle('hide', !can('complaint.add'));
}

/* Sales adds up. Rental does not, on purpose. */
function drawBills(){
  var list = (DB.bills || []).filter(function(b){
    return QT_VIEW === 'bills' || b.state !== 'paid'; });
  var qs = ($('qtSearch') && $('qtSearch').value || '').toLowerCase().trim();
  if(qs) list = list.filter(function(b){
    return (b.no + ' ' + nameOf(DB.clients, b.client)).toLowerCase()
      .indexOf(qs) > -1; });

  $('qtList').innerHTML = list.length ? list.map(function(b){
    var job = byId(DB.complaints, b.job);
    return '<div class="card tap" onclick="openBill(\''+b.id+'\')">'+
      '<div class="row"><div class="grow">'+
        '<div class="ttl">'+esc(nameOf(DB.clients, b.client))+'</div>'+
        '<div class="meta">'+esc(b.no)+' \u00b7 '+esc(dmy(b.date))+
          (job ? ' \u00b7 '+esc(job.no) : '')+'</div>'+
        '<div class="meta">Rs. '+Math.round(billTotal(b)).toLocaleString('en-PK')+
          ' \u00b7 '+esc(DEALS[b.deal||'cash'].label)+'</div>'+
      '</div><span class="pill '+(b.state==='paid'?'p-resolved':'p-pending')+'">'+
        (b.state==='paid'?'Paid':'Open')+'</span></div></div>'; }).join('')
    : '<div class="empty"><span class="ic">\u{1F9FE}</span>'+
      (QT_VIEW==='unpaid'?'Nothing outstanding.':'No bills yet. They are raised '+
      'from a finished job.')+'</div>';

  $('qtAdd').classList.add('hide');
}

function quoteTotal(x){
  if(x.type === 'rental') return 0;
  var rate = parseFloat(x.taxPct);
  if(!rate && rate !== 0) rate = taxFor(x.type);
  var n = 0;
  (x.lines||[]).forEach(function(l){ n += lineBefore(l, rate); });
  return n;
}
function quoteTax(x){
  if(x.type === 'rental' || !x.tax) return 0;
  var rate = parseFloat(x.taxPct);
  if(!rate && rate !== 0) rate = taxFor(x.type);
  return quoteTotal(x) * (rate / 100);
}

function newQuote(){
  if(!can('complaint.add')) return toast('Only the office writes quotations','bad');
  if(!DB.clients.length) return toast('Add a client first','bad');
  openQuoteForm(null);
}

function openQuoteForm(id){
  var x = id ? byId(DB.quotes||[], id) : null;
  modal(x ? 'Edit ' + x.no : 'New quotation',
    '<div class="field"><label>Brand</label><select id="qfBrand">'+
      Object.keys(BRANDS).map(function(k){
        return '<option value="'+k+'"'+(x&&x.brand===k?' selected':'')+'>'+
               esc(BRANDS[k].name)+'</option>'; }).join('')+'</select></div>'+
    '<div class="field"><label>Client</label>'+
      '<select id="qfClient" onchange="qfBrandFollows()">'+
      DB.clients.map(function(c){
        return '<option value="'+c.id+'" data-brand="'+esc(c.brand||'paragon')+'"'+
               (x&&x.client===c.id?' selected':'')+'>'+
               esc(c.name)+'</option>'; }).join('')+'</select>'+
      '<div class="help">Choosing a client sets the company to the one he '+
      'belongs to. Change it above if this one is going out under another '+
      'name.</div></div>'+
    '<div class="two">'+
      '<div class="field"><label>Type</label><select id="qfType">'+
        '<option value="sales"'+(x&&x.type==='sales'?' selected':'')+'>Sales</option>'+
        '<option value="rental"'+(x&&x.type==='rental'?' selected':'')+'>Rental</option>'+
      '</select></div>'+
      '<div class="field"><label>Tax</label><select id="qfTax">'+
        '<option value="1"'+(!x||x.tax?' selected':'')+'>applicable</option>'+
        '<option value="">not applicable</option>'+
      '</select></div>'+
    '</div>'+
    '<div class="field"><label>Date</label>'+
      '<input id="qfDate" type="date" value="'+(x?x.date:today())+'"></div>'+
    '<div class="field"><label>Valid until</label>'+
      '<input id="qfValid" type="date" value="'+(x?x.valid||'':'')+'">'+
      '<div class="help">Prints for the client. Nothing expires on its own \u2014 '+
      'only a person closes a quotation.</div></div>'+
    '<div class="field"><label>Reference</label>'+
      '<input id="qfRef" value="'+esc(x?x.ref:'')+'" placeholder="their enquiry no"></div>'+
    '<div class="field"><label>Terms</label>'+
      '<textarea id="qfTerms" placeholder="Payment, delivery, warranty">'+
        esc(x ? x.terms : defaultTerms())+'</textarea></div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t: x?'Save':'Create', cls:'', f:'saveQuote(' + (x?"'"+x.id+"'":'null') + ')'}]);
}

function defaultTerms(){
  return 'Prices are valid for 15 days from the date of this quotation.\n'+
         'Delivery within 7 working days of a confirmed order.\n'+
         'Payment 50% in advance, balance on delivery.';
}

/* A client belongs to a company, so a quotation for him starts there. It can
   still be changed, because the same client is sometimes quoted under another
   of the three. */
function qfBrandFollows(){
  var sel = $('qfClient');
  var opt = sel.options[sel.selectedIndex];
  if(opt && opt.dataset.brand) $('qfBrand').value = opt.dataset.brand;
}

function saveQuote(id){
  DB.quotes = DB.quotes || [];
  var x = id ? byId(DB.quotes, id) : null;
  var brand = $('qfBrand').value;
  if(!x){
    x = { id:uid(), no:quoteNo(brand), brand:brand, lines:[], at:now() };
    DB.quotes.unshift(x);
  }
  x.brand  = brand;
  x.client = $('qfClient').value;
  x.type   = $('qfType').value;
  x.tax    = !!$('qfTax').value;
  if(!id) x.taxPct = taxFor(x.type);   /* frozen at creation */
  x.date   = $('qfDate').value || today();
  x.ref    = $('qfRef').value.trim();
  x.valid  = $('qfValid').value || '';
  x.terms  = $('qfTerms').value;
  x.by     = ME.id; x.byName = ME.name;
  x._at    = now();
  logIt('quote',(id?'Edited ':'Wrote ')+x.no, nameOf(DB.clients, x.client));
  save(); closeModal(); draw();
  if(!id) openQuote(x.id);
  if(sharingOn()) syncSoon();
}

function openQuote(id){
  var x = byId(DB.quotes||[], id);
  if(!x) return;

  modal(x.no,

      '<div class="ttl" style="color:'+b.c1+'">'+esc(b.name)+'</div>'+
      '<div class="meta">'+esc(nameOf(DB.clients, x.client))+' \u00b7 '+
        esc(dmy(x.date))+'</div></div>'+
      '<span class="pill '+Q_STATE[qState(x)].pill+'">'+
        Q_STATE[qState(x)].label+'</span></div>'+

    '<div class="meta" style="margin:-6px 0 12px">'+
      (rental?'Rental':'Sales')+(x.tax?' \u00b7 tax '+(x.taxPct||taxFor(x.type))+'%':'')+
      (x.valid?' \u00b7 valid to '+esc(dmy(x.valid)):'')+
      ' \u00b7 '+waitDot(x)+waitingDays(x)+' day(s) since it went out</div>'+

    (x.why ? '<div class="note w"><b>'+esc(x.why)+'</b>'+
      (x.whyNote?' \u2014 '+esc(x.whyNote):'')+'</div>' : '')+
    (x.wonBy ? '<div class="note i">Won by <b>'+esc(BRANDS[x.wonBy].name)+
      '</b> \u2014 kept in the business, neither a win nor a loss here.</div>' : '')+
    (qState(x)==='cancelled' && x.whyNote
      ? '<div class="note d">Cancelled \u2014 '+esc(x.whyNote)+'</div>' : '')+
    (overdue(x) ? '<div class="note d">The follow-up is overdue.</div>' : '')+

    ((x.lines||[]).length
      ? (x.lines||[]).map(function(l, i){
          return '<div class="card" style="padding:10px 12px;margin-bottom:7px">'+
            '<div class="row"><div class="grow">'+
            '<div style="font-size:13.5px;font-weight:600">'+
              (l.n||i+1)+'. '+esc(l.desc)+'</div>'+
            (l.machine ? '<div class="meta">'+esc(l.machine)+'</div>' : '')+
            (modelNamed(l.machine) && modelNamed(l.machine).features
              ? '<div class="meta">'+esc(modelNamed(l.machine).features.slice(0,60))+
                '\u2026</div>' : '')+
            '<div class="meta">'+
              (rental
                ? esc(l.rate||'') + ' per copy \u00b7 ' + esc(l.copies||'') +
                  ' copies \u00b7 monthly minimum Rs. ' +
                  Number(l.price||0).toLocaleString('en-PK')
                : (l.qty||1) + ' \u00d7 Rs. ' +
                  Number(l.price||0).toLocaleString('en-PK') + ' = Rs. ' +
                  ((l.qty||1) * (l.price||0)).toLocaleString('en-PK'))+
            '</div></div>'+
            (can('complaint.add')
              ? '<div style="display:flex;gap:5px">'+
                (i > 0 ? '<button class="btn sm ghost" onclick="moveLine(\''+x.id+
                  '\','+i+',-1)">\u2191</button>' : '')+
                (i < (x.lines||[]).length-1 ? '<button class="btn sm ghost" '+
                  'onclick="moveLine(\''+x.id+'\','+i+',1)">\u2193</button>' : '')+
                '<button class="btn sm danger" onclick="dropQLine(\''+x.id+'\','+i+

      : '<div class="empty" style="padding:22px">No lines yet.</div>')+

        (x.tax ? '<div class="row" style="margin-top:5px">'+

          '<div class="grow">Payable</div><div>Rs. '+

          '</div></div>' : '')
      : '')+

      'total: each line carries its own monthly minimum, and one-off charges do not '+
      'add to them meaningfully.</div>' : '')+
    callHistory(x),

    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(qOpen(x) && can('complaint.add')

/* Closing a quotation is deliberate: each of these opens a form rather than
   firing on one tap, because a one-tap close is how the wrong one gets closed. */
function quoteActions(id){
  var x = byId(DB.quotes, id);
  modal('What happened to ' + x.no + '?',
    '<div class="note i">Nothing is deleted here. A quotation that should not '+
    'exist is cancelled with a reason and stays in the record.</div>',
    [{t:'Back',cls:'ghost',f:"closeModal();openQuote('"+id+"')"},
     {t:'Accepted',cls:'green',f:"markQuote('"+id+"','accepted')"},
     {t:'Rejected',cls:'danger',f:"markQuote('"+id+"','rejected')"},
     {t:'Won elsewhere',cls:'ghost',f:"markQuote('"+id+"','elsewhere')"},
     {t:'Cancel it',cls:'danger',f:"markQuote('"+id+"','cancelled')"}]);
}

function addQLine(id){
  var x = byId(DB.quotes, id);
  var rental = x.type === 'rental';
  modal('Add a line',
    '<div class="field"><label>Description</label>'+
      '<input id="qlDesc" placeholder="'+(rental
        ? 'Monthly minimum print without papers' : 'Ricoh MP 3055')+'"></div>'+
    '<div class="field"><label>Machine</label>'+
      '<input id="qlMachine" placeholder="Ricoh MP 3055"></div>'+
    (rental
      ? '<div class="two">'+
          '<div class="field"><label>Rate per copy</label>'+
            '<input id="qlRate" placeholder="1.50"></div>'+
          '<div class="field"><label>Copies</label>'+
            '<input id="qlCopies" placeholder="5,000"></div>'+
        '</div>'+
        '<div class="field"><label>Monthly minimum</label>'+
          '<input id="qlPrice" type="number" inputmode="decimal"></div>'
      : '<div class="two">'+
          '<div class="field"><label>How many</label>'+
            '<input id="qlQty" type="number" inputmode="numeric" value="1"></div>'+
          '<div class="field"><label>Price each</label>'+
            '<input id="qlPrice" type="number" inputmode="decimal"></div>'+

        'out.</div></div>')+
    '<div class="field"><label>What kind of thing</label><select id="qlCat">'+
      ['machine','part','toner','service','other'].map(function(k){
        return '<option value="'+k+'">'+k+'</option>'; }).join('')+
      '</select><div class="help">Never printed. A year later it tells you which '+
      'kind of quotation actually wins.</div></div>',
    [{t:'Back',cls:'ghost',f:"closeModal();openQuote('"+id+"')"},
     {t:'Add',cls:'',f:"saveQLine('"+id+"')"}]);
}

function saveQLine(id){
  var x = byId(DB.quotes, id);
  var desc = $('qlDesc').value.trim();
  if(!desc) return toast('A description is needed','bad');
  var l = { desc:desc, machine:$('qlMachine').value.trim() || '\u2014',
            cat: $('qlCat') ? $('qlCat').value : 'other',
            price: parseFloat($('qlPrice').value) || 0 };
  if(x.type === 'rental'){
    l.rate = $('qlRate').value.trim();
    l.copies = $('qlCopies').value.trim();
  } else {
    l.qty = parseInt($('qlQty').value,10) || 1;
    l.enteredAs = $('qlAs').value;
  }
  x.lines = x.lines || [];
  x.lines.push(l);
  reorder(x.lines);          /* nobody types a serial number */
  x._at = now();
  save(); closeModal(); openQuote(id); draw();
  if(sharingOn()) syncSoon();
}

function dropQLine(id, i){
  var x = byId(DB.quotes, id);
  x.lines.splice(i,1);
  reorder(x.lines);          /* and close up when one is taken out */
  x._at = now();
  save(); closeModal(); openQuote(id); draw();
}

/* ============================================================
   TASKS AND MEETINGS
   ------------------------------------------------------------
   For the people who run the business, not the field. A task
   given to somebody is only theirs once they accept it: until
   then it is a request, and saying so keeps both people honest
   about who is actually doing it.
   ============================================================ */

var T_STATE = {
  offered: { label:'Offered',  pill:'p-pending'  },
  mine:    { label:'Accepted', pill:'p-started'  },
  done:    { label:'Done',     pill:'p-resolved' },
  turned:  { label:'Declined', pill:'p-closed'   }
};

function owners(){
  return DB.users.filter(function(u){
    return u.active && (u.role === 'admin' || u.role === 'supervisor'); });
}

function canTasks(){ return !!ME && (ME.role === 'admin' || ME.role === 'supervisor'); }

function myTasks(){
  return (DB.tasks || []).filter(function(t){
    return t.to === ME.id || t.by === ME.id ||
           (t.kind === 'meeting' && (t.who||[]).indexOf(ME.id) > -1); });
}

function taskDue(t){
  if(!t.when) return '';
  var d = new Date(t.when);
  if(isNaN(d)) return '';
  var days = Math.floor((d - new Date()) / 86400000);
  if(t.state === 'done') return dmy(t.when);
  if(days < 0)  return 'overdue by ' + Math.abs(days) + ' day(s)';
  if(days === 0) return 'today';
  if(days === 1) return 'tomorrow';
  return 'in ' + days + ' days';
}

function drawTasks(){
  if(ME && ME.role === 'helper'){
    var mineH = (DB.tasks || []).filter(function(t){
      return t.to === ME.id && t.state !== 'done' && t.state !== 'turned'; });
    $('tkBody').innerHTML = '<label style="margin-bottom:9px">Your work</label>' +
      (mineH.length ? mineH.map(taskCard).join('')
        : '<div class="empty"><span class="ic">\u2713</span>Nothing waiting for you.</div>');
    return;
  }
  if(!canTasks()){
    $('tkBody').innerHTML = '<div class="empty"><span class="ic">\u{1F512}</span>'+
      'Tasks are for the people running the business.</div>';
    return;
  }
  var all = myTasks();
  var offered = all.filter(function(t){ return t.state === 'offered' && t.to === ME.id; });
  var mine    = all.filter(function(t){ return t.state === 'mine' && t.to === ME.id; });
  var late    = mine.filter(function(t){
    return t.when && new Date(t.when) < new Date() && t.kind !== 'meeting'; });
  var soon    = all.filter(function(t){
    return t.kind === 'meeting' && t.state !== 'done' &&
           (!t.when || new Date(t.when) >= new Date(Date.now() - 86400e3)); });

  $('tkBody').innerHTML =
    '<div class="tiles">'+
      tile('a', offered.length, 'Offered to you', "tkFilter('offered')")+
      tile('b', mine.length, 'Yours', "tkFilter('mine')")+
      tile('r', late.length, 'Overdue', "tkFilter('late')")+
      tile('g', soon.length, 'Meetings', "tkFilter('meet')")+
    '</div>'+

    (offered.length ? '<label style="margin-bottom:9px">Waiting for you to accept</label>'+
      offered.map(taskCard).join('')+'<div class="sep"></div>' : '')+

    '<div class="strip" id="tkStrip"></div>'+
    '<div id="tkList"></div>';

  tkStrip();
}

var TK_VIEW = 'open';
function tkFilter(v){ TK_VIEW = v; drawTasks(); }

function tkStrip(){
  var counts = { open:0, mine:0, offered:0, late:0, meet:0, done:0 };
  myTasks().forEach(function(t){
    if(t.state === 'done') counts.done++; else counts.open++;
    if(t.state === 'mine' && t.to === ME.id) counts.mine++;
    if(t.state === 'offered' && t.to === ME.id) counts.offered++;
    if(t.state === 'mine' && t.when && new Date(t.when) < new Date() &&
       t.kind !== 'meeting') counts.late++;
    if(t.kind === 'meeting' && t.state !== 'done') counts.meet++;
  });

  $('tkStrip').innerHTML = [
    ['open','Open'], ['mine','Yours'], ['offered','Offered'],
    ['late','Overdue'], ['meet','Meetings'], ['done','Done']
  ].map(function(f){
    return '<button class="'+(TK_VIEW===f[0]?'on':'')+'" onclick="tkFilter(\''+f[0]+
      '\')">'+f[1]+'<span class="c">'+counts[f[0]]+'</span></button>'; }).join('');

  var list = myTasks().filter(function(t){
    if(TK_VIEW === 'open')    return t.state !== 'done';
    if(TK_VIEW === 'mine')    return t.state === 'mine' && t.to === ME.id;
    if(TK_VIEW === 'offered') return t.state === 'offered' && t.to === ME.id;
    if(TK_VIEW === 'late')    return t.state === 'mine' && t.when &&
                                     new Date(t.when) < new Date() && t.kind !== 'meeting';
    if(TK_VIEW === 'meet')    return t.kind === 'meeting' && t.state !== 'done';
    if(TK_VIEW === 'done')    return t.state === 'done';
    return true;
  }).sort(function(a,b){ return String(a.when||'z') < String(b.when||'z') ? -1 : 1; });

  $('tkList').innerHTML = list.length ? list.map(taskCard).join('')
    : '<div class="empty"><span class="ic">\u2713</span>Nothing here.</div>';
}

function taskCard(t){
  var s = T_STATE[t.state];
  var late = t.state === 'mine' && t.when && new Date(t.when) < new Date() &&
             t.kind !== 'meeting';
  return '<div class="card tap" onclick="openTask(\'' + t.id + '\')">'+
    '<div class="row"><div class="grow">'+
      '<div class="ttl">'+(t.kind==='meeting'?'\u{1F5D3} ':'')+esc(t.what)+'</div>'+
      (t.detail ? '<div class="meta">'+esc(t.detail.slice(0,80))+
        (t.detail.length>80?'\u2026':'')+'</div>' : '')+
      '<div class="meta">'+
        (t.kind === 'meeting'
          ? esc(dtime(t.when)) + ' \u00b7 ' +
            (t.who||[]).map(function(i){ return esc(nameOf(DB.users,i)); }).join(', ')
          : (t.to === ME.id ? 'from ' + esc(nameOf(DB.users,t.by))
                            : 'to ' + esc(nameOf(DB.users,t.to))) +
            (t.when ? ' \u00b7 ' + esc(taskDue(t)) : '') +
            (t.every ? ' \u00b7 ' + esc(t.every) : ''))+
      '</div>'+
    '</div><div style="display:flex;flex-direction:column;gap:4px;'+
      'align-items:flex-end">'+
      '<span class="pill '+(late?'p-high':s.pill)+'">'+
        (late?'Overdue':s.label)+'</span>'+moveFlag(t)+
    '</div></div></div>';
}

function newTask(kind){
  if(!canTasks()) return toast('Tasks are for the people running the business','bad');
  var meeting = kind === 'meeting';
  var people = owners().concat(meeting ? [] : DB.users.filter(function(u){
    return u.active && u.role === 'helper'; }));

  modal(meeting ? 'New meeting' : 'New task',
    '<div class="field"><label>'+(meeting?'What is it about':'What has to be done')+
      '</label><input id="tfWhat"></div>'+
    '<div class="field"><label>Detail</label><textarea id="tfDetail"></textarea></div>'+
    (meeting
      ? '<div class="field"><label>When</label>'+
          '<input id="tfWhen" type="datetime-local"></div>'+
        '<div class="field"><label>Where</label>'+
          '<input id="tfWhere" placeholder="Office, or a client site"></div>'+
        '<div class="field"><label>Who is coming</label>'+
          people.map(function(u){
            return '<label style="display:flex;gap:9px;align-items:center;'+
              'font-weight:400;padding:6px 0"><input type="checkbox" class="tfWho" '+
              'value="'+u.id+'"'+(u.id===ME.id?' checked':'')+
              ' style="width:auto">'+esc(u.name)+'</label>'; }).join('')+
        '</div>'
      : '<div class="field"><label>Who is it for</label><select id="tfTo">'+
          people.map(function(u){
            return '<option value="'+u.id+'"'+(u.id===ME.id?' selected':'')+'>'+
                   esc(u.name)+(u.id===ME.id?' (you)':'')+'</option>'; }).join('')+
          '</select><div class="help">Somebody else has to accept it before it '+
          'becomes theirs.</div></div>'+
        '<div class="field"><label>By when</label>'+
          '<input id="tfWhen" type="date"></div>'+
        '<div class="field"><label>Repeats</label><select id="tfEvery">'+
          '<option value="">once</option>'+
          '<option value="every day">every day</option>'+
          '<option value="every week">every week</option>'+
          '<option value="every two weeks">every two weeks</option>'+
          '<option value="every month">every month</option>'+
        '</select></div>'),
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:meeting?'Set it':'Give it', cls:'', f:"saveTask('"+(meeting?'meeting':'task')+"')"}]);
}

function saveTask(kind){
  var what = $('tfWhat').value.trim();
  if(!what) return toast('Say what it is','bad');
  DB.tasks = DB.tasks || [];

  var t = { id:uid(), kind:kind, what:what,
            detail:$('tfDetail').value.trim(),
            when:$('tfWhen').value || '',
            by:ME.id, at:now(), _at:now(), notes:[] };

  if(kind === 'meeting'){
    t.where = $('tfWhere').value.trim();
    t.who = Array.prototype.map.call(document.querySelectorAll('.tfWho:checked'),
              function(b){ return b.value; });
    t.state = 'mine';
    if(!t.who.length) return toast('Nobody is coming','bad');
    t.who.forEach(function(i){
      if(i !== ME.id)
        tell(i, 'A meeting was set', what + ' \u00b7 ' + dtime(t.when)); });
  } else {
    t.to = $('tfTo').value;
    t.every = $('tfEvery').value;
    /* something you give yourself is already yours */
    t.state = t.to === ME.id ? 'mine' : 'offered';
    if(t.to !== ME.id)
      tell(t.to, 'A task was offered to you', what);
  }

  DB.tasks.unshift(t);
  logIt('task',(kind==='meeting'?'Set a meeting: ':'Gave a task: ')+what,
        kind==='meeting' ? '' : nameOf(DB.users, t.to));
  save(); closeModal(); draw();
  toast(kind==='meeting'?'Meeting set':'Given','good');
  if(sharingOn()) syncSoon();
}

/* Monthly keeps the day of the month, clamped where the next month is shorter. */
function nextDate(from, every){
  var d = new Date(from);
  if(isNaN(d)) return from;
  if(every === 'every day')       d.setDate(d.getDate() + 1);
  else if(every === 'every week') d.setDate(d.getDate() + 7);
  else if(every === 'every two weeks') d.setDate(d.getDate() + 14);
  else if(every === 'every month'){
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
  }
  return d.toISOString().slice(0,10);
}

function endTask(id){
  var t = byId(DB.tasks, id);
  t.state = 'done'; t.done = now(); t._at = now();

  /* The next one is worked out from this task's own due date, never from the
     day it was finished. Otherwise a task done three days late pushes every
     future one later, and a monthly chore drifts out of its month in a year. */
  if(t.every && t.when){
    var d = nextDate(t.when, t.every);
    DB.tasks.unshift(Object.assign({}, t, {
      id:uid(),
      /* his own repeating chore comes back accepted; asking a man to accept
         his own monthly chore every month is friction with no purpose. A
         brother's assignment comes back to be accepted, because he agreed to
         one task, not to an endless series. */
      state: t.to === t.by ? 'mine' : 'offered',
      done:'', notes:[], moves:0, moveLog:[],
      when: d, at:now(), _at:now() }));
  }
  if(t.by !== ME.id) tell(t.by, 'A task was finished', t.what + ' \u00b7 ' + ME.name);
  logIt('task','Finished: ' + t.what, '');
  save(); closeModal(); draw();
  toast(t.every ? 'Done. The next one is waiting.' : 'Done','good');
  if(sharingOn()) syncSoon();
}

/* ============================================================
   PRAYERS
   ------------------------------------------------------------
   Each person enters his own times. Two people may follow mosques
   that differ by minutes and both are right, so there is no API,
   no calculated times and no daily fetch.

   There is no count of missed prayers and no streak. This is
   between a person and their faith. The app's only job is the
   reminder and the tap.
   ============================================================ */

var PRAYERS = ['Fajr','Zuhr','Asr','Maghrib','Isha'];

function prayerTimes(){
  DB.prayers = DB.prayers || {};
  DB.prayers[ME.id] = DB.prayers[ME.id] || {};
  return DB.prayers[ME.id];
}

function prayedToday(){
  DB.prayed = DB.prayed || {};
  var k = ME.id + '|' + today();
  DB.prayed[k] = DB.prayed[k] || {};
  return DB.prayed[k];
}

function tapPrayer(name){
  var p = prayedToday();
  if(p[name]) delete p[name]; else p[name] = now();
  save(); drawDay();
}

function nextPrayer(){
  var t = prayerTimes(), p = prayedToday();
  var nowMin = new Date().getHours()*60 + new Date().getMinutes();
  var best = null;
  PRAYERS.forEach(function(k){
    var v = t[k] && t[k].at;
    if(!v) return;
    var bits = v.split(':');
    var m = parseInt(bits[0],10)*60 + parseInt(bits[1],10);
    if(m >= nowMin && (!best || m < best.m)) best = { k:k, m:m };
  });
  if(!best) return '';
  var gap = best.m - nowMin;
  var h = Math.floor(gap/60), mm = gap % 60;
  return best.k + ' in ' + (h ? h + ' hour' + (h>1?'s':'') + ' ' : '') +
         mm + ' minute' + (mm===1?'':'s');
}

function prayerCards(){
  var t = prayerTimes(), p = prayedToday();
  var nowMin = new Date().getHours()*60 + new Date().getMinutes();
  var nextK = '';
  var bestM = 1e9;
  PRAYERS.forEach(function(k){
    var v = t[k] && t[k].at; if(!v) return;
    var b = v.split(':'); var m = parseInt(b[0],10)*60 + parseInt(b[1],10);
    if(m >= nowMin && m < bestM){ bestM = m; nextK = k; }
  });

  return '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">'+
    PRAYERS.map(function(k){
      var done = !!p[k];
      var at = (t[k] && t[k].at) || '';
      /* an untouched card looks exactly like one whose time has not come */
      return '<div onclick="tapPrayer(\''+k+'\')" style="cursor:pointer;'+
        'text-align:center;padding:9px 3px;border-radius:7px;'+
        'border:'+(k===nextK?'2px solid var(--blue)':'1px solid var(--line)')+';'+
        'background:'+(done?'var(--blue)':'#fff')+';'+
        'color:'+(done?'#fff':'var(--ink)')+'">'+
        '<div style="font-size:11.5px;font-weight:600">'+k+'</div>'+
        '<div style="font-size:11px;opacity:.75;margin-top:2px">'+
          (at || '\u2014')+'</div></div>'; }).join('')+
    '</div>'+
    (nextPrayer() ? '<div class="help" style="text-align:center;margin-top:8px">'+
      esc(nextPrayer())+'</div>' : '');
}

function prayerSetup(){
  var t = prayerTimes();
  modal('Prayer times',
    '<div class="note i">Your own times, not a calculation. Two people may follow '+
    'mosques that differ by minutes and both are right.</div>'+
    PRAYERS.map(function(k){
      var v = t[k] || {};
      return '<div class="card" style="padding:11px 13px;margin-bottom:8px">'+
        '<label>'+k+'</label>'+
        '<div class="two">'+
          '<div class="field" style="margin-bottom:0"><label>At</label>'+
            '<input class="prAt" data-k="'+k+'" type="time" value="'+
            esc(v.at||'')+'"></div>'+
          '<div class="field" style="margin-bottom:0"><label>Remind before</label>'+
            '<select class="prBefore" data-k="'+k+'">'+
              [0,5,10,15,20,30].map(function(m){
                return '<option value="'+m+'"'+((v.before||0)==m?' selected':'')+'>'+
                  (m ? m + ' min' : 'at the time')+'</option>'; }).join('')+
            '</select></div>'+
        '</div></div>'; }).join(''),
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Save',cls:'',f:'savePrayers()'}]);
}

function savePrayers(){
  var t = prayerTimes();
  Array.prototype.forEach.call(document.querySelectorAll('.prAt'), function(el){
    t[el.dataset.k] = t[el.dataset.k] || {};
    t[el.dataset.k].at = el.value;
  });
  Array.prototype.forEach.call(document.querySelectorAll('.prBefore'), function(el){
    t[el.dataset.k] = t[el.dataset.k] || {};
    t[el.dataset.k].before = parseInt(el.value,10) || 0;
  });
  save(); closeModal(); drawDay();
  toast('Saved','good');

/* ============================================================
   WALK AND GYM
   ------------------------------------------------------------
   Neither has a target. The app records what happened; it does
   not set a goal or compare against one.

   The dots are not a streak to protect. Four out of seven is an
   honest picture. Nothing turns red, nothing warns, nothing
   congratulates.
   ============================================================ */

function logbook(kind){
  DB.moved = DB.moved || {};
  var k = ME.id + '|' + kind;
  DB.moved[k] = DB.moved[k] || [];
  return DB.moved[k];
}

function didIt(kind, on){
  return logbook(kind).some(function(r){ return r.on === (on || today()); });
}

function markWalk(){
  modal('Walk',
    '<div class="note i">Marking it done is enough. The rest is optional.</div>'+
    '<div class="two">'+
      '<div class="field"><label>Distance</label>'+
        '<input id="wkKm" placeholder="3 km"></div>'+
      '<div class="field"><label>Minutes</label>'+
        '<input id="wkMin" type="number" inputmode="numeric"></div>'+
    '</div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Done',cls:'green',f:'saveWalk()'}]);
}

function saveWalk(){
  var b = logbook('walk');
  b.unshift({ on:today(), km:$('wkKm').value.trim(),
              min:parseInt($('wkMin').value,10) || 0, at:now() });
  save(); closeModal(); drawDay();
  toast('Recorded','good');
}

function markGym(){
  var b = logbook('gym');
  if(didIt('gym')) return toast('Already recorded today','good');
  b.unshift({ on:today(), at:now() });
  save(); drawDay();
  toast('Recorded','good');
}

/* seven dots: filled where it happened, hollow where it did not */
function sevenDots(kind){
  var out = [];
  for(var i = 6; i >= 0; i--){
    var d = new Date(Date.now() - i*86400e3).toISOString().slice(0,10);
    var on = didIt(kind, d);
    out.push('<span style="display:inline-block;width:9px;height:9px;'+
      'border-radius:50%;margin-right:5px;'+
      (on ? 'background:var(--ink-2)' : 'border:1px solid var(--line)')+'"></span>');
  }
  return out.join('');
}

function lastTime(kind){
  var b = logbook(kind);
  if(!b.length) return 'not yet';
  var r = b[0];
  return dmy(r.on) + (r.km ? ' \u00b7 ' + esc(r.km) : '') +
         (r.min ? ' \u00b7 ' + r.min + ' min' : '');
}

/* ============================================================
   THE DAY
   ============================================================ */

function drawDay(){
  var box = $('dayBox');
  if(!box) return;
  if(!canTasks()){ box.innerHTML = ''; return; }

  var meetings = (DB.tasks||[]).filter(function(t){
    return t.kind === 'meeting' && t.state !== 'done' && t.when &&
           String(t.when).slice(0,10) === today() &&
           (t.who||[]).indexOf(ME.id) > -1; });

  var due = (DB.tasks||[]).filter(function(t){
    return t.kind !== 'meeting' && t.state === 'mine' && t.to === ME.id &&
           t.when && t.when <= today(); });

  box.innerHTML =
    '<div class="card"><div class="row" style="align-items:center;margin-bottom:9px">'+
      '<label class="grow" style="margin:0">Prayers</label>'+
      '<button class="btn sm ghost" onclick="prayerSetup()">Times</button></div>'+
      prayerCards()+'</div>'+

    '<div class="card"><div class="row">'+
      '<div class="grow"><div class="ttl">Walk</div>'+
      '<div class="meta">'+esc(lastTime('walk'))+'</div>'+
      '<div style="margin-top:7px">'+sevenDots('walk')+'</div></div>'+
      '<button class="btn sm '+(didIt('walk')?'ghost':'')+'" onclick="markWalk()">'+
        (didIt('walk')?'Again':'Done')+'</button></div></div>'+

    '<div class="card"><div class="row">'+
      '<div class="grow"><div class="ttl">Gym</div>'+
      '<div class="meta">'+esc(lastTime('gym'))+'</div>'+
      '<div style="margin-top:7px">'+sevenDots('gym')+'</div></div>'+
      '<button class="btn sm '+(didIt('gym')?'ghost':'')+'" onclick="markGym()">'+
        (didIt('gym')?'\u2713':'Done')+'</button></div></div>'+

    (meetings.length ? '<label style="margin:14px 0 9px">Today</label>'+
      meetings.map(taskCard).join('') : '')+
    (due.length ? '<label style="margin:14px 0 9px">Due</label>'+
      due.slice(0,5).map(taskCard).join('') : '');
}

/* ============================================================
   LINE ORDER
   ------------------------------------------------------------
   Nobody types a serial number, and it has to close up properly
   when a line in the middle is taken out.
   ============================================================ */

function reorder(list){
  (list || []).forEach(function(l, i){ l.n = i + 1; });
  return list;
}

function moveLine(quoteId, i, dir){
  var x = byId(DB.quotes, quoteId);
  var j = i + dir;
  if(j < 0 || j >= x.lines.length) return;
  var tmp = x.lines[i]; x.lines[i] = x.lines[j]; x.lines[j] = tmp;
  reorder(x.lines);
  x._at = now();
  save(); closeModal(); openQuote(quoteId);
}

/* ============================================================
   GOALS AND HABITS
   ------------------------------------------------------------
   Some things take three months. They are won or lost daily, and
   the daily part is where people quit.
   ============================================================ */

var GOAL_STATE = {
  live:    { label:'Active',   pill:'p-started'  },
  won:     { label:'Achieved', pill:'p-resolved' },
  paused:  { label:'Paused',   pill:'p-pending'  },
  dropped: { label:'Dropped',  pill:'p-closed'   }
};

function myGoals(){
  return (DB.goals || []).filter(function(g){ return g.who === ME.id; });
}

function habitsOf(goalId){
  return (DB.habits || []).filter(function(h){
    return h.goal === goalId && !h.gone; });
}

function habitDone(habitId, on){
  var k = habitId + '|' + (on || today());
  return !!((DB.habitLog || {})[k]);
}

function tapHabit(habitId){
  DB.habitLog = DB.habitLog || {};
  var k = habitId + '|' + today();
  if(DB.habitLog[k]) delete DB.habitLog[k]; else DB.habitLog[k] = now();
  save(); drawGoals();
}

function habitDots(habitId){
  var out = [];
  for(var i = 6; i >= 0; i--){
    var d = new Date(Date.now() - i*86400e3).toISOString().slice(0,10);
    var on = habitDone(habitId, d);
    out.push('<span style="display:inline-block;width:9px;height:9px;'+
      'border-radius:50%;margin-right:5px;'+
      (on ? 'background:var(--ink-2)' : 'border:1px solid var(--line)')+'"></span>');
  }
  return out.join('');
}

function daysLeft(g){
  if(!g.by) return '';
  var n = Math.ceil((new Date(g.by) - new Date(today())) / 86400000);
  if(n < 0) return 'the date has passed';
  if(n === 0) return 'today is the date';
  return n + ' day(s) to go';
}

function drawGoals(){
  var box = $('goalBox');
  if(!box) return;
  if(!canTasks()){ box.innerHTML = ''; return; }
  var live = myGoals().filter(function(g){ return (g.state||'live') === 'live'; });
  if(!live.length){ box.innerHTML = ''; return; }

  box.innerHTML = '<label style="margin:14px 0 9px">Going on</label>' +
    live.map(function(g){
      var hs = habitsOf(g.id);
      return '<div class="card"><div class="row"><div class="grow">'+
        '<div class="ttl tap" onclick="openGoal(\''+g.id+'\')">'+esc(g.title)+'</div>'+
        (g.by ? '<div class="meta">'+esc(daysLeft(g))+'</div>' : '')+
        '</div></div>'+
        (hs.length ? '<div style="margin-top:10px">'+hs.map(function(hb){
          var on = habitDone(hb.id);
          return '<div class="row" style="align-items:center;padding:6px 0">'+
            '<div class="grow"><div style="font-size:13.5px'+
              (on?';color:var(--ink-3)':'')+'">'+esc(hb.what)+'</div>'+
            '<div style="margin-top:5px">'+habitDots(hb.id)+'</div></div>'+
            '<button class="btn sm '+(on?'ghost':'green')+'" onclick="tapHabit(\''+
              hb.id+'\')">'+(on?'\u2713':'Done')+'</button></div>'; }).join('')+
          '</div>' : '')+
      '</div>'; }).join('');
}

function goalList(){
  var list = myGoals();
  modal('Goals',
    (list.length ? list.map(function(g){
      var s = GOAL_STATE[g.state||'live'];
      return '<div class="card tap" onclick="openGoal(\''+g.id+'\')" '+
        'style="padding:11px 13px;margin-bottom:8px">'+
        '<div class="row"><div class="grow">'+
        '<div class="ttl">'+esc(g.title)+'</div>'+
        (g.why ? '<div class="meta">'+esc(g.why)+'</div>' : '')+
        (g.by ? '<div class="meta">'+esc(daysLeft(g))+'</div>' : '')+
        '</div><span class="pill '+s.pill+'">'+s.label+'</span></div></div>';
      }).join('')
      : '<div class="empty">None yet.<br>Some things take three months, and they '+
        'are won or lost daily.</div>'),
    [{t:'Close',cls:'ghost',f:'closeModal()'},
     {t:'+ Add',cls:'',f:'editGoal(null)'}]);
}

function editGoal(id){
  DB.goals = DB.goals || [];
  var g = id ? byId(DB.goals, id) : null;
  modal(g ? 'Edit goal' : 'A goal',
    '<div class="field"><label>What</label>'+
      '<input id="glTitle" value="'+esc(g?g.title:'')+'"></div>'+
    '<div class="field"><label>Why</label>'+
      '<textarea id="glWhy" placeholder="The reason you will remember in week six">'+
        esc(g?g.why:'')+'</textarea>'+
      '<div class="help">This is the part that decides whether it survives '+
      'February.</div></div>'+
    '<div class="two">'+
      '<div class="field"><label>From</label>'+
        '<input id="glFrom" type="date" value="'+(g?g.from||today():today())+'"></div>'+
      '<div class="field"><label>By</label>'+
        '<input id="glBy" type="date" value="'+(g?g.by||'':'')+'"></div>'+
    '</div>',
    [{t:'Back',cls:'ghost',f:'goalList()'},
     {t:'Save',cls:'',f:'saveGoal(' + (g?"'"+g.id+"'":'null') + ')'}]);
}

function saveGoal(id){
  var title = $('glTitle').value.trim();
  if(!title) return toast('What is the goal?','bad');
  var g = id ? byId(DB.goals, id) : null;
  if(!g){ g = { id:uid(), who:ME.id, state:'live' }; DB.goals.push(g); }
  g.title = title;
  g.why   = $('glWhy').value.trim();
  g.from  = $('glFrom').value || today();
  g.by    = $('glBy').value || '';
  g._at   = now();
  logIt('goal',(id?'Edited ':'Set ')+title,'');
  save(); draw();
  if(id) goalList(); else openGoal(g.id);
  if(sharingOn()) syncSoon();
}

function openGoal(id){
  var g = byId(DB.goals, id);
  if(!g) return;
  var s = GOAL_STATE[g.state||'live'];
  var hs = habitsOf(id);

  modal(g.title,
    '<div class="row" style="margin-bottom:12px"><div class="grow">'+
      (g.why ? '<div style="font-size:14px;line-height:1.6">'+esc(g.why)+'</div>' : '')+
      (g.by ? '<div class="meta" style="margin-top:5px">'+esc(dmy(g.from))+
        ' \u2192 '+esc(dmy(g.by))+' \u00b7 '+esc(daysLeft(g))+'</div>' : '')+
      '</div><span class="pill '+s.pill+'">'+s.label+'</span></div>'+

    (g.droppedWhy ? '<div class="note w"><b>Dropped:</b> '+esc(g.droppedWhy)+
      '</div>' : '')+

    '<div class="sep"></div><label>The daily part</label>'+
    (hs.length ? hs.map(function(hb){
      return '<div class="card" style="padding:10px 12px;margin-bottom:7px">'+
        '<div class="row"><div class="grow">'+
        '<div style="font-size:13.5px;font-weight:600">'+esc(hb.what)+'</div>'+
        '<div style="margin-top:6px">'+habitDots(hb.id)+'</div></div>'+
        '<button class="btn sm danger" onclick="dropHabit(\''+hb.id+'\',\''+id+
          '\')">Remove</button></div></div>'; }).join('')
      : '<div class="help">Nothing daily yet. A goal without a daily part is a '+
        'wish.</div>'),

    [{t:'Back',cls:'ghost',f:'goalList()'},
     {t:'+ Daily',cls:'ghost',f:"addHabit('"+id+"')"}]
      .concat((g.state||'live') === 'live'
        ? [{t:'Achieved',cls:'green',f:"endGoal('"+id+"','won')"},
           {t:'Drop it',cls:'danger',f:"endGoal('"+id+"','dropped')"}] : []));
}

function addHabit(goalId){
  modal('Something daily',
    '<div class="field"><label>What</label>'+
      '<input id="hbWhat" placeholder="Walk thirty minutes"></div>'+
      '<div class="help">Small enough to do on a bad day. That is the whole '+
      'trick.</div>',
    [{t:'Back',cls:'ghost',f:"openGoal('"+goalId+"')"},
     {t:'Add',cls:'',f:"saveHabit('"+goalId+"')"}]);
}

function saveHabit(goalId){
  var what = $('hbWhat').value.trim();
  if(!what) return toast('What is it?','bad');
  DB.habits = DB.habits || [];
  DB.habits.push({ id:uid(), goal:goalId, who:ME.id, what:what, at:now(), _at:now() });
  save(); openGoal(goalId); draw();
  if(sharingOn()) syncSoon();
}

function dropHabit(habitId, goalId){
  var h = byId(DB.habits || [], habitId);
  if(h){ h.gone = true; h._at = now(); }
  save(); openGoal(goalId); draw();
  if(sharingOn()) syncSoon();
}

function endGoal(id, to){
  var g = byId(DB.goals, id);
  if(to === 'won'){
    g.state = 'won'; g.wonOn = today(); g._at = now();
    logIt('goal','Achieved: ' + g.title, '');
    save(); closeModal(); draw();
    toast('Well done','good');
    return;
  }
  askReason('Why are you dropping it?', function(why){
    g.state = 'dropped'; g.droppedWhy = why; g._at = now();
    logIt('goal','Dropped: ' + g.title, why);
    save(); closeModal(); draw();
    toast('Dropped, with the reason kept','good');
  });
}

/* ============================================================
   WHO IS TOLD WHAT
   ------------------------------------------------------------
   A notification that says only "part issued" makes the person
   open the app to find out which — which is the work it was
   meant to save. Each one here carries enough to act on.

   Tapping opens the record, never a dashboard.
   ============================================================ */

function admins(){
  return DB.users.filter(function(u){
    return u.active && (u.role === 'admin' || u.role === 'supervisor'); });
}
function storeFolk(){
  return DB.users.filter(function(u){
    return u.active && (u.role === 'store' || u.role === 'admin'); });
}
/* the lists overlap — an admin is in both — so nobody gets two copies */
function tellAll(list, what, detail, link){
  var done = {};
  list.forEach(function(u){
    if(u.id === ME.id || done[u.id]) return;
    done[u.id] = 1;
    tell(u.id, what, detail, link);
  });
}

function jobLine(c){
  var m = byId(DB.machines, c.machine);
  return nameOf(DB.clients, c.client) +
         (m ? ' \u00b7 ' + m.model : '') + ' \u00b7 ' + c.no;
}

/* ---------- complaints ---------- */

function notifyLogged(c){
  tellAll(admins(), 'Complaint logged',
    jobLine(c) + ' \u00b7 ' + c.what.slice(0,70) +
    (c.pri === 'High' ? ' \u00b7 HIGH' : ''), c.id);
}

function notifyAssigned(c){
  tell(c.tech, 'A job was given to you',
    jobLine(c) + ' \u00b7 ' + c.what.slice(0,70) +
    (c.cheque ? ' \u00b7 cheque to collect' : ''), c.id);
  tellAll(admins(), 'Technician assigned',
    nameOf(DB.users, c.tech) + ' \u2192 ' + jobLine(c), c.id);
}

function notifyResolved(c){
  tellAll(admins(), 'Job resolved',
    jobLine(c) + ' \u00b7 by ' + nameOf(DB.users, c.tech) +
    (c.counter ? ' \u00b7 counter ' + c.counter.toLocaleString() : ''), c.id);
}

/* the technician is finished; it is for the office to decide what next */
function notifyNeedsParts(c, note){
  tellAll(admins(), 'Resolved but parts are needed',
    jobLine(c) + ' \u00b7 ' + (note || '').slice(0,70), c.id);
}

function notifyCheque(c){
  tellAll(admins(), c.chequeDone ? 'Cheque collected' : 'Cheque not collected',
    jobLine(c) + ' \u00b7 by ' + ME.name +
    (c.chequeDone ? '' : ' \u00b7 ' + (c.chequeWhy||'').slice(0,60)), c.id);
}

/* A complaint the client reported themselves carries everything needed to
   act, because nobody should have to open the app to find out what broke. */
function notifyScanned(c){
  var m = byId(DB.machines, c.machine);
  tellAll(admins(), 'New complaint \u2014 scanned by client',
    nameOf(DB.clients, c.client) + (m ? ' \u00b7 ' + m.model : '') +
    (m && m.place ? ' \u00b7 ' + m.place : '') + '\n"' +
    String(c.what || '').slice(0, 90) + '"\nReported by ' + (c.who || '') +
    (c.phone ? ', ' + c.phone : ''), c.id);
}

/* ---------- parts ---------- */

function notifyPartAsked(p, c){
  tellAll(storeFolk().concat(admins()), 'Part requested',
    q(p,'qty') + ' \u00d7 ' + p.name + ' \u00b7 ' + (c ? jobLine(c) : '') +
    ' \u00b7 by ' + (p.byName || ''), c ? c.id : '');
}

function notifyPartReady(p, c){
  tell(p.by, 'A part is ready at the store',
    q(p,'issued') + ' \u00d7 ' + p.name + ' \u00b7 ' + (c ? jobLine(c) : ''),
    c ? c.id : '');
}

function notifyPartRejected(p, c, n, why){
  tellAll(storeFolk().concat(admins()), 'Part rejected',
    n + ' \u00d7 ' + p.name + ' \u00b7 ' + (c ? jobLine(c) : '') +
    ' \u00b7 ' + (why || '').slice(0,60), c ? c.id : '');
}

/* a loss, and somebody should know the same day */
function notifyPartLost(p, c, n, why){
  var s = p.stock ? byId(DB.stock, p.stock) : null;
  var worth = s ? n * (q(p,'unitCost') || q(s,'cost')) : 0;
  tellAll(admins(), 'Part written off',
    n + ' \u00d7 ' + p.name +
    (worth ? ' \u00b7 about Rs. ' + Math.round(worth).toLocaleString('en-PK') : '') +
    ' \u00b7 ' + (c ? jobLine(c) : '') + ' \u00b7 ' + (why || '').slice(0,50),
    c ? c.id : '');
}

/* ---------- the store ---------- */

function notifyLowStock(s){
  var left = shelf(s.id);
  tellAll(storeFolk().concat(admins()), 'Low stock',
    stockLabel(s) + ' \u00b7 ' + left + ' left, minimum is ' + q(s,'min'), '');
}

/* called after anything that moves the shelf, and only when it crosses */
function checkLowStock(stockId){
  var s = byId(DB.stock, stockId);
  if(!s || !q(s,'min')) return;
  var left = shelf(stockId);
  var wasLow = !!s.lowTold;
  var isLow = left <= q(s,'min');
  if(isLow && !wasLow){ s.lowTold = today(); notifyLowStock(s); }
  if(!isLow && wasLow) s.lowTold = '';
}

/* ---------- old parts still owed ---------- */

function oldPartOverdue(){
  var out = [];
  DB.parts.forEach(function(p){
    if(!wantsOldBack(p)) return;
    var owed = q(p,'installed') - q(p,'oldBack');
    if(owed <= 0) return;
    var when = p.at_installed;
    if(!when) return;
    var days = Math.floor((Date.now() - new Date(when)) / 86400000);
    if(days >= 3) out.push({ p:p, owed:owed, days:days });
  });
  return out;
}

/* the technician first, and the office once it has gone on a week */
function checkOldParts(){
  var late = oldPartOverdue();
  late.forEach(function(r){
    var c = byId(DB.complaints, r.p.complaint);
    var key = 'old|' + r.p.id + '|' + today();
    DB.told = DB.told || {};
    if(DB.told[key]) return;
    DB.told[key] = 1;

    tell(r.p.by, 'An old part is still owed',
      r.owed + ' \u00d7 ' + r.p.name + ' \u00b7 ' + (c ? jobLine(c) : '') +
      ' \u00b7 fitted ' + r.days + ' days ago', c ? c.id : '');

    if(r.days >= 7)
      tellAll(admins(), 'An old part has not come back',
        r.owed + ' \u00d7 ' + r.p.name + ' \u00b7 ' +
        (r.p.byName || '') + ' \u00b7 ' + r.days + ' days', c ? c.id : '');
  });
  if(late.length) save();
}

/* ---------- follow-ups due ---------- */

function checkFollowUps(){
  if(!can('complaint.add')) return;
  (DB.quotes || []).forEach(function(x){
    if(!qOpen(x)) return;
    var due = nextDue(x);
    if(!due || due > today()) return;
    var key = 'fu|' + x.id + '|' + today();
    DB.told = DB.told || {};
    if(DB.told[key]) return;
    DB.told[key] = 1;

    var last = callsFor(x.id)[0];
    var b = BRANDS[x.brand];
    tell(ME.id, 'Follow-up due \u2014 ' + nameOf(DB.clients, x.client),
      x.no + ' \u00b7 ' + b.name +
      (x.type !== 'rental' && quoteTotal(x)
        ? ' \u00b7 Rs. ' + Math.round(quoteTotal(x)).toLocaleString('en-PK') : '') +
      ' \u00b7 sent ' + waitingDays(x) + ' days ago' +
      (last ? ' \u00b7 last spoken ' + dmy(last.on) + ': "' +
        last.said.slice(0,70) + '" \u00b7 this is follow-up ' + (last.n + 1) : ''),
      '');
  });
  save();
}

/* ---------- run the checks that are not tied to a button ---------- */
function sweep(){
  /* The ten-minute check keeps running after a sign-out; with nobody signed
     in it has nobody to check for. */
  if(!ME) return;
  /* Complaints arrive from the server between syncs, so the ones that came
     in by scan are noticed here rather than at the moment they were made. */
  try {
    DB.told = DB.told || {};
    (DB.complaints || []).forEach(function(c){
      if(c.source !== 'scan') return;
      var key = 'scan|' + c.id;
      if(DB.told[key]) return;
      DB.told[key] = 1;
      if(can('complaint.all')) notifyScanned(c);
    });
  } catch(e){}
  try { checkOldParts(); } catch(e){}
  try { checkContracts(); } catch(e){}
  try { phoneNotify(); } catch(e){}
  try { checkFollowUps(); } catch(e){}
  try {
    (DB.stock || []).forEach(function(s){ checkLowStock(s.id); });
  } catch(e){}
  drawTabs();
}

/* ============================================================
   SENDING IT
   ------------------------------------------------------------
   A phone cannot make a PDF on its own, so there are two honest
   ways to send a quotation and the app offers both:

     the figures as a message, which lands in seconds
     the printed page, saved as a PDF and attached by hand

   The message is not a replacement for the document. It is what
   a person actually sends while standing in front of a client.
   ============================================================ */

function quoteMessage(x){
  var b = BRANDS[x.brand];
  var c = byId(DB.clients, x.client);
  var rental = x.type === 'rental';
  var L = [];

  L.push('*' + b.name + '*');
  L.push('Quotation ' + x.no + ' \u00b7 ' + dmy(x.date));
  if(c) L.push('For: ' + c.name);
  if(x.ref) L.push('Ref: ' + x.ref);
  L.push('');

  (x.lines||[]).forEach(function(l, i){
    L.push((l.n || i+1) + '. ' + l.desc +
      (l.machine && l.machine !== '\u2014' ? ' (' + l.machine + ')' : ''));
    if(rental){
      if(l.rate)   L.push('   Rate per copy: ' + l.rate);
      if(l.copies) L.push('   Copies: ' + l.copies);
      L.push('   Monthly minimum: Rs. ' + Number(l.price||0).toLocaleString('en-PK'));
    } else {
      var each = Number(l.price||0).toLocaleString('en-PK');
      var amt = ((l.qty||1) * (l.price||0)).toLocaleString('en-PK');
      L.push('   ' + (l.qty||1) + ' \u00d7 Rs. ' + each + ' = Rs. ' + amt);
    }
  });

  if(!rental && quoteTotal(x)){
    L.push('');
    L.push('*Total (excluding tax): Rs. ' +
           Math.round(quoteTotal(x)).toLocaleString('en-PK') + '*');
    if(x.tax){
      L.push('Sales tax ' + (x.taxPct || taxFor(x.type)) + '%: Rs. ' +
             Math.round(quoteTax(x)).toLocaleString('en-PK'));
      L.push('*Payable: Rs. ' +
             Math.round(quoteTotal(x) + quoteTax(x)).toLocaleString('en-PK') + '*');
    }
  }

  if(x.valid){
    L.push('');
    L.push('Valid until ' + dmy(x.valid));
  }
  if(x.terms){
    L.push('');
    L.push('*Terms*');
    L.push(x.terms);
  }
  L.push('');
  L.push(DB.company.addr || '');
  L.push(DB.company.phone || '');
  return L.filter(function(s,i,a){
    return !(s === '' && a[i-1] === ''); }).join('\n');
}

/* ============================================================
   BILLS
   ------------------------------------------------------------
   A bill comes out of a job, because that is where the parts and
   the visit already are. Nothing is typed twice.

   Whether the parts are charged is decided by the client's
   arrangement, not by whoever happens to be raising the bill.

   This is a service bill for the client.
   ============================================================ */

function billNo(){
  return takeNumber('bill', 'PCS-B', function(){
    DB.seq.bill = (DB.seq.bill || 0) + 1; return DB.seq.bill; }, 4) + '-' + mmyy();
}

function billFor(complaintId){
  return (DB.bills || []).filter(function(b){ return b.job === complaintId; })[0];
}

/* what is on a job, ready to be charged or not */
function billLines(c){
  var out = [];
  var charge = partsBilled(c.client);

  DB.parts.forEach(function(p){
    if(p.complaint !== c.id) return;    /* only what was fitted on THIS job */
    var n = q(p,'installed');
    if(!n) return;
    out.push({ what: p.name, qty: n,
               rate: charge ? q(p,'unitCost') : 0,
               free: !charge, kind: 'part' });
  });
  return out;
}

function raiseBill(complaintId){
  if(!can('complaint.add')) return toast('Only the office raises a bill','bad');
  var c = byId(DB.complaints, complaintId);
  if(!c) return;

  var have = billFor(complaintId);
  if(have) return openBill(have.id);

  var deal = DEALS[dealOf(c.client)];
  var lines = billLines(c);
  var charge = partsBilled(c.client);

  modal('Raise a bill \u2014 ' + c.no,
    '<div class="note '+(charge?'i':'g')+'">'+
      '<b>'+esc(nameOf(DB.clients, c.client))+'</b> is on <b>'+esc(deal.label)+
      '</b>, so parts are <b>'+(charge?'charged':'included')+'</b>.'+
      (charge ? '' : ' They will show on the bill at zero, so the client can see '+
        'what was fitted.')+
    '</div>'+

    (lines.length
      ? '<div class="field"><label>Parts fitted</label>'+
        lines.map(function(l){
          return '<div style="font-size:13.5px;padding:3px 0">'+esc(l.what)+
            ' \u00d7 '+l.qty+
            (l.free ? ' \u2014 included'
                    : ' \u2014 Rs. ' + Math.round(l.rate*l.qty).toLocaleString('en-PK'))+
            '</div>'; }).join('')+'</div>'
      : '<div class="help">No parts were fitted on this job.</div>')+

    '<div class="two">'+
      '<div class="field"><label>Visit charge</label>'+
        '<input id="blVisit" type="number" inputmode="decimal" value="'+
        (charge ? 2500 : 0)+'"></div>'+
      '<div class="field"><label>Labour</label>'+
        '<input id="blLabour" type="number" inputmode="decimal" value="0"></div>'+
    '</div>'+
    '<div class="field"><label>Anything else</label>'+
      '<input id="blExtraWhat" placeholder="Transport, after-hours">'+
      '<input id="blExtra" type="number" inputmode="decimal" '+
      'style="margin-top:7px" placeholder="0"></div>'+
    '<div class="field"><label>Sales tax</label><select id="blTax">'+
      '<option value="18">18%</option><option value="0">none</option>'+
      '</select></div>',

    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Raise it',cls:'',f:"saveBill('"+complaintId+"')"}]);
}

function saveBill(complaintId){
  var c = byId(DB.complaints, complaintId);
  var lines = billLines(c);

  var visit  = parseFloat($('blVisit').value)  || 0;
  var labour = parseFloat($('blLabour').value) || 0;
  var extra  = parseFloat($('blExtra').value)  || 0;
  var extraWhat = $('blExtraWhat').value.trim();

  if(visit)  lines.push({ what:'Visit charge', qty:1, rate:visit, kind:'visit' });
  if(labour) lines.push({ what:'Labour', qty:1, rate:labour, kind:'labour' });
  if(extra)  lines.push({ what: extraWhat || 'Other', qty:1, rate:extra, kind:'other' });

  if(!lines.length) return toast('There is nothing to bill','bad');

  DB.bills = DB.bills || [];
  var b = {
    id:uid(), no:billNo(), job:complaintId, client:c.client,
    date:today(), lines:lines,
    taxPct: parseFloat($('blTax').value) || 0,
    deal: dealOf(c.client),
    state:'open', by:ME.id, byName:ME.name, at:now(), _at:now()
  };
  DB.bills.unshift(b);
  logIt('bill','Raised ' + b.no, nameOf(DB.clients, c.client) + ' \u00b7 ' + c.no);
  save(); closeModal(); draw(); openBill(b.id);
  toast(b.no + ' raised','good');
  if(sharingOn()) syncSoon();
}

function billSub(b){
  var n = 0;
  (b.lines||[]).forEach(function(l){
    n += (parseFloat(l.qty)||0) * (parseFloat(l.rate)||0); });
  return n;
}
function billTax(b){ return billSub(b) * ((parseFloat(b.taxPct)||0) / 100); }
function billTotal(b){ return billSub(b) + billTax(b); }

/* ============================================================
   CONTRACTS
   ------------------------------------------------------------
   Four arrangements, and one distinction that the whole thing
   exists for:

     an ASC that has expired blocks new complaints
     a rental that has expired blocks nothing

   Under rental the machine is ours and the client keeps paying,
   so the end date is paperwork. Under an ASC the client paid for
   a year of service and that year is finished. Expired ASCs get
   serviced free because nobody notices \u2014 this is what notices.
   ============================================================ */

var DEAL_KIND = {
  rental: {
    label:'Rental', title:'RENTAL AGREEMENT',
    sub:'Photocopier Rental \u2014 Per Copy Basis', abbr:'RA',
    owns:'us', parts:'included', toner:'included',
    blocks:false, amount:false
  },
  asc_with: {
    label:'ASC \u2014 with parts', title:'ANNUAL SERVICE CONTRACT',
    sub:'With Spare Parts', abbr:'ASC',
    owns:'client', parts:'included', toner:'excluded',
    blocks:true, amount:true
  },
  asc_without: {
    label:'ASC \u2014 without parts', title:'ANNUAL SERVICE CONTRACT',
    sub:'Without Spare Parts', abbr:'ASC',
    owns:'client', parts:'billed', toner:'excluded',
    blocks:true, amount:true
  },
  warranty: {
    label:'Warranty', title:'WARRANTY',
    sub:'Equipment Purchased from Us', abbr:'WTY',
    owns:'client', parts:'included', toner:'excluded',
    blocks:true, amount:false      /* no figure \u2014 he bought a machine */
  }
};

var C_STATE = {
  draft:     { label:'Draft',     pill:'p-pending'  },
  active:    { label:'Active',    pill:'p-resolved' },
  expired:   { label:'Expired',   pill:'p-high'     },
  cancelled: { label:'Cancelled', pill:'p-closed'   }
};

function contractNo(kind, brand){
  var pre = BRANDS[brand || 'paragon'].prefix.replace('-Q','') + '-' +
            DEAL_KIND[kind].abbr;
  return takeNumber('k-' + pre, pre, function(){
    DB.seq.contract = DB.seq.contract || {};
    DB.seq.contract[pre] = (DB.seq.contract[pre] || 1023) + 1;
    return DB.seq.contract[pre];
  }, 4);
}

/* One machine, one live contract. A second would make every figure
   ambiguous the day they disagree. */
function contractFor(machineId){
  return (DB.contracts || []).filter(function(k){
    return k.machine === machineId && k.state === 'active'; })[0];
}

function contractsOf(clientId){
  return (DB.contracts || []).filter(function(k){ return k.client === clientId; });
}

function expiresIn(k){
  if(!k.ends) return null;
  return Math.ceil((new Date(k.ends) - new Date(today())) / 86400000);
}

/* A contract does not expire the moment nobody is looking; it is worked
   out whenever anything asks. */
function contractState(k){
  if(k.state !== 'active') return k.state;
  var d = expiresIn(k);
  return (d !== null && d < 0) ? 'expired' : 'active';
}

/* ---------- the one block ---------- */

function serviceBlocked(machineId){
  var k = contractFor(machineId);
  if(!k) return null;
  if(!DEAL_KIND[k.kind].blocks) return null;      /* rental blocks nothing */
  if(contractState(k) !== 'expired') return null;
  return k;
}

function blockNote(k){
  var over = (k.overrides || []).length;
  return '<div class="note d"><b>' + esc(DEAL_KIND[k.kind].label) +
    ' expired on ' + esc(dmy(k.ends)) + '.</b> Service under it has finished. '+
    'Open this job only if somebody has decided to, and say who.' +
    (over ? ' It has been overridden ' + over + ' time(s) already.' : '') +
    '</div>';
}

      f:'saveContract(' + (k?"'"+k.id+"'":'null') + ')'}]);

  kfMachines(k ? k.machine : machineId);
  kfKindChanged(k);
}

function kfMachines(pick){
  var cid = $('kfClient').value;
  var list = DB.machines.filter(function(m){ return m.client === cid; });
  var sel = $('kfMachine');
  if(!list.length){
    sel.innerHTML = '<option value="">no machines on record for this client</option>';
    return;
  }
  sel.innerHTML = list.map(function(m){
    var busy = contractFor(m.id);
    return '<option value="'+m.id+'"'+(pick===m.id?' selected':'')+'>'+
           esc(machineLabel(m))+
           (busy && busy.id !== pick ? ' \u2014 already on ' + esc(busy.no) : '')+
           '</option>'; }).join('');
}

function kfKindChanged(k){
  var kind = $('kfKind').value;
  var d = DEAL_KIND[kind];
  var box = $('kfMoney');

  if(kind === 'rental'){
    box.innerHTML =
      '<div class="two">'+
        '<div class="field"><label>Rate per print</label>'+
          '<input id="kfRate" type="number" inputmode="decimal" step="0.01" '+
          'value="'+(k&&k.rate!=null?k.rate:'0.95')+'"></div>'+
        '<div class="field"><label>Prints included</label>'+
          '<input id="kfFree" type="number" inputmode="numeric" '+
          'value="'+(k&&k.free!=null?k.free:'')+'" placeholder="30000"></div>'+
      '</div>'+
      '<div class="field"><label>Rate above that</label>'+
        '<input id="kfRate2" type="number" inputmode="decimal" step="0.01" '+
        'value="'+(k&&k.rate2!=null?k.rate2:'0.90')+'">'+
        '<div class="help">Both rates print on the agreement, and both say '+
        '<b>per printer, per month</b> \u2014 a bare figure reads as a one-off '+
        'charge.</div></div>';
  } else if(d.amount){
    box.innerHTML =
      '<div class="field"><label>Annual charge</label>'+
        '<input id="kfAmount" type="number" inputmode="decimal" '+
        'value="'+(k&&k.amount!=null?k.amount:'')+'"></div>'+
      '<div class="field"><label>Payable</label><select id="kfHow">'+
        '<option value="annually in advance">annually in advance</option>'+
        '<option value="monthly">monthly</option>'+
        '<option value="in four equal instalments">in four instalments</option>'+
      '</select></div>';
  } else {
    box.innerHTML =
      '<div class="note i">A warranty carries no figure. The client bought a '+
      'machine, not a contract.</div>';
  }

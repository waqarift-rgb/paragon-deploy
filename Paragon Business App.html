/* ============================================================
   IN-APP CALL  (voice / video, WebRTC)
   ============================================================ */

var _call = null;   /* { peer, pc, stream, remote, convId, video, ringing } */

/* WebRTC ke liye page secure (https) chahiye. Warna dialer. */
function callSupported(){
  return !!(window.RTCPeerConnection && navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia &&
            (location.protocol === 'https:' || location.hostname === 'localhost'));
}

/* free public STUN (NAT ke paar). TURN baad mein jodenge agar zaroorat ho. */
var _iceServers = [{ urls: 'stun:stun.l.google.com:19302' },
                   { urls: 'stun:stun1.l.google.com:19302' }];

/* chatCall ko upgrade: https par in-app, warna dialer */
function callStart(convId, video){
  if(!callSupported()){
    /* HTTPS nahi \u2014 phone dialer (jo pehle tha) */
    return callDialer(convId);
  }
  var other = null;
  (_chat.members || []).forEach(function(m){ if(m.id !== ME.id) other = m; });
  if(!other && _chat.list){
    var c = _chat.list.filter(function(x){ return x.id === convId; })[0];
    if(c && c.other) other = c.other;
  }
  if(!other) return toast('Kise call karein?','bad');

  _callBegin(other, convId, !!video, true);
}

function callDialer(convId){
  var other = null;
  (_chat.members || []).forEach(function(m){ if(m.id !== ME.id) other = m; });
  if(!other && _chat.list){
    var c = _chat.list.filter(function(x){ return x.id === convId; })[0];
    if(c && c.other) other = c.other;
  }
  var u = other ? byId(DB.users, other.id) : null;
  var phone = (u && u.phone) ? u.phone : (other && other.phone);
  if(!phone) return toast('Is ka phone number nahi hai','bad');
  window.location.href = 'tel:' + String(phone).replace(/[^0-9+]/g, '');
}

function _callBegin(other, convId, video, iCall){
  _call = { peer: other.id, peerName: other.name, convId: convId, video: video,
            pc: null, stream: null, ringing: iCall };
  callUI('calling');
  navigator.mediaDevices.getUserMedia({ audio: true, video: video })
    .then(function(stream){
      _call.stream = stream;
      var pc = new RTCPeerConnection({ iceServers: _iceServers });
      _call.pc = pc;
      stream.getTracks().forEach(function(t){ pc.addTrack(t, stream); });
      pc.onicecandidate = function(e){
        if(e.candidate) callSend('ice', e.candidate);
      };
      pc.ontrack = function(e){
        _call.remote = e.streams[0];
        var v = document.getElementById('callRemote');
        if(v){ v.srcObject = e.streams[0]; }
        callUI('connected');
      };
      pc.onconnectionstatechange = function(){
        if(pc.connectionState === 'failed' || pc.connectionState === 'disconnected') callEnd(true);
      };
      var lv = document.getElementById('callLocal');
      if(lv && video){ lv.srcObject = stream; }

      if(iCall){
        pc.createOffer().then(function(o){ return pc.setLocalDescription(o); })
          .then(function(){ callSend('offer', { sdp: pc.localDescription, video: video }); });
        callSend('ring', { video: video });
      }
      callPollStart();
    })
    .catch(function(err){
      toast(video ? 'Camera/mic ki ijazat nahi' : 'Mic ki ijazat nahi','bad');
      callEnd(false);
    });
}

function callSend(kind, data){
  if(!_call) return;
  hrCall({ action:'call.signal', to:_call.peer, kind:kind, data:data }).catch(function(){});
}

var _callPoll = null, _callSince = '';
function callPollStart(){
  clearInterval(_callPoll);
  _callPoll = setInterval(callPollNow, 1200);
}
function callPollNow(){
  hrCall({ action:'call.poll', since:_callSince }).then(function(d){
    if(!d || !d.ok) return;
    _callSince = d.now || _callSince;
    (d.signals || []).forEach(callHandle);
  }).catch(function(){});
}

function callHandle(s){
  /* aane wali call (ring) \u2014 app khula ho to */
  if(s.kind === 'ring' && !_call){
    _callIncoming(s);
    return;
  }
  if(!_call || s.from !== _call.peer) return;
  var pc = _call.pc;
  if(s.kind === 'offer' && pc){
    pc.setRemoteDescription(new RTCSessionDescription(s.data.sdp))
      .then(function(){ return pc.createAnswer(); })
      .then(function(a){ return pc.setLocalDescription(a); })
      .then(function(){ callSend('answer', { sdp: pc.localDescription }); });
  } else if(s.kind === 'answer' && pc){
    pc.setRemoteDescription(new RTCSessionDescription(s.data.sdp));
  } else if(s.kind === 'ice' && pc){
    try { pc.addIceCandidate(new RTCIceCandidate(s.data)); } catch(e){}
  } else if(s.kind === 'hangup'){
    callEnd(false);
  }
}

function _callIncoming(s){
  var u = byId(DB.users, s.from);
  _call = { peer: s.from, peerName: s.fromName || (u && u.name) || 'Someone',
            video: !!(s.data && s.data.video), pc: null, stream: null, incoming: true };
  callUI('incoming');
  callPollStart();
}

function callAccept(){
  if(!_call) return;
  var other = { id: _call.peer, name: _call.peerName };
  var video = _call.video, conv = _call.convId;
  _call = null;
  _callBegin(other, conv, video, false);
  /* answerer offer ka intezar karega (ring aaya, offer bhi aa raha) */
}

function callEnd(silent){
  if(_call){
    if(!silent) callSend('hangup', {});
    if(_call.pc) try { _call.pc.close(); } catch(e){}
    if(_call.stream) _call.stream.getTracks().forEach(function(t){ t.stop(); });
  }
  clearInterval(_callPoll);
  hrCall({ action:'call.clear' }).catch(function(){});
  _call = null;
  var w = document.getElementById('callWrap'); if(w) w.remove();
}

/* ---- call ki screen ---- */
function callUI(state){
  var w = document.getElementById('callWrap');
  if(!w){
    w = document.createElement('div'); w.id = 'callWrap'; w.className = 'call-wrap';
    document.body.appendChild(w);
  }
  var name = _call ? esc(_call.peerName) : '';
  var video = _call && _call.video;
  var label = state === 'incoming'
      ? (video ? 'Video call aa rahi hai\u2026' : 'Call aa rahi hai\u2026')
      : state === 'calling' ? 'Ring ho rahi hai\u2026'
      : state === 'connected' ? 'Connected' : '';

  w.innerHTML =
    (video
      ? '<video id="callRemote" class="call-remote" autoplay playsinline></video>'+
        '<video id="callLocal" class="call-local" autoplay playsinline muted></video>'
      : '<div class="call-voice"><div class="call-av">'+initials(_call?_call.peerName:'')+'</div></div>')+
    '<div class="call-top"><div class="call-name">'+name+'</div>'+
      '<div class="call-state">'+label+'</div></div>'+
    '<div class="call-btns">'+
      (state === 'incoming'
        ? '<button class="call-btn green" onclick="callAccept()">\u{1F4DE} Answer</button>'+
          '<button class="call-btn red" onclick="callEnd(false)">Decline</button>'
        : '<button class="call-btn red" onclick="callEnd(false)">\u{1F4F4} End</button>')+
    '</div>';
}

/* har jagah call sun-ne ke liye \u2014 boot par poll shuru (sirf https par) */
function callWatch(){
  if(!callSupported() || !sharingOn() || !ME) return;
  callPollStart();
}

/* ============================================================
   NOTIFICATIONS ON AN IPHONE (AND IN ANY BROWSER)
   ------------------------------------------------------------
   The APK has its own way of ringing the phone. Everywhere else
   \u2014 above all on an iPhone \u2014 it is this: the phone gives the
   server an address, and the server knocks on it when a note
   comes in.

   Three things Apple insists on, and this follows all three:
     the app must be on the Home Screen, not open in Safari
     the person must tap a button to allow it; it cannot be asked
       for on its own
     the page must come over https
   ============================================================ */

function isIPhone(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function standalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
         window.navigator.standalone === true;
}

/* where this phone stands, in one word */
function pushState(){
  if(onPhone()) return 'apk';                                /* the APK rings by itself */
  if(!('serviceWorker' in navigator)) return 'none';
  var secure = location.protocol === 'https:' ||
               /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if(!secure) return 'insecure';
  if(isIPhone() && !standalone()) return 'homescreen';
  if(!('PushManager' in window) || !('Notification' in window)) return 'none';
  if(Notification.permission === 'denied') return 'blocked';
  return DB.pushOn ? 'on' : 'off';
}

function b64uBytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  var bin = atob(s), u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

/* What the service worker needs to fetch notes by itself: whose, and the
   secret. Kept in the phone's own store for the app, nowhere else. */
function pushCfg(state){
  if(!('caches' in window)) return Promise.resolve();
  return caches.open('paragon-cfg').then(function(c){
    var jobs = [c.put('/cfg', new Response(JSON.stringify(
      ME ? { key: String(DB.share.key || ''), user: String(ME.id) } : {})))];
    if(state) jobs.push(c.put('/state', new Response(JSON.stringify(state))));
    return Promise.all(jobs);
  }).catch(function(){});
}

function enablePush(){
  var st = pushState();
  if(st !== 'off' && st !== 'on') return pushHelp();
  if(!sharingOn()) return toast('Connect to the server first (More \u2192 Paragon server)','bad');

  var reg;
  Notification.requestPermission().then(function(perm){
    if(perm !== 'granted') throw new Error('Notifications were not allowed');
    return navigator.serviceWorker.register('/sw.js', { scope:'/' });
  }).then(function(){ return navigator.serviceWorker.ready; })
  .then(function(r){ reg = r; return bridge({ action:'pushkey' }); })
  .then(function(k){
    if(!k || !k.ok) throw new Error('The server did not give its push key');
    return reg.pushManager.getSubscription().then(function(old){
      return old || reg.pushManager.subscribe({
        userVisibleOnly:true, applicationServerKey: b64uBytes(k.key) });
    }).then(function(sub){
      return bridge({ action:'subscribe', user:ME.id, sub:sub.toJSON(),
                      mutedUntil: String(mutedUntil() || '') })
        .then(function(d){
          if(!d || !d.ok) throw new Error((d && d.msg) || 'The server refused');
          /* start counting from now, so switching on does not ring with
             everything that came before */
          return pushCfg({ since: k.now || '', shown: [] });
        });
    });
  }).then(function(){
    DB.pushOn = true; save();
    closeModal(); drawMore();
    toast('Notifications are on for this phone','good');
  }).catch(function(e){
    toast('Could not switch them on: ' + e.message, 'bad');
  });
}

/* Signing out stops this phone ringing with that person's jobs. */
function disablePush(quiet){
  DB.pushOn = false; save();
  pushCfg();
  if(!('serviceWorker' in navigator)) return Promise.resolve();
  return navigator.serviceWorker.getRegistration('/').then(function(reg){
    if(!reg || !reg.pushManager) return;
    return reg.pushManager.getSubscription().then(function(sub){
      if(!sub) return;
      var ep = sub.endpoint;
      return sub.unsubscribe().then(function(){
        if(sharingOn()) return bridge({ action:'unsubscribe', endpoint: ep }).catch(function(){});
      });
    });
  }).catch(function(){}).then(function(){
    if(!quiet){ try { drawMore(); } catch(e){} }
  });
}

/* Quiet hours reach the server too, so it does not knock at all. */
function pushMuteChanged(){
  if(pushState() !== 'on') return;
  navigator.serviceWorker.getRegistration('/').then(function(reg){
    return reg && reg.pushManager.getSubscription();
  }).then(function(sub){
    if(sub) bridge({ action:'subscribe', user:ME.id, sub:sub.toJSON(),
                     mutedUntil: String(mutedUntil() || '') }).catch(function(){});
  }).catch(function(){});
}

function pushHelp(){
  var st = pushState();
  var body = {
    apk:        '<div class="note g">This is the Android app. It rings the phone by '+
                'itself; there is nothing to switch on here.</div>',
    homescreen: '<div class="note w"><b>First put the app on your Home Screen.</b> '+
                'An iPhone only lets an app notify once it is there.</div>'+
                '<div class="field"><label>How</label><div style="font-size:14px">'+
                'In Safari, tap <b>Share</b> (the square with an arrow), then '+
                '<b>Add to Home Screen</b>. Open the app from its new icon, and come '+
                'back here.</div></div>',
    insecure:   '<div class="note w">This connection is not secure (http). Phones only '+
                'allow notifications over <b>https</b>, which the cloud server will '+
                'have.</div>',
    blocked:    '<div class="note d">Notifications were turned down for this app. '+
                'Switch them back on in the phone\u2019s Settings \u2192 Notifications, '+
                'then come back here.</div>',
    none:       '<div class="note w">This browser cannot receive notifications. On an '+
                'iPhone it needs iOS 16.4 or later.</div>',
    on:         '<div class="note g">Notifications are on for this phone.</div>',
    off:        '<div class="note i">Get a notification on this phone when a job, a '+
                'part or anything else is waiting for you \u2014 even with the app closed.'+
                '</div>'
  }[st];
  modal('Notifications on this phone', body,
    [{t:'Close',cls:'ghost',f:'closeModal()'}]
      .concat(st === 'off' ? [{t:'Switch on',cls:'',f:'enablePush()'}] : [])
      .concat(st === 'on'  ? [{t:'Switch off',cls:'danger',f:'disablePush();closeModal()'}] : []));
}

/* A tapped notification, arriving by the address or by a message from the
   service worker while the app was already open. */
function pushLinks(){
  var m = location.search.match(/[?&]link=([^&]+)/);
  if(m){
    var id = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname);
    setTimeout(function(){ openFromPhone(id); }, 400);
  }
  if('serviceWorker' in navigator)
    navigator.serviceWorker.addEventListener('message', function(e){
      if(e.data && e.data.open) openFromPhone(e.data.open);
    });
}

/* ============================================================
   ATTENDANCE
   ------------------------------------------------------------
   The phone presses the button and shows what the server says.
   Whether a check-in is late, how long the overtime ran, which
   day is a holiday or a Sunday or an absence \u2014 all of that is
   worked out on the server, from the times, so no phone can
   decide it and no two phones can disagree.

   Nobody's attendance but a person's own ever comes to their
   phone. An admin's phone asks for everyone's, and the server
   checks that it is an admin before it answers.
   ============================================================ */

function hrUrl(){ return String(DB.share.url || '').replace(/\/+$/, '') + '/hr'; }

function hrCall(body){
  return fetch(hrUrl(), { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({ key: DB.share.key,
      token: (DB.hr && DB.hr.user === (ME && ME.id)) ? DB.hr.token : '' }, body)) })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d && d.signin){ DB.hr = null; save(); }
    return d;
  });
}

/* Signing in on the phone also signs in to attendance, with the same
   password, while it is to hand. It is never kept \u2014 only the session. */
function hrLogin(user, pass, quiet){
  if(!sharingOn()) return Promise.resolve(false);
  return fetch(hrUrl(), { method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ key: DB.share.key, action:'login', user:user, pass:pass }) })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d && d.ok){ DB.hr = { token:d.token, user:d.user }; save(); attRefresh(); return true; }
    if(!quiet) toast(d && d.msg || 'Could not sign in to attendance', 'bad');
    return false;
  }).catch(function(){ return false; });
}

function hrReady(){ return sharingOn() && DB.hr && ME && DB.hr.user === ME.id; }

function hrLink(){
  modal('Attendance',
    '<div class="note i">To mark attendance on this phone, confirm it is you '+
    'once. Your password is checked by the server and is not kept on the phone.</div>'+
    '<div class="field"><label>Your password</label>'+
      '<input id="hlPass" type="password" autocomplete="current-password"></div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},
     {t:'Confirm',cls:'',f:'doHrLink()'}]);
}

function doHrLink(){
  var p = $('hlPass').value;
  if(!p) return;
  hrLogin(ME.email, p).then(function(ok){
    if(ok){ closeModal(); toast('Attendance is ready on this phone','good'); draw(); }
  });
}

/* ---------- today, on the home screen ---------- */

function hhmm(iso){ return String(iso || '').slice(11, 16); }

function attRefresh(){
  if(!hrReady()) return;
  var month = today().slice(0, 7);
  hrCall({ action:'month', month:month }).then(function(d){
    if(!d || !d.ok) return;
    var me = (d.people || []).filter(function(p){ return p.user === ME.id; })[0];
    var row = me && me.rows.filter(function(r){ return r.day === today(); })[0];
    DB.attToday = row ? Object.assign({ day: today() }, row) : { day: today() };
    save();
    if(PAGE === 'home') drawAttCard();
  }).catch(function(){});
}

function drawAttCard(){
  var dbEl = document.getElementById('dbAtt');
  var el = (dbEl && $('homeDash').style.display !== 'none') ? dbEl : $('homeAtt');
  if(!el || !ME) return;
  if(ME.role === 'operator'){ el.innerHTML = ''; return; }
  if(!sharingOn()){ el.innerHTML = ''; return; }
  if(!hrReady()){
    el.innerHTML = '<div class="card" style="padding:12px 14px">'+
      '<div class="row"><div class="grow"><div class="ttl">Attendance</div>'+
      '<div class="meta">Confirm it is you once, to start</div></div>'+
      '<button class="btn sm" onclick="hrLink()">Start</button></div></div>';
    return;
  }
  var t = (DB.attToday && DB.attToday.day === today()) ? DB.attToday : {};
  var queued = (DB.attQueue || []).length;
  var line, btn;
  if(!t.in){
    line = 'Not checked in yet';
    btn = '<button class="btn green" onclick="attStart(\'in\')">Check In</button>';
  } else if(!t.out){
    line = 'In at <b>' + hhmm(t.in) + '</b> \u00b7 ' +
      (t.late ? '<span style="color:var(--red)">late</span>'
              : '<span style="color:var(--green)">on time</span>');
    btn = '<button class="btn" onclick="attStart(\'out\')">Check Out</button>';
  } else {
    line = 'In <b>' + hhmm(t.in) + '</b> \u00b7 Out <b>' + hhmm(t.out) + '</b>' +
      (t.late ? ' \u00b7 <span style="color:var(--red)">late</span>' : '') +
      (t.ot_min ? ' \u00b7 ' + t.ot_min + ' min after 6' : '');
    btn = '';
  }
  var state = !t.in ? 'out' : !t.out ? 'in' : 'done';
  var dot = state === 'in' ? '#1A7538' : state === 'done' ? '#889' : '#C8860B';
  var label = state === 'in' ? 'On duty' : state === 'done' ? 'Day complete' : 'Not checked in';
  el.innerHTML = '<div class="att-card">'+
    '<div class="att-top">'+
      '<div class="att-dot" style="background:' + dot + '"></div>'+
      '<div class="grow"><div class="att-state">' + label + '</div>'+
      '<div class="att-date">' + esc(dmy(today())) + '</div></div>'+
      (state === 'in' ? '<div class="att-since">since ' + hhmm(t.in) + '</div>' : '')+
    '</div>'+
    '<div class="att-line">' + line + '</div>'+
    (queued ? '<div class="att-q">\u23F3 Saved on this phone \u2014 will send when online</div>' : '')+
    (btn ? '<div class="att-btn">' + btn + '</div>' : '')+
  '</div>';
}

/* The press. The location is taken quietly; the time the server keeps is its
   own, so a phone's clock cannot move it. With no signal the press is kept
   and sent later \u2014 and the server marks it so, for the admin to see. */
function attPress(kind, extra){
  extra = extra || {};
  var stamp = new Date();
  var send = function(place){
    var body = { action:kind, time: isoLocal(stamp),
                 place: extra.where || place || '',
                 photo: extra.photo || '', loc: extra.loc || (place||'') };
    hrCall(body).then(function(d){
      if(d && d.ok){
        DB.attToday = Object.assign({ day: (d.rec && d.rec.day) || today() }, d.rec || {});
        save(); drawAttCard();
        toast(d.already ? 'You checked in at ' + hhmm(d.rec.in)
          : kind === 'in' ? 'Checked in ' + hhmm(d.rec.in) + (d.rec.late ? ' \u2014 late' : '')
          : 'Checked out ' + hhmm(d.rec.out), d.rec && d.rec.late && kind === 'in' ? 'bad' : 'good');
      } else if(d && d.signin){
        drawAttCard(); toast('Confirm it is you once more, then press again','bad');
      } else {
        toast((d && d.msg) || 'Not saved', 'bad');
      }
    }).catch(function(){
      DB.attQueue = DB.attQueue || [];
      DB.attQueue.push(body); save(); drawAttCard();
      toast('No signal \u2014 saved on this phone, it will be sent','good');
    });
  };
  if(extra.where !== undefined){ send(extra.loc || ''); return; }   /* naya rasta: sab pehle mil gaya */
  if(navigator.geolocation){
    var done = false;
    var go = function(p){ if(done) return; done = true; send(p); };
    navigator.geolocation.getCurrentPosition(function(pos){
      go(pos.coords.latitude.toFixed(5) + ',' + pos.coords.longitude.toFixed(5));
    }, function(){ go(''); }, { timeout:6000, maximumAge:60000 });
    setTimeout(function(){ go(''); }, 7000);
  } else send('');
}

function isoLocal(d){
  var p = function(n){ return String(n).padStart(2,'0'); };
  var off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-';
  off = Math.abs(off);
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+
    p(d.getMinutes())+':'+p(d.getSeconds())+sg+p(Math.floor(off/60))+':'+p(off%60);
}

/* presses made without signal go when it comes back */
function attFlush(){
  if(!hrReady() || !(DB.attQueue || []).length) return;
  var next = DB.attQueue[0];
  hrCall(next).then(function(d){
    if(d && (d.ok || d.msg)){ DB.attQueue.shift(); save(); drawAttCard();
      if(DB.attQueue.length) attFlush(); else attRefresh(); }
  }).catch(function(){});
}

/* ============================================================
   SALARY
   ------------------------------------------------------------
   Every figure on a slip comes from the server, worked out from
   the attendance rows to the owner's own rules. The phone shows
   it, prints it, and asks for the admin's decisions \u2014 nothing
   here calculates money.

   An admin reaches all of it. Anyone else reaches one thing:
   their own finalised slips, which the server hands over to that
   person and nobody else.
   ============================================================ */

var _pay = null;
var MONTHS = ['January','February','March','April','May','June','July','August',
              'September','October','November','December'];

function monthName(m){ return MONTHS[+m.slice(5,7)-1] + ' ' + m.slice(0,4); }
function rs(n){ return 'Rs. ' + Math.round(+n || 0).toLocaleString('en-PK'); }
function rs2(n){ return 'Rs. ' + (+n || 0).toLocaleString('en-PK', {maximumFractionDigits:2}); }

/* Rupees in words, the way a slip says them: lakh and crore. */
function rupeesInWords(n){
  var neg = n < 0; n = Math.abs(Math.round(n));
  var ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven',
    'Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  var tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x){ return x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? ' ' + ones[x%10] : ''); }
  function three(x){ return (x >= 100 ? ones[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' : '') : '') +
                            (x%100 ? two(x%100) : ''); }
  if(n === 0) return 'Rupees Zero Only';
  var parts = [], crore = Math.floor(n/1e7), lakh = Math.floor(n%1e7/1e5),
      thou = Math.floor(n%1e5/1e3), rest = n%1e3;
  if(crore) parts.push(three(crore) + ' Crore');
  if(lakh)  parts.push(two(lakh) + ' Lakh');
  if(thou)  parts.push(two(thou) + ' Thousand');
  if(rest)  parts.push(three(rest));
  return (neg ? 'Minus ' : '') + 'Rupees ' + parts.join(' ') + ' Only';
}

var _advEditing = null;
function payAdvMonth(id){
  var a = null; _pay.people.forEach(function(p){ (p.advances||[]).forEach(function(x){ if(x.id === id) a = x; }); });
  if(!a) return;
  _advEditing = a;
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  var def = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');

    '<div class="note i">' + rs(a.balance) + ' is left on this advance. Take all of it in one salary, a part, '+
    'or nothing this time \u2014 the rest follows the plan.</div>'+
    '<div class="field"><label>Which month\u2019s salary</label><input id="amMonth" type="month" value="' + def + '"></div>'+
    '<div class="field"><label>Take</label><select id="amHow" onchange="$(\'amAmtF\').style.display=this.value===\'part\'?\'\':\'none\'">'+
      '<option value="all">All of it \u2014 ' + rs(a.balance) + '</option><option value="part">This much\u2026</option>'+
      '<option value="none">Nothing this month</option><option value="plan">Back to the plan</option></select></div>'+
    '<div class="field" id="amAmtF" style="display:none"><label>Amount (Rs.)</label><input id="amAmt" type="number" inputmode="numeric"></div>'+
    '<div class="field"><label>Note</label><input id="amNote" placeholder="He asked \u00b7 client paid late \u00b7 \u2026"></div>',
    [{t:'Back',cls:'ghost',f:'payAdvances()'},{t:'Save',cls:'',f:'payAdvMonthSave()'}]);

function payAdvMonthSave(){

    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');

}

    _pay.people.forEach(function(p){ (p.deductions||[]).forEach(function(x){ rows.push([p, x]); }); });

/* ---------- the monthly letter to the bank ---------- */
var _letter = null, _letterDate = null, _letterRef = null, _letterOut = {};

/* What the letter says when nothing has been changed: the wording agreed with
   the owner. Everything here can be changed in Letter settings. {month} is the
   month's name, {count} the number of employees, {total} the total in rupees. */
var LETTER_DEFAULT = {
  to: 'The Branch Manager\n{bank}\n{branch}\n{branchAddr}',
  subject: 'Request for transfer of salaries through RAAST \u2014 {month}',
  salutation: 'Dear Sir / Madam,',
  body: 'Please debit our account given below and transfer the salaries of our employees for {month} through RAAST to their accounts, as listed.',
  closing: 'We confirm the above amounts and authorise the transfer. Kindly debit the total to our account.',
  signoff: 'Yours faithfully,',
  forLine: 'For Paragon Copier Solution',
  ref: 'PCS/SAL/{ym}',
  signers: [{ name:'Waqar Iftikhar', title:'Partner', stamp:true }, { name:'Shahrukh Iftikhar', title:'Partner', stamp:true }]
};
function letterConf(c){
  var L = (c && c.letter) || {}, out = {};
  Object.keys(LETTER_DEFAULT).forEach(function(k){
    out[k] = (L[k] != null && (k !== 'signers' || L[k].length)) ? L[k] : LETTER_DEFAULT[k]; });
  return out;
}
function fillIn(text, d){
  var c = d.company || {};
  return String(text || '').replace(/\{month\}/g, monthName(d.month)).replace(/\{ym\}/g, d.month)
    .replace(/\{count\}/g, String(d.rowsIn ? d.rowsIn.length : d.rows.length))
    .replace(/\{total\}/g, Math.round(d.totalIn != null ? d.totalIn : d.total).toLocaleString('en-PK'))
    .replace(/\{bank\}/g, c.acBank || '').replace(/\{branch\}/g, c.branch || '').replace(/\{branchAddr\}/g, c.branchAddr || '');
}

/* ---------- Letter settings: every word of it, and who signs ---------- */
function letterSettings(){
  hrCall({ action:'company' }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');
    var L = letterConf(d.company || {});
    var s = L.signers.concat([{},{}]).slice(0, 4);
    var ta = function(id, label, v, rows){
      return '<div class="field"><label>' + label + '</label><textarea id="' + id + '" rows="' + (rows||2) + '">' + esc(v) + '</textarea></div>'; };
    var inp = function(id, label, v){
      return '<div class="field"><label>' + label + '</label><input id="' + id + '" value="' + esc(v) + '"></div>'; };
    modal('Letter settings',
      '<div class="note i" style="font-size:12.5px">These words go on every month\u2019s letter. You can use '+
      '<b>{month}</b> (September 2026), <b>{count}</b> (number of employees), <b>{total}</b> (total rupees), and in the address '+
      '<b>{bank}</b>, <b>{branch}</b>, <b>{branchAddr}</b> from the company account.</div>'+
      ta('lsTo', 'To (one line each)', L.to, 4)+
      inp('lsSubject', 'Subject', L.subject)+
      inp('lsSal', 'Greeting', L.salutation)+
      ta('lsBody', 'Opening paragraph', L.body, 3)+
      ta('lsClose', 'Closing paragraph', L.closing, 3)+
      '<div class="two">' + inp('lsSign', 'Sign-off', L.signoff) + inp('lsFor', 'Below it', L.forLine) + '</div>'+
      inp('lsRef', 'Reference number (pattern)', L.ref)+
      '<div class="sep"></div><label style="margin-bottom:6px">Who signs (up to four)</label>'+
      s.map(function(x, i){
        return '<div class="two"><div class="field"><label>Name ' + (i+1) + '</label><input id="lsN' + i + '" value="' + esc(x.name||'') + '"></div>'+
          '<div class="field"><label>Designation</label><input id="lsT' + i + '" value="' + esc(x.title||'') + '"></div></div>'+
          '<label style="display:flex;gap:9px;align-items:center;font-weight:400;margin:-4px 0 10px">'+
          '<input type="checkbox" id="lsS' + i + '" style="width:auto"' + (x.stamp !== false && x.name ? ' checked' : '') + '>The firm\u2019s stamp with this signature</label>';
      }).join(''),
      [{t:'Back',cls:'ghost',f:'salaryBox()'},{t:'As it was',cls:'ghost',f:'letterReset()'},{t:'Save',cls:'',f:'letterSave()'}]);
  });
}
function letterSave(){
  var signers = [0,1,2,3].map(function(i){ return { name:$('lsN'+i).value.trim(), title:$('lsT'+i).value.trim(), stamp:$('lsS'+i).checked }; })
    .filter(function(x){ return x.name; });
  if(!signers.length) return toast('At least one person has to sign','bad');
  hrCall({ action:'company', set:true, letter:{ to:$('lsTo').value, subject:$('lsSubject').value, salutation:$('lsSal').value,
    body:$('lsBody').value, closing:$('lsClose').value, signoff:$('lsSign').value, forLine:$('lsFor').value,
    ref:$('lsRef').value, signers:signers } }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');
    toast('Letter settings saved','good'); salaryBox();
  });
}
function letterReset(){
  if(!confirm('Put the letter back to its original wording?')) return;
  hrCall({ action:'company', set:true, letter:{ signers:[] } }).then(function(d){
    if(d && d.ok){ toast('Back to the original wording','good'); letterSettings(); }
  });
}
function bankLetter(month){
  _slipMonth = month || _slipMonth || (function(){
    var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
  hrCall({ action:'bank.letter', month:_slipMonth }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');
    _letter = d;
    var c = d.company || {};
    var ready = c.iban && c.acBank && d.rows.length;
    var L = letterConf(c);
    if(!_letterDate || _letterRef == null || _letterRef.month !== d.month){
      var td = new Date();
      _letterDate = td.getFullYear() + '-' + String(td.getMonth()+1).padStart(2,'0') + '-' + String(td.getDate()).padStart(2,'0');
      _letterRef = { month: d.month, text: fillIn(L.ref, d) };
      _letterOut = {};
    }
    modal('Bank letter \u00b7 ' + monthName(d.month),
      '<div class="row" style="align-items:center;margin-bottom:10px">'+
        '<button class="btn ghost sm" onclick="bankShift(-1)">\u2039</button>'+
        '<div class="grow" style="text-align:center;font-weight:600">' + monthName(d.month) + '</div>'+
        '<button class="btn ghost sm" onclick="bankShift(1)">\u203a</button></div>'+
      (!c.iban ? '<div class="note d">Enter Paragon\u2019s bank account first (Salary \u2192 Company bank account).</div>' : '')+
      (d.drafts.length ? '<div class="note w">Not finalised yet, so not in the letter: ' + d.drafts.map(esc).join(', ') + '.</div>' : '')+
      (d.missing.length ? '<div class="note w">No bank details, so not in the letter: ' + d.missing.map(esc).join(', ') +
        '. Add them under People and rates \u2192 Details.</div>' : '')+
      (d.skipped.length ? '<div class="note i">Nothing to pay this month: ' + d.skipped.map(function(x){ return esc(x.name); }).join(', ') + '.</div>' : '')+
      (d.rows.length ? '<div class="two"><div class="field"><label>Date on the letter</label><input id="blDate" type="date" value="' + _letterDate + '" '+
          'onchange="_letterDate=this.value"></div><div class="field"><label>Reference</label><input id="blRef" value="' + esc(_letterRef.text) + '" '+
          'onchange="_letterRef.text=this.value"></div></div>'+
        '<div class="help" style="margin:-4px 0 6px">Untick anyone to leave them out of this month\u2019s letter.</div>'+
        d.rows.map(function(r, i){
        return '<label class="row" style="padding:6px 0;border-bottom:1px solid var(--line);align-items:center;font-weight:400;gap:9px">'+
          '<input type="checkbox" style="width:auto"' + (_letterOut[r.iban] ? '' : ' checked') + ' onchange="letterToggle(\'' + r.iban + '\', this.checked)">'+
          '<div class="grow"><b>' + esc(r.name) + '</b><div class="meta">' + esc(r.bank) + ' \u00b7 ' + esc(r.iban) + '</div></div><div>' + rs(r.amount) + '</div></label>';
      }).join('') + '<div class="row" style="padding:9px 0;font-weight:700"><div class="grow">Total</div><div id="blTotal">' + rs(letterRows().total) + '</div></div>'
        : '<div class="empty">No finalised salaries with bank details this month.</div>'),
      [{t:'Back',cls:'ghost',f:'salaryBox()'}].concat(ready ? [{t:'Print the letter',cls:'',f:'bankLetterPrint()'}] : []));
  });
}
function letterRows(){
  var rows = _letter.rows.filter(function(r){ return !_letterOut[r.iban]; });
  return { rows: rows, total: rows.reduce(function(a, r){ return a + r.amount; }, 0) };
}
function letterToggle(iban, on){
  if(on) delete _letterOut[iban]; else _letterOut[iban] = true;
  var el = $('blTotal'); if(el) el.textContent = rs(letterRows().total);
}

function bankShift(k){
  var y = +_slipMonth.slice(0,4), m = +_slipMonth.slice(5,7) + k;
  if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
  bankLetter(y + '-' + String(m).padStart(2,'0'));
}

/* the firm's blue stamp: its name, a space to sign in, and PARTNER */
function stampSvg(){
  /* the firm's stamp as the owner uses it: the name above, the space where
     the partner signs, and PARTNER below \u2014 in blue, with no border or lines */
  var ink = '#1F4FA8';
  return '<svg width="54mm" height="30mm" viewBox="0 0 270 150" xmlns="http://www.w3.org/2000/svg">'+
    '<text x="135" y="34" text-anchor="middle" fill="' + ink + '" opacity=".92" font-family="Arial,Helvetica,sans-serif" '+
      'font-weight="700" font-size="21" textLength="250" lengthAdjust="spacingAndGlyphs">PARAGON COPIER SOLUTION</text>'+
    '<text x="135" y="136" text-anchor="middle" fill="' + ink + '" opacity=".92" font-family="Arial,Helvetica,sans-serif" '+
      'font-weight="700" font-size="21" textLength="124" lengthAdjust="spacing">PARTNER</text></svg>';
}

function bankLetterPrint(){
  var d = _letter, c = d.company || {};
  var sel = letterRows();
  if(!sel.rows.length) return toast('Nobody is ticked for this letter','bad');
  d = Object.assign({}, d, { rowsIn: sel.rows, totalIn: sel.total });
  var L = letterConf(c);
  var dt = String(_letterDate || '').split('-');
  var dateText = dt.length === 3 ? dt[2] + '-' + dt[1] + '-' + dt[0] : '';
  var lines = function(txt){ return fillIn(txt, d).split('\n').filter(function(x){ return x.trim(); }).map(esc).join('<br>'); };
  var cell = 'padding:1.6mm 2mm;border:1px solid #C9D1DB';
  var w = Math.floor(100 / Math.max(1, L.signers.length));
  var sig = function(s){
    return '<td style="width:' + w + '%;text-align:center;vertical-align:bottom;padding-top:8mm">' +
      (s.stamp !== false ? stampSvg() : '<div style="height:24mm"></div>') +
      '<div style="font-weight:700;margin-top:1mm">' + esc(s.name) + '</div><div>' + esc(s.title || '') + '</div></td>'; };
  printBox('Salary transfer ' + monthName(d.month),
    '<div style="font-family:Calibri,Carlito,Arial,sans-serif">' + letterhead() +
    '<table style="font-size:10.5pt;margin:0 0 5mm"><tr><td>Ref: ' + esc(_letterRef ? _letterRef.text : fillIn(L.ref, d)) + '</td>'+
      '<td style="text-align:right">Date: ' + esc(dateText) + '</td></tr></table>'+
    '<div style="font-size:11pt;line-height:1.6;margin-bottom:5mm">' + lines(L.to) + '</div>'+
    '<div style="font-size:11pt;font-weight:700;margin-bottom:4mm">Subject: ' + esc(fillIn(L.subject, d)) + '</div>'+
    '<div style="font-size:11pt;line-height:1.65">' + esc(fillIn(L.salutation, d)) + '<br><br>' + lines(L.body) + '</div>'+
    '<table style="font-size:10.5pt;margin:4mm 0;width:auto"><tr><td style="padding-right:6mm">Title of account</td><td><b>' + esc(c.acTitle || 'Paragon Copier Solution') + '</b></td></tr>'+
      '<tr><td>Bank</td><td><b>' + esc(c.acBank || '') + '</b></td></tr><tr><td>IBAN</td><td><b>' + esc(c.iban || '') + '</b></td></tr></table>'+
    '<table style="font-size:9.5pt;border-collapse:collapse;width:100%"><tr style="background:#EEF2F6">'+
      '<th style="' + cell + '">#</th><th style="' + cell + '">Employee</th><th style="' + cell + '">Title of account</th>'+
      '<th style="' + cell + '">Bank</th><th style="' + cell + '">IBAN</th><th style="' + cell + ';text-align:right">Amount (Rs.)</th></tr>'+
      d.rowsIn.map(function(r, i){
        return '<tr><td style="' + cell + '">' + (i+1) + '</td><td style="' + cell + '">' + esc(r.name) + '</td><td style="' + cell + '">' + esc(r.title) +
          '</td><td style="' + cell + '">' + esc(r.bank) + '</td><td style="' + cell + ';font-family:monospace">' + esc(r.iban) +
          '</td><td style="' + cell + ';text-align:right">' + Math.round(r.amount).toLocaleString('en-PK') + '</td></tr>'; }).join('')+
      '<tr style="font-weight:700"><td style="' + cell + '" colspan="5">Total \u2014 ' + d.rowsIn.length + ' employee(s)</td>'+
      '<td style="' + cell + ';text-align:right">' + Math.round(d.totalIn).toLocaleString('en-PK') + '</td></tr></table>'+
    '<div style="font-size:10pt;margin-top:2mm"><b>' + rupeesInWords(d.totalIn) + '</b></div>'+
    '<div style="font-size:11pt;line-height:1.65;margin-top:5mm">' + lines(L.closing) + '<br><br>' + esc(fillIn(L.signoff, d)) +
      '<br>' + esc(fillIn(L.forLine, d)) + '</div>'+
    '<table style="margin-top:4mm"><tr>' + L.signers.map(sig).join('') + '</tr></table>' +
    letterfoot() + '</div>');
}

function personPicker(id){
  return '<select id="' + id + '"><option value="">\u2014 choose the person \u2014</option>' +
    _pay.people.map(function(p){ return '<option value="' + p.user + '">' + esc(p.name) + '</option>'; }).join('') +
    '</select>';
}

function payAdvanceForm(){
  var go = function(){
    modal('Give an advance',
      '<div class="field"><label>To whom (required)</label>' + personPicker('paWho') + '</div>'+
      '<div class="two"><div class="field"><label>Amount (Rs.)</label><input id="paAmt" type="number" inputmode="numeric"></div>'+
      '<div class="field"><label>Given on (required)</label><input id="paGiven" type="date"></div></div>'+
      '<div class="two"><div class="field"><label>Instalments</label><input id="paN" type="number" inputmode="numeric" placeholder="6"></div>'+
      '<div class="field"><label>First deduction</label><input id="paFirst" type="month"></div></div>'+
      '<div class="field"><label>Purpose</label><input id="paWhy" placeholder="Bike \u00b7 Medical \u00b7 \u2026"></div>'+
      '<div class="help">Each instalment is the amount divided evenly; what is left over goes '+
      'on the last one, so the total recovers exactly.</div>',
      [{t:'Back',cls:'ghost',f:'payAdvances()'},{t:'Save',cls:'',f:'payAdvanceSave()'}]);
  };
  _pay ? go() : payLoad(go);
}
function payAdvanceSave(){
  var who = $('paWho').value, amt = +$('paAmt').value, n = +$('paN').value;

/* ---------- a day's decisions, from the attendance screen ---------- */

function attApprove(uid, day){
  var p = (_attData.people || []).filter(function(x){ return x.user === uid; })[0];
  var r = p && p.rows.filter(function(x){ return x.day === day; })[0] || {};
  var w = r.waive || [];
  var cb = function(id, label, on, show){
    return show ? '<label style="display:flex;gap:9px;align-items:center;font-weight:400;padding:6px 0">'+
      '<input type="checkbox" id="' + id + '" style="width:auto"' + (on ? ' checked' : '') + '>' + label + '</label>' : '';
  };
  var early = r.out && hhmm(r.out) < '18:00';
  modal('Decisions \u00b7 ' + (p ? p.name : '') + ' \u00b7 ' + dmy(day),
    cb('apOT', 'Overtime approved (' + Math.floor((r.ot_min||0)/60) + ' whole hour(s))', r.okOT, (r.ot_min||0) >= 60)+
    cb('apEarly', 'Leaving early approved \u2014 no deduction', r.okEarly, early)+
    (r.status === 'present' || r.status === 'half' ?
      '<div class="field" style="margin-top:6px"><label>Half day</label><select id="apHalf">'+
        '<option value="">No</option>'+
        '<option value="unpaid"' + (r.status==='half' && !r.halfPaid ? ' selected' : '') + '>Half day \u2014 half a day deducted</option>'+
        '<option value="paid"' + (r.status==='half' && r.halfPaid ? ' selected' : '') + '>Half day \u2014 paid, no deduction</option>'+
      '</select></div>' : '')+
    cb('apWL', 'Forgive this late mark', w.indexOf('late') > -1, !!r.late)+
    cb('apWA', 'Forgive this absence', w.indexOf('absent') > -1, r.status === 'absent')+
    cb('apWV', 'Forgive this leave', w.indexOf('leave') > -1, r.status === 'leave')+
    '<div class="field"><label>Reason (required \u2014 printed on the slip)</label>'+
      '<input id="apNote" value="' + esc(r.waiveNote||'') + '"></div>',
    [{t:'Back',cls:'ghost',f:'attendanceBox()'},{t:'Save',cls:'',f:"attApproveSave('" + uid + "','" + day + "')"}]);
}

function attApproveSave(uid, day){
  var note = $('apNote').value.trim();
  if(!note) return toast('Write the reason \u2014 it goes on the slip','bad');
  var b = { action:'approve', user:uid, day:day, note:note, waive:[] };
  if($('apOT')) b.okOT = $('apOT').checked;
  if($('apEarly')) b.okEarly = $('apEarly').checked;
  if($('apHalf')){ b.half = !!$('apHalf').value; b.halfPaid = $('apHalf').value === 'paid'; }
  if($('apWL') && $('apWL').checked) b.waive.push('late');
  if($('apWA') && $('apWA').checked) b.waive.push('absent');
  if($('apWV') && $('apWV').checked) b.waive.push('leave');
  hrCall(b).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');
    toast('Saved','good'); _attWho = uid; attendanceBox();
  });
}

/* ---------- slips ---------- */

var _slipMonth = null, _slips = [];

function paySlips(month){
  _slipMonth = month || _slipMonth || (function(){
    var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);   /* last month, by default */
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
  hrCall({ action:'slips.month', month:_slipMonth }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');
    _slips = d.slips || [];
    var bar = '<div class="row" style="align-items:center;margin-bottom:10px">'+
      '<button class="btn ghost sm" onclick="slipShift(-1)">\u2039</button>'+
      '<div class="grow" style="text-align:center;font-weight:600">' + monthName(_slipMonth) + '</div>'+
      '<button class="btn ghost sm" onclick="slipShift(1)">\u203a</button></div>';
    modal('Salary slips', bar + (_slips.length ? _slips.map(function(s, i){
      return '<div class="card tap" style="padding:10px 12px;margin-bottom:7px" onclick="slipView(' + i + ')">'+
        '<div class="row"><div class="grow"><div class="ttl">' + esc(s.name) + '</div>'+
        '<div class="meta">' + (s.status === 'final' ? '\u2714 finalised' : 'draft') +
          (s.no_out && s.no_out.length ? ' \u00b7 <span style="color:var(--amber)">' + s.no_out.length + ' day(s) without check-out</span>' : '') +
        '</div></div><div class="ttl" style="' + (s.net < 0 ? 'color:var(--red)' : '') + '">' + rs(s.net) + '</div></div></div>';
    }).join('') : '<div class="empty">No slips for this month yet.</div>'),
    [{t:'Back',cls:'ghost',f:'salaryBox()'},{t:'Make drafts',cls:'',f:'slipMake()'}]);
  });
}
function slipShift(k){
  var y = +_slipMonth.slice(0,4), m = +_slipMonth.slice(5,7) + k;
  if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
  paySlips(y + '-' + String(m).padStart(2,'0'));
}
function slipMake(){
  hrCall({ action:'slips.make', month:_slipMonth }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not made','bad');
    if((d.problems||[]).length) toast(d.problems.join(' \u00b7 '), 'bad');
    else toast(d.made.length + ' draft(s) made','good');
    paySlips();
  });
}

function slipView(i, own){
  var s = own ? _mySlips[i] : _slips[i];
  var admin = can('salary');
  var lines = [
    ['Basic salary' + (s.full_month ? '' : ' (' + s.days_employed + ' days \u00d7 ' + rs2(s.per_day) + ')'), s.basic_due, 1],
    s.ot_amount ? ['Overtime ' + s.ot_hours + ' h \u00d7 ' + rs2(s.per_hour), s.ot_amount, 1] : null,
    s.bonus ? ['Bonus', s.bonus, 1] : null,
    s.leave_deduction ? ['Leave ' + s.leave_days + ' day(s)', s.leave_deduction, -1] : null,
    s.absent_deduction ? ['Absent ' + s.absent_days + ' day(s)', s.absent_deduction, -1] : null,
    s.late_deduction ? ['Late ' + s.late_marks + ' \u00f7 3 = ' + (+s.late_days).toFixed(2) + ' day(s)', s.late_deduction, -1] : null,
    s.half_deduction ? ['Half days ' + s.half_days_unpaid + ' day', s.half_deduction, -1] : null,
    s.early_deduction ? ['Left early ' + s.early_minutes + ' min', s.early_deduction, -1] : null,
    s.advance_deduction ? ['Advance' + (s.final_month ? ' (final month \u2014 in full)' : ''), s.advance_deduction, -1] : null
  ].concat((s.other_deductions||[]).map(function(x){ return ['Deduction \u2014 ' + x.reason, x.amount, -1]; })).filter(Boolean);
  modal(s.name + ' \u00b7 ' + monthName(s.month),
    lines.map(function(l){
      return '<div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)"><div class="grow">' +
        esc(l[0]) + '</div><div style="' + (l[2] < 0 ? 'color:var(--red)' : '') + '">' +
        (l[2] < 0 ? '\u2212 ' : '') + rs(l[1]) + '</div></div>';
    }).join('') +
    '<div class="row" style="padding:10px 0;font-size:18px;font-weight:700"><div class="grow">Net salary</div>'+
      '<div style="' + (s.net < 0 ? 'color:var(--red)' : '') + '">' + rs(s.net) + '</div></div>' +
    (s.owes ? '<div class="note d">Deductions are more than the salary: <b>' + rs(s.owes) +
      '</b> is owed, to be recovered separately.</div>' : '') +
    ((s.concessions||[]).length ? '<div class="note g"><b>Concessions given</b><br>' + s.concessions.map(function(c){
      return esc(dmy(c.day)) + ' \u00b7 ' + esc(c.what) + (c.note ? ' \u2014 ' + esc(c.note) : ''); }).join('<br>') + '</div>' : '') +
    ((s.no_out||[]).length ? '<div class="note w">Days without a check-out: ' + s.no_out.map(dmy).join(', ') +
      '. Fix them in Attendance before finalising.</div>' : ''),
    [{t:'Back',cls:'ghost',f: own ? 'mySlips()' : 'paySlips()'},
     {t:'Print',cls:'ghost',f:'slipPrint(' + i + ',' + (own ? 1 : 0) + ')'}]
      .concat(admin && !own && s.status !== 'final' ? [{t:'Finalise',cls:'',f:'slipFinal(' + i + ')'}] : []));
}

function slipFinal(i){
  var s = _slips[i];
  if(!confirm('Finalise ' + s.name + '\u2019s slip for ' + monthName(s.month) + '?\n\n' +
              'The figures will be frozen and advance instalments recovered.')) return;
  hrCall({ action:'slips.final', id:s.id }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not finalised','bad');
    toast('Finalised','good'); paySlips();
  });
}

var _mySlips = [];
function mySlips(){
  if(!payNeedServer()) return;
  hrCall({ action:'slips.mine' }).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Could not load','bad');

  });
}

/* The printed slip: one A4 page, the rules on it, and a daily table from
   which the person can count their own late marks and get the same number. */
function slipPrint(i, own){
  var s = own ? _mySlips[i] : _slips[i];
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var y = +s.month.slice(0,4), m = +s.month.slice(5,7);
  var inMonth = new Date(y, m, 0).getDate();
  var cell = 'padding:1.2mm 1.5mm;border-bottom:1px solid #E4E8EE';
  var row = function(a, b, neg){
    return '<tr><td style="' + cell + '">' + esc(a) + '</td><td style="' + cell + ';text-align:right">' +
      (neg ? '\u2212 ' : '') + rs(b) + '</td></tr>'; };
  var earn = row('Basic salary' + (s.full_month ? '' : ' (' + s.days_employed + ' days \u00d7 ' + rs2(s.per_day) + ')'), s.basic_due) +
    row('Overtime \u2014 ' + s.ot_hours + ' h \u00d7 ' + rs2(s.per_hour), s.ot_amount) +
    row('Bonus', s.bonus);
  var ded = row('Leave \u2014 ' + s.leave_days + ' \u00d7 ' + rs2(s.per_day), s.leave_deduction, 1) +
    row('Absent \u2014 ' + s.absent_days + ' \u00d7 ' + rs2(s.per_day), s.absent_deduction, 1) +
    row('Late \u2014 ' + s.late_marks + ' \u00f7 3 = ' + (+s.late_days).toFixed(2) + ' \u00d7 ' + rs2(s.per_day), s.late_deduction, 1) +
    row('Half days \u2014 ' + s.half_days_unpaid + ' \u00d7 ' + rs2(s.per_day), s.half_deduction, 1) +
    row('Left early \u2014 ' + s.early_minutes + ' min \u00d7 ' + rs2(s.per_hour / 60), s.early_deduction, 1) +
    row('Advance' + (s.final_month ? ' \u2014 final month, in full' : ' \u2014 instalment'), s.advance_deduction, 1) +
    (s.other_deductions||[]).map(function(x){ return row('Deduction \u2014 ' + x.reason, x.amount, 1); }).join('');
  var table = (s.table || []).map(function(r){
    var dt = new Date(r.day + 'T12:00:00');
    var st = { present:'Present', absent:'Absent', leave:'Leave', holiday:'Holiday', weekly_off:'Sunday', half:'Half day' }[r.status] || r.status;
    return '<tr><td style="' + cell + '">' + esc(dmy(r.day)) + '</td><td style="' + cell + '">' + days[dt.getDay()] +
      '</td><td style="' + cell + '">' + (r.in||'') + '</td><td style="' + cell + '">' + (r.out||'') +
      '</td><td style="' + cell + '">' + (r.late ? 'Yes' : '') + '</td><td style="' + cell + '">' + (r.ot_h ? r.ot_h + ' h' : '') +
      '</td><td style="' + cell + '">' + (r.early ? r.early + ' min' : '') + '</td><td style="' + cell + '">' + st + '</td></tr>';
  }).join('');
  printBox('Salary slip ' + s.name + ' ' + monthName(s.month),
    letterhead() +
    '<div style="text-align:center;font-size:13pt;font-weight:700;letter-spacing:1px;color:#1F3864;margin:-2mm 0 4mm">SALARY SLIP</div>'+
    '<table style="font-size:10pt;margin:0 0 3mm"><tr><td><b>' + esc(s.name) + '</b><br>' + esc(s.designation || '') + '</td>'+
      '<td style="text-align:right"><b>' + monthName(s.month) + '</b><br>' + inMonth + ' days in month' +
      (s.full_month ? '' : '<br>Employed ' + esc(dmy(s.period[0])) + ' to ' + esc(dmy(s.period[1]))) + '</td></tr></table>'+
    (s.partner ? '<div style="font-size:8.5pt;background:#F5F7F9;padding:2mm 3mm;border-radius:1mm;margin-bottom:3mm">'+
      'Partner \u2014 salary paid in full. No deductions apply.</div>' :
     s.operator ? '<div style="font-size:8.5pt;background:#F5F7F9;padding:2mm 3mm;border-radius:1mm;margin-bottom:3mm">'+
      'Operator \u2014 posted at a client\u2019s office. Attendance does not affect this salary; only advances and the '+
      'deductions listed below, each with its reason.</div>' :
    '<div style="font-size:8.5pt;background:#F5F7F9;padding:2mm 3mm;border-radius:1mm;margin-bottom:3mm">'+
      'Duty 09:00\u201318:00 \u00b7 Clock-in up to 09:30 is on time, 09:31 onward is late \u00b7 3 late marks = 1 day\u2019s deduction \u00b7 '+
      'A full-day leave or absence = 1 day\u2019s deduction \u00b7 Holidays and Sundays are paid \u00b7 Work after 18:00 is overtime, '+
      'paid by the whole hour when approved \u00b7 Leaving early is deducted by the minute unless approved \u00b7 '+
      'Per day = basic \u00f7 30 \u00b7 Per hour = per day \u00f7 8</div>')+
    '<div style="font-size:9.5pt;margin-bottom:3mm"><b>Present</b> ' + s.present + ' \u00b7 <b>Leave</b> ' + s.leave_days +
      ' \u00b7 <b>Absent</b> ' + s.absent_days + ' \u00b7 <b>Holidays</b> ' + s.holidays + ' \u00b7 <b>Sundays</b> ' + s.weekly_offs +
      ' \u00b7 <b>Late marks</b> ' + s.late_marks + ' \u00b7 <b>Overtime</b> ' + s.ot_hours + ' h</div>'+
    '<table style="font-size:8pt"><tr style="background:#F5F7F9"><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Late</th>'+
      '<th>Overtime</th><th>Early</th><th>Status</th></tr>' + table + '</table>'+
    '<table style="font-size:10pt;margin-top:3mm"><tr><td style="width:50%;vertical-align:top;padding-right:3mm">'+
      '<b>Earnings</b><table>' + earn + '</table></td>'+
      '<td style="vertical-align:top"><b>Deductions</b><table>' + ded + '</table></td></tr></table>'+
    '<div style="border:2px solid #1C2E4A;border-radius:1.5mm;padding:3mm 4mm;margin:3mm 0">'+
      '<div style="display:flex;justify-content:space-between;font-size:15pt;font-weight:700">'+
        '<span>Net salary</span><span>' + rs(s.net) + '</span></div>'+
      '<div style="font-size:9.5pt;color:#55606D">' + rupeesInWords(s.net) + '</div>'+
      (s.owes ? '<div style="font-size:10pt;color:#B42318;margin-top:1mm"><b>Owed by the employee: ' + rs(s.owes) +
        '</b> \u2014 to be recovered separately.</div>' : '') + '</div>'+
    ((s.advances||[]).length ? '<div style="font-size:9pt"><b>Advances</b> ' + s.advances.map(function(a){
      return esc(a.purpose || 'Advance') + ': ' + rs(a.amount) + ', recovered ' + rs(a.recovered + a.this_month) +
        ', left ' + rs(Math.max(0, a.balance - a.this_month)); }).join(' \u00b7 ') + '</div>' : '')+
    ((s.concessions||[]).length ? '<div style="font-size:9pt;margin-top:2mm"><b>Concessions given to you this month</b><br>' +
      s.concessions.map(function(c){ return esc(dmy(c.day)) + ' \u2014 ' + esc(c.what) + (c.note ? ' (' + esc(c.note) + ')' : ''); }).join('<br>') + '</div>' : '')+
    '<table style="margin-top:12mm;font-size:9pt"><tr>'+
      '<td style="border-top:1px solid #16202B;padding-top:1mm;width:30%">Prepared by</td><td style="width:5%"></td>'+
      '<td style="border-top:1px solid #16202B;padding-top:1mm;width:30%">Approved by</td><td style="width:5%"></td>'+
      '<td style="border-top:1px solid #16202B;padding-top:1mm;width:30%">Received by</td></tr></table>'+
    (s.status !== 'final' ? '<div style="text-align:center;color:#B42318;font-weight:700;margin-top:4mm">DRAFT \u2014 not finalised</div>' : ''));
}

/* ============================================================
   INVOICES, PAYMENTS AND RECEIVABLES
   ------------------------------------------------------------
   This part answers one question: who owes us what, and since
   when. The server keeps every figure and works out every
   balance from its entries; the phone asks and shows.

   The admin sees all of it. A technician can record a payment
   he has collected, and nothing else; the store can make a
   delivery note, and sees no prices. The server checks both.
   ============================================================ */

var _mon = {};

function mNeed(){
  if(!sharingOn()){ toast('This works once the phone is connected to the server','bad'); return false; }
  if(!hrReady()){ hrLink(); return false; }
  return true;
}
function mCall(body, then){
  hrCall(body).then(function(d){
    if(!d || !d.ok) return toast((d && d.msg) || 'Not done','bad');
    then(d);
  }).catch(function(){ toast('No signal \u2014 this is kept on the server','bad'); });
}
function clientName(id){ return nameOf(DB.clients, id) || id; }
function ageColour(days){ return days >= 60 ? 'var(--red)' : days >= 30 ? 'var(--amber)' : 'inherit'; }

/* a photo, taken or chosen, as a small JPEG ready to send */
function snapPhoto(done){
  pickPhoto(function(data){ done(data); });
}

/* ---------- the admin's menu ---------- */

    modal('Money',

       ['\u{1F9FE}','Invoices','All invoices \u2014 open, share, or make new','invBox()'],
       ['\u2795','New direct invoice','Bina quotation \u2014 seedha invoice','invDirectForm()'],
       ['\u{1F4B3}','Payments','Confirm, set against invoices, bounced','paysBox()'],
       ['\u{1F3E2}','Rental invoices','Made from rent and counter readings \u2014 monthly','rentalRunPick()'],
       ['\u{1F4E5}','Import rental invoices','Old way: this month\u2019s Excel from the rental software','rentBox()'],
       ['\u{1F4C8}','Client profit','What each client earns \u2014 after visits, parts, toner','clientProfitPick()'],
       ['\u2699','Settings','Invoice numbers, bank details, warranty wording','monSettings()']].map(function(x){
        return '<div class="card tap" style="padding:10px 12px;margin-bottom:7px" onclick="' + x[3] + '">'+
          '<div class="row"><span style="font-size:19px;margin-right:10px">' + x[0] + '</span>'+
          '<div class="grow"><div class="ttl">' + x[1] + '</div><div class="meta">' + x[2] + '</div></div></div></div>';
      }).join(''),
      [{t:'Close',cls:'ghost',f:'closeModal()'}]);
  });
}

/* ---------- receivables ---------- */

function recvBox(tab){
  mCall({ action:'recv' }, function(r){
    _mon.recv = r;
    var rows = r.rows.filter(function(x){ return x.kind === tab; });
    var s = r.summary;
    modal('Receivables',
      '<table style="width:100%;font-size:13px;margin-bottom:10px">'+

  mCall({ action:'inv.list' }, function(r){

        '<div class="meta"><b style="color:'+(BRANDS[i.brand]?BRANDS[i.brand].c1:'#12395E')+'">'+esc(BRANDS[i.brand]?BRANDS[i.brand].name.split(' ')[0]:'')+'</b> \u00b7 '+esc(dmy(i.date)) + ' \u00b7 ' + rs(i.total) + (i.tax?' \u00b7 with tax':'') + (i.outstanding > 0.5 && i.state !== 'cancelled' ? ' \u00b7 owes ' + rs(i.outstanding) : '') + '</div></div>'+
        '<span class="pill ' + pill[i.state] + '">' + i.state.replace('_',' ') + '</span></div>'+
        '<div class="qrow-act">'+
          '<button class="btn sm ghost" onclick="event.stopPropagation();invPrint(' + n + ')">\u{1F4C4} Open</button>'+
          '<button class="btn sm" style="background:#25D366" onclick="event.stopPropagation();invShare(' + n + ')">\u{1F4AC} Share</button>'+
        '</div></div>';
    }).join('') : '<div class="empty">No invoices in this folder.</div>'),
    [{t:'Back',cls:'ghost',f:'moneyBox()'},{t:'+ Direct invoice',cls:'',f:'invDirectForm()'}]);

    (i.deliveries.length ? '<div class="help">Delivered: ' + i.deliveries.map(function(d){

    }).join('')+

    '<div class="field"><label>Kind</label><select id="ifType"><option value="sales">Sales</option><option value="service">Service</option><option value="cash">Cash (no tax)</option></select></div></div>'+
    '<div class="two"><div class="field"><label>Payment</label><select id="ifTerms">'+
      '<option value="days">Credit \u2014 days</option><option value="advance">Advance</option><option value="half">Half advance</option><option value="delivery">On delivery</option></select></div>'+
    '<div class="field"><label>Days</label><input id="ifDays" type="number" inputmode="numeric" value="' + (c.termsDays || 30) + '"></div></div>'+

    [{t:'Cancel',cls:'ghost',f:'closeModal();_mon.po=null'},{t:'Make the invoice',cls:'',f:"invMake('" + qid + "')"}]);
}
function invMake(qid){
  var lines = Array.prototype.map.call(document.querySelectorAll('.ifLine:checked'), function(e){ return +e.value; });
  var warr = Array.prototype.map.call(document.querySelectorAll('.ifWarr:checked'), function(e){ return +e.value; });
  if(!lines.length) return toast('Tick at least one line','bad');
  if(!$('ifDate').value) return toast('Enter the invoice date \u2014 it is never assumed','bad');
  var t = $('ifTerms').value;
  mCall({ action:'inv.make', quote:qid, lines:lines, warranty:warr, date:$('ifDate').value, type:$('ifType').value,
          terms: t === 'days' ? { kind:'days', days:+$('ifDays').value || 0 } : { kind:t },
          po:$('ifPo').value, poDate:$('ifPoDate').value, poPhoto:_mon.po || '' }, function(d){
    _mon.po = null;
    toast('Invoice ' + d.no + ' made','good'); invBox();
  });
}

var _dn = null;
function dnForm(invId){
  var open = function(inv){
    _dn = { inv: inv, items: [] };
    modal('Delivery note \u00b7 ' + inv.no,
      '<div class="two"><div class="field"><label>Delivery date (required)</label><input id="dnDate" type="date"></div>'+
      '<div class="field"><label>Address</label><input id="dnAddr" placeholder="Head office"></div></div>'+
      '<div class="two"><div class="field"><label>Received by</label><input id="dnRecv"></div>'+
      '<div class="field"><label>Designation</label><input id="dnDesig"></div></div>'+

      '<button class="btn ghost sm" onclick="dnAddItem()">+ A machine</button>',
      [{t:'Cancel',cls:'ghost',f:'closeModal()'},{t:'Save',cls:'',f:'dnSave()'}]);
    dnAddItem();
  };
  var have = (_mon.dnInv || []).filter(function(i){ return i.id === invId; })[0];
  if(have) return open(have);
  mCall({ action:'dn.invoices' }, function(r){
    _mon.dnInv = r.invoices;

}
function dnAddItem(){
  var inv = _dn.inv, k = _dn.items.length;
  _dn.items.push({ photo:'' });
  var el = document.createElement('div');
  el.className = 'card'; el.style.cssText = 'padding:9px 10px;margin-bottom:7px';
  el.innerHTML = '<div class="field"><label>Line</label><select id="dnLine' + k + '">' + inv.lines.map(function(l, n){
      return '<option value="' + n + '">' + esc(l.desc) + '</option>'; }).join('') + '</select></div>'+
    '<div class="two"><div class="field"><label>Serial (required)</label><input id="dnSer' + k + '" autocapitalize="characters"></div>'+
    '<div class="field"><label>Counter at delivery</label><input id="dnCnt' + k + '" type="number" inputmode="numeric"></div></div>'+
    '<button class="btn ghost sm" onclick="dnPhoto(' + k + ')" id="dnPh' + k + '">Photo of the counter (required)</button>';
  $('dnItems').appendChild(el);
}
function dnPhoto(k){
  snapPhoto(function(d){ _dn.items[k].photo = d; $('dnPh' + k).textContent = '\u2714 Counter photographed'; });
}
function dnSave(){
  if(!$('dnDate').value) return toast('Enter the delivery date','bad');
  var items = _dn.items.map(function(it, k){
    return { line:+$('dnLine' + k).value, serial:$('dnSer' + k).value.trim().toUpperCase(),
             counter:$('dnCnt' + k).value, counterPhoto:it.photo,
             model:(_dn.inv.lines[+$('dnLine' + k).value] || {}).desc || '' };
  });
  for(var n = 0; n < items.length; n++){
    if(!items[n].serial) return toast('Every machine needs its serial','bad');
    if(items[n].counter === '') return toast('Every machine needs its counter','bad');
    if(!items[n].counterPhoto) return toast('Photograph the counter of ' + items[n].serial + ' \u2014 it is required','bad');
  }
  var inv = _dn.inv, date = $('dnDate').value;
  mCall({ action:'dn.make', inv:inv.id, date:date, address:$('dnAddr').value,
          recvName:$('dnRecv').value, recvDesig:$('dnDesig').value, items:items }, function(d){
    /* the machine now belongs at the client: complaints can be logged against it,
       and warranty runs from today, the delivery date */
    items.forEach(function(it){
      var m = DB.machines.filter(function(x){ return String(x.serial||'').toUpperCase() === it.serial; })[0];
      if(!m){ m = { id:uid(), model:it.model, serial:it.serial }; DB.machines.push(m); }
      m.client = inv.client; m.counterStart = { value:+it.counter, date:date, note:d.no };
      m._at = now();
      var line = inv.lines[it.line] || {};
      if(line.warranty){
        var end = new Date(date + 'T12:00:00'); end.setFullYear(end.getFullYear() + 1); end.setDate(end.getDate() - 1);
        DB.contracts = DB.contracts || [];
        DB.contracts.unshift({ id:uid(), no:contractNo('warranty', inv.brand || 'paragon'), kind:'warranty',
          state:'active', client:inv.client, machine:m.id, brand:inv.brand || 'paragon',
          starts:date, ends:end.toISOString().slice(0,10), amount:null, overrides:[], at:now(), _at:now(),
          note:'From ' + inv.no + ', delivered ' + dmy(date) });
      }
    });
    logIt('delivery', d.no, clientName(inv.client) + ' \u00b7 ' + items.length + ' machine(s)');
    save(); if(sharingOn()) syncSoon();
    toast('Delivery note ' + d.no + ' saved; machines are at the client','good');
    closeModal();
  });
}

var _col = null;
function collectForm(){
  if(!mNeed()) return;

  modal('Payment collected',
    '<div class="note i">Recorded now, confirmed in the office once the cheque is in hand. '+
    'Until then it does not reduce what the client owes.</div>'+
    '<div class="field"><label>Client</label><select id="coCli"><option value="">\u2014 choose \u2014</option>' +
      DB.clients.map(function(c){ return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select></div>'+
    '<div class="two"><div class="field"><label>Amount (Rs.)</label><input id="coAmt" type="number" inputmode="numeric"></div>'+
    '<div class="field"><label>How</label><select id="coHow"><option value="cheque">Cheque</option><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option></select></div></div>'+
    '<button class="btn ghost sm" id="coPh" onclick="snapPhoto(function(d){ _col.photo = d; $(\'coPh\').textContent = \'\\u2714 Photo taken\'; })">Photo of the cheque or receipt (required)</button>'+
    '<div id="coMis"></div>',
    [{t:'Cancel',cls:'ghost',f:'closeModal()'},{t:'Save',cls:'',f:'collectSave()'}]);
}
function collectSave(reason){
  if(!$('coCli').value) return toast('Choose the client','bad');
  if(!(+$('coAmt').value > 0)) return toast('Enter the amount','bad');
  if(!_col.photo) return toast('Take a photo of the cheque or the receipt','bad');
  hrCall({ action:'pay.collect', client:$('coCli').value, amount:+$('coAmt').value, method:$('coHow').value,
           photo:_col.photo, reason:reason || '' }).then(function(d){
    if(d && d.mismatch){
      $('coMis').innerHTML = '<div class="note d" style="margin-top:10px"><b>This does not match what is due.</b><br>'+
        'Due: ' + rs(d.due) + ' \u00b7 Received: ' + rs(d.received) + ' \u00b7 <b>Difference: ' + rs(d.difference) + '</b><br>'+
        'Is this a part payment, or has withholding tax been deducted?</div>'+
        '<div class="row" style="gap:6px;flex-wrap:wrap">'+
        '<button class="btn sm" onclick="collectSave(\'part\')">Part payment</button>'+
        '<button class="btn sm" onclick="collectSave(\'withholding\')">Withholding deducted</button>'+
        '<button class="btn sm ghost" onclick="collectSave(\'advance\')">Advance</button></div>';
      return;
    }
    if(!d || !d.ok) return toast((d && d.msg) || 'Not saved','bad');
    toast('Recorded as collected. The office confirms it.','good'); closeModal();
  }).catch(function(){ toast('No signal \u2014 try again when there is signal','bad'); });
}

var RENT_COLS = {
  client: ['client name','client','customer','customer name','party','party name','name'],
  no:     ['invoice number','invoice no','invoice #','inv no','invoice','number','bill no'],
  date:   ['invoice date','date','bill date'],
  month:  ['invoice for the month','for the month','month','for month','period','billing month'],
  amount: ['amount','amount before tax','value','net amount','amount excl tax'],
  tax:    ['sales tax','tax','gst','sst','sales tax amount'],
  total:  ['total','total amount','gross','amount incl tax','grand total']
};
function rentDate(v){
  if(v == null || v === '') return '';
  if(typeof v === 'number' || /^\d+(\.\d+)?$/.test(String(v))){
    var d = new Date(Math.round((+v - 25569) * 86400000)); return d.toISOString().slice(0,10);
  }
  var s = String(v).trim(), m;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){
    var y = m[3].length === 2 ? '20' + m[3] : m[3];
    return y + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  }
  var t = new Date(s); return isNaN(t) ? '' : t.toISOString().slice(0,10);
}
function rentMonth(v){
  var d = rentDate(v); if(d) return d.slice(0,7);
  var s = String(v || '').toLowerCase(), y = (s.match(/(20\d{2}|\b\d{2}\b)/) || [])[1];
  var mi = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].findIndex(function(x){ return s.indexOf(x) > -1; });
  if(mi < 0 || !y) return '';
  if(y.length === 2) y = '20' + y;
  return y + '-' + String(mi + 1).padStart(2,'0');
}
function rentBox(){
  modal('Import rental invoices',
    '<div class="note i">Choose this month\u2019s Excel from the rental software. Nothing is '+
    'written until you have seen the summary and pressed Import. An invoice number already '+
    'here is refused, and a name that is not recognised is held until you match it.</div>'+
    '<button class="btn" onclick="rentPick()">Choose the Excel file</button><div id="rtOut" style="margin-top:12px"></div>',
    [{t:'Back',cls:'ghost',f:'moneyBox()'}]);
}
function rentPick(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.csv';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    var r = new FileReader(), isX = /\.xlsx$/i.test(f.name);
    r.onload = function(){
      (isX ? readXLSX(r.result) : Promise.resolve(parseCSV(r.result))).then(function(rows){
        var hi = rows.findIndex(function(x){ return !blankRow(x); });
        var head = (rows[hi] || []).map(norm), col = {};
        Object.keys(RENT_COLS).forEach(function(k){
          col[k] = head.findIndex(function(h){ return RENT_COLS[k].indexOf(h) > -1; }); });
        var missing = ['client','no','date','month','amount','total'].filter(function(k){ return col[k] < 0; });
        if(missing.length) return $('rtOut').innerHTML = '<div class="note d">These columns were not found: ' +
          missing.join(', ') + '. The first row must name them.</div>';
        _mon.rent = rows.slice(hi + 1).map(function(x, n){
          if(blankRow(x)) return null;
          var g = function(k){ return col[k] < 0 ? '' : x[col[k]]; };
          return { row: hi + n + 2, client:String(g('client')||'').trim(), no:String(g('no')||'').trim(),
                   date:rentDate(g('date')), month:rentMonth(g('month')),
                   amount:numOr(g('amount'),0), tax:numOr(g('tax'),0), total:numOr(g('total'),0) };
        }).filter(Boolean);
        rentCheck();
      }).catch(function(e){ $('rtOut').innerHTML = '<div class="note d">Could not read it: ' + esc(e.message) + '</div>'; });
    };
    if(isX) r.readAsArrayBuffer(f); else r.readAsText(f);
  };
  inp.click();
}
function rentCheck(){
  mCall({ action:'rimport.check', rows:_mon.rent }, function(c){
    _mon.rentCheck = c;
    $('rtOut').innerHTML =
      '<div class="card" style="padding:11px 13px"><div class="ttl">Ready to import</div>'+
      '<div class="meta"><b>' + c.ready + '</b> invoice(s) will be added \u00b7 ' + rs(c.value) + '</div>'+
      (c.duplicates.length ? '<div class="meta">' + c.duplicates.length + ' already here and will be skipped</div>' : '')+
      (c.bad.length ? '<div class="meta" style="color:var(--red)">' + c.bad.length + ' row(s) do not add up: ' +
        c.bad.map(function(b){ return 'row ' + b.row + ' (' + esc(b.why) + ')'; }).join('; ') + '</div>' : '')+
      '</div>'+
      (c.names.length ? '<label style="margin:10px 0 6px">Match these names once \u2014 they are remembered</label>' +
        c.names.map(function(nm, k){
          return '<div class="field"><label>' + esc(nm) + '</label><select id="rtMap' + k + '"><option value="">\u2014 which client? \u2014</option>' +
            DB.clients.map(function(cl){ return '<option value="' + cl.id + '">' + esc(cl.name) + '</option>'; }).join('') + '</select></div>';
        }).join('') + '<button class="btn ghost sm" onclick="rentMap()">Save these and check again</button>' : '')+
      (c.ready ? '<button class="btn green" style="margin-top:10px" onclick="rentCommit()">Import ' + c.ready + '</button>' : '');
  });
}
function rentMap(){
  var names = _mon.rentCheck.names, jobs = [];
  names.forEach(function(nm, k){ var v = $('rtMap' + k).value; if(v) jobs.push(hrCall({ action:'namemap.set', name:nm, client:v })); });
  if(!jobs.length) return toast('Choose a client for at least one name','bad');

   MACHINE HISTORY, VISITS, AND THE FAIR REPEAT RULE
   ============================================================ */

var VISIT_KIND = {
  toner:   'Toner',
  pm:      'Preventive maintenance',
  round:   'Service round',
  part:    'Part',
  install: 'Installation'
};

/* A phone number is 10 or 11 digits, or 12 starting 92. A wrong one is a
   wasted journey. */
function validPhone(p){
  var d = String(p || '').replace(/[^0-9]/g, '');
  if(!d) return true;
  return d.length === 10 || d.length === 11 || (d.length === 12 && d.indexOf('92') === 0);
}

/* Every reading of a machine's counter, from wherever it came, newest last. */
function readingsOf(machineId){
  var out = [];
  DB.complaints.forEach(function(c){
    if(c.machine === machineId && c.counter)
      out.push({ at: c.counterAt || c.resolved || c.opened, n: c.counter });
  });
  (DB.visits || []).forEach(function(v){
    if(v.machine === machineId && v.counter) out.push({ at: v.at, n: v.counter });
  });
  out.sort(function(a, b){ return String(a.at) < String(b.at) ? -1 : 1; });
  return out;
}

/* pages a day, from the first and last readings a sensible distance apart */
function pagesPerDay(machineId){
  var r = readingsOf(machineId);
  if(r.length < 2) return null;
  var a = r[0], b = r[r.length - 1];
  var days = (new Date(b.at) - new Date(a.at)) / 86400000;
  if(days < 7 || b.n <= a.n) return null;
  return (b.n - a.n) / days;
}

function modelOf(m){
  if(!m) return null;
  var name = String(m.model || '').toLowerCase().replace(/\s+/g, '');
  return (DB.models || []).filter(function(x){
    return String(x.name || '').toLowerCase().replace(/\s+/g, '') === name; })[0] || null;
}

/* ---------- the screen for the technician standing at the machine ----------
   It answers, in a glance: third time for this, drum changed last time, print
   count normal \u2014 so it is probably the roller. */
function machineHistory(machineId, fromJob){
  var m = byId(DB.machines, machineId);
  if(!m) return toast('That machine is not on record','bad');
  var job = fromJob ? byId(DB.complaints, fromJob) : null;
  var office = can('complaint.all');
  if(!office && !(job && job.tech === ME.id))
    return toast('The history opens from a job of yours','bad');

  var r = readingsOf(machineId);
  var cur = r.length ? r[r.length - 1].n : null;
  var ppd = pagesPerDay(machineId);
  var model = modelOf(m);
  var rated = model && +model.rated ? +model.rated : null;

  /* every visit, whatever brought the technician there */
  var visits = [];
  DB.complaints.forEach(function(c){
    if(c.machine !== machineId || (job && c.id === job.id)) return;
    var fitted = DB.parts.filter(function(p){ return p.complaint === c.id && q(p,'installed') > 0; })
      .map(function(p){ var s = byId(DB.stock, p.stock);
        return s ? [s.code, s.name, s.quality].filter(Boolean).join('-') : 'part'; });
    visits.push({ at: c.resolved || c.started || c.opened, who: nameOf(DB.users, c.tech),
      kind: 'Complaint', what: c.what, done: c.workDone || '', parts: fitted, n: c.counter || null });
  });
  (DB.visits || []).forEach(function(v){
    if(v.machine !== machineId) return;
    visits.push({ at: v.at, who: nameOf(DB.users, v.by), kind: VISIT_KIND[v.kind] || v.kind,
      what: '', done: v.work || '', parts: [], n: v.counter || null });
  });
  visits.sort(function(a, b){ return String(a.at) < String(b.at) ? 1 : -1; });

  /* the pages printed since the visit before each one */
  for(var i = 0; i < visits.length; i++){
    for(var j = i + 1; j < visits.length; j++){
      if(visits[j].n && visits[i].n){ visits[i].since = visits[i].n - visits[j].n; break; }
    }
  }
  var sixAgo = new Date(Date.now() - 182 * 86400000).toISOString();
  var recent = DB.complaints.filter(function(c){
    return c.machine === machineId && (!job || c.id !== job.id) && String(c.opened) >= sixAgo; }).length;

  modal(machineLabel(m),
    '<div class="meta" style="margin-bottom:10px">' + esc(nameOf(DB.clients, m.client)) +
      (m.dept || m.place ? ' \u00b7 ' + esc([m.dept, m.place].filter(Boolean).join(' \u2014 ')) : '') + '</div>'+
    '<div class="tiles">'+
      tile('b', cur != null ? cur.toLocaleString() : '\u2014', 'Current counter')+
      tile('g', ppd ? Math.round(ppd * 30).toLocaleString() : '\u2014', 'Printing a month')+
      tile('a', rated ? rated.toLocaleString() : '\u2014', 'Rated a month')+
      tile(recent >= 2 ? 'r' : 'g', recent, 'Complaints, 6 months')+
    '</div>'+
    (rated && ppd && ppd * 30 > rated ? '<div class="note w">It is printing more than it was built '+
      'for. Faults come sooner on a machine run this hard.</div>' : '')+
    '<label style="margin:6px 0 8px">Last visits</label>'+
    (visits.length ? visits.slice(0, 5).map(function(v){
      return '<div class="card" style="padding:9px 12px;margin-bottom:6px">'+
        '<div style="font-size:13px"><b>' + esc(dmy(v.at)) + '</b> \u00b7 ' + esc(v.who || '') + ' \u00b7 ' + esc(v.kind) +
        (v.what ? ' \u2014 ' + esc(String(v.what).slice(0, 60)) : '') + '</div>'+
        (v.done ? '<div class="meta">Done: ' + esc(v.done) + '</div>' : '')+
        (v.parts.length ? '<div class="meta">Fitted: ' + esc(v.parts.join(', ')) + '</div>' : '')+
        (v.n ? '<div class="meta">Counter ' + v.n.toLocaleString() +
          (v.since != null ? ' \u00b7 <b>+' + v.since.toLocaleString() + ' since the visit before</b>' : '') + '</div>' : '')+
      '</div>';
    }).join('') : '<div class="help">No visits recorded before this one.</div>'),
    [{t:'Close',cls:'ghost',f: job ? "openComplaint('" + job.id + "')" : 'closeModal()'}]
      .concat(canVisit() ? [{t:'Log a visit here',cls:'',f:"visitForm('" + machineId + "')"}] : []));
}
